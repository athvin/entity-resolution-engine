# Build + push the Rust control-plane image (er-api) to ECR by commit sha.
# Runs on GitHub's amd64 runners (the EKS nodes are amd64) and authenticates to
# ECR via OIDC — no stored credentials. The one image serves er-api (server),
# er-dispatcher (CMD override), and the `er` pipeline CLI (see rust/Dockerfile).
#
# This replaces the image-build job of the removed ci.yaml. Both deployed
# images are built here: er-api (the Rust control plane) and er-web (the Next.js
# BFF). er-web used to be nobody's job — the comment here said "built by the
# frontend pipeline" and frontend.yml had no image job at all, so the ECR repo
# and frontend/Dockerfile existed while nothing ever pushed a tag, and
# `make dev-up TAG=<sha>` could not roll the BFF out. er-pipeline is gone (the
# in-process dispatcher runs the pipeline itself). main is branch-protected, so
# a push here is already a green state.
#
# Each image builds only when its own tree moved, via the `detect` job — the
# same shape rust.yml uses, rather than a workflow-level `paths:` filter, which
# cannot distinguish the two trees.
name: images

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
      # The charts and the namespace provisioning script, because a change to
      # either IS a dev platform release (§14.2) even when no image moved. The
      # image jobs skip in that case and `deploy-dev` reuses the digests already
      # in the registry, which is what is running.
      - "infra/k8s/**"
      - "scripts/dev_env.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref/sha to build (defaults to the triggering commit)"
        required: false

concurrency:
  # Keyed on the ref AND the dispatched commit, not the ref alone.
  #
  # `workflow_dispatch` has to run on `main` because the ECR push role's OIDC
  # trust pins the `sub` claim to `refs/heads/main` (infra/terraform/modules/github-oidc),
  # so the `ref` input exists to build some *other* commit with main's identity.
  # Grouping on `github.ref` alone made every such dispatch share one group, so
  # dispatching a second commit silently cancelled the first — which is exactly
  # what happened while building a before/after image pair for the §18.16
  # measurement, and it looks like a build failure rather than a cancellation
  # until you read the run's conclusion.
  #
  # On a `push` the inputs are empty, so this collapses to the old behaviour:
  # a newer push to main still cancels an in-flight build of an older one.
  group: images-${{ github.ref }}-${{ github.event.inputs.ref || '' }}
  cancel-in-progress: true

jobs:
  # Which trees moved in this push. `workflow_dispatch` and anything without a
  # usable "before" sha (a first push, a force-push) build both rather than
  # guessing — an unnecessary cached build is cheaper than a missing image.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE...$SHA")"
          # `grep -c` (not -q) reads all input: -q closes the pipe early and can
          # SIGPIPE `git diff` under pipefail, which reads as a false skip.
          for tree in rust frontend; do
            n="$(printf '%s\n' "$changed" | grep -cE "^${tree}/" || true)"
            if [ "${n:-0}" -gt 0 ]; then
              echo "${tree}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${tree}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # A change to this workflow rebuilds both.
          if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/images\.yml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

  er-api:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 90, against a measured 58m9s of real build (run 41524220825) — this
    # Dockerfile's `COPY . .` means any rust/ change rebuilds all 408 crates,
    # so the long case is the NORMAL case until that is restructured. The
    # number exists because neither image job had a timeout at all: the
    # default is 360 minutes, so a hung buildkit burned six runner-hours
    # before failing, and `deploy-dev` waited on it the whole time.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # OIDC token exchange for the ECR-push role
    env:
      ECR: 797781631727.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-ecr-push
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Resolve the image tag (full sha of the built ref)
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build + push er-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rust
          file: rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR }}/er-api:${{ steps.tag.outputs.sha }}
          # Layer cache in ECR (er-buildcache, terraform: envs/core/registry.tf),
          # not the Actions cache: the gha backend's ~5 GB mode=max cache was the
          # largest producer in the shared 10 GB budget — the thing rust.yml's
          # cache-prune exists to cap. `image-manifest=true,oci-mediatypes=true`
          # because ECR rejects buildkit's default cache-manifest media type.
          # The transitional `type=gha` cache-from is GONE: run 41524220825
          # logged `importing cache manifest from …/er-buildcache:er-api` and
          # both tags are in the repo, so the registry round-trip is proven and
          # buildkit now touches the Actions cache in neither direction.
          cache-from: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-api"
          cache-to: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-api,mode=max,image-manifest=true,oci-mediatypes=true"

  er-web:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 30, against 2m30s warm off the registry cache (run 41524220825). Same
    # reason as er-api's: the default was 360.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token exchange for the ECR-push role
    env:
      ECR: 797781631727.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-ecr-push
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Resolve the image tag (full sha of the built ref)
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The context is `frontend` because frontend/Dockerfile's COPY paths are
      # directory-relative (it says so in its own header), and pnpm comes from
      # corepack reading `packageManager` — the same single pin the CI gate uses.
      - name: Build + push er-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR }}/er-web:${{ steps.tag.outputs.sha }}
          # Same ECR-backed layer cache as er-api above — see that step's
          # comment for the full reasoning.
          cache-from: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-web"
          cache-to: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-web,mode=max,image-manifest=true,oci-mediatypes=true"

  # §14.2's Helm half: "Dev platform releases apply from CI on `main`". Lives
  # here rather than in its own workflow so ordering is structural — a deploy
  # cannot start before the images it deploys are pushed.
  #
  # It targets ONE namespace, `ci`, which CI owns. `er-platform` is otherwise
  # only ever installed into a per-developer namespace by `make dev-up`, and
  # redeploying those on every merge would restart a pod someone is mid-debug on
  # — which also contradicts §14.2's own next clause, "`make dev-up` stays a
  # human command". The reasoning is in infra/terraform/envs/dev/ci-deploy.tf.
  #
  # NOT YET EXERCISED. The `er-ci-deploy-dev` role does not exist until
  # `envs/dev` is applied, so this job's first run will fail at role assumption
  # exactly as infra.yml's plan jobs do. Prefer making the first real rollout a
  # deliberate `workflow_dispatch` rather than whatever the next merge is.
  deploy-dev:
    name: deploy dev (ci namespace)
    needs: [detect, er-api, er-web]
    # `always()` because er-api and er-web are each conditional on their own
    # tree changing: a rust-only commit SKIPS er-web, and a plain `needs` would
    # skip the deploy with it. `!cancelled()` so a cancelled run does not deploy.
    # Failed image builds are caught explicitly below rather than by `needs`,
    # because "skipped" and "failed" must not be the same thing here.
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-deploy-dev
    env:
      CI_NAMESPACE: ci
      CLUSTER: er-dev
      AWS_REGION: us-east-2
    steps:
      - name: Refuse to deploy a failed build
        # A skipped image job means "that tree did not change", which is fine —
        # the digest resolution below reuses what is already in the registry. A
        # FAILED one means the image is missing or stale, and deploying then
        # would roll out a half-built commit.
        env:
          API: ${{ needs.er-api.result }}
          WEB: ${{ needs.er-web.result }}
        run: |
          for r in "$API" "$WEB"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an image job ended '$r'; refusing to deploy"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-deploy-dev
          aws-region: us-east-2
      - name: Resolve image digests
        id: digests
        # §14.2: a deploy passes a DIGEST, never a tag, and gates on that digest
        # being present in the registry first. Promotion-by-digest is only a
        # property if the thing being deployed is identified by content.
        #
        # Images are tagged by full sha and built only when their own tree
        # moved, so for any given commit one of them may legitimately have no
        # sha tag. In that case reuse the newest digest already in the repo —
        # that IS what is running — and say so in the log. Nothing is deployed
        # by tag either way, and an empty result is fatal.
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for repo in er-api er-web; do
            d="$(aws ecr describe-images --repository-name "$repo" \
                   --image-ids "imageTag=$sha" \
                   --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
            if [ -z "$d" ] || [ "$d" = "None" ]; then
              d="$(aws ecr describe-images --repository-name "$repo" \
                     --query 'reverse(sort_by(imageDetails,&imagePushedAt))[0].imageDigest' \
                     --output text 2>/dev/null || true)"
              echo "$repo: no image tagged $sha — reusing newest digest $d"
            else
              echo "$repo: $sha -> $d"
            fi
            if [ -z "$d" ] || [ "$d" = "None" ]; then
              echo "::error::no digest in ECR for $repo; refusing to deploy by tag"
              exit 1
            fi
            echo "${repo//-/_}=$d" >> "$GITHUB_OUTPUT"
          done
      - name: Install helm
        # Version-pinned tarball rather than a third-party action, the same
        # choice the disk-reclaim step in rust.yml documents: every `uses:` in
        # this repo is SHA-pinned, and a pinned download needs no SHA to keep
        # current. `helm version` is the check that the install worked.
        env:
          HELM_VERSION: v3.19.0
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          helm version --short
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Provision the namespace's EFS access point and secrets
        # Same script `make dev-up` uses, so CI and a human provision a
        # namespace identically rather than by two drifting paths. Idempotent:
        # it finds an existing access point and existing secrets.
        id: env
        run: |
          set -euo pipefail
          eval "$(bash scripts/dev_env.sh up "$CI_NAMESPACE")"
          echo "fs=$ER_EFS_FS_ID" >> "$GITHUB_OUTPUT"
          echo "ap=$ER_EFS_AP_ID" >> "$GITHUB_OUTPUT"
      - name: Roll the release
        # `--atomic` is the difference between a failed deploy and a broken
        # namespace: it rolls back on failure instead of leaving half a release.
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/storage/ebs-gp3.yaml
          helm upgrade --install "$CI_NAMESPACE" infra/k8s/charts/er-dev-namespace \
            --namespace default --set "developer=$CI_NAMESPACE" --wait
          # The executor allowlist (batch-orchestration-design §11): the two
          # Phase 2 kinds run as per-attempt Kubernetes Jobs in this namespace.
          # Enabled HERE, not in the chart default, so a developer namespace
          # opts in deliberately. Gated until 2026-11-02 on the Standard vCPU
          # quotas (both now 64) — before the grant no runner node of any
          # class could provision at all (§7.2).
          helm upgrade --install er-platform infra/k8s/charts/er-platform \
            --namespace "$CI_NAMESPACE" --set "developer=$CI_NAMESPACE" \
            --set "images.api.digest=${{ steps.digests.outputs.er_api }}" \
            --set "images.web.digest=${{ steps.digests.outputs.er_web }}" \
            --set "efs.fileSystemId=${{ steps.env.outputs.fs }}" \
            --set "efs.accessPointId=${{ steps.env.outputs.ap }}" \
            --set 'executor.dagKinds=lake_maintain\,lake_migrate' \
            --atomic --wait --timeout 10m
