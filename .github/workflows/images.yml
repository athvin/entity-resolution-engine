# Build + push the Rust control-plane image (er-api) to ECR by commit sha.
# Runs on GitHub's amd64 runners (the EKS nodes are amd64) and authenticates to
# ECR via OIDC — no stored credentials. The one image serves er-api (server),
# er-dispatcher (CMD override), and the `er` pipeline CLI (see rust/Dockerfile).
#
# This replaces the image-build job of the removed ci.yaml. Both deployed
# images are built here: er-api (the Rust control plane) and er-web (the Next.js
# BFF). er-web used to be nobody's job — the comment here said "built by the
# frontend pipeline" and frontend.yml had no image job at all, so the ECR repo
# and frontend/Dockerfile existed while nothing ever pushed a tag, and
# `make dev-up TAG=<sha>` could not roll the BFF out. er-pipeline is gone: the
# pipeline runs as per-attempt Jobs from the er-api image. main is
# branch-protected, so
# a push here is already a green state.
#
# Each image builds only when its own tree moved, via the `detect` job — the
# same shape rust.yml uses, rather than a workflow-level `paths:` filter, which
# cannot distinguish the two trees.
name: images

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
      - "scripts/ci/images-detect.sh"
      # The charts and the namespace provisioning script, because a change to
      # either IS a dev platform release (§14.2) even when no image moved. The
      # image jobs skip in that case and `deploy-dev` reuses the digests already
      # in the registry, which is what is running.
      - "infra/k8s/**"
      - "scripts/dev_env.sh"
      # The observability stack installer. A change to it IS a dev platform
      # release for the same reason a chart change is.
      - "scripts/obs_up.sh"
      # The deploy workflow itself, for that same reason — and this one was
      # learned the hard way. `deploy.yml` carries the `helm upgrade` flags,
      # which is where the executor allowlist actually lives
      # (`--set executor.dagKinds=…`). #498 flipped the pipeline kinds on,
      # merged green, and changed NOTHING on the cluster: the commit touched
      # only `.github/workflows/deploy.yml`, no path here matched, no images run
      # started, and so no deploy fired. The live dispatcher still read
      # `lake_maintain,lake_migrate` afterwards.
      #
      # It did land eventually, but only by luck — an unrelated commit touching
      # `rust/**` triggered a run, and a `workflow_run` deploy uses the DEFAULT
      # BRANCH's workflow file, so it picked up the new flags. Absent that, the
      # change would have sat unapplied indefinitely. That is precisely the
      # "'Merged' did not mean 'deployed'" failure this file's own header
      # describes at length, arriving through a different door.
      - ".github/workflows/deploy.yml"
      # The deploy's own extracted steps, for the same reason as the workflow
      # file: with deploy.yml's push trigger gone (#661), this list is the ONLY
      # road a deploy-script edit has to the workflow that runs it.
      - "scripts/ci/deploy-*.sh"
  # A Dockerfile change was UNVALIDATABLE before merge: this workflow ran on
  # `push` to main only, so the first exercise of a restructured build was the
  # merge itself, and a break blocked dev deploys until someone reverted it.
  # The `verify` job below closes that, and the path list is deliberately
  # narrow — the builds' own STRUCTURE, not their sources. A source change
  # that breaks compilation is already caught by rust.yml and frontend.yml;
  # what nothing else covers is a Dockerfile, a .dockerignore (the er-api
  # build reads `.cargo/config.toml` out of its context) or this file.
  # Widening this to `rust/**` would put a cold ~1h build on ordinary PRs.
  #
  # Legal here only because NO job in this workflow is a required status
  # check — a `paths:` filter on a required one never reports and blocks the
  # PR forever (see the ci-and-supply-chain skill).
  pull_request:
    paths:
      - "rust/Dockerfile"
      - "rust/.dockerignore"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref/sha to build (defaults to the triggering commit)"
        required: false

concurrency:
  # Keyed on the ref AND the dispatched commit, not the ref alone.
  #
  # `workflow_dispatch` has to run on `main` because the ECR push role's OIDC
  # trust pins the `sub` claim to `refs/heads/main` (infra/terraform/modules/github-oidc),
  # so the `ref` input exists to build some *other* commit with main's identity.
  # Grouping on `github.ref` alone made every such dispatch share one group, so
  # dispatching a second commit silently cancelled the first — which is exactly
  # what happened while building a before/after image pair for the §18.16
  # measurement, and it looks like a build failure rather than a cancellation
  # until you read the run's conclusion.
  #
  group: images-${{ github.ref }}-${{ github.event.inputs.ref || '' }}
  # NEVER cancel a push build, for the same reason `deploy.yml` never cancels a
  # deploy: an image is the ARTIFACT a commit needs, not a check on it.
  # Cancelling one does not save work, it removes the thing the deploy is
  # supposed to roll — and the deploy then reuses whatever digest is newest in
  # ECR and reports SUCCESS.
  #
  # This used to read `cancel-in-progress: true`, with a comment noting that on
  # a push "a newer push to main still cancels an in-flight build of an older
  # one". That is exactly what happened on 2026-11-05: a burst of merges, an
  # er-api build that takes ~58 minutes, and so NO er-api image completed all
  # day. P12's metrics, P15's structured logging and P22's allowlist were all
  # merged, green, and absent from the running binary, while four deploys
  # reported success on an image built the previous evening.
  #
  # The stale-digest `::warning::` in deploy.yml fired on each of them, which is
  # the only reason this was findable — and it is a warning in a run summary,
  # which is not where anyone was looking.
  #
  # The cost is queued builds during a merge burst instead of cancelled ones.
  # That is the right trade: a queue is slow and correct, a cancellation is fast
  # and silently wrong. A `workflow_dispatch` still cancels its own group, which
  # is keyed on the dispatched ref and so never collides with a push.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Which trees moved in this push. `workflow_dispatch` and anything without a
  # usable "before" sha (a first push, a force-push) build both rather than
  # guessing — an unnecessary cached build is cheaper than a missing image.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/images-detect.sh
  er-api:
    needs: detect
    # Never on a pull_request: this job PUSHES, and the ECR role's OIDC trust
    # pins `sub` to refs/heads/main, so a PR could not assume it anyway. PRs
    # get the no-push `verify` job instead.
    if: github.event_name != 'pull_request' && needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 90, against a measured 58m9s of real build (run 41524220825) — this
    # Dockerfile's `COPY . .` means any rust/ change rebuilds all 408 crates,
    # so the long case is the NORMAL case until that is restructured. The
    # number exists because neither image job had a timeout at all: the
    # default is 360 minutes, so a hung buildkit burned six runner-hours
    # before failing, and `deploy-dev` waited on it the whole time.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # OIDC token exchange for the ECR-push role
    env:
      ECR: 797781631727.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-ecr-push
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Resolve the image tag (full sha of the built ref)
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build + push er-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rust
          file: rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR }}/er-api:${{ steps.tag.outputs.sha }}
          # Layer cache in ECR (er-buildcache, terraform: envs/core/registry.tf),
          # not the Actions cache: the gha backend's ~5 GB mode=max cache was the
          # largest producer in the shared 10 GB budget — the thing rust.yml's
          # cache-prune exists to cap. `image-manifest=true,oci-mediatypes=true`
          # because ECR rejects buildkit's default cache-manifest media type.
          # The transitional `type=gha` cache-from is GONE: run 41524220825
          # logged `importing cache manifest from …/er-buildcache:er-api` and
          # both tags are in the repo, so the registry round-trip is proven and
          # buildkit now touches the Actions cache in neither direction.
          cache-from: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-api"
          cache-to: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-api,mode=max,image-manifest=true,oci-mediatypes=true"

  er-web:
    needs: detect
    # Push-only, same reason as er-api above.
    if: github.event_name != 'pull_request' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 30, against 2m30s warm off the registry cache (run 41524220825). Same
    # reason as er-api's: the default was 360.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token exchange for the ECR-push role
    env:
      ECR: 797781631727.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-ecr-push
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Resolve the image tag (full sha of the built ref)
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The context is `frontend` because frontend/Dockerfile's COPY paths are
      # directory-relative (it says so in its own header), and pnpm comes from
      # corepack reading `packageManager` — the same single pin the CI gate uses.
      - name: Build + push er-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR }}/er-web:${{ steps.tag.outputs.sha }}
          # Same ECR-backed layer cache as er-api above — see that step's
          # comment for the full reasoning.
          cache-from: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-web"
          cache-to: "type=registry,ref=${{ env.ECR }}/er-buildcache:er-web,mode=max,image-manifest=true,oci-mediatypes=true"

  # Does each image still BUILD? PR-only, no push, no cache.
  #
  # This is the job that makes a Dockerfile change reviewable. It cannot reuse
  # the registry layer cache — reading it needs the ECR role, whose OIDC trust
  # is pinned to refs/heads/main — so it is a cold build and slow by
  # construction. That is the trade: an hour on the handful of PRs that touch
  # a Dockerfile, against shipping a broken build to main and blocking dev
  # deploys until someone reverts.
  #
  # `fail-fast: false` so one image's failure still reports the other's
  # result, which is most of the diagnostic value when a shared change (this
  # workflow, a base-image bump) breaks one of them.
  verify:
    name: image builds (${{ matrix.image }}, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: er-api
            context: rust
            file: rust/Dockerfile
          - image: er-web
            context: frontend
            file: frontend/Dockerfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          # The whole point: prove the build, publish nothing. No `load`
          # either — nothing here runs the image, and loading a multi-GB
          # image into the daemon is disk this runner does not have spare.
          push: false

  # §14.2's Helm half — "Dev platform releases apply from CI on `main`" — used
  # to be a `deploy-dev` job here. It is now .github/workflows/deploy.yml,
  # because a job in THIS workflow could not survive its own
  # `cancel-in-progress`. That file's header carries the measurement.
