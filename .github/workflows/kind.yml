# The kind probe (batch-orchestration-design §11): the Kubernetes executor end
# to end on a real (local) cluster — real pods, real projected ServiceAccount
# tokens verified against the real API server's JWKS, adoption across a
# dispatcher restart, cancel-through-canceling, and a seven-pod `run_all_full`
# where each stage reads what the previous stage's PROCESS wrote.
#
# Nightly + manual, and DELIBERATELY NOT a required check: the
# frontend-testing standard says a gate must be observed failing before it is
# trusted, and this one has not been yet. It also builds the full release
# image in-job (~40 min cold), which is the wrong cost for every PR.
name: kind

on:
  workflow_dispatch:
  schedule:
    # Nightly, offset from the drift run.
    - cron: "41 6 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: kind probe (executor e2e)
    runs-on: ubuntu-latest
    # 120, not 90: the cold image build is ~40 min on its own and the pipeline
    # phase adds seven sequential pods, each paying a cold DuckDB open, against
    # a 30-minute wait of its own. At 90 a slow build and a slow pipeline
    # together would cancel the job just before its most interesting assertion.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # The in-job docker build of the release image needs the same headroom
        # rust.yml's test and ducklake-e2e jobs reclaim; the same safety
        # argument holds — kind, kubectl and helm are installed below from
        # pinned tarballs, nothing reads the hostedtoolcache.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache
          df -h / | tail -1
      - name: Install kind + kubectl + helm (pinned tarballs)
        # Version-pinned downloads rather than third-party actions: every
        # `uses:` in this repo is SHA-pinned, and a pinned download needs no
        # SHA to keep current (the same argument as images.yml's helm step).
        env:
          KIND_VERSION: v0.31.0
          KUBECTL_VERSION: v1.33.4
          HELM_VERSION: v3.19.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          kind version && kubectl version --client && helm version --short
      - name: kind up (cluster + image + chart)
        run: bash scripts/kind_env.sh up
      - name: the probe
        run: bash scripts/check_kind.sh
      - name: diagnostics on failure
        if: failure()
        run: |
          # THE NODE BUDGET FIRST, because "Insufficient cpu" is unreadable
          # without it and that is how a whole class of failure hid here. A
          # task pod that cannot be scheduled sits `Pending` until the phase's
          # wait times out, so the probe reports "job never reached succeeded"
          # — a timeout — for a pod that never started. Allocatable CPU and the
          # sum of what is already requested are the two numbers that turn that
          # back into a one-line diagnosis, and neither was printed.
          echo "::group::node capacity and committed requests"
          kubectl --context kind-er-kind get nodes \
            -o custom-columns='NODE:.metadata.name,CPU:.status.capacity.cpu,ALLOCATABLE:.status.allocatable.cpu,MEM:.status.allocatable.memory' || true
          # `describe node` ends with "Allocated resources" — requests and
          # limits as both absolute values and percentages, across every
          # namespace. One command, and it is the answer.
          kubectl --context kind-er-kind describe node \
            | sed -n '/Allocated resources/,/^Events/p' || true
          echo "::endgroup::"
          kubectl --context kind-er-kind -n er-kind get pods,jobs -o wide || true
          # Why a Pending pod is pending, in its own words. `get pods` shows
          # the phase but not the reason, and the reason is the whole point.
          for p in $(kubectl --context kind-er-kind -n er-kind get pods \
                       --field-selector=status.phase=Pending \
                       -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "::group::pending pod $p"
            kubectl --context kind-er-kind -n er-kind describe "pod/$p" \
              | sed -n '/^Containers:/,$p' | head -60 || true
            echo "::endgroup::"
          done
          kubectl --context kind-er-kind -n er-kind logs deploy/er-dispatcher --tail=200 || true
          # By LABEL, not by Deployment name: web-api is two Deployments now
          # (one per colour) and `deploy/web-api` no longer resolves. The label
          # is stable across both and across a cutover, which is the point — a
          # diagnostic that silently prints nothing is worse than none, and this
          # one only runs when something has already failed.
          kubectl --context kind-er-kind -n er-kind logs -l app.kubernetes.io/name=web-api \
            -c er-server --tail=200 --prefix || true
          kubectl --context kind-er-kind -n er-kind get events --sort-by=.lastTimestamp | tail -40 || true
