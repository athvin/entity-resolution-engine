# The kind probe (batch-orchestration-design §11): the Kubernetes executor end
# to end on a real (local) cluster — real pods, real projected ServiceAccount
# tokens verified against the real API server's JWKS, adoption across a
# dispatcher restart, cancel-through-canceling, and a seven-pod `run_all_full`
# where each stage reads what the previous stage's PROCESS wrote.
#
# Nightly + manual, and DELIBERATELY NOT a required check. It has now been
# observed failing four times for four distinct causes (#614, #622, #624,
# #610) and passing since — all six phases green on the 2026-11-07 nightly
# and again on 2026-11-08 (#655) — so the frontend-testing "a gate must be
# observed failing before it is trusted" premise this comment once carried
# is satisfied. It stays unrequired on cost grounds: it builds the full
# release image in-job (~29 min measured, ~40 min cold), which is the wrong
# price for every PR, and the per-PR `assertions` job below covers the cheap
# half.
#
# Two jobs, and the split is the point. `probe` is the nightly cluster run.
# `assertions` runs on PRs that touch the probe and mutation-tests its
# assertion blocks in about a second — because a neutered assertion makes the
# nightly greener rather than redder, so the nightly cannot catch it.
name: kind

on:
  workflow_dispatch:
  schedule:
    # Nightly, offset from the drift run.
    - cron: "41 6 * * *"
  # PRs get the one-second fixture test below and NOT the two-hour probe. A
  # `paths:` filter is safe here only because nothing in this workflow is a
  # required status check — on `rust.yml` or `frontend.yml` the same filter
  # would leave a required context permanently unreported, which is why those
  # two use a `detect` job instead (ci-and-supply-chain).
  pull_request:
    paths:
      - scripts/check_kind.sh
      - scripts/ci/kind-assertions-test.sh
      - scripts/ci/kind-diagnostics.sh
      - .github/workflows/kind.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Why this runs on PRs when the probe does not: the probe's python assertion
  # blocks are the least-exercised correctness-critical code here — a cluster,
  # an image build and two hours, nightly. And an assertion that can no longer
  # fail makes the probe GREENER, so the nightly cannot detect its own
  # neutering. Only a per-PR mutation test can. Seconds, no cluster, no docker.
  assertions:
    name: kind probe assertions (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mutation tests for the probe's assertion blocks
        run: bash scripts/ci/kind-assertions-test.sh

  probe:
    name: kind probe (executor e2e)
    # Never on a pull request: ~2h and a full release image build. The
    # `assertions` job above is the PR-path coverage.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 120, not 90: the cold image build is ~40 min on its own and the pipeline
    # phase adds seven sequential pods, each paying a cold DuckDB open, against
    # a 30-minute wait of its own. At 90 a slow build and a slow pipeline
    # together would cancel the job just before its most interesting assertion.
    # Measured on the first green runs (#655): 28m42s on 2026-11-07 and 33m51s
    # on 2026-11-08 end to end (~25-29 min kind up + image, ~3 min probe), so
    # 120 holds with ~4x headroom and phase 6's feared ~22 min did not appear.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # The in-job docker build of the release image needs the same headroom
        # rust.yml's test and ducklake-e2e jobs reclaim — same script, same
        # safety argument, and it still holds here because the step below
        # installs kind, kubectl and helm from pinned tarballs rather than
        # from the hostedtoolcache.
        run: bash scripts/ci/reclaim-disk.sh
      - name: Install kind + kubectl + helm (pinned tarballs)
        # helm comes from scripts/ci/install-helm.sh, which owns that pin for
        # all three of its consumers; the pinned-download-over-action argument
        # is stated there.
        run: bash scripts/ci/install-kind-tools.sh
      - name: kind up (cluster + image + chart)
        run: bash scripts/kind_env.sh up
      - name: the probe
        run: bash scripts/check_kind.sh
      - name: diagnostics on failure
        if: failure()
        run: bash scripts/ci/kind-diagnostics.sh
