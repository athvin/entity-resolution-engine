# The dev deploy, in its own workflow so it cannot be starved.
#
# ## Why this is not a job inside images.yml any more
#
# It was, and it was structurally unreachable on a busy day. `images.yml` sets
# `cancel-in-progress: true`, and `deploy-dev` was `needs: [detect, er-api,
# er-web]` behind the ~58-minute er-api build. So any merge to main within an
# hour of the previous one cancelled the earlier run **before its deploy job
# started**.
#
# Measured on 2026-11-03: four merges inside one hour produced three
# consecutive cancelled deploys, and `scripts/obs_up.sh` — the only installer
# for the span store, the collector and Fluent Bit — had therefore never run,
# despite the PR that added it having merged. Nothing reported it, because a
# cancelled run is not a failure. "Merged" did not mean "deployed", and five
# defects in those unexecuted values survived review as a direct result.
#
# A job-level `concurrency` cannot fix that: the workflow-level cancel kills
# the job before it ever starts. The deploy has to be a separate run, which is
# what this file is.
#
# ## What the queueing semantics buy
#
# `cancel-in-progress: false` is the point of the whole change. Deploys QUEUE
# instead of cancelling, so a merge landing while a deploy is in flight waits
# its turn rather than aborting it half-applied.
#
# A cancelled `images` run still produces no deploy, and that is correct rather
# than a remnant of the old bug: a superseded build should not roll out, and
# the newest run — the one that was not cancelled — completes and deploys. The
# difference is that its deploy can no longer be killed by whatever merges
# next.
#
# ## The property the old comment claimed, and why it survives
#
# images.yml said the deploy lived there "so ordering is structural — a deploy
# cannot start before the images it deploys are pushed." That ordering is NOT
# given up here. `workflow_run` fires only on `completed`, and the `if` below
# additionally requires `conclusion == 'success'`, so a deploy still cannot
# begin before the images exist. What changes is only that the wait now happens
# in a run of its own, outside the concurrency group that was cancelling it.
#
# ## It targets one namespace
#
# `ci`, which CI owns. `er-platform` is otherwise only ever installed into a
# per-developer namespace by `make dev-up`, and redeploying those on every
# merge would restart a pod someone is mid-debug on — which also contradicts
# §14.2's own next clause, "`make dev-up` stays a human command". The reasoning
# is in infra/terraform/envs/dev/ci-deploy.tf.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  # PLATFORM-ONLY CHANGES, which the `workflow_run` path above cannot see.
  #
  # `images` only runs when something that goes INTO an image changes, so a
  # commit touching just `infra/k8s/**` builds nothing, `images` never runs,
  # and this workflow never fires — while `obs_up.sh`, which applies those
  # values, lives inside the deploy job. The result is a change that merges
  # green and is simply never applied.
  #
  # Found by merging the collector's PII attribute allowlist (#507): committed,
  # green, and absent from the cluster. It had been masked until then because
  # every earlier observability change rode along with a Rust commit that did
  # build an image.
  #
  # A `paths:` filter is safe HERE and nowhere near the gates: `deploy` is not
  # a required status check (the required set is the rust, frontend and infra
  # jobs), so a filtered run that never reports blocks nothing. On `rust.yml`
  # or `frontend.yml` the same filter would block every PR forever, which is
  # why those use the `detect`-job pattern instead.
  push:
    branches: [main]
    paths:
      - infra/k8s/**
      - scripts/obs_up.sh
  # The manual path, for redeploying a sha whose images already exist.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit sha to deploy (must already be built in ECR)
        required: true

concurrency:
  group: deploy-dev
  # Never cancel a deploy. See the header: cancelling one is how the previous
  # arrangement silently skipped deploying at all.
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: deploy dev (ci namespace)
    # Only a SUCCESSFUL images run on main deploys.
    #
    # This replaces the old "Refuse to deploy a failed build" step, and is
    # strictly better than it was: a rust-only commit legitimately SKIPS the
    # er-web job, which leaves the workflow conclusion `success`, while a
    # genuinely failed image build makes it `failure`. The distinction the old
    # step had to make by inspecting `needs.*.result` is already encoded in the
    # conclusion — and `cancelled` and `skipped` conclusions fall through to no
    # deploy, which is what they should mean.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-deploy-dev
    env:
      CI_NAMESPACE: ci
      CLUSTER: er-dev
      AWS_REGION: us-east-2
      # The commit being deployed. `workflow_run` does not check out anything
      # by default and `github.sha` here is the DEFAULT BRANCH tip, not the
      # built commit — using it would deploy whatever main happens to be now
      # rather than what was built, which is the subtle way this kind of split
      # goes wrong.
      #
      # On the `push` path `github.sha` IS the pushed commit rather than a
      # moving branch tip, so it is correct here for the same reason it is
      # wrong above — the hazard is reading a branch tip, not the variable.
      DEPLOY_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      # True on the platform-only path, where NO image was built for this
      # commit by design. It changes the stale-digest message below from a
      # warning into a note — see the reasoning there.
      PLATFORM_ONLY: ${{ github.event_name == 'push' }}
    steps:
      - name: Name the commit being deployed
        run: echo "deploying $DEPLOY_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Full history, because the staleness guard in "Resolve image
          # digests" runs `git diff <the sha the reused image was built
          # from>..<DEPLOY_SHA>`. The default depth of 1 clones a single
          # commit, so that diff cannot resolve its left side and the guard
          # would take its "cannot verify" branch on EVERY deploy — a check
          # that always abstains, which is worse than no check because it
          # looks like one.
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          # The OIDC subject is pinned to `ref:refs/heads/main`
          # (infra/terraform/modules/github-oidc). A `workflow_run` workflow
          # runs in the DEFAULT BRANCH context, so the claim still matches —
          # and if it ever stops matching, this step fails closed before
          # anything is applied.
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-deploy-dev
          aws-region: us-east-2
      - name: Resolve image digests
        id: digests
        # §14.2: a deploy passes a DIGEST, never a tag, and gates on that digest
        # being present in the registry first. Promotion-by-digest is only a
        # property if the thing being deployed is identified by content.
        #
        # Images are tagged by full sha and built only when their own tree
        # moved, so for any given commit one of them may legitimately have no
        # sha tag. In that case reuse the newest digest already in the repo —
        # that IS what is running — and say so in the log. Nothing is deployed
        # by tag either way, and an empty result is fatal.
        run: |
          set -euo pipefail
          for repo in er-api er-web; do
            d="$(aws ecr describe-images --repository-name "$repo" \
                   --image-ids "imageTag=$DEPLOY_SHA" \
                   --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
            if [ -z "$d" ] || [ "$d" = "None" ]; then
              d="$(aws ecr describe-images --repository-name "$repo" \
                     --query 'reverse(sort_by(imageDetails,&imagePushedAt))[0].imageDigest' \
                     --output text 2>/dev/null || true)"
              # A WARNING, not just a log line. Reusing a digest is correct
              # when that tree genuinely did not change — but it also happens
              # when the build that should have produced one was skipped or
              # never ran, and then a GREEN deploy ships code from an arbitrary
              # number of commits back. Observed: the images run carrying the
              # telemetry exporter died in an outage, the next merge was
              # frontend-only so er-api was correctly skipped, and the deploy
              # reported success while rolling an image nine commits stale.
              #
              # The annotation puts it in the run summary where it is read,
              # rather than 140 lines into a step log where it was not.
              # Two cases reach here and they deserve different volumes.
              #
              # On the `workflow_run` path a missing image is SUSPICIOUS: an
              # images run did happen, so either that tree genuinely did not
              # change or a build was skipped and this deploy is about to ship
              # older code. That is the case the warning was added for, and it
              # must stay loud.
              #
              # On the `push` path — a platform-only commit under
              # `infra/k8s/**` — no image was built BY DESIGN, so reuse is the
              # expected and correct outcome every single time. Warning there
              # would fire on every such deploy and teach the reader to ignore
              # the annotation, which would cost exactly the signal the loud
              # case exists to provide.
              if [ "$PLATFORM_ONLY" = "true" ]; then
                echo "::notice title=$repo digest reused (platform-only deploy)::no image tagged $DEPLOY_SHA, which is expected: this commit touched only infra/k8s, so nothing was built. Rolling the newest digest in ECR ($d), which is what is already running."
              else
                echo "::warning title=$repo reused a stale digest::no image tagged $DEPLOY_SHA; rolled the newest digest in ECR instead ($d). Correct if that tree did not change in this commit — but if its build was skipped or failed, this deploy shipped older code than $DEPLOY_SHA."
              fi
              echo "$repo: no image tagged $DEPLOY_SHA — REUSED newest digest $d"
              echo "reused_${repo//-/_}=1" >> "$GITHUB_OUTPUT"

              # REFUSE, rather than warn, when the tree that builds this image
              # actually moved between what is running and what is being
              # deployed.
              #
              # The warning above was not enough, and the evidence is specific:
              # it fired on four deploys on 2026-11-05 — P12's metrics, P15's
              # structured logging, P22's gate and P7's action header all
              # merged, green, and absent from the running binary — and nobody
              # read it, including the person who added it for exactly this
              # failure. Something that must not be missed has to fail a check,
              # not annotate one.
              #
              # The question is answerable because the reused digest carries
              # the sha it WAS built from. `git diff <that sha>..<DEPLOY_SHA>`
              # over the image's own source paths says whether this deploy
              # would ship older code than it claims. No image tag and no
              # source change is the legitimate case (#587's platform-only
              # path, or a tree that genuinely did not move); no image tag WITH
              # a source change is the bug.
              built_from="$(aws ecr describe-images --repository-name "$repo" \
                              --image-ids "imageDigest=$d" \
                              --query 'imageDetails[0].imageTags[0]' --output text 2>/dev/null || true)"
              case "$repo" in
                er-api) watched="rust Dockerfile entities" ;;
                er-web) watched="frontend" ;;
                *)      watched="" ;;
              esac
              if [ -n "$built_from" ] && [ "$built_from" != "None" ] && [ -n "$watched" ]; then
                # shellcheck disable=SC2086
                if ! git cat-file -e "${built_from}^{commit}" 2>/dev/null; then
                  echo "::warning title=$repo cannot verify the reused digest::its tag '$built_from' is not a commit in this checkout, so the staleness check could not run"
                elif changed="$(git diff --name-only "$built_from".."$DEPLOY_SHA" -- $watched)" && [ -n "$changed" ]; then
                  echo "::error title=$repo would ship older code than $DEPLOY_SHA::the newest digest in ECR was built from $built_from, and these paths changed between it and $DEPLOY_SHA. Refusing to deploy rather than reporting success on a stale image. Build it with: gh workflow run images.yml -f ref=$DEPLOY_SHA"
                  echo "$changed" | head -20
                  exit 1
                else
                  echo "$repo: reuse verified — no change under '$watched' between $built_from and $DEPLOY_SHA"
                fi
              fi
            else
              echo "$repo: $DEPLOY_SHA -> $d"
              echo "reused_${repo//-/_}=0" >> "$GITHUB_OUTPUT"
            fi
            if [ -z "$d" ] || [ "$d" = "None" ]; then
              echo "::error::no digest in ECR for $repo; refusing to deploy by tag"
              exit 1
            fi
            echo "${repo//-/_}=$d" >> "$GITHUB_OUTPUT"
          done
      - name: Install helm
        # Version-pinned tarball rather than a third-party action, the same
        # choice the disk-reclaim step in rust.yml documents: every `uses:` in
        # this repo is SHA-pinned, and a pinned download needs no SHA to keep
        # current. `helm version` is the check that the install worked.
        env:
          HELM_VERSION: v3.19.0
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          helm version --short
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Provision the namespace's EFS access point and secrets
        # Same script `make dev-up` uses, so CI and a human provision a
        # namespace identically rather than by two drifting paths. Idempotent:
        # it finds an existing access point and existing secrets.
        id: env
        run: |
          set -euo pipefail
          eval "$(bash scripts/dev_env.sh up "$CI_NAMESPACE")"
          echo "fs=$ER_EFS_FS_ID" >> "$GITHUB_OUTPUT"
          echo "ap=$ER_EFS_AP_ID" >> "$GITHUB_OUTPUT"
      - name: Install the observability stack
        # Cluster-scoped, not per-namespace: the log shipper, the OTLP
        # collector gateway and the shared span store serve every namespace on
        # this cluster. It runs here because it ran NOWHERE before — `make
        # obs-up` was the only path, which meant the stack was hand-installed,
        # absent from every GitOps loop, and invisible to the drift check.
        #
        # The same script a human runs (scripts/obs_up.sh), for the reason the
        # namespace step above gives: two paths drift, one does not. Every
        # release is `upgrade --install`, so this is a no-op when nothing moved.
        #
        # Deliberately NOT `continue-on-error`: a telemetry stack that silently
        # fails to install is worse than a red deploy, because the absence of
        # spans reads as "nothing happened" rather than as a broken deploy.
        run: bash scripts/obs_up.sh
      - name: Say what was deployed
        # The summary is the artifact someone reads a week later when asking
        # "was that change actually out?". A digest alone does not answer it;
        # whether it came from THIS commit does.
        env:
          API_REUSED: ${{ steps.digests.outputs.reused_er_api }}
          WEB_REUSED: ${{ steps.digests.outputs.reused_er_web }}
        run: |
          {
            echo "### deploy — dev (\`ci\` namespace)"
            echo ""
            echo "| image | digest | from this commit? |"
            echo "|---|---|---|"
            for pair in "er-api:$API_REUSED:${{ steps.digests.outputs.er_api }}" \
                        "er-web:$WEB_REUSED:${{ steps.digests.outputs.er_web }}"; do
              name="${pair%%:*}"; rest="${pair#*:}"; reused="${rest%%:*}"; digest="${rest#*:}"
              if [ "$reused" = "1" ]; then
                echo "| \`$name\` | \`${digest:0:19}…\` | **no — reused the newest digest in ECR** |"
              else
                echo "| \`$name\` | \`${digest:0:19}…\` | yes |"
              fi
            done
            echo ""
            echo "Commit: \`$DEPLOY_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The executor allowlist (batch-orchestration-design §11): these kinds
      # run as per-attempt Kubernetes Jobs in this namespace. Enabled HERE,
      # not in the chart default, so a developer namespace opts in
      # deliberately.
      #
      # `run_all_*` joins the two Phase 2 kinds because the pipeline has now
      # been observed end to end on a real cluster: `check_kind.sh` phase 5
      # runs `run_all_full` as seven pods — seven distinct Job objects, seven
      # distinct pod uids, one launch each — and the lake comes out ledgered.
      # Both share one DAG and one set of bodies; only `init`'s mode
      # decision differs.
      #
      # The rest of Phase 3's kinds (`correct`, `train`, `apply_corrections`,
      # `apply_approved`, `provision`) stay OFF for now. Their bodies are
      # real and covered by the integration tier, but none has run on a
      # cluster, and an allowlist whose entries all arrive together is not
      # an allowlist. They go on as each is observed.

      - name: The namespace chart
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/storage/ebs-gp3.yaml
          helm upgrade --install "$CI_NAMESPACE" infra/k8s/charts/er-dev-namespace \
            --namespace default --set "developer=$CI_NAMESPACE" --wait

      - name: Read the live colour
        # NEVER guessed. The Service selector is the single source of truth for
        # which colour is serving — the same field the cutover moves — so this
        # cannot drift from reality the way a stored value or a convention
        # would. `make dev-resume` reads it the same way.
        #
        # Absent selector == first install: there is no live colour, so there is
        # nothing to cut over FROM and the deploy takes the simple path below.
        id: colour
        run: |
          set -euo pipefail
          live="$(kubectl -n "$CI_NAMESPACE" get svc er-web \
            -o jsonpath='{.spec.selector.er\.dupezero\.com/color}' 2>/dev/null || true)"
          if [ -z "$live" ]; then
            echo "no live colour (first install) — deploying blue directly"
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "live=blue" >> "$GITHUB_OUTPUT"
            echo "target=blue" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$live" in
            blue) target=green ;;
            green) target=blue ;;
            *) echo "::error::svc/er-web selects unknown colour '$live'"; exit 1 ;;
          esac
          # The digests the LIVE colour is already serving, so the upgrade that
          # deploys the target does not re-render the live Deployment and
          # restart the pod taking traffic. `image: reg/repo@sha256:…` -> the
          # digest only.
          live_api="$(kubectl -n "$CI_NAMESPACE" get deploy "web-api-$live" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="er-server")].image}' | sed 's/.*@//')"
          live_web="$(kubectl -n "$CI_NAMESPACE" get deploy "web-api-$live" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="er-web")].image}' | sed 's/.*@//')"
          echo "live=$live target=$target"
          echo "live api=$live_api web=$live_web"
          {
            echo "first=false"
            echo "live=$live"
            echo "target=$target"
            echo "live_api=$live_api"
            echo "live_web=$live_web"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy the inactive colour
        # Phase 1 of the cutover. Traffic does NOT move here: `color.active`
        # stays on the live colour, and the new digests go into the other one.
        #
        # THE SCHEMA GATE IS THE HOOK, not a step here. `er-schema-migrate`
        # (weight -5) runs `er-server migrate --expect-additive`, which plans
        # first and refuses — writing nothing — if the release is breaking.
        # Helm runs hooks before any release object is applied, so a breaking
        # release fails with the live colour untouched. A separate preflight Job
        # would be the same check twice.
        #
        # `images.api/web.digest` is what the HOOK migrates with: the colour
        # blocks say what each Deployment runs, while `images.*` means "the
        # release this upgrade is about".
        env:
          LIVE: ${{ steps.colour.outputs.live }}
          TARGET: ${{ steps.colour.outputs.target }}
          FIRST: ${{ steps.colour.outputs.first }}
          LIVE_API: ${{ steps.colour.outputs.live_api }}
          LIVE_WEB: ${{ steps.colour.outputs.live_web }}
          DAG_KINDS: 'lake_maintain\,lake_migrate\,run_all_full\,run_all_incremental'
          NEW_API: ${{ steps.digests.outputs.er_api }}
          NEW_WEB: ${{ steps.digests.outputs.er_web }}
          FS: ${{ steps.env.outputs.fs }}
          AP: ${{ steps.env.outputs.ap }}
        run: |
          set -euo pipefail
          args=(
            --namespace "$CI_NAMESPACE" --set "developer=$CI_NAMESPACE"
            --set "images.api.digest=$NEW_API"
            --set "images.web.digest=$NEW_WEB"
            --set "efs.fileSystemId=$FS"
            --set "efs.accessPointId=$AP"
            # The executor allowlist (batch-orchestration-design §11): the two
            # Phase 2 kinds run as per-attempt Kubernetes Jobs in this
            # namespace. Enabled HERE, not in the chart default, so a developer
            # namespace opts in deliberately.
            --set "executor.dagKinds=$DAG_KINDS"
            --set "color.active=$LIVE"
            --set "color.$TARGET.replicas=1"
            --set "color.$TARGET.api.digest=$NEW_API"
            --set "color.$TARGET.web.digest=$NEW_WEB"
          )
          if [ "$FIRST" != "true" ]; then
            # Pin the live colour to what it is ALREADY serving. Without this
            # the live Deployment re-renders to the new digest and restarts the
            # pod taking traffic, which is the outage this exists to remove.
            args+=(
              --set "color.$LIVE.replicas=1"
              --set "color.$LIVE.api.digest=$LIVE_API"
              --set "color.$LIVE.web.digest=$LIVE_WEB"
            )
          fi
          helm upgrade --install er-platform infra/k8s/charts/er-platform \
            "${args[@]}" --atomic --wait --timeout 10m
          kubectl -n "$CI_NAMESPACE" rollout status "deploy/web-api-$TARGET" --timeout=5m

      - name: Smoke-test the inactive colour
        # Through the PREVIEW Services, which select the inactive colour. Hitting
        # the live ones would test what is already in production and pass for the
        # wrong reason — the failure that would make this whole mechanism
        # decorative without looking broken.
        #
        # Readiness already proves er-server reached the control plane and the
        # BFF reached er-server (#437 pointed both probes at checks that can
        # fail). This adds the one thing a probe cannot: that the answer arrives
        # through a Service, over the network path a real request takes.
        if: steps.colour.outputs.first != 'true'
        env:
          TARGET: ${{ steps.colour.outputs.target }}
        run: |
          set -euo pipefail
          kubectl -n "$CI_NAMESPACE" run "smoke-$GITHUB_RUN_ID" --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --quiet -- \
            sh -ec '
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://er-api-preview:8000/readyz)
              echo "er-api-preview /readyz -> $code"
              [ "$code" = "200" ] || exit 1
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://er-web-preview:3000/api/healthz)
              echo "er-web-preview /api/healthz -> $code"
              [ "$code" = "200" ] || exit 1
            '
          echo "the $TARGET colour serves through its own Services"

      - name: Cut over
        # Phase 2: the whole cutover is this one field on two Service objects.
        # The old colour keeps running, so a rollback is the same field moving
        # back — see the summary this writes.
        if: steps.colour.outputs.first != 'true'
        env:
          LIVE: ${{ steps.colour.outputs.live }}
          TARGET: ${{ steps.colour.outputs.target }}
          LIVE_API: ${{ steps.colour.outputs.live_api }}
          LIVE_WEB: ${{ steps.colour.outputs.live_web }}
          DAG_KINDS: 'lake_maintain\,lake_migrate\,run_all_full\,run_all_incremental'
          NEW_API: ${{ steps.digests.outputs.er_api }}
          NEW_WEB: ${{ steps.digests.outputs.er_web }}
          FS: ${{ steps.env.outputs.fs }}
          AP: ${{ steps.env.outputs.ap }}
        run: |
          set -euo pipefail
          helm upgrade er-platform infra/k8s/charts/er-platform \
            --namespace "$CI_NAMESPACE" --set "developer=$CI_NAMESPACE" \
            --set "images.api.digest=$NEW_API" --set "images.web.digest=$NEW_WEB" \
            --set "efs.fileSystemId=$FS" --set "efs.accessPointId=$AP" \
            --set "executor.dagKinds=$DAG_KINDS" \
            --set "color.active=$TARGET" \
            --set "color.$TARGET.replicas=1" \
            --set "color.$TARGET.api.digest=$NEW_API" \
            --set "color.$TARGET.web.digest=$NEW_WEB" \
            --set "color.$LIVE.replicas=1" \
            --set "color.$LIVE.api.digest=$LIVE_API" \
            --set "color.$LIVE.web.digest=$LIVE_WEB" \
            --atomic --wait --timeout 10m
          now="$(kubectl -n "$CI_NAMESPACE" get svc er-web \
            -o jsonpath='{.spec.selector.er\.dupezero\.com/color}')"
          [ "$now" = "$TARGET" ] || { echo "::error::cutover did not take: svc selects '$now'"; exit 1; }
          echo "traffic is on $TARGET"
          {
            echo "### Cut over to \`$TARGET\`"
            echo
            echo "The \`$LIVE\` colour is still running. To roll back:"
            echo
            echo '```'
            echo "helm upgrade er-platform infra/k8s/charts/er-platform \\"
            echo "  --namespace $CI_NAMESPACE --reuse-values --set color.active=$LIVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retire the old colour
        # Phase 3, and the one step that is deliberately NOT --atomic-coupled to
        # the cutover: it runs only after the cutover has been verified, so a
        # failure here leaves traffic correctly on the new colour with one
        # surplus pod — the harmless direction.
        #
        # Scaled to zero rather than left warm because two serving pods is
        # double the steady-state cost of a namespace, and the Deployment is
        # kept (not deleted) so the next deploy scales it up with its image
        # already cached. A rollback AFTER this point needs the replica count
        # back as well as the selector, which is why the summary above prints
        # the command while the pod is still there.
        if: steps.colour.outputs.first != 'true'
        env:
          LIVE: ${{ steps.colour.outputs.live }}
        run: |
          set -euo pipefail
          kubectl -n "$CI_NAMESPACE" scale "deploy/web-api-$LIVE" --replicas=0
          echo "retired $LIVE"
