# The dev deploy, in its own workflow so it cannot be starved.
#
# ## Why this is not a job inside images.yml any more
#
# It was, and it was structurally unreachable on a busy day. `images.yml` sets
# `cancel-in-progress: true`, and `deploy-dev` was `needs: [detect, er-api,
# er-web]` behind the ~58-minute er-api build. So any merge to main within an
# hour of the previous one cancelled the earlier run **before its deploy job
# started**.
#
# Measured on 2026-11-03: four merges inside one hour produced three
# consecutive cancelled deploys, and `scripts/obs_up.sh` — the only installer
# for the span store, the collector and Fluent Bit — had therefore never run,
# despite the PR that added it having merged. Nothing reported it, because a
# cancelled run is not a failure. "Merged" did not mean "deployed", and five
# defects in those unexecuted values survived review as a direct result.
#
# A job-level `concurrency` cannot fix that: the workflow-level cancel kills
# the job before it ever starts. The deploy has to be a separate run, which is
# what this file is.
#
# ## What the queueing semantics buy
#
# `cancel-in-progress: false` is the point of the whole change. Deploys QUEUE
# instead of cancelling, so a merge landing while a deploy is in flight waits
# its turn rather than aborting it half-applied.
#
# A cancelled `images` run still produces no deploy, and that is correct rather
# than a remnant of the old bug: a superseded build should not roll out, and
# the newest run — the one that was not cancelled — completes and deploys. The
# difference is that its deploy can no longer be killed by whatever merges
# next.
#
# ## The property the old comment claimed, and why it survives
#
# images.yml said the deploy lived there "so ordering is structural — a deploy
# cannot start before the images it deploys are pushed." That ordering is NOT
# given up here. `workflow_run` fires only on `completed`, and the `if` below
# additionally requires `conclusion == 'success'`, so a deploy still cannot
# begin before the images exist. What changes is only that the wait now happens
# in a run of its own, outside the concurrency group that was cancelling it.
#
# ## It targets one namespace
#
# `ci`, which CI owns. `er-platform` is otherwise only ever installed into a
# per-developer namespace by `make dev-up`, and redeploying those on every
# merge would restart a pod someone is mid-debug on — which also contradicts
# §14.2's own next clause, "`make dev-up` stays a human command". The reasoning
# is in infra/terraform/envs/dev/ci-deploy.tf.
name: deploy

on:
  workflow_run:
    workflows: [images]
    types: [completed]
  # PLATFORM-ONLY CHANGES, which the `workflow_run` path above cannot see.
  #
  # `images` only runs when something that goes INTO an image changes, so a
  # commit touching just `infra/k8s/**` builds nothing, `images` never runs,
  # and this workflow never fires — while `obs_up.sh`, which applies those
  # values, lives inside the deploy job. The result is a change that merges
  # green and is simply never applied.
  #
  # Found by merging the collector's PII attribute allowlist (#507): committed,
  # green, and absent from the cluster. It had been masked until then because
  # every earlier observability change rode along with a Rust commit that did
  # build an image.
  #
  # A `paths:` filter is safe HERE and nowhere near the gates: `deploy` is not
  # a required status check (the required set is the rust, frontend and infra
  # jobs), so a filtered run that never reports blocks nothing. On `rust.yml`
  # or `frontend.yml` the same filter would block every PR forever, which is
  # why those use the `detect`-job pattern instead.
  push:
    branches: [main]
    paths:
      - infra/k8s/**
      - scripts/obs_up.sh
      # The deploy's own extracted steps: without these, an edit to a deploy
      # script would never trigger the workflow that runs it.
      - scripts/ci/deploy-*.sh
  # The manual path, for redeploying a sha whose images already exist.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit sha to deploy (must already be built in ECR)
        required: true

concurrency:
  group: deploy-dev
  # Never cancel a deploy. See the header: cancelling one is how the previous
  # arrangement silently skipped deploying at all.
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: deploy dev (ci namespace)
    # Only a SUCCESSFUL images run on main deploys.
    #
    # This replaces the old "Refuse to deploy a failed build" step, and is
    # strictly better than it was: a rust-only commit legitimately SKIPS the
    # er-web job, which leaves the workflow conclusion `success`, while a
    # genuinely failed image build makes it `failure`. The distinction the old
    # step had to make by inspecting `needs.*.result` is already encoded in the
    # conclusion — and `cancelled` and `skipped` conclusions fall through to no
    # deploy, which is what they should mean.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-deploy-dev
    env:
      CI_NAMESPACE: ci
      CLUSTER: er-dev
      AWS_REGION: us-east-2
      # The commit being deployed. `workflow_run` does not check out anything
      # by default and `github.sha` here is the DEFAULT BRANCH tip, not the
      # built commit — using it would deploy whatever main happens to be now
      # rather than what was built, which is the subtle way this kind of split
      # goes wrong.
      #
      # On the `push` path `github.sha` IS the pushed commit rather than a
      # moving branch tip, so it is correct here for the same reason it is
      # wrong above — the hazard is reading a branch tip, not the variable.
      DEPLOY_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      # True on the platform-only path, where NO image was built for this
      # commit by design. It changes the stale-digest message below from a
      # warning into a note — see the reasoning there.
      PLATFORM_ONLY: ${{ github.event_name == 'push' }}
    steps:
      - name: Name the commit being deployed
        run: echo "deploying $DEPLOY_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Full history, because the staleness guard in "Resolve image
          # digests" runs `git diff <the sha the reused image was built
          # from>..<DEPLOY_SHA>`. The default depth of 1 clones a single
          # commit, so that diff cannot resolve its left side and the guard
          # would take its "cannot verify" branch on EVERY deploy — a check
          # that always abstains, which is worse than no check because it
          # looks like one.
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          # The OIDC subject is pinned to `ref:refs/heads/main`
          # (infra/terraform/modules/github-oidc). A `workflow_run` workflow
          # runs in the DEFAULT BRANCH context, so the claim still matches —
          # and if it ever stops matching, this step fails closed before
          # anything is applied.
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-deploy-dev
          aws-region: us-east-2
      - name: Resolve image digests
        id: digests
        # §14.2: a deploy passes a DIGEST, never a tag — the reuse rules, the
        # warning-versus-notice volumes and the staleness REFUSE live in
        # scripts/ci/deploy-resolve-digests.sh with the code. Reads DEPLOY_SHA
        # and PLATFORM_ONLY from the job env; needs the full-history checkout
        # above for the `git diff` staleness guard.
        run: bash scripts/ci/deploy-resolve-digests.sh
      - name: Install helm
        # The shared installer, which owns the pin for all three of its
        # consumers (here, infra.yml and kind.yml) and states why this is a
        # pinned tarball rather than a third-party action.
        run: bash scripts/ci/install-helm.sh
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Provision the namespace's EFS access point and secrets
        # Same script `make dev-up` uses, so CI and a human provision a
        # namespace identically rather than by two drifting paths. Idempotent:
        # it finds an existing access point and existing secrets.
        id: env
        run: bash scripts/ci/deploy-provision-namespace.sh
      - name: Install the observability stack
        # Cluster-scoped, not per-namespace: the log shipper, the OTLP
        # collector gateway and the shared span store serve every namespace on
        # this cluster. It runs here because it ran NOWHERE before — `make
        # obs-up` was the only path, which meant the stack was hand-installed,
        # absent from every GitOps loop, and invisible to the drift check.
        #
        # The same script a human runs (scripts/obs_up.sh), for the reason the
        # namespace step above gives: two paths drift, one does not. Every
        # release is `upgrade --install`, so this is a no-op when nothing moved.
        #
        # Deliberately NOT `continue-on-error`: a telemetry stack that silently
        # fails to install is worse than a red deploy, because the absence of
        # spans reads as "nothing happened" rather than as a broken deploy.
        run: bash scripts/obs_up.sh
      - name: Say what was deployed
        # The summary is the artifact someone reads a week later when asking
        # "was that change actually out?" — see the script.
        env:
          API_REUSED: ${{ steps.digests.outputs.reused_er_api }}
          WEB_REUSED: ${{ steps.digests.outputs.reused_er_web }}
          API_DIGEST: ${{ steps.digests.outputs.er_api }}
          WEB_DIGEST: ${{ steps.digests.outputs.er_web }}
        run: bash scripts/ci/deploy-summary.sh

      # Every kind runs as per-attempt Kubernetes Jobs. There is no allowlist
      # to pass any more (#645): the executor owns every kind the DAG registry
      # parses, so neither the install nor the cut-over carries a value that
      # could disagree with the other.
      #
      # The rollout this replaced went kind by kind, and the note here used to
      # say the last few would go on one at a time "as each is observed" on a
      # cluster. That was the wrong unit. What a
      # cluster run adds — real scheduling, real projected-token verification,
      # real EFS, a real image — are PLATFORM properties, and they are already
      # proven live by `lake_maintain` (Phase 2) and by `run_all_full` running
      # as seven pods with seven pod uids and a ledgered lake. Repeating that
      # per kind re-proves the platform, not the kind.
      #
      # The per-kind risk is the body and the work order, and the integration
      # tier covers both for every kind: `pg_run_all_dag.rs` and
      # `pg_run_all_pipeline.rs` stand up the REAL control plane
      # (`er_server::app(AppState::with_pg(..))`) against a real DuckLake and
      # run the real `exec-task` binary, so a mis-assembled order fails there.

      - name: The namespace chart
        # The cluster-scoped StorageClass goes on first; why, and why `--wait`,
        # are in scripts/ci/deploy-namespace-chart.sh.
        run: bash scripts/ci/deploy-namespace-chart.sh

      - name: Read the live colour
        # NEVER guessed — the Service selector is the single source of truth
        # (D-BLUEGREEN); the reading and the first-install path live in
        # scripts/ci/deploy-read-colour.sh.
        id: colour
        run: bash scripts/ci/deploy-read-colour.sh

      - name: Deploy the inactive colour
        # Phase 1 of the cutover: traffic does NOT move here. The schema gate
        # is the `er-schema-migrate` helm hook, and the live colour is pinned
        # to what it already serves — both explained in
        # scripts/ci/deploy-inactive-colour.sh with the code.
        env:
          LIVE: ${{ steps.colour.outputs.live }}
          TARGET: ${{ steps.colour.outputs.target }}
          FIRST: ${{ steps.colour.outputs.first }}
          LIVE_API: ${{ steps.colour.outputs.live_api }}
          LIVE_WEB: ${{ steps.colour.outputs.live_web }}
          NEW_API: ${{ steps.digests.outputs.er_api }}
          NEW_WEB: ${{ steps.digests.outputs.er_web }}
          FS: ${{ steps.env.outputs.fs }}
          AP: ${{ steps.env.outputs.ap }}
        run: bash scripts/ci/deploy-inactive-colour.sh

      - name: Smoke-test the inactive colour
        # Through the PREVIEW Services, which select the inactive colour —
        # hitting the live ones would pass for the wrong reason. Why that is
        # the failure that would make this whole mechanism decorative, and
        # what this adds over the readiness probes, is in
        # scripts/ci/deploy-smoke-preview.sh.
        if: steps.colour.outputs.first != 'true'
        env:
          TARGET: ${{ steps.colour.outputs.target }}
        run: bash scripts/ci/deploy-smoke-preview.sh

      - name: Cut over
        # Phase 2: one selector field on two Services moves traffic; the old
        # colour keeps running so rollback is the same field moving back. The
        # verification and the rollback summary live in
        # scripts/ci/deploy-cutover.sh.
        if: steps.colour.outputs.first != 'true'
        env:
          LIVE: ${{ steps.colour.outputs.live }}
          TARGET: ${{ steps.colour.outputs.target }}
          LIVE_API: ${{ steps.colour.outputs.live_api }}
          LIVE_WEB: ${{ steps.colour.outputs.live_web }}
          NEW_API: ${{ steps.digests.outputs.er_api }}
          NEW_WEB: ${{ steps.digests.outputs.er_web }}
          FS: ${{ steps.env.outputs.fs }}
          AP: ${{ steps.env.outputs.ap }}
        run: bash scripts/ci/deploy-cutover.sh

      - name: Retire the old colour
        # Phase 3, and the one step deliberately NOT --atomic-coupled to the
        # cutover. Why that is the harmless direction, and why the Deployment
        # is scaled to zero rather than deleted, is in
        # scripts/ci/deploy-retire-colour.sh.
        if: steps.colour.outputs.first != 'true'
        env:
          LIVE: ${{ steps.colour.outputs.live }}
        run: bash scripts/ci/deploy-retire-colour.sh
