# The application's CI. The engine, CLI, and control plane are Rust (under
# `rust/`); the Python/dbt implementation has been removed, so this is the whole
# backend gate — effectively unfiltered (the frontend keeps its own pnpm gate).
#
# The one exception: a PR that only touches `.claude/**` (agent/skill prose, no
# code and nothing the generators read) runs none of the compile jobs. Because
# the required jobs below are REQUIRED status checks, a workflow-level path
# filter would leave them "pending" forever and block the PR; instead a `detect`
# job computes whether any non-`.claude` file changed and the required jobs gate
# on it with `if:`. A job skipped by `if:` reports a "skipped" conclusion, which
# branch protection accepts as satisfied — so the PR stays mergeable with zero
# compute. The skip is deliberately `.claude`-only: the `entities` job runs
# `er-entity verify` (docs/erd.md staleness) and `lint` verifies the generated
# skill references, so docs/ changes must still run the gate.
#
# A JOB'S `name:` IS ITS BRANCH-PROTECTION CONTEXT. Renaming one silently
# un-protects it, and adding a required context for a job that does not yet
# exist on `main` blocks every PR until it does. `entities` was split out of
# `lint` and is required; it was added to protection only after it had reported
# green on `main`, which is the only safe order.
#
# The toolchain is installed with `rustup` rather than an action: dtolnay's
# rust-toolchain selects the channel through its ref (`@stable`), which cannot
# also carry the S9 `@<sha> # vTAG` pin the repo requires of every `uses:`.
#
# SPEED: every compile job shares an sccache compilation cache (GHA backend) and
# links with mold, so the 6 jobs stop re-compiling the same crate-units cold and
# the DuckDB static link is far cheaper. The heavy perf jobs (bench compile,
# 50k scale) run only on main + nightly, not on every PR — the PR gate is
# lint + test + the DuckLake integration e2e + cargo-deny.
#
# The two caches are a SHARED, CAPPED resource — 10 GB per repository, LRU-evicted
# past it — and they fail differently, which is why both exist. rust-cache keys on
# `Cargo.lock` and so misses wholesale on any dependency change; sccache is
# content-addressed per compilation unit and still hits for every crate a bump did
# not touch. Three rules follow, each load-bearing:
#
#   1. `lint` is the SINGLE WRITER of `shared-key: rust`, and only from `main`;
#      the other four compile jobs are restore-only (`save-if: false`).
#      `coverage` keeps the writer on its own key — see the note there for why
#      dropping it would buy 1.8 GiB and a timeout.
#   2. sccache is pruned to a budget nightly (`cache-prune`), because its backend
#      writes one entry per compilation object and nothing else caps it.
#   3. Every compile job reports `sccache --show-stats`, so the hit rate is
#      observable rather than assumed.
#
# Without 1 and 2 the repository sat at the ceiling and GitHub evicted its largest
# LRU victim — the rust-cache entry every compile job restores from — producing
# cold runs with no dependency change to explain them. Cold is a 3x penalty on the
# critical-path job. The measurements, and the decisions taken against them
# (including why headstart is not one of them), are in the `ci-and-supply-chain`
# skill's build-cost reference.
name: rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full run (incl. the heavy perf jobs + coverage) at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:
    # On-demand trigger for the nightly-only jobs (coverage, perf).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

# Incremental compilation is pointless in CI and conflicts with sccache; mold is
# the linker for every rustc invocation. RUSTC_WRAPPER/sccache are set per
# compile job (the cargo-deny job must not inherit a wrapper it never installs).
env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Did anything outside `.claude/**` change? The required compile jobs below
  # gate on this so a skills-only PR skips them (a skipped required check still
  # satisfies branch protection). Non-PR events (push to main, nightly) always
  # report `true` — the gate never self-skips on the branch it protects.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `base...head` = what the PR introduces. Count changed paths NOT under
          # `.claude/`; any such file means the backend gate must run. `grep -c`
          # reads all input (unlike `grep -q`, which closes the pipe early and can
          # SIGPIPE `git diff` under `pipefail` → a flaky false skip); `|| true`
          # absorbs grep's exit-1-on-zero-matches under `set -e`.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          noncode="$(printf '%s\n' "$changed" | grep -cvE '^\.claude/' || true)"
          if [ "${noncode:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Deliberately NOT gated on `detect`. The jobs below skip for a PR that only
  # touches `.claude/**` — which is exactly the PR that changes a skill, so a
  # skill gate placed in any of them would never run when it matters. This one
  # needs no toolchain (pure shell, no cargo, no node, no network), so running
  # it unconditionally costs seconds.
  skills:
    name: agent skills (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: agent-skill authoring rules
        # Frontmatter limits, body size, one-level references, resolving links,
        # a table of contents on long references, and an evals.md per skill.
        #
        # working-directory is mandatory: this workflow defaults every `run` to
        # `rust/` (for the cargo jobs), and the script lives at the repo root.
        # Without the override this step dies with exit 127 before it checks
        # anything — which is how the first push of this job failed.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh lint

  lint:
    name: fmt + clippy + docs
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45, not 30: on a cold cache this job has to build the bundled duckdb C++
    # tree before clippy can lint 27 crates and rustdoc can document them, and
    # it measured 30+ min — the timeout cancelled it mid-run even though every
    # gate had passed. Any duckdb bump invalidates the cache and hits this.
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
          # Busts the stale entry, and makes the next profile edit bust it
          # automatically. rust-cache keys on `Cargo.lock`, the rustc version and
          # `.cargo/config.toml` — NOT on `Cargo.toml`, so the
          # `[profile.dev.package."*"] debug = false` added in #251 was invisible
          # to it. The symptom, from main run 39779467231: `Cache hit for:
          # v0-rust-rust-Linux-x64-8556beb2-...` then `Cache up-to-date.` — an
          # exact key hit, so rust-cache skipped the save and the pre-profile
          # entry became immortal. Every run then restored ~1.3 GB of
          # full-debug-info dependency artifacts whose fingerprints cargo
          # immediately rejected, and rebuilt them anyway.
          #
          # `prefix-key` makes the v0 entries unreachable (restore-keys are
          # prefixed too) so they age out instead of being downloaded for
          # nothing. Hashing Cargo.toml into `key` is the durable half: a future
          # profile or lint change lands on a new key and therefore SAVES, while
          # restore-keys still prefix-match the previous entry for a partial
          # restore. Bump `prefix-key` by hand only for a change neither file
          # records.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # THIS job is the single writer of `shared-key: rust`. The other four
          # compile jobs restore from it and set `save-if: false`, because the
          # 10 GB per-repository Actions cache is a shared, capped resource and
          # this workspace does not fit in it twice.
          #
          # What went wrong without this: five jobs all saved the same key, PR
          # branches minted their own ~1.5 GB entries, and sccache's GHA backend
          # — one cache entry per compilation object, nothing capping it — added
          # ~2,700 entries and 4.3 GiB. Measured at 10,653,007,178 bytes across
          # 2,594 entries, i.e. at the ceiling, so GitHub evicted LRU and the
          # victim was the big rust-cache entry. That is why cold runs kept
          # happening with no dependency change to explain them, and cold is a
          # 3x penalty on this job (42m27 vs 14m15).
          #
          # Writing only from `main` is the other half: a PR must not be able to
          # evict the entry every other PR depends on.
          #
          # The trade-off, stated so it is not discovered later: a PR that
          # changes `Cargo.lock` no longer saves its own entry, so every push to
          # it restores main's by `restore-keys` prefix match and rebuilds the
          # changed crates again. It is a partial restore, not a cold build, and
          # sccache covers what the prefix match misses — but a duckdb bump will
          # feel it on each push. `sccache --show-stats` below is how to tell
          # whether that is actually costing anything before trading the budget
          # back for it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: agent-skill generated references are not stale
        # The GENERATED blocks in .claude/skills/**/references/ are derived from
        # entities/, the crate tree, er-sql-check's analyze.rs, the workflows and
        # the frontend config. They can only go stale when CODE changes — and a
        # code change always reaches this job — so the regen half belongs here
        # rather than in the always-on `skills` job, which has no toolchain.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh check
      - name: Build cost (sccache stats, target size)
        # Never a gate: `always()` so a red job still reports, `|| true` so the
        # reporting itself cannot fail one.
        #
        # The sccache hit rate has never been observable in this repo, which is
        # why nobody could say whether it earns the ~4.3 GiB and ~2,700 entries
        # it takes out of a 10 GB per-repository cache. It is the input to the
        # two decisions deferred in the `ci-and-supply-chain` skill's build-cost
        # reference: whether to move sccache to S3, and whether it could be
        # dropped (which is also precondition 1 for revisiting headstart).
        #
        # Read it as a pair: a cold run shows what the misses cost, a warm run
        # shows what the hits save. One number alone says nothing.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  # Split out of `lint` on 2026-10-22. That job ran four independent ~10-minute
  # steps SERIALLY and took 42m27 on a cache miss — clippy 10m32, this 10m39,
  # rustdoc 9m20 and the advisory OpenAPI gate 10m34 — while gating every merge.
  #
  # WHAT IS AND IS NOT WORTH SPLITTING, from run 39775982197 rather than from
  # reasoning — because reasoning got it wrong here:
  #
  #   clippy       9m22    expensive: builds the dependency tree's metadata
  #   this step    8m16    expensive: first `cargo run`, so it pays the codegen
  #   rustdoc      0m39    nearly free once clippy has run
  #   OpenAPI gate 0m42    nearly free once a `cargo run` has codegen'd
  #
  # So the cost is the DEPENDENCY TREE, paid once per kind of build, and the
  # workspace's own 28 crates are cheap. Only the first two deserve their own
  # jobs; rustdoc stays in `lint` and the OpenAPI gate stays here, because a
  # separate job for either would re-pay a tree build to save forty seconds.
  # The earlier guess — that these two `cargo run` steps share little because
  # `er-entity-cli` pulls datafusion 52 / arrow 57 and `er-server` pulls
  # duckdb / arrow 58 / aws — is contradicted by that 0m42.
  #
  # REQUIRED status check. It is the entity-framework gate: regenerate every
  # artifact from entities/*.yaml and fail if any committed file (Rust struct,
  # DuckLake/Postgres DDL, query fns) is stale, then plan every statement and run
  # the E0xx passes.
  entities:
    name: entities
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: on a cold cache this builds the bundled
    # duckdb C++ tree plus a second full arrow before it can verify anything.
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        # rustfmt is not optional here: `er-entity gen` shells out to it to
        # canonicalise generated output, and this gate compares bytes. It came
        # for free in `lint` (clippy's job installs it); here it must be asked
        # for, or every generated file reads as stale.
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # Restore-only. `lint` is the single writer of this key — see the long
          # comment there for why five writers on a 10 GB capped cache is what
          # kept producing cold runs.
          save-if: false
      - name: entity framework verify (stale-output + analyser passes)
        run: cargo run -q -p er-entity-cli -- verify --root ..
      - name: API breaking-change gate (advisory)
        # Rides along here rather than getting its own job, which MEASUREMENT
        # decided and intuition got wrong. In run 39775982197 this step cost
        # 0m42 after `er-entity verify` had already codegen'd the shared
        # dependency tree — against 10m34 in the 42m27 serial run, where nothing
        # before it had produced rlibs. Standalone it would pay that codegen
        # again for a step that is otherwise free, and gain nothing in wall clock
        # because it already runs in parallel with `lint`.
        #
        # PR-only, which the step itself always implied: it diffs against
        # `origin/main`, so on a push to main there is no base and it exits 0
        # having examined nothing. Running it there was ~10 minutes to print
        # nothing.
        #
        # It cannot fail this required job: every stage is `|| true` or
        # `|| exit 0`. It is advisory until the first external org key, after
        # which the release pipeline runs `er-openapi-check --strict`.
        if: github.event_name == 'pull_request'
        # Diff the control-lane OpenAPI document against main's and report breaking
        # component-schema changes (removed schema/field, retype, dropped required).
        run: |
          git -C .. fetch --no-tags --depth=1 origin main || exit 0
          git -C .. show origin/main:frontend/src/lib/api/openapi.json > /tmp/base-openapi.json 2>/dev/null || exit 0
          cargo run -q -p er-server --bin er-openapi-check -- /tmp/base-openapi.json || true
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      # The debug-info settings that used to live here are now
      # `[profile.dev.package."*"]` / `[profile.test]` in `rust/Cargo.toml`, with
      # the measurement. They were job env on this job alone, so `lint`,
      # `ducklake-e2e`, `bench-compile`, `scale-tests` and every laptop paid a
      # 1.9x larger build; the profile gives it to all of them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # `cargo test --workspace` links a separate debug binary per crate, and
        # with bundled duckdb and full debug info that exceeds ubuntu-latest's
        # ~14 GB of free space — the link step then dies with "No space left on
        # device" (which reads as an unrelated `linking with cc failed`). Only
        # this job is affected: `lint` never links, and the e2e/bench/scale jobs
        # build a `-p`-scoped subset. These preinstalled toolchains are unused
        # here and return ~25 GB. Written inline rather than pulling a
        # third-party action, to keep every `uses:` in this workflow SHA-pinned.
        # Headroom, not the fix. Measured: this frees the runner from 86 GB to
        # 111 GB available — and `cargo test --workspace` still exhausted it,
        # which is what sent the search to the debug-info settings now in
        # `rust/Cargo.toml`'s `[profile.dev.package."*"]`. Keep both: the build
        # is large even without C++ symbols.
        # Removing the tool cache is safe for THIS job specifically: it installs
        # Rust with rustup and mold with apt, and the two actions it does use
        # (sccache, rust-cache) are JS, so nothing here reads `setup-*`'s cache.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache
          df -h / | tail -1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # Restore-only. `lint` is the single writer of this key — see the long
          # comment there for why five writers on a 10 GB capped cache is what
          # kept producing cold runs.
          save-if: false
      - run: cargo test --workspace
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why. This job is also where the disk wall
        # shows up, so the `target` size is the number to watch here.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true
          df -h / | tail -1

  security:
    name: cargo-deny (advisories + licenses + bans)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cargo-deny runs in a musl container that pre-installs only the pinned MSRV,
    # not the `channel = "stable"` our rust-toolchain.toml asks for — so rustup
    # refuses `cargo metadata` with "toolchain not installed". cargo-deny never
    # compiles, so pin it to the installed toolchain via RUSTUP_TOOLCHAIN (which
    # overrides the toolchain file) to keep the check evaluating the lockfile.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  # NOT split, unlike `lint` — and that is a measurement, not an oversight. This
  # job is now the critical path (23m10 in run 39775982197: 13m15 for the
  # four-crate test, 8m17 for the rapidfuzz extension test), so splitting it is
  # the obvious next move and it does not survive the numbers.
  #
  # The extension step's 8m17 came AFTER the first step had already built the
  # dependency tree, so unlike `lint`'s rustdoc (0m39) and OpenAPI gate (0m42) it
  # is not riding cheaply on a tree someone else paid for — those 8m17 are its own
  # test-target compile, link and run. Standalone it would pay a tree build on top
  # of that, plausibly ~18m against this job's remaining 13m15, which would make
  # the wall clock WORSE than the 23m10 it was meant to improve.
  #
  # So: measure before splitting this. What would decide it is the tree cost for a
  # `-p dedupe-core --test extensions` build alone, which no run has isolated yet.
  ducklake-e2e:
    name: DuckLake + extensions e2e
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: this measured 29 min on a cold cache,
    # one minute inside the old limit. It passed by luck, not by margin.
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
      # The er-server control-plane queue gate runs against this service.
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # Restore-only. `lint` is the single writer of this key — see the long
          # comment there for why five writers on a 10 GB capped cache is what
          # kept producing cold runs.
          save-if: false
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          # Key on the lockfile (the DuckDB version lives there), and fall back to
          # any prior extensions cache so a dependency change restores the already
          # downloaded extensions instead of re-fetching them cold under the job
          # timeout.
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - run: cargo test -p dedupe-cli -p er-cli -p er-server -p er-entity-diff
      - name: Extension loading (rapidfuzz)
        run: cargo test -p dedupe-core --test extensions
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  # --- heavy perf jobs: main + nightly only (skipped on PRs for latency) ---

  bench-compile:
