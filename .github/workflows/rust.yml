# The application's CI. The engine, CLI, and control plane are Rust (under
# `rust/`); the Python/dbt implementation has been removed, so this is the whole
# backend gate — effectively unfiltered (the frontend keeps its own pnpm gate).
#
# Three exceptions: a PR that touches nothing but `.claude/**` (agent/skill
# prose), `infra/terraform/**`, and/or the `gh aw` agentic-workflow files runs
# none of the compile jobs. Because the required jobs below are REQUIRED status
# checks, a workflow-level path filter would leave them "pending" forever and
# block the PR; instead a `detect` job computes whether any file outside those
# sets changed and the required jobs gate on it with `if:`. A job skipped by
# `if:` reports a "skipped" conclusion, which branch protection accepts as
# satisfied — so the PR stays mergeable with zero compute.
#
# A FOURTH exception, and it is a different kind: a PR that changes NO FILES AT
# ALL. `detect` reports `code=false` for it too, but that case needed a guard of
# its own, because this is the one detect in the repo built as a DENYLIST and an
# empty path list inverts through it — the blank line a shell `printf` emits for
# an empty string matches no exemption, so it counted as real code and ran the
# whole gate. The four allowlist detects (frontend, infra, images, devcontainer)
# never had it: zero paths is zero matches there. See `detect_classify` in
# scripts/ci/detect-paths.sh.
#
# Unlike the other three, an empty PR must not come out GREEN — a skip alone
# would satisfy every required context having proved nothing — so the `empty`
# job below fails on purpose. `claim-ticket` opens exactly this shape (a draft
# PR from an empty commit, claiming a ticket before any code exists), which is
# why the case is worth a guard rather than a shrug.
#
# Why `infra/terraform/**` is safe to skip, which is not obvious: nothing in the
# Rust gate reads it. No crate or manifest references it (the two mentions under
# `rust/` are prose in comments), and `make check` touches `infra/` nowhere.
# `scripts/skills-check.sh` DOES derive generated skill references from it — it
# counts `resource "aws_*"` blocks, IAM users, Pod Identity associations and the
# pinned provider versions — so a terraform-only PR can make a reference stale.
# That is covered, and by design: the `skills` job below runs the same drift
# check and is deliberately NOT gated on `detect`, which is the whole reason it
# exists as a separate job. The terraform gate itself lives in `infra.yml`.
#
# The agentic workflows (`.github/workflows/*.md`, the `*.lock.yml` compiled from
# each, and `shared/`) qualify on the same two grounds: nothing in `make check`
# reads them, and the drift they CAN cause — `skills-check.sh` derives the
# agentic-workflow table in `required-checks.md` from those `.md` files — is
# caught by the ungated `skills` job. Note those are matched per FILE rather than
# as a directory, because this file and its three siblings live there too.
#
# `.claude/**` and `CLAUDE.md` are exempt too, but NOT wholesale — and the reason
# the earlier blanket "docs must run the gate" rule existed is worth keeping in
# view, because it was correct about the risk and only wrong about the scope.
# Exactly four files under those prefixes are coupled to a gate, and they split
# across two different jobs, which is why one `code` output could not express it.
# All four used to live under `docs/`; that directory is gone and each now sits
# in the `references/` of the skill that owns it, which changed their paths and
# nothing else about this mechanism:
#
#   entity-framework/references/erd.md
#       a GENERATED artifact; `er-entity verify` fails on staleness
#                                                             -> `entities`
#   entity-framework/references/entity-framework-design.md
#       the set-difference source for skills-check's `diagnostics` generator
#                                                             -> drift (`lint`)
#   skill-writer/references/agent-skills.md, and CLAUDE.md
#       skill-inventory generator TARGETS; a hand-edit inside a generated
#       block is drift                                        -> drift (`lint`)
#
# So `detect` emits two more outputs, `erd` and `drift`, and those two jobs gate
# on `code OR <their own>`. Everything else still gates on `code` alone. A PR of
# nothing but skills therefore runs `lint` and nothing else, and a PR of pure
# prose under `.claude/` runs no compile job at all.
#
# Why this mattered: the `.claude/**` exemption was close to dead letter. Any
# skill whose DESCRIPTION changes regenerates rows in `.claude/skills/skill-writer/references/agent-skills.md` and
# `CLAUDE.md` — so the commit that exempted skills was immediately defeated by
# the regeneration those same skills require, and the full ~40-minute backend
# gate ran on prose anyway. The exemption only ever worked for a skill-body edit
# that left every description untouched.
#
# `lint` still compiles clippy to verify a markdown table, which is wasteful but
# is the cheapest thing that can BLOCK: the `skills` job runs the same drift
# check and is not a required status check, so it cannot. Promoting it is the
# follow-up that would let `lint` skip here too.
#
# A JOB'S `name:` IS ITS BRANCH-PROTECTION CONTEXT. Renaming one silently
# un-protects it, and adding a required context for a job that does not yet
# exist on `main` blocks every PR until it does. `entities` was split out of
# `lint` and is required; it was added to protection only after it had reported
# green on `main`, which is the only safe order.
#
# The toolchain is installed with `rustup` rather than an action: dtolnay's
# rust-toolchain selects the channel through its ref (`@stable`), which cannot
# also carry the S9 `@<sha> # vTAG` pin the repo requires of every `uses:`.
#
# SPEED: every compile job shares an sccache compilation cache (the Actions
# cache backend — see the env block for why it is not S3) and links with mold, so the jobs stop re-compiling
# the same crate-units cold and the DuckDB static link is far cheaper. The heavy perf jobs (bench compile,
# 50k scale) run only on main + nightly, not on every PR — the PR gate is
# lint + test + the DuckLake integration e2e + cargo-deny.
#
# The two caches are a SHARED, CAPPED resource — 10 GB per repository, LRU-evicted
# past it — and they fail differently, which is why both exist. rust-cache keys on
# `Cargo.lock` and so misses wholesale on any dependency change; sccache is
# content-addressed per compilation unit and still hits for every crate a bump did
# not touch. Three rules follow, each load-bearing:
#
#   1. `lint` is the SINGLE WRITER of `shared-key: rust`, and only from `main`;
#      the other four compile jobs are restore-only (`save-if: false`).
#      `coverage` keeps the writer on its own key — see the note there for why
#      dropping it would buy 1.8 GiB and a timeout.
#   2. The Actions cache is pruned to a budget nightly (`cache-prune`), and its
#      original reason is LIVE again: sccache writes one entry per compilation
#      object with nothing else capping it. What changed is the ceiling it is
#      capped against — the per-repository limit is purchasable now and set to
#      20 GB, so the budget is sized to let sccache reach its natural size
#      rather than to protect 10 GB from it. See the job.
#   3. Every compile job reports `sccache --show-stats`, so the hit rate is
#      observable rather than assumed.
#
# Without 1 and 2 the repository sat at the ceiling and GitHub evicted its largest
# LRU victim — the rust-cache entry every compile job restores from — producing
# cold runs with no dependency change to explain them. Cold is a 3x penalty on the
# critical-path job. The measurements, and the decisions taken against them
# (including why headstart is not one of them), are in the `ci-and-supply-chain`
# skill's build-cost reference.
name: rust

on:
  pull_request:
  # Merge-queue wiring, which NOTHING CONSUMES TODAY — do not read this trigger
  # as evidence that a queued tree is re-tested. GitHub's merge queue is not
  # enabled here and cannot be: it is offered only for organization-owned repos
  # and this one is user-owned (visibility is not the blocker and has moved).
  # `mergeQueue(branch:"main")` is `null`; protection is `strict: false`. The
  # only run that ever examines a COMBINATION of PRs is `merge-bus.yml`.
  #
  # The wiring stays because it is nearly free, and because a workflow missing
  # `merge_group:` would stall every queued PR the day a queue did exist — the
  # same failure as a `paths:` filter on a required workflow. The handling is
  # already written: `detect` applies its usual path filter to the queue's own
  # base...head, but never consults the content-addressed pass markers, so
  # whatever the PR's change reaches would be re-proved against the real merge
  # result before it landed.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Nightly full run (incl. the heavy perf jobs + coverage) at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:
    # On-demand trigger for the nightly-only jobs (coverage, perf).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

# Incremental compilation is pointless in CI and conflicts with sccache; mold is
# the linker for every rustc invocation. RUSTC_WRAPPER/sccache are set per
# compile job (the cargo-deny job must not inherit a wrapper it never installs).
env:
  CARGO_INCREMENTAL: "0"
  # mold is the linker for every rustc invocation — and the seven jobs that
  # install it REMOVE this flag rather than failing when they cannot.
  #
  # It is an unpinned network dependency on `azure.archive.ubuntu.com` sitting
  # on the critical path of six required jobs. Exiting non-zero there turned an
  # unreachable mirror into a red required check with nothing in the diff to
  # explain it — twice on 2026-11-05 alone (`73421208`, `41691e2a`), after the
  # retry loop had already been hardened once for the same reason.
  #
  # The flag is computed away rather than cleared, so a future flag added
  # beside it survives the fallback.
  #
  # The cost is worth knowing: sccache keys on the compilation inputs INCLUDING
  # RUSTFLAGS, so a fallback run gets a COLD cache as well as a slower linker,
  # and may still exhaust its timeout. A job that might finish beats one that
  # cannot start, and the warning says which happened.
  #
  # The stronger fix is to stop using apt: mold ships a static tarball on its
  # GitHub releases — the same host the checkout already depends on — so a
  # pinned URL plus a checksum would remove the mirror from the path entirely.
  # Not done here, to keep a change on a required path small enough to trust.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # The Actions cache backend, not S3 — and the reason is the bill, not speed.
  # S3 egress was the single largest line item in the AWS account: measured by
  # CUR 2.0 per-resource attribution, `er-ci-sccache` / `DataTransfer-Out-Bytes`
  # was $209.32 of a $211.62 November S3 total, 2,425.7 GB. Storage was $0.02.
  # GitHub-hosted runners are outside AWS, so every cache read is billed
  # internet egress at ~$0.09/GB, and no VPC endpoint can reach it.
  #
  # The multiplier is compile jobs, not runs: ~8.7 sccache jobs per `rust` run,
  # each pulling ~0.43 GB at a 99.8% hit rate, nearly all of it the same
  # dependency objects a sibling job in the same run already fetched.
  #
  # What makes this a revert rather than a regression: the 10 GB per-repository
  # ceiling that drove #350 to S3 became PURCHASABLE on 2025-11-20, at
  # $0.07/GB-month above the included 10 GB. Eviction was the entire problem
  # with this backend — `cache-prune`'s own comment records run 39783867347 at
  # 96.65%/97.54% hit rate with the whole workflow in 8m03 ON THIS BACKEND — and
  # the ceiling is the part money now fixes. The repository's eviction limit is
  # raised to match; see #887.
  #
  # Note GitHub's own caveat on that setting: it "should not be used for
  # controlling costs". It governs when LRU eviction fires, and eviction lags,
  # so peak hourly usage — which is what is billed — can exceed it transiently.
  # The spend guard is a billing spending limit, not this number.
  #
  # CACHE POISONING: this backend is strictly SAFER than the two S3 roles it
  # replaces, which is why their reasoning does not reappear below. The S3 split
  # existed because a PR able to write the cache is a path for a branch to plant
  # object code a later `main` build consumes, and poisoning outlives the
  # credential that planted it. GitHub enforces the same separation natively and
  # unforgeably: a run "cannot restore caches created for child branches or
  # sibling branches", so a PR-branch entry is unreadable from `main` while PRs
  # still read what `main` populated — which was always nearly all the value.
  # No IAM condition, no OIDC exchange, and nothing to misconfigure.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Did anything outside `.claude/**`, `infra/terraform/**` and the agentic
  # workflow files change? The required compile jobs below gate on this, so a
  # skills-only, terraform-only or prompt-only PR skips them (a skipped required
  # check still satisfies branch protection). Non-PR events (push to main,
  # nightly) always report `true` — the gate never self-skips on the branch it
  # protects.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      # `.claude/skills/entity-framework/references/erd.md` changed: `entities` must run `er-entity verify`.
      erd: ${{ steps.filter.outputs.erd }}
      # A generated-skill-reference input or target changed: `lint` must run the
      # drift check, which is the only copy of it that can block a merge.
      drift: ${{ steps.filter.outputs.drift }}
      # The PR introduces NO files at all. Read by `empty` below, and reported
      # separately from `code` because the two answers go to opposite places:
      # the compile tier skips, and `empty` fails.
      empty: ${{ steps.filter.outputs.empty }}
      pass_key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          # One of the two pairs is set: a PR's, or the merge queue's.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        # The last detect step to become a script; frontend.yml, infra.yml and
        # images.yml already had one. Its classification lives in
        # scripts/ci/detect-paths.sh (which argues the denylist and is
        # unit-tested by scripts/ci/detect-paths-test.sh), and the `key` step
        # below sources that same file — which is what stops the filter and
        # the key drifting apart.
        run: bash scripts/ci/rust-detect.sh
      # CONTENT-ADDRESSED SKIP: a PR whose tested tree is byte-identical, over
      # every path this gate reads, to a tree that already went green on THIS
      # PR skips the gate. frontend.yml has the same mechanism, so the key and
      # the whole argument for why it is safe to trust — marker provenance,
      # the ISO-week bound, and what a skip can and cannot let through with no
      # merge queue enabled — live in scripts/ci/pass-key.sh.
      #
      # Bypass with the `ci:full` label (or a workflow re-run after removing a
      # marker) when you want the full gate regardless.
      - id: key
        if: github.event_name == 'pull_request' && steps.filter.outputs.code == 'true' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        working-directory: ${{ github.workspace }}
        env:
          GATE: rust
        run: bash scripts/ci/pass-key.sh
      - id: lookup
        if: steps.key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - id: decide
        working-directory: ${{ github.workspace }}
        env:
          # `code`, not `rust`: this is the name the rest of the workflow reads
          # as `needs.detect.outputs.code`.
          GATE: rust
          OUT: code
          RAN: ${{ steps.filter.outputs.code }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: bash scripts/ci/pass-decide.sh

  # THE RED X ON A PULL REQUEST THAT CHANGES NOTHING, and the cheapest thing
  # that can produce one. `detect` now classifies an empty `base...head` as
  # `code=false`, so every compile job above skips — which is correct (there is
  # nothing to compile) but would otherwise leave the PR reading GREEN, with
  # every required context satisfied and not one line of code proved. This job
  # is the other half: the skip makes it cheap, this makes it honest.
  #
  # Why that shape exists on purpose: `claim-ticket` opens a draft PR from an
  # EMPTY COMMIT so the claim on a ticket is visible on GitHub before any code
  # does. Before the `detect` guard those PRs each ran the full compile matrix
  # — ~10m wall and ~0.6 GB of sccache S3 egress — to prove a tree identical to
  # `main`.
  #
  # DELIBERATELY NOT A REQUIRED STATUS CHECK, and it should stay that way. A
  # draft is already unmergeable, so there is nothing for it to block; and
  # adding a required context is a branch-protection change that is only safe
  # AFTER the job has reported on `main` (see the header's note on `entities`).
  # Non-required is also what lets the red clear itself: the first real commit
  # flips `empty` to false, this job skips, and the gate takes over.
  #
  # `working-directory` is overridden because the workflow default is `rust`,
  # which does not exist in a job that never checks out.
  empty:
    name: empty pull request
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.empty == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail — this pull request introduces no files
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::this pull request changes no files; push a commit or close it"
          exit 1

  # Deliberately NOT gated on `detect`. The jobs below skip for a PR that only
  # touches `.claude/**` — which is exactly the PR that changes a skill, so a
  # skill gate placed in any of them would never run when it matters. This one
  # needs no toolchain (pure shell, no cargo, no node, no network), so running
  # it unconditionally costs seconds.
  #
  # The same reasoning keeps the Codex config bridge gate (`.agents/skills`
  # and `AGENTS.md`) in this job: `detect` exempts `.claude/**` and
  # `.agents/**`, so a skills-only PR reaches only this job — which is exactly
  # the PR that can orphan a symlink.
  skills:
    name: agent skills (lint + drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: agent-skill authoring rules and generated-reference drift
        # `all` = regen + drift + lint. Authoring rules are frontmatter limits,
        # body size, one-level references, resolving links, a table of contents
        # on long references, and an evals.md per skill.
        #
        # The DRIFT half also runs here, not only in the cargo `lint` job, and
        # that is the point of this job rather than an accident:
        #
        #   `lint` is gated on `detect`, which skips every compile job for a PR
        #   touching nothing but .claude/** — so the drift check does not run on
        #   exactly the PRs that change skills. That was sound while every
        #   generator derived from code outside .claude/, because a code change
        #   always ran the full gate. It stopped being sound when
        #   `gen_skill_inventory` landed: it derives from SKILL.md descriptions,
        #   so a one-line description edit makes the inventory tables in
        #   .claude/skills/skill-writer/references/agent-skills.md and CLAUDE.md stale — a .claude-only PR that
        #   goes green and turns main red on the push-to-main run.
        #
        # Running it needs no toolchain: every generator is grep/awk/sed over
        # checked-in files, which is why this job can stay at 5 minutes with a
        # bare checkout and no cargo, node or Docker.
        #
        # This job IS a required status check, which it can be because it
        # carries no `if:` and no `needs:` — a required context that reports
        # `skipped`, or does not report at all, blocks every PR forever.
        #
        # The drift check is deliberately ALSO left in the cargo `lint` job, now
        # as a backstop: add an `if:` or a `needs:` here, or rename this job out
        # of the required set, and that copy is the only thing still checking a
        # code PR. Do not delete it as redundant without first removing this
        # job's required status.
        #
        # working-directory is mandatory: this workflow defaults every `run` to
        # `rust/` (for the cargo jobs), and the script lives at the repo root.
        # Without the override this step dies with exit 127 before it checks
        # anything — which is how the first push of this job failed.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh all

      - name: Skills-check regression tests
        # The gate's own race conditions, asserted deterministically. The reason
        # this step exists is that `names_skill_in_backticks` piped `awk` into
        # `grep -q` under `pipefail`, so a found match could report as missing
        # whenever the reader won the race — it failed exactly once, on #606,
        # against a tree where the name was present, and passed on rerun.
        #
        # A race cannot be trusted to the gate's own green, so it gets a suite
        # that forces the losing side every time, plus a mutation check that
        # fails if the suite stops discriminating.
        #
        # Same bare-checkout budget as the step above: pure bash, no toolchain.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/skills-check-test.sh

      - name: agent config bridge symlinks (Codex discovery)
        # Claude Code discovers project skills at .claude/skills and its
        # instructions at CLAUDE.md; Codex discovers them at .agents/skills
        # and AGENTS.md, and reads neither Claude Code name. Both are authored
        # once in the Claude Code locations and bridged across by symlinks — a
        # PR that adds a skill without its bridge, or forks a bridge into a
        # real copy, fails here. Runs in THIS job rather than behind `detect`
        # because a skills-only PR is exactly the shape `detect` skips; see
        # the job header. Same bare-checkout budget as the steps above.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/agent-bridge-check.sh

      - name: agent-bridge regression tests
        # Same contract as the skills-check suite two steps up: a detector
        # breaks by noticing nothing, and this gate's rename-detection exits
        # are precisely what must never start passing silently.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/agent-bridge-check-test.sh

      - name: codex-mcp-sync derivation tests
        # The one piece of agent config no symlink can bridge: Codex reads MCP
        # servers from $CODEX_HOME/config.toml and ignores a project
        # .codex/config.toml's `mcp_servers`. scripts/codex-mcp-sync.sh derives
        # `codex mcp add` from .mcp.json instead, and what this asserts is that
        # it still refuses every shape it does not understand — a sync that
        # passed over a server quietly would read as "synced" with the tool
        # missing. Everything runs through --dry-run, so no Codex install and
        # no $CODEX_HOME write; jq is preinstalled on the runner.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/codex-mcp-sync-test.sh

      - name: codex PreToolUse guard tests
        # The other half of `.claude/settings.json` that has no Codex
        # equivalent: the `permissions.deny` list and the aws-write-guard hook.
        # Both are installed into $CODEX_HOME by scripts/codex-hooks-sync.sh and
        # the deny list is DERIVED from settings.json, so what this asserts is
        # that the derivation is non-empty and every deny path still fires —
        # a guard that stopped matching is silent at runtime, because Codex logs
        # `Completed` and runs the command. It also pins the asymmetry: `ask`
        # must stay `ask` for Claude Code and become `deny` for Codex, where
        # `ask` is not a weaker deny but an allow.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/codex-hooks-sync-test.sh

      - name: kimi-mcp-sync derivation tests
        # Kimi Code CLI is a THIRD agent on this repo and a separate binary from
        # Codex, not `codex --profile kimi`. It reads the same `.agents/skills/`
        # bridge but none of the Claude Code config, and its MCP schema has no
        # `type` key — it infers stdio from `command`, HTTP from `url`, and needs
        # `transport = "sse"` spelled out. So the derivation TRANSLATES rather
        # than copies, and what this pins is each transport plus the rule that a
        # shape it does not understand fails instead of being skipped. Fixture
        # files and a fixture home throughout; no Kimi install needed.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/kimi-mcp-sync-test.sh

      - name: kimi PreToolUse guard tests
        # The same two `.claude/settings.json` protections, into
        # $KIMI_CODE_HOME/config.toml. Measured against Kimi Code CLI 2.5.2: a
        # `deny` verdict and exit 2 block the call, while an `ask` verdict and
        # any non-2 error exit RUN it — the same asymmetry Codex has, so the
        # guard only ever emits `deny`. The assertion that earns its place is
        # that the installed `[[hooks]]` table carries only Kimi's four allowed
        # fields: a fifth fails the entire config load, taking the provider and
        # model tables with it.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/kimi-hooks-sync-test.sh

  # S9 — every `uses:` pinned to a commit SHA with its `# vTAG` comment.
  #
  # This job exists because the policy was enforced by NOTHING. `scripts/ci/
  # actionlint.sh` shelled out to `uv run python scripts/actionlint.py`; the
  # Python/dbt removal took that script, the root pyproject.toml and uv.lock
  # with it, so the checker could not run at all — and no job invoked it, so the
  # breakage was invisible while the skill went on calling S9 "enforced, not
  # just documented". Found 2026-11-03. The script is pure bash now, for the
  # same reason: a gate with no dependencies cannot be deleted by a dependency
  # cleanup.
  #
  # DELIBERATELY NOT GATED ON `detect`, for the same reason the `skills` job is
  # not. `detect` exempts `.claude/**`, `infra.yml`, `drift.yml` and every
  # `*.lock.yml` — so a PR touching only those skips the compile jobs, and a
  # gated pin check would skip on exactly the PRs most likely to introduce an
  # unpinned action: a hand-edited `infra.yml`, or a regenerated gh-aw lock file
  # whose pins come from a compiler nobody is watching.
  #
  # NOT a required status check yet. The repo's rule is that a gate is trusted
  # only after it has been observed failing, and that cannot be done here while
  # the account cannot allocate runners. Promote it once it has reported green
  # on `main` and been seen to go red — in that order, because a required
  # context for a job that does not yet exist on `main` blocks every PR.
  workflow-pins:
    name: workflow pins (S9)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install actionlint (pinned, checksum-verified)
        # This replaced `taiki-e/install-action` with `tool: actionlint` and
        # `continue-on-error: true`, which could NEVER succeed: that action
        # resolves an unknown tool as a Rust crate and actionlint is a Go binary
        # absent from its TOOLS.md. Every run logged `× For crate actionlint:
        # actionlint is not found`, the swallowed failure left the binary absent,
        # and the linting half skipped while the job stayed green on the pin
        # check alone. No `continue-on-error` here: a failed install is now a
        # failed job, which is the only way absence can stop reading as success.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-actionlint.sh
      - name: every `uses:` is SHA-pinned with its tag comment
        # Mandatory: this workflow defaults every `run` to `rust/`, and the
        # script lives at the repo root. Without it the step dies with exit 127
        # before checking anything, which is how the `skills` job first failed.
        #
        # ACTIONLINT_REQUIRED=1 is the other half of the fix above: it makes a
        # missing binary a failure rather than a logged skip, so the two steps
        # cannot quietly go back to proving only the pin half.
        working-directory: ${{ github.workspace }}
        env:
          ACTIONLINT_REQUIRED: "1"
        run: bash scripts/ci/actionlint.sh
      - name: the actionlint-required branch still fails when it should
        # A detector breaks by noticing nothing, and the branch above is exactly
        # the one that spent months reporting success while running nothing. Its
        # self-test is here, ungated, beside the siblings that test the same
        # class of defect.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/actionlint-required-test.sh
      - name: the `detect` path classifier still classifies
        # Lives in this job because it must be UNGATED. `detect` decides whether
        # the compile jobs run, so a test for it placed in a job that `detect`
        # gates would skip on exactly the PR that broke it — the same reasoning
        # that keeps the pin check and the `skills` job off `detect`.
        #
        # The direction that matters is a false SKIP: a classifier that exempts
        # too much lets a real code change merge without the backend gate, and
        # nothing goes red to say so. The suite asserts both directions and fails
        # if it asserted nothing.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/detect-paths-test.sh
      - name: the content-addressed pass gate still gates
        # The step after the classifier in the same chain, and ungated for the
        # same reason: `detect` consults a pass marker to decide whether the
        # compile jobs run, so a test for that decision cannot sit behind it.
        #
        # Same load-bearing direction, one step worse. A broken classifier
        # skips the gate for a PR whose paths look exempt; a broken pass gate
        # skips it on the strength of a green earned by DIFFERENT CONTENT. The
        # suite drives scripts/ci/pass-key.sh itself against throwaway commits
        # rather than re-deriving its filter, and fails if it asserted nothing.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/pass-gate-test.sh
      - name: tracked shell scripts live under scripts/
        # Ungated for the same reason as the steps above: this guards repo
        # layout, not compiled code, so it must run on every PR — a stray
        # script is most likely to arrive on exactly the PR a path filter
        # would skip.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/scripts-home-check.sh
      - name: no static AWS credentials in the Terraform tree
        # Ungated like its neighbours, and for a sharper version of the same
        # reason: a new `aws_iam_access_key` arrives on an infra-only PR, which
        # is precisely what a Rust path filter skips. It is also cheap enough
        # to be unconditional — two greps, no toolchain, no credentials.
        #
        # This is #549's acceptance check (one access key, named `builder`)
        # kept executable, plus a bar on re-plumbing the retired ER_S3_* pair.
        # Self-test first: the gate's failure mode is noticing nothing.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/tf-static-credentials-check-test.sh && bash scripts/ci/tf-static-credentials-check.sh
      - name: the agent-task scripts still validate their inputs
        # Ungated like its neighbours, and a TEST rather than a run on
        # purpose: `agent-task.yml` is `workflow_dispatch` only and needs two
        # secrets this repo does not have, so dispatching it dies at the agent
        # step having proved nothing about the scripts before it — and leaves
        # an `agent-wip/<run-id>` branch behind for the trouble.
        #
        # The load-bearing half is input validation: `resume` is a dispatch
        # input that reaches `refs/heads/agent-wip/$RESUME` and the agent's
        # prompt, so the suite's rejection cases are the point and its happy
        # paths only stop a reject-everything regex from passing.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/agent-task-test.sh
      - name: no inline shell logic in workflow `run:` blocks
        # The other half of that convention, and the half the step above
        # cannot see: a `run:` block is shell with NO FILE, so a file-level
        # rule is blind to it. That blindness is where seven copies of the
        # build-cost report and a 56-line untestable `detect` step came from.
        #
        # Its own self-test runs first, because a detector breaks by noticing
        # nothing — and a layout gate that silently stopped matching reports a
        # clean tree forever. Same failure the S9 pin check had until #467.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/workflow-shell-check-test.sh && bash scripts/ci/workflow-shell-check.sh

  lint:
    name: fmt + clippy + docs
    needs: detect
    # `drift` too: this job carries a generated-reference drift check as a
    # backstop for code PRs. The ungated `skills` job is the primary copy and
    # is itself a required status check (probed on `main`) — this duplicate
    # exists so a `detect` regression could not let a code PR through with
    # drift unexamined; see the `skills` job header.
    if: needs.detect.outputs.code == 'true' || needs.detect.outputs.drift == 'true'
    runs-on: ubuntu-latest
    # 45, not 30: on a cold cache this job has to build the bundled duckdb C++
    # tree before clippy can lint 27 crates and rustdoc can document them, and
    # it measured 30+ min — the timeout cancelled it mid-run even though every
    # gate had passed. Any duckdb bump invalidates the cache and hits this.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh --components
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: agent-skill generated references are not stale
        # The GENERATED blocks in .claude/skills/**/references/ are derived from
        # entities/, the crate tree, er-sql-check's analyze.rs, the workflows and
        # the frontend config. They can only go stale when CODE changes — and a
        # code change always reaches this job — so the regen half belongs here
        # rather than in the always-on `skills` job, which has no toolchain.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh check
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  # Split out of `lint` on 2026-10-22. That job ran four independent ~10-minute
  # steps SERIALLY and took 42m27 on a cache miss — clippy 10m32, this 10m39,
  # rustdoc 9m20 and the advisory OpenAPI gate 10m34 — while gating every merge.
  #
  # WHAT IS AND IS NOT WORTH SPLITTING, from run 39775982197 rather than from
  # reasoning — because reasoning got it wrong here:
  #
  #   clippy       9m22    expensive: builds the dependency tree's metadata
  #   this step    8m16    expensive: first `cargo run`, so it pays the codegen
  #   rustdoc      0m39    nearly free once clippy has run
  #   OpenAPI gate 0m42    nearly free once a `cargo run` has codegen'd
  #
  # So the cost is the DEPENDENCY TREE, paid once per kind of build, and the
  # workspace's own 28 crates are cheap. Only the first two deserve their own
  # jobs; rustdoc stays in `lint` and the OpenAPI gate stays here, because a
  # separate job for either would re-pay a tree build to save forty seconds.
  # The earlier guess — that these two `cargo run` steps share little because
  # `er-entity-cli` pulls datafusion 52 / arrow 57 and `er-server` pulls
  # duckdb / arrow 58 / aws — is contradicted by that 0m42.
  #
  # REQUIRED status check. It is the entity-framework gate: regenerate every
  # artifact from entities/*/entity.yaml and fail if any committed file (Rust struct,
  # DuckLake/Postgres DDL, query fns) is stale, then plan every statement and run
  # the E0xx passes.
  entities:
    name: entities
    needs: detect
    # `erd` too: `.claude/skills/entity-framework/references/erd.md` is a generated artifact this job byte-compares.
    if: needs.detect.outputs.code == 'true' || needs.detect.outputs.erd == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: on a cold cache this builds the bundled
    # duckdb C++ tree plus a second full arrow before it can verify anything.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        # rustfmt is not optional here: `er-entity gen` shells out to it to
        # canonicalise generated output, and this gate compares bytes. It came
        # for free in `lint` (clippy's job installs it); here it must be asked
        # for, or every generated file reads as stale.
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: entity framework verify (stale-output + analyser passes)
        run: cargo run -q -p er-entity-cli -- verify --root ..
      - name: API breaking-change gate (advisory)
        # Rides along here rather than getting its own job, which MEASUREMENT
        # decided and intuition got wrong. In run 39775982197 this step cost
        # 0m42 after `er-entity verify` had already codegen'd the shared
        # dependency tree — against 10m34 in the 42m27 serial run, where nothing
        # before it had produced rlibs. Standalone it would pay that codegen
        # again for a step that is otherwise free, and gain nothing in wall clock
        # because it already runs in parallel with `lint`.
        #
        # PR-only, which the step itself always implied: it diffs against
        # `origin/main`, so on a push to main there is no base and it exits 0
        # having examined nothing. Running it there was ~10 minutes to print
        # nothing.
        #
        # It cannot fail this required job: every stage is `|| true` or
        # `|| exit 0`. It is advisory until the first external org key, after
        # which the release pipeline runs `er-openapi-check --strict`.
        if: github.event_name == 'pull_request'
        # Diffs the control-plane OpenAPI document against main's and reports
        # breaking component-schema changes (removed schema/field, retype,
        # dropped required). The `|| exit 0` / `|| true` chain that makes it
        # unable to fail this job is in the script.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/api-breaking-gate.sh
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  # SPLIT in two legs, same measurement-driven shape as the e2e tier below. Run
  # 41461727505 decomposed this job's 10m36 step as 3m11 of build and ~7m of
  # test binaries running one after the other — er-match's `tests/main` alone
  # 264s, er-std's 85s, dedupe-core's 66s. One leg takes er-match, the other
  # takes the rest; the two land near-equal (~4.5m vs ~3m of tests) and the
  # split is complementary BY CONSTRUCTION: `--workspace --exclude er-match`
  # means a new crate's tests default into the `rest` leg, never into no leg.
  # The required context rides `test-gate` below, which carries the old job's
  # exact name.
  test-shard:
    name: test shard (${{ matrix.slice }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45, matching `lint` and the two e2e tiers, and for their reason: a cold
    # sccache forces a full bundled-DuckDB C++ rebuild, which this job has to
    # survive rather than be killed in the middle of.
    #
    # Measured 2026-11-05 on merge-bus batch `merge-bus/42099563401`:
    # `test shard (er-match)` ran 20:03:33 → 20:33:52 and was cancelled by this
    # timeout at exactly 30m, which made `test` fail closed on the non-success
    # leg. The batch's content was two shell-script lines; nothing about it was
    # slow except the compile.
    #
    # Why a batch is always exposed to this: a merge-bus batch branch is a
    # NOVEL TREE, so its own compilation units have never been cached by any
    # run — no backend can hand them over. It still restores the dependency
    # objects `main` populated, which is the part a cache can help with.
    # `build-cost.md` records the same effect for a lock-touching PR ("runs cold
    # until it merges, by design"); a batch reaches it by being new rather than
    # by changing a lockfile, and reaches it on EVERY run. Leaving this at 30
    # meant the bus could never land a batch that ran the Rust tier at all.
    #
    # This survived the move off S3 unchanged. The previous wording blamed the
    # read-only PR role, which was never the operative reason: a tree nothing
    # has compiled is cold whoever holds the credential.
    #
    # This only ever grants more time, never less: a genuinely hung job now
    # takes 45 minutes to be killed instead of 30.
    timeout-minutes: 45
    strategy:
      # A flaky leg can be re-run alone; its sibling's green stands.
      fail-fast: false
      matrix:
        include:
          - slice: er-match
            args: -p er-match
          - slice: rest
            args: --workspace --exclude er-match
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      # The debug-info settings that used to live here are now
      # `[profile.dev.package."*"]` / `[profile.test]` in `rust/Cargo.toml`, with
      # the measurement. They were job env on this job alone, so `lint`,
      # `ducklake-e2e`, `bench-compile`, `scale-tests` and every laptop paid a
      # 1.9x larger build; the profile gives it to all of them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # THIS is the tier that needs it: `cargo test --workspace` links a
        # separate debug binary per crate, which exceeds the runner's free
        # space. `lint` never links and bench/scale build a `-p`-scoped
        # subset, so they carry no such step. The errno-28 misdirection, the
        # 86→111 GB measurement, and why dropping the tool cache is safe are
        # all in scripts/ci/reclaim-disk.sh.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/reclaim-disk.sh
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Run the test suite
        # `cargo test`, not nextest, and that is a measured choice. nextest runs
        # each test in its own PROCESS; with 586 tests across ~147 binaries that
        # each statically link bundled DuckDB, the spawn-and-load cost dominates
        # whatever the extra overlap buys. A/B on this job, same cache state:
        # cargo 357s vs nextest 453s. nextest wins where tests are few and slow
        # (the Postgres tier), and loses where they are many and fast — which is
        # this job. The way to parallelise here is FEWER, larger test binaries,
        # so cargo's own in-binary threads do the overlapping — and, since the
        # split, a second RUNNER for the one binary that dwarfs the rest.
        # Doctests stay complete across the legs: `-p er-match` runs er-match's,
        # `--exclude er-match` runs everyone else's.
        run: cargo test ${{ matrix.args }}
      - name: Cache DuckDB extensions
        if: matrix.slice == 'rest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - name: Extension loading (splink_udfs) and the engine version label
        # Moved here from the e2e tier: `cargo test --workspace` above already
        # BUILT and ran dedupe-core's one test binary, so re-invoking it with
        # the filter is run-only (~seconds) — where in the e2e rest leg the
        # same step paid its own 2m15s tree build. The env is STEP-scoped on
        # purpose: er-compile and er-sql-check also gate tests behind
        # DEDUPE_E2E_EXTENSIONS, and a job-level env would silently start
        # running those on every PR.
        if: matrix.slice == 'rest'
        env:
          DEDUPE_E2E_EXTENSIONS: "1"
        run: cargo test -p dedupe-core --test main extensions
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  # The required status check for the test tier — the same shape, for the same
  # reason, as `ducklake-gate` below and infra.yml's `plan-gate`: a matrix
  # job's per-leg names cannot be required status checks. Carries the old
  # job's exact `name:` so the context "test" kept reporting and branch
  # protection never changed.
  test-gate:
    name: test
    needs: [detect, test-shard]
    # `!cancelled()`: the gate must RUN (and fail) when a leg fails — a gate
    # skipped because its `needs` failed would read to branch protection as
    # satisfied.
    if: ${{ !cancelled() && needs.detect.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout only to have scripts/ci/ on disk — the gate reads no code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every test leg must have succeeded
        working-directory: ${{ github.workspace }}
        env:
          # The matrix aggregate: `success` only if every leg succeeded,
          # `failure` if any failed, `skipped` if the whole job was.
          GATE_LEGS: |
            test-shard=${{ needs.test-shard.result }}
        run: bash scripts/ci/gate-all-legs.sh

  security:
    name: cargo-deny (advisories + licenses + bans)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cargo-deny runs in a musl container that pre-installs only the pinned MSRV,
    # not the `channel = "stable"` our rust-toolchain.toml asks for — so rustup
    # refuses `cargo metadata` with "toolchain not installed". cargo-deny never
    # compiles, so pin it to the installed toolchain via RUSTUP_TOOLCHAIN (which
    # overrides the toolchain file) to keep the check evaluating the lockfile.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  # SPLIT in three, and that is a measurement too — the opposite of the one a
  # previous version of this comment recorded against splitting. Run 41461727505
  # (2026-11-02) put this tier at 30m, decomposing as 2m16s of build (sccache on
  # S3 at a 100% hit rate) and then ~22m of test binaries running one after the
  # other: er-cli's lake suite alone 888s, then er-server's 419s. The tree-build
  # cost that once made a split look worse than the job it would improve (the
  # ~18m estimate, from the GHA-cache era) is ~2m now, so a second runner pays
  # ~5m of setup+build to take ~15m off the wall. Three jobs rather than one
  # matrix because the legs genuinely differ: the lake shards need no Postgres
  # service and partition one crate's suite with nextest; the server leg keeps
  # the service, plain `cargo test`, and the extensions step.
  #
  #   lake-e2e       er-cli only, 4 nextest hash partitions, no pg service
  #   ducklake-e2e   three slices: pg a-l, pg m-z (er-server's pg_* suite,
  #                  split at the measured time-midpoint) and rest
  #                  (dedupe-cli + er-entity-diff + er-server non-pg)
  #   ducklake-gate  the required context (see it for why the legs cannot be)
  #
  # The extensions step moved to the `test` tier's rest leg (its binary is
  # already built there); the gate KEEPS the name "DuckLake + extensions e2e"
  # because a job's name is its branch-protection context and renaming one is
  # a protection edit — the name is frozen, the coverage note lives here.
  #
  # nextest here, though the `test` job measured it out (357s -> 453s): that tax
  # is process-per-test on thousands of tiny tests. This suite is 44 tests
  # averaging ~21s (A/B on the old combined job: 15.5m cargo vs 15.2m nextest),
  # and hash partitioning is the thing libtest cannot do — every test lands in
  # exactly one shard by name hash, so a new test is auto-assigned to a shard,
  # never silently dropped, and existing tests do not migrate when one is added.
  #
  # nextest must NOT reach er-server's pg suite: those tests coordinate around
  # the shared service database in-process (er-server/tests/common/mod.rs), and
  # process-per-test would void that. The server leg stays on plain `cargo test`
  # deliberately.
  lake-e2e:
    name: DuckLake e2e shard (${{ matrix.partition }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A flaky leg can be re-run alone; its siblings' green stands.
      fail-fast: false
      matrix:
        # Four, up from three, both times for the same reason: hash
        # partitioning balances counts, not durations. 2-way landed 518s/274s
        # of execution (run 41478579329); 3-way landed legs at 9.8/13.0/12.0m
        # wall (run 41484769012) — the slow tests cluster. nextest has no
        # duration-aware partition, so the lever is more, smaller shards.
        partition: ["1/4", "2/4", "3/4", "4/4"]
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      # A RUNTIME gate: each lake test early-returns without this (er-cli
      # tests/lake_e2e.rs). A shard that lost this env would go green in
      # seconds — if a shard finishes suspiciously fast, check here first.
      DEDUPE_E2E_DUCKLAKE: "1"
      # No ER_TEST_PG_DSN and no postgres service: er-cli's tests reference
      # neither — the lake catalog is a DuckDB file under a per-test temp dir,
      # which is also what makes nextest's process-per-test safe here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # Same step and same reasoning as `test` — see
        # scripts/ci/reclaim-disk.sh. This leg builds only er-cli's targets, so
        # it may not need the headroom; the Build cost step below prints
        # `du`/`df` so that removal can be decided by measurement, not
        # assumption.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/reclaim-disk.sh
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - name: DuckLake e2e (er-cli, hash partition)
        # No `--test main` restriction: er-cli's lib unit tests partition too,
        # so nothing the old combined job ran is dropped. Doctests are a
        # cargo-test-only concept, and the `test` job runs them workspace-wide.
        run: cargo nextest run -p er-cli --no-fail-fast --partition hash:${{ matrix.partition }}
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  ducklake-e2e:
    name: DuckLake e2e server (${{ matrix.slice }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: this measured 29 min on a cold cache,
    # one minute inside the old limit. It passed by luck, not by margin.
    timeout-minutes: 45
    strategy:
      # A flaky leg can be re-run alone; its sibling's green stands.
      fail-fast: false
      matrix:
        # Three slices. The pg suite measured 423.8s on one leg (run
        # 41484769012) — the tier's floor — so it splits at the alphabetic
        # midpoint its module START TIMES put near pg_l/pg_m (~216s vs ~208s).
        # The split stays complementary BY CONSTRUCTION: `pg a-l` names the
        # twelve `pg_<letter>` prefix tokens explicitly, and `pg m-z` runs the
        # full `pg_` filter with `--skip` of EXACTLY those twelve tokens — so
        # a new pg_* module lands in one slice or the other by its name, never
        # in neither, and a test matching both boundaries runs exactly once.
        # er-entity-diff's Postgres tests (whose FN names carry no `pg_` —
        # they are `postgres_diff_*`/`the_control_database_*` in the separate
        # pg_diff / pg_reconcile binaries) run UNFILTERED in the rest slice,
        # so no name filter can silently drop them. All slices keep the
        # postgres service: non-pg_ er-server tests (db_per_test and friends)
        # still reach the DSN.
        #
        # The extensions step that used to ride the rest slice now rides the
        # `test` tier's rest leg, where dedupe-core's binary is already built —
        # it was paying a 2m15s tree build here to run 0.5s of tests.
        include:
          - slice: pg a-l
            suite: pg-al
          - slice: pg m-z
            suite: pg-mz
          - slice: rest
            suite: rest
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      DEDUPE_E2E_DUCKLAKE: "1"
      # No DEDUPE_E2E_EXTENSIONS here any more: the extensions step rides the
      # `test` tier's rest leg now, with the env scoped to that one step.
      # The er-server control-plane queue gate runs against this service.
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # Same step and same reasoning as `test` — see
        # scripts/ci/reclaim-disk.sh. This job joined that club when the
        # executor added the kube tree and er-server's e2e test targets: its
        # cold libduckdb build died in `ar` on a full disk.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/reclaim-disk.sh
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          # Key on the lockfile (the DuckDB version lives there), and fall back to
          # any prior extensions cache so a dependency change restores the already
          # downloaded extensions instead of re-fetching them cold under the job
          # timeout.
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - name: er-server pg suite, modules a-l
        if: matrix.suite == 'pg-al'
        # The twelve prefix tokens are OR'd substring filters; `--test main`
        # selects only the consolidated integration binary. A test matching a
        # token runs here and is `--skip`ped in the m-z slice, so the pair is
        # exactly-once by construction. Keep this token list and the skip list
        # below BYTE-IDENTICAL — they are the same twelve strings.
        #
        # The tokens sit AFTER `--`: cargo's own CLI takes at most ONE
        # positional TESTNAME ("error: unexpected argument 'pg_b' found");
        # multiple OR'd filters are a libtest feature, so they must be passed
        # through to the harness.
        run: >
          cargo test -p er-server --test main --
          pg_a pg_b pg_c pg_d pg_e pg_f pg_g pg_h pg_i pg_j pg_k pg_l
      - name: er-server pg suite, modules m-z
        if: matrix.suite == 'pg-mz'
        # The complement: everything matching `pg_` except the a-l tokens. A
        # NEW pg_* module lands here unless its name starts with one of the
        # twelve prefixes — in neither-slice is impossible while the two lists
        # match.
        run: >
          cargo test -p er-server --test main pg_ --
          --skip pg_a --skip pg_b --skip pg_c --skip pg_d --skip pg_e
          --skip pg_f --skip pg_g --skip pg_h --skip pg_i --skip pg_j
          --skip pg_k --skip pg_l
      - name: everything else (rest slice)
        if: matrix.suite == 'rest'
        # Two invocations: dedupe-cli + er-entity-diff run UNFILTERED (their
        # Postgres tests live in separate binaries with non-pg_ fn names, so a
        # name filter could silently drop them); er-server's remaining targets
        # (lib + bin unittests + the non-pg_ integration tests) run with the
        # complementary skip.
        run: |
          cargo test -p dedupe-cli -p er-entity-diff
          cargo test -p er-server -- --skip pg_
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  # The required status check for the e2e tier. The GitHub behaviour forcing
  # this shape is stated in full above infra.yml's `plan-gate`, which this
  # copies: A MATRIX JOB'S PER-LEG NAMES CANNOT BE REQUIRED STATUS CHECKS.
  # When `lake-e2e` is skipped by its `if:`, GitHub reports a single check-run
  # under the literal, uninterpolated name `DuckLake e2e shard (${{ matrix.partition }})`,
  # so per-leg contexts never report on a PR that skips the tier — and a
  # required context that never reports blocks the PR forever (learned on #359).
  #
  # This job carries the EXACT `name:` the old combined job had, so the split
  # needed no branch-protection edit: the context "DuckLake + extensions e2e"
  # kept reporting without interruption, just from a different job id.
  ducklake-gate:
    name: DuckLake + extensions e2e
    needs: [detect, lake-e2e, ducklake-e2e]
    # `!cancelled()`: the gate must RUN (and fail) when a leg fails — a gate
    # skipped because its `needs` failed would read to branch protection as
    # satisfied, which is the exact false-green this job exists to prevent.
    if: ${{ !cancelled() && needs.detect.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout only to have scripts/ci/ on disk — the gate reads no code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every e2e leg must have succeeded
        working-directory: ${{ github.workspace }}
        env:
          # For each matrix job this is the aggregate: `success` only if every
          # leg succeeded, `failure` if any failed, `skipped` if the whole job
          # was.
          GATE_LEGS: |
            lake-e2e=${{ needs.lake-e2e.result }}
            ducklake-e2e=${{ needs.ducklake-e2e.result }}
        run: bash scripts/ci/gate-all-legs.sh

  # --- heavy perf jobs: main + nightly only (skipped on PRs for latency) ---

  bench-compile:
    name: benchmarks (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on merge_group either: the queue is a PR gate, these are main+nightly.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo bench -p dedupe-core --no-run
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  scale-tests:
    name: scale golden (50k)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not on merge_group either: the queue is a PR gate, these are main+nightly.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      DEDUPE_SCALE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-rust.sh
      - name: Install mold
        # One copy for the seven jobs here that link with mold (agent-task.yml
        # has the eighth): retried, time-boxed, and falling back to the default
        # linker by stripping mold from RUSTFLAGS — the why and the measured
        # failure modes live in scripts/ci/install-mold.sh's header. 13 min
        # lets all three bounded attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        # The script lives at the repo root; this workflow defaults `run` to rust/.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-mold.sh
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo test -p dedupe-core --test main golden_historical_50k
      - name: Build cost (sccache stats, target size)
        # Diagnostics, never a gate. What the numbers are for, and why nothing
        # in them can fail the job, is in scripts/ci/build-cost.sh.
        if: always()
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/build-cost.sh

  # --- coverage: nightly + on-demand only (never on PRs or main pushes) ---
  #
  # Measures line coverage with cargo-llvm-cov over the default + DuckLake/PG
  # e2e paths (the 50k scale test stays off). `--fail-under-lines` is the
  # non-regression floor: ratchet it UP as coverage grows, never down. It is a
  # backstop against regressions — the primary quality gate is the behavioral
  # tests the other jobs run. No sccache/mold here: llvm-cov owns RUSTFLAGS for
  # instrumentation and instrumented builds don't cache usefully; nightly
  # latency is not a concern.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      RUSTFLAGS: ""
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: coverage
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v2-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # This key KEEPS its writer, unlike the four restore-only jobs above,
          # and the reasoning is worth recording because the opposite looks
          # obviously right: the entry held 1,885 MiB, 19% of the repository's
          # whole 10 GB budget, for a job that runs nightly and is not required.
          #
          # Dropping it would make this job permanently cold, and the `llvm-cov`
          # step already measures 22m10 WARM against a 60-minute timeout. An
          # instrumented cold build has no cache to fall back on — llvm-cov owns
          # RUSTFLAGS, so every unit including dependencies rebuilds, and the
          # `shared-key: rust` entry cannot substitute. That trades 1.8 GiB for a
          # timeout failure.
          #
          # It also is not necessary. `[profile.test]` inherits
          # `[profile.dev.package."*"] debug = false` from rust/Cargo.toml, so
          # this entry shrinks on its own — the bulk of it was the ~1.5 GB duckdb
          # rlib. The single-writer rule, the nightly sccache cap and that shrink
          # free enough on their own; check the real number here before
          # considering anything more aggressive.
      - name: Repair the restored libduckdb-sys source tree
        # #424 cured the eight compile jobs by DELETING rust-cache. This job is
        # the one that keeps it — for the reasons directly above — so it is the
        # one place the poisoning survives, and it needs the repair instead.
        #
        # The mechanism, from the crate source rather than the symptom.
        # `libduckdb-sys` does not unpack into `OUT_DIR`: `src/build_paths.rs:40`
        # walks UP from it to a tree shared across the whole target dir,
        # `target/duckdb-sources/<key>/`, guarded by a `.complete` DOTFILE.
        # Present, the build script returns early. Absent, it unpacks into a
        # fresh staging dir and `fs::rename`s that over `<key>/` — and renaming
        # onto a non-empty directory is ENOTEMPTY, which is Linux errno 39:
        #
        #   unpacking bundled DuckDB sources: Os { code: 39, kind: DirectoryNotEmpty }
        #
        # That panic message names the wrong operation. `fs::rename` in
        # `publish()` is the ONLY syscall in that function that can return 39 —
        # the staging dir is uniquely minted, so `archive.unpack` cannot — and
        # the `?` carries it to an `.expect("unpacking bundled DuckDB sources")`
        # at `build_bundled_cc.rs:65`. Reading that string as the location is
        # what sent two earlier fixes at `OUT_DIR`, where they verifiably
        # deleted `.o` files while the panic happened anyway.
        #
        # So the poisoned state is a POPULATED `<key>/` with NO `.complete`,
        # which is what a rust-cache save/restore round-trip leaves behind. The
        # repair cannot go before the save — rust-cache writes in its POST-step,
        # after every step this workflow can declare — so after the restore is
        # the only place it can go.
        #
        # Dated prediction this step exists to stop: #376 bumped duckdb at
        # 01:07 on 2026-11-03, after that day's nightly. The next scheduled run
        # therefore gets a NEW `<key>`, unpacks cleanly, passes, and SAVES the
        # stripped tree; the run after that restores it and dies before a test.
        # Breakage never lands on the run that caused it.
        #
        # The test below is exactly the build script's own precondition, so an
        # intact tree is left alone and keeps the fast path. Dropping one costs
        # the tarball unpack (seconds), not the compile (minutes) — the C++
        # objects come from sccache. It echoes per tree because both earlier
        # fixes went GREEN having done nothing: "it ran" and "it did something"
        # have to be distinguishable in the log.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/duckdb-cache-repair.sh
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 45

  # --- cache hygiene: nightly + on-demand only ---
  #
  # GitHub allows 10 GB of Actions cache per repository and evicts LRU past it.
  # sccache's GHA backend writes ONE ENTRY PER COMPILATION OBJECT and nothing
  # caps it, so it grows without bound — measured at ~2,706 entries and 4,410 MiB,
  # 99% of the repository's entries and 44% of its bytes. At that size the
  # repository sat at the ceiling (10,653,007,178 bytes across 2,594 entries) and
  # GitHub evicted the largest LRU victim, which is the ~1.5 GB `shared-key: rust`
  # entry that five compile jobs restore from. So sccache was evicting the cache
  # it was added to complement, and the cost was a 42m27 `lint` instead of 14m15.
  #
  # Pruning OLDEST-ACCESSED-FIRST rather than by prefix is deliberate: an sccache
  # entry is content-addressed, so an old one is still a valid hit if that crate
  # version comes back, and the least-recently-accessed ones are the versions the
  # lockfile has already moved past. Deleting the whole prefix would throw away
  # the thing sccache is uniquely good at — surviving a `Cargo.lock` change, which
  # rust-cache cannot do at all.
  #
  # Kept as its own job, never a step on a required one: cache hygiene must not
  # be able to fail a merge.
  cache-prune:
    name: prune the Actions cache to budget
    runs-on: ubuntu-latest
    # 30, not 15: listing ~5,600 entries over 56 paginated requests and then
    # deleting thousands of them is minutes of pure API round trips even eight at
    # a time. The first version ran sequentially and did not finish in ten.
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      # Deleting a cache entry needs write; nothing else here does.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # sccache's share of the 10 GB budget. Deliberately GENEROUS, and the first
      # guess here (2048) was wrong in a way worth recording.
      #
      # sccache turns out to be the PRIMARY cache for this workspace, not a
      # backstop for rust-cache. Run 39783867347 logged `No cache found.` for
      # rust-cache in both compile jobs — a total miss — and still finished the
      # whole workflow in 8m03, because sccache hit 96.65% and 97.54% (and 98%
      # on C/C++, so it is caching the bundled DuckDB compile too). clippy came
      # in at 2m02 with no rust-cache at all.
      #
      # So this budget is not "sccache's slice". It is "what is left after the
      # caches that cannot share", and it should be as large as that allows:
      # a fresh `v1-rust` entry, `coverage`'s entry, the buildkit blobs from
      # images.yml (~1 GB, also uncapped), the pnpm store, the Next cache and the
      # DuckDB extensions come to roughly 3.5 GB. Pruning below that line deletes
      # entries that are each a future compile.
      #
      # The prune still exists, because unbounded growth is what evicted
      # rust-cache in the first place. But the real fix is to take sccache out of
      # this 10 GB budget entirely — see the build-cost reference's S3 section,
      # which this measurement promotes from contingency to the obvious next step.
      #
      # MEASURED 2026-10-22, run 39838150331 — the first real run of this job.
      # It printed the accounting below and then correctly deleted NOTHING,
      # because sccache was 3,341 MiB against this 5,120 budget while the
      # repository sat at 10,696,640,978 bytes:
      #
      #     sccache        4682 entries  3341.1 MiB
      #     buildkit-blob   ~70 entries  ~5000 MiB   <- four entries at 763.8 MiB
      #     v1-rust-rust       2 entries   364.1 MiB each
      #
      # So capping sccache alone made this job a no-op while `images.yml`'s
      # `type=gha,mode=max` layer cache held half the budget and kept evicting
      # the entries that make CI fast. BUDGETS below is therefore a list, not a
      # single number: each prefix is capped independently, oldest-accessed
      # first.
      #
      # THE sccache BUDGET IS LIVE AGAIN as of #887, which moved sccache back
      # onto this backend to stop $209/month of S3 egress. It spent the S3 era
      # vestigial — kept precisely so this rollback would not silently uncap it,
      # which is the one reason that note existed and the reason it paid off.
      #
      # 5120 was its S3-era value and is now too tight. The repository's
      # eviction limit is raised to 20 GB (Settings -> Actions, $0.07/GB-month
      # above the included 10), and the other consumers come to ~6.5 GB once
      # #889's single-writer guards drain the duplicate `pnpm-store` and
      # `next-build` entries. 12288 MiB leaves sccache room to reach its natural
      # size — it settled at 4.78 GB on S3 under a 14-day expiry — with headroom
      # for growth between nightly runs, while still bounding the monotonic
      # growth that evicted rust-cache in the first place. Pruning below the
      # natural size deletes entries that are each a future compile, which is
      # the mistake this comment's own history records.
      #
      # buildkit is the other half and is still rollback insurance: it moved to
      # ECR (er-buildcache; images.yml `cache-to: type=registry`) and keeps only
      # a transitional `type=gha` cache-FROM, which reads and never writes.
      #
      # What is deliberately NOT capped: `v1-rust*` (two ~364 MiB entries,
      # the thing all of this protects), `pnpm-store`, `next-build` and
      # `duckdb-extensions` — all small, all load-bearing, none growing without
      # bound. Only the two unbounded producers are listed.
      BUDGETS: |
        sccache 12288
        buildkit-blob 2048
      # Upper bound on deletions per run, so one night's work is bounded no
      # matter how large the backlog. It converges over successive runs, and
      # reports when it stops short rather than looking finished.
      MAX_DELETES: "4000"
    steps:
      # Checkout only to have scripts/ci/ on disk — the prune reads no code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune
        # The enumeration-not-usage-endpoint rationale and the concurrency
        # measurements live in the script's own comments; the BUDGETS above
        # keep the measured numbers next to the knobs they size.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/cache-prune.sh

  # Writes the content-addressed pass marker `detect` looks up. Runs only on a
  # PR, only when the gate actually ran (not when it was itself skipped by a
  # marker or by the path filter), and only when every required job succeeded.
  # Not a required check, and it cannot fail a merge: a failed save just means
  # the next identical run does the work again.
  record-pass:
    name: record pass marker
    needs: [detect, lint, entities, test-gate, security, ducklake-gate]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.detect.outputs.code == 'true'
      && needs.detect.outputs.pass_key != ''
      && needs.lint.result == 'success' && needs.entities.result == 'success' && needs.test-gate.result == 'success' && needs.security.result == 'success' && needs.ducklake-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - working-directory: ${{ github.workspace }}
        run: echo "${{ github.sha }}" > .ci-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.detect.outputs.pass_key }}
