# Rust workspace checks for the all-Rust rebuild under `rust/` (the engine,
# the CLI, and the foundation crates that will replace the Python in src/er,
# server/ and dbt/). Path-filtered so a Python- or frontend-only change never
# pays for a Rust build, and a Rust-only change never waits on the Python tiers.
#
# The toolchain is installed with `rustup` rather than an action: dtolnay's
# rust-toolchain selects the channel through its ref (`@stable`), which cannot
# also carry the S9 `@<sha> # vTAG` pin the repo requires of every `uses:`.
name: rust

on:
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
      - run: cargo test --workspace

  bench-compile:
    name: benchmarks (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
      # Keep benches building; running them is manual (they take minutes).
      - run: cargo bench -p dedupe-core --no-run

  security:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  ducklake-e2e:
    name: DuckLake + extensions e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
      # The er-server control-plane queue gate runs against this service.
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
      - name: Cache DuckDB extensions
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.duckdb/extensions
          # Key on the lockfile (the DuckDB version lives there), and fall back to
          # any prior extensions cache so a dependency change restores the already
          # downloaded extensions instead of re-fetching them cold under the job
          # timeout.
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - run: cargo test -p dedupe-cli -p er-cli -p er-server
      - name: Extension loading (rapidfuzz)
        run: cargo test -p dedupe-core --test extensions

  scale-tests:
    name: scale golden (50k)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEDUPE_SCALE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: rust
      - run: cargo test -p dedupe-core --test golden_historical_50k
