  # --- coverage: nightly + on-demand only (never on PRs or main pushes) ---
  #
  # Measures line coverage with cargo-llvm-cov over the default + DuckLake/PG
  # e2e paths (the 50k scale test stays off). `--fail-under-lines` is the
  # non-regression floor: ratchet it UP as coverage grows, never down. It is a
  # backstop against regressions — the primary quality gate is the behavioral
  # tests the other jobs run. No sccache/mold here: llvm-cov owns RUSTFLAGS for
  # instrumentation and instrumented builds don't cache usefully; nightly
  # latency is not a concern.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      RUSTFLAGS: ""
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: coverage
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v1-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # This key KEEPS its writer, unlike the four restore-only jobs above,
          # and the reasoning is worth recording because the opposite looks
          # obviously right: the entry held 1,885 MiB, 19% of the repository's
          # whole 10 GB budget, for a job that runs nightly and is not required.
          #
          # Dropping it would make this job permanently cold, and the `llvm-cov`
          # step already measures 22m10 WARM against a 60-minute timeout. An
          # instrumented cold build has no cache to fall back on — llvm-cov owns
          # RUSTFLAGS, so every unit including dependencies rebuilds, and the
          # `shared-key: rust` entry cannot substitute. That trades 1.8 GiB for a
          # timeout failure.
          #
          # It also is not necessary. `[profile.test]` inherits
          # `[profile.dev.package."*"] debug = false` from rust/Cargo.toml, so
          # this entry shrinks on its own — the bulk of it was the ~1.5 GB duckdb
          # rlib. The single-writer rule, the nightly sccache cap and that shrink
          # free enough on their own; check the real number here before
          # considering anything more aggressive.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 45

  # --- cache hygiene: nightly + on-demand only ---
  #
  # GitHub allows 10 GB of Actions cache per repository and evicts LRU past it.
  # sccache's GHA backend writes ONE ENTRY PER COMPILATION OBJECT and nothing
  # caps it, so it grows without bound — measured at ~2,706 entries and 4,410 MiB,
  # 99% of the repository's entries and 44% of its bytes. At that size the
  # repository sat at the ceiling (10,653,007,178 bytes across 2,594 entries) and
  # GitHub evicted the largest LRU victim, which is the ~1.5 GB `shared-key: rust`
  # entry that five compile jobs restore from. So sccache was evicting the cache
  # it was added to complement, and the cost was a 42m27 `lint` instead of 14m15.
  #
  # Pruning OLDEST-ACCESSED-FIRST rather than by prefix is deliberate: an sccache
  # entry is content-addressed, so an old one is still a valid hit if that crate
  # version comes back, and the least-recently-accessed ones are the versions the
  # lockfile has already moved past. Deleting the whole prefix would throw away
  # the thing sccache is uniquely good at — surviving a `Cargo.lock` change, which
  # rust-cache cannot do at all.
  #
  # Kept as its own job, never a step on a required one: cache hygiene must not
  # be able to fail a merge.
  cache-prune:
    name: prune the Actions cache to budget
    runs-on: ubuntu-latest
    # 30, not 15: listing ~5,600 entries over 56 paginated requests and then
    # deleting thousands of them is minutes of pure API round trips even eight at
    # a time. The first version ran sequentially and did not finish in ten.
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      # Deleting a cache entry needs write; nothing else here does.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # sccache's share of the 10 GB budget. Deliberately GENEROUS, and the first
      # guess here (2048) was wrong in a way worth recording.
      #
      # sccache turns out to be the PRIMARY cache for this workspace, not a
      # backstop for rust-cache. Run 39783867347 logged `No cache found.` for
      # rust-cache in both compile jobs — a total miss — and still finished the
      # whole workflow in 8m03, because sccache hit 96.65% and 97.54% (and 98%
      # on C/C++, so it is caching the bundled DuckDB compile too). clippy came
      # in at 2m02 with no rust-cache at all.
      #
      # So this budget is not "sccache's slice". It is "what is left after the
      # caches that cannot share", and it should be as large as that allows:
      # a fresh `v1-rust` entry, `coverage`'s entry, the buildkit blobs from
      # images.yml (~1 GB, also uncapped), the pnpm store, the Next cache and the
      # DuckDB extensions come to roughly 3.5 GB. Pruning below that line deletes
      # entries that are each a future compile.
      #
      # The prune still exists, because unbounded growth is what evicted
      # rust-cache in the first place. But the real fix is to take sccache out of
      # this 10 GB budget entirely — see the build-cost reference's S3 section,
      # which this measurement promotes from contingency to the obvious next step.
      #
      # MEASURED 2026-10-22, run 39838150331 — the first real run of this job.
      # It printed the accounting below and then correctly deleted NOTHING,
      # because sccache was 3,341 MiB against this 5,120 budget while the
      # repository sat at 10,696,640,978 bytes:
      #
      #     sccache        4682 entries  3341.1 MiB
      #     buildkit-blob   ~70 entries  ~5000 MiB   <- four entries at 763.8 MiB
      #     v1-rust-rust       2 entries   364.1 MiB each
      #
      # So capping sccache alone made this job a no-op while `images.yml`'s
      # `type=gha,mode=max` layer cache held half the budget and kept evicting
      # the entries that make CI fast. BUDGETS below is therefore a list, not a
      # single number: each prefix is capped independently, oldest-accessed
      # first.
      #
      # What is deliberately NOT capped: `v1-rust*` (two ~364 MiB entries,
      # the thing all of this protects), `pnpm-store`, `next-build` and
      # `duckdb-extensions` — all small, all load-bearing, none growing without
      # bound. Only the two unbounded producers are listed.
      BUDGETS: |
        sccache 5120
        buildkit-blob 2048
      # Upper bound on deletions per run, so one night's work is bounded no
      # matter how large the backlog. It converges over successive runs, and
      # reports when it stops short rather than looking finished.
      MAX_DELETES: "4000"
    steps:
      - name: Prune
        # No checkout, so step off the workflow's `rust` working-directory
        # default, which would not exist.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          report() {
            gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq \
              '"\(.active_caches_count) entries, \(.active_caches_size_in_bytes) bytes"'
          }

          echo "::group::before"
          echo "total: $(report)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.size_in_bytes)\t\(.key | split("/")[0])"' |
            awk -F'\t' '{c[$2]++; s[$2]+=$1}
                        END {for (k in c) printf "%7d entries %9.1f MiB  %s\n", c[k], s[k]/1048576, k}' |
            sort -k3 -rn
          echo "::endgroup::"

          # One pass per capped prefix. Each is independent: a prefix already
          # under budget contributes no deletions, which is the correct no-op.
          grand_deleted=0
          while read -r prefix budget_mib; do
            [ -n "$prefix" ] || continue

            entries=$(mktemp)
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=$prefix&sort=last_accessed_at&direction=asc" \
              --jq '.actions_caches[] | "\(.id)\t\(.size_in_bytes)"' >"$entries"

            total=$(awk -F'\t' '{s+=$2} END {print s+0}' "$entries")
            budget=$((budget_mib * 1048576))
            printf '%s: %d entries, %d MiB (budget %d MiB)\n' \
              "$prefix" "$(wc -l <"$entries")" "$((total / 1048576))" "$budget_mib"

            if [ "$total" -le "$budget" ]; then
              echo "  under budget; nothing to do"
              continue
            fi

            # Choose the victims in one pass, then delete them CONCURRENTLY. A
            # sequential loop is what the first version did and it does not fit
            # in any sane timeout: one DELETE is a separate HTTPS round trip
            # (~150 ms) and the backlog was 5,595 entries / 5,846 MiB, i.e.
            # ~3,400 deletions. Measured: it ran past 10 minutes having cleared
            # only part of it. `xargs -P 8` does 1,586 in 2m00.
            #
            # MAX_DELETES bounds a single run so the job cannot become unbounded
            # work if a backlog is ever huge; it converges over successive runs
            # instead. Anything dropped is reported, never silent.
            remaining_cap=$((MAX_DELETES - grand_deleted))
            if [ "$remaining_cap" -le 0 ]; then
              printf '  deletion cap %d already spent; the next run continues here\n' "$MAX_DELETES"
              continue
            fi

            doomed=$(mktemp)
            awk -F'\t' -v budget="$budget" -v total="$total" -v cap="$remaining_cap" '
              total <= budget { exit }
              NR > cap        { exit }
              { print $1; total -= $2 }
            ' "$entries" >"$doomed"
            want=$(wc -l <"$doomed")
            printf '  deleting %d oldest-accessed entries (cap %d remaining)\n' "$want" "$remaining_cap"

            # `|| true` per delete: a concurrent run may have evicted it
            # already, which is not a failure. xargs would otherwise exit 123
            # and, under `set -e`, fail a job whose whole point is hygiene.
            export GITHUB_REPOSITORY
            xargs -r -P 8 -I{} sh -c \
              'gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/{}" --silent 2>/dev/null || true' \
              <"$doomed"

            grand_deleted=$((grand_deleted + want))
            if [ "$want" -ge "$remaining_cap" ]; then
              printf '  hit the deletion cap with %s still over budget; the next run continues\n' "$prefix"
            fi
          done <<<"$BUDGETS"

          printf 'deleted %d entries in total\n' "$grand_deleted"
          echo "total: $(report)"
