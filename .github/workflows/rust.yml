# The application's CI. The engine, CLI, and control plane are Rust (under
# `rust/`); the Python/dbt implementation has been removed, so this is the whole
# backend gate — effectively unfiltered (the frontend keeps its own pnpm gate).
#
# Three exceptions: a PR that touches nothing but `.claude/**` (agent/skill
# prose), `infra/terraform/**`, and/or the `gh aw` agentic-workflow files runs
# none of the compile jobs. Because the required jobs below are REQUIRED status
# checks, a workflow-level path filter would leave them "pending" forever and
# block the PR; instead a `detect` job computes whether any file outside those
# sets changed and the required jobs gate on it with `if:`. A job skipped by
# `if:` reports a "skipped" conclusion, which branch protection accepts as
# satisfied — so the PR stays mergeable with zero compute.
#
# Why `infra/terraform/**` is safe to skip, which is not obvious: nothing in the
# Rust gate reads it. No crate or manifest references it (the two mentions under
# `rust/` are prose in comments), and `make check` touches `infra/` nowhere.
# `scripts/skills-check.sh` DOES derive generated skill references from it — it
# counts `resource "aws_*"` blocks, IAM users, Pod Identity associations and the
# pinned provider versions — so a terraform-only PR can make a reference stale.
# That is covered, and by design: the `skills` job below runs the same drift
# check and is deliberately NOT gated on `detect`, which is the whole reason it
# exists as a separate job. The terraform gate itself lives in `infra.yml`.
#
# The agentic workflows (`.github/workflows/*.md`, the `*.lock.yml` compiled from
# each, and `shared/`) qualify on the same two grounds: nothing in `make check`
# reads them, and the drift they CAN cause — `skills-check.sh` derives the
# agentic-workflow table in `required-checks.md` from those `.md` files — is
# caught by the ungated `skills` job. Note those are matched per FILE rather than
# as a directory, because this file and its three siblings live there too.
#
# The skip stops there. `docs/**` must still run the gate, because `entities`
# runs `er-entity verify` (docs/erd.md staleness) and `lint` verifies the
# generated skill references.
#
# A JOB'S `name:` IS ITS BRANCH-PROTECTION CONTEXT. Renaming one silently
# un-protects it, and adding a required context for a job that does not yet
# exist on `main` blocks every PR until it does. `entities` was split out of
# `lint` and is required; it was added to protection only after it had reported
# green on `main`, which is the only safe order.
#
# The toolchain is installed with `rustup` rather than an action: dtolnay's
# rust-toolchain selects the channel through its ref (`@stable`), which cannot
# also carry the S9 `@<sha> # vTAG` pin the repo requires of every `uses:`.
#
# SPEED: every compile job shares an sccache compilation cache (the S3 backend
# below — see the env block) and links with mold, so the jobs stop re-compiling
# the same crate-units cold and the DuckDB static link is far cheaper. The heavy perf jobs (bench compile,
# 50k scale) run only on main + nightly, not on every PR — the PR gate is
# lint + test + the DuckLake integration e2e + cargo-deny.
#
# The two caches are a SHARED, CAPPED resource — 10 GB per repository, LRU-evicted
# past it — and they fail differently, which is why both exist. rust-cache keys on
# `Cargo.lock` and so misses wholesale on any dependency change; sccache is
# content-addressed per compilation unit and still hits for every crate a bump did
# not touch. Three rules follow, each load-bearing:
#
#   1. `lint` is the SINGLE WRITER of `shared-key: rust`, and only from `main`;
#      the other four compile jobs are restore-only (`save-if: false`).
#      `coverage` keeps the writer on its own key — see the note there for why
#      dropping it would buy 1.8 GiB and a timeout.
#   2. The Actions cache is pruned to a budget nightly (`cache-prune`). Its
#      original reason — sccache writing one entry per compilation object with
#      nothing capping it — is GONE now that sccache is on S3. The job stays
#      because sccache was never the only unbounded producer: `images.yml`'s
#      `type=gha,mode=max` buildkit layer cache measured ~5,000 MiB, half the
#      budget, and was evicting the entries that make CI fast. See the job.
#   3. Every compile job reports `sccache --show-stats`, so the hit rate is
#      observable rather than assumed.
#
# Without 1 and 2 the repository sat at the ceiling and GitHub evicted its largest
# LRU victim — the rust-cache entry every compile job restores from — producing
# cold runs with no dependency change to explain them. Cold is a 3x penalty on the
# critical-path job. The measurements, and the decisions taken against them
# (including why headstart is not one of them), are in the `ci-and-supply-chain`
# skill's build-cost reference.
name: rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full run (incl. the heavy perf jobs + coverage) at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:
    # On-demand trigger for the nightly-only jobs (coverage, perf).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

# Incremental compilation is pointless in CI and conflicts with sccache; mold is
# the linker for every rustc invocation. RUSTC_WRAPPER/sccache are set per
# compile job (the cargo-deny job must not inherit a wrapper it never installs).
env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  # S3, not the Actions cache backend. The Actions one shares a 10 GB
  # per-repository budget, LRU-evicted past it, which is why this workflow used
  # to carry a nightly `cache-prune` job — a cap on the thing doing most of the
  # work. When the repository sat at the ceiling GitHub evicted its largest LRU
  # victim (the rust-cache entry every compile job restores from) and produced
  # cold runs with nothing in the diff to explain them. S3 has no such budget,
  # so both the prune and that eviction class are gone.
  #
  # Bucket + roles are infra/terraform/envs/core/sccache.tf.
  SCCACHE_BUCKET: er-ci-sccache-797781631727
  SCCACHE_REGION: us-east-2

jobs:
  # Did anything outside `.claude/**`, `infra/terraform/**` and the agentic
  # workflow files change? The required compile jobs below gate on this, so a
  # skills-only, terraform-only or prompt-only PR skips them (a skipped required
  # check still satisfies branch protection). Non-PR events (push to main,
  # nightly) always report `true` — the gate never self-skips on the branch it
  # protects.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `base...head` = what the PR introduces. Count changed paths NOT in
          # the exempt set; any such file means the backend gate must run. This
          # is a DENYLIST, so an entry added here is one the Rust gate stops
          # seeing — only add something nothing in `make check` reads (the
          # header explains why each qualifies, and why `docs/` does not).
          #
          # `infra.yml`, `drift.yml` and the `gh aw` agentic set are named FILE
          # BY FILE and not as `^\.github/workflows/`, which matters: `rust.yml`,
          # `frontend.yml` and `images.yml` must keep triggering the gates they
          # define, or a change to a gate would stop reporting on exactly the PR
          # most likely to break it. The two terraform workflows define no Rust
          # job and cannot affect the workspace build, and an infra-only PR was
          # paying the full ~40-minute backend gate — `test` plus the DuckLake
          # e2e — to prove it.
          #
          # Enumerating rather than exempting the directory and listing
          # exceptions is the FAIL-SAFE direction: a workflow added later runs
          # the gate until someone argues it should not, instead of skipping it
          # until someone notices.
          #
          # `grep -c` reads all input (unlike `grep -q`, which closes the pipe
          # early and can SIGPIPE `git diff` under `pipefail` → a flaky false
          # skip); `|| true` absorbs grep's exit-1-on-zero-matches under `set -e`.
          #
          # The agentic entries are named or extension-matched, never the whole
          # directory — the one place this pattern needs care, because `rust.yml`,
          # `frontend.yml` and `images.yml` live in `.github/workflows/` too and
          # must keep triggering the gate they define. `^\.github/workflows/`
          # would be the `paths:`-filter trap in CLAUDE.md wearing a different
          # hat. So: the `.md` a human edits, the `.lock.yml` `gh aw compile`
          # emits from it, the `shared/` imports they pull in, and
          # `agentics-maintenance.yml`, which that compile also generates.
          # `.github/aw/` is gh-aw's own metadata (the resolved action SHAs).
          # None of those shapes can capture a hand-written `.yml` workflow, so
          # they cannot widen the exemption past what is argued for above.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf 'changed paths:\n%s\n' "$changed"
          exempt='^(\.claude/|infra/terraform/|scripts/ci/tf-|\.github/aw/|\.github/workflows/((infra|drift)\.yml$|shared/|agentics-maintenance\.yml$|[A-Za-z0-9._-]+\.md$|[A-Za-z0-9._-]+\.lock\.yml$))'
          noncode="$(printf '%s\n' "$changed" | grep -cvE "$exempt" || true)"
          if [ "${noncode:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Deliberately NOT gated on `detect`. The jobs below skip for a PR that only
  # touches `.claude/**` — which is exactly the PR that changes a skill, so a
  # skill gate placed in any of them would never run when it matters. This one
  # needs no toolchain (pure shell, no cargo, no node, no network), so running
  # it unconditionally costs seconds.
  skills:
    name: agent skills (lint + drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: agent-skill authoring rules and generated-reference drift
        # `all` = regen + drift + lint. Authoring rules are frontmatter limits,
        # body size, one-level references, resolving links, a table of contents
        # on long references, and an evals.md per skill.
        #
        # The DRIFT half also runs here, not only in the cargo `lint` job, and
        # that is the point of this job rather than an accident:
        #
        #   `lint` is gated on `detect`, which skips every compile job for a PR
        #   touching nothing but .claude/** — so the drift check does not run on
        #   exactly the PRs that change skills. That was sound while every
        #   generator derived from code outside .claude/, because a code change
        #   always ran the full gate. It stopped being sound when
        #   `gen_skill_inventory` landed: it derives from SKILL.md descriptions,
        #   so a one-line description edit makes the inventory tables in
        #   docs/agent-skills.md and CLAUDE.md stale — a .claude-only PR that
        #   goes green and turns main red on the push-to-main run.
        #
        # Running it needs no toolchain: every generator is grep/awk/sed over
        # checked-in files, which is why this job can stay at 5 minutes with a
        # bare checkout and no cargo, node or Docker.
        #
        # It is deliberately ALSO left in the cargo `lint` job. This job is not
        # a required status check, so on its own it cannot block a merge; the
        # required one covers code PRs while this one covers .claude-only PRs.
        # Promoting this to required would make the pair redundant — worth doing
        # now that both halves have been observed failing.
        #
        # working-directory is mandatory: this workflow defaults every `run` to
        # `rust/` (for the cargo jobs), and the script lives at the repo root.
        # Without the override this step dies with exit 127 before it checks
        # anything — which is how the first push of this job failed.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh all

  # S9 — every `uses:` pinned to a commit SHA with its `# vTAG` comment.
  #
  # This job exists because the policy was enforced by NOTHING. `scripts/ci/
  # actionlint.sh` shelled out to `uv run python scripts/actionlint.py`; the
  # Python/dbt removal took that script, the root pyproject.toml and uv.lock
  # with it, so the checker could not run at all — and no job invoked it, so the
  # breakage was invisible while the skill went on calling S9 "enforced, not
  # just documented". Found 2026-11-03. The script is pure bash now, for the
  # same reason: a gate with no dependencies cannot be deleted by a dependency
  # cleanup.
  #
  # DELIBERATELY NOT GATED ON `detect`, for the same reason the `skills` job is
  # not. `detect` exempts `.claude/**`, `infra.yml`, `drift.yml` and every
  # `*.lock.yml` — so a PR touching only those skips the compile jobs, and a
  # gated pin check would skip on exactly the PRs most likely to introduce an
  # unpinned action: a hand-edited `infra.yml`, or a regenerated gh-aw lock file
  # whose pins come from a compiler nobody is watching.
  #
  # NOT a required status check yet. The repo's rule is that a gate is trusted
  # only after it has been observed failing, and that cannot be done here while
  # the account cannot allocate runners. Promote it once it has reported green
  # on `main` and been seen to go red — in that order, because a required
  # context for a job that does not yet exist on `main` blocks every PR.
  workflow-pins:
    name: workflow pins (S9)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint itself is advisory here — the script runs it when present and
      # says so when it is not, so a hiccup installing it can never fail the
      # pinning half. Installed through the action this repo already pins rather
      # than a fresh third-party one.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: actionlint
        continue-on-error: true
      - name: every `uses:` is SHA-pinned with its tag comment
        # Mandatory: this workflow defaults every `run` to `rust/`, and the
        # script lives at the repo root. Without it the step dies with exit 127
        # before checking anything, which is how the `skills` job first failed.
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/actionlint.sh

  lint:
    name: fmt + clippy + docs
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45, not 30: on a cold cache this job has to build the bundled duckdb C++
    # tree before clippy can lint 27 crates and rustdoc can document them, and
    # it measured 30+ min — the timeout cancelled it mid-run even though every
    # gate had passed. Any duckdb bump invalidates the cache and hits this.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: agent-skill generated references are not stale
        # The GENERATED blocks in .claude/skills/**/references/ are derived from
        # entities/, the crate tree, er-sql-check's analyze.rs, the workflows and
        # the frontend config. They can only go stale when CODE changes — and a
        # code change always reaches this job — so the regen half belongs here
        # rather than in the always-on `skills` job, which has no toolchain.
        working-directory: ${{ github.workspace }}
        run: bash scripts/skills-check.sh check
      - name: Build cost (sccache stats, target size)
        # Never a gate: `always()` so a red job still reports, `|| true` so the
        # reporting itself cannot fail one.
        #
        # The sccache hit rate has never been observable in this repo, which is
        # why nobody could say whether it earns the ~4.3 GiB and ~2,700 entries
        # it takes out of a 10 GB per-repository cache. It is the input to the
        # two decisions deferred in the `ci-and-supply-chain` skill's build-cost
        # reference: whether to move sccache to S3, and whether it could be
        # dropped (which is also precondition 1 for revisiting headstart).
        #
        # Read it as a pair: a cold run shows what the misses cost, a warm run
        # shows what the hits save. One number alone says nothing.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  # Split out of `lint` on 2026-10-22. That job ran four independent ~10-minute
  # steps SERIALLY and took 42m27 on a cache miss — clippy 10m32, this 10m39,
  # rustdoc 9m20 and the advisory OpenAPI gate 10m34 — while gating every merge.
  #
  # WHAT IS AND IS NOT WORTH SPLITTING, from run 39775982197 rather than from
  # reasoning — because reasoning got it wrong here:
  #
  #   clippy       9m22    expensive: builds the dependency tree's metadata
  #   this step    8m16    expensive: first `cargo run`, so it pays the codegen
  #   rustdoc      0m39    nearly free once clippy has run
  #   OpenAPI gate 0m42    nearly free once a `cargo run` has codegen'd
  #
  # So the cost is the DEPENDENCY TREE, paid once per kind of build, and the
  # workspace's own 28 crates are cheap. Only the first two deserve their own
  # jobs; rustdoc stays in `lint` and the OpenAPI gate stays here, because a
  # separate job for either would re-pay a tree build to save forty seconds.
  # The earlier guess — that these two `cargo run` steps share little because
  # `er-entity-cli` pulls datafusion 52 / arrow 57 and `er-server` pulls
  # duckdb / arrow 58 / aws — is contradicted by that 0m42.
  #
  # REQUIRED status check. It is the entity-framework gate: regenerate every
  # artifact from entities/*.yaml and fail if any committed file (Rust struct,
  # DuckLake/Postgres DDL, query fns) is stale, then plan every statement and run
  # the E0xx passes.
  entities:
    name: entities
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: on a cold cache this builds the bundled
    # duckdb C++ tree plus a second full arrow before it can verify anything.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        # rustfmt is not optional here: `er-entity gen` shells out to it to
        # canonicalise generated output, and this gate compares bytes. It came
        # for free in `lint` (clippy's job installs it); here it must be asked
        # for, or every generated file reads as stale.
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: entity framework verify (stale-output + analyser passes)
        run: cargo run -q -p er-entity-cli -- verify --root ..
      - name: API breaking-change gate (advisory)
        # Rides along here rather than getting its own job, which MEASUREMENT
        # decided and intuition got wrong. In run 39775982197 this step cost
        # 0m42 after `er-entity verify` had already codegen'd the shared
        # dependency tree — against 10m34 in the 42m27 serial run, where nothing
        # before it had produced rlibs. Standalone it would pay that codegen
        # again for a step that is otherwise free, and gain nothing in wall clock
        # because it already runs in parallel with `lint`.
        #
        # PR-only, which the step itself always implied: it diffs against
        # `origin/main`, so on a push to main there is no base and it exits 0
        # having examined nothing. Running it there was ~10 minutes to print
        # nothing.
        #
        # It cannot fail this required job: every stage is `|| true` or
        # `|| exit 0`. It is advisory until the first external org key, after
        # which the release pipeline runs `er-openapi-check --strict`.
        if: github.event_name == 'pull_request'
        # Diff the control-lane OpenAPI document against main's and report breaking
        # component-schema changes (removed schema/field, retype, dropped required).
        run: |
          git -C .. fetch --no-tags --depth=1 origin main || exit 0
          git -C .. show origin/main:frontend/src/lib/api/openapi.json > /tmp/base-openapi.json 2>/dev/null || exit 0
          cargo run -q -p er-server --bin er-openapi-check -- /tmp/base-openapi.json || true
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  # SPLIT in two legs, same measurement-driven shape as the e2e tier below. Run
  # 41461727505 decomposed this job's 10m36 step as 3m11 of build and ~7m of
  # test binaries running one after the other — er-match's `tests/main` alone
  # 264s, er-std's 85s, dedupe-core's 66s. One leg takes er-match, the other
  # takes the rest; the two land near-equal (~4.5m vs ~3m of tests) and the
  # split is complementary BY CONSTRUCTION: `--workspace --exclude er-match`
  # means a new crate's tests default into the `rest` leg, never into no leg.
  # The required context rides `test-gate` below, which carries the old job's
  # exact name.
  test-shard:
    name: test shard (${{ matrix.slice }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A flaky leg can be re-run alone; its sibling's green stands.
      fail-fast: false
      matrix:
        include:
          - slice: er-match
            args: -p er-match
          - slice: rest
            args: --workspace --exclude er-match
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
      # The debug-info settings that used to live here are now
      # `[profile.dev.package."*"]` / `[profile.test]` in `rust/Cargo.toml`, with
      # the measurement. They were job env on this job alone, so `lint`,
      # `ducklake-e2e`, `bench-compile`, `scale-tests` and every laptop paid a
      # 1.9x larger build; the profile gives it to all of them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # `cargo test --workspace` links a separate debug binary per crate, and
        # with bundled duckdb and full debug info that exceeds ubuntu-latest's
        # ~14 GB of free space — the link step then dies with "No space left on
        # device" (which reads as an unrelated `linking with cc failed`).
        # `lint` never links and bench/scale build a `-p`-scoped subset, but
        # `ducklake-e2e` joined this club when the executor added the kube tree
        # and its tests (its cold build died at the libduckdb `ar` step), so it
        # carries the same step. These preinstalled toolchains are unused
        # here and return ~25 GB. Written inline rather than pulling a
        # third-party action, to keep every `uses:` in this workflow SHA-pinned.
        # Headroom, not the fix. Measured: this frees the runner from 86 GB to
        # 111 GB available — and `cargo test --workspace` still exhausted it,
        # which is what sent the search to the debug-info settings now in
        # `rust/Cargo.toml`'s `[profile.dev.package."*"]`. Keep both: the build
        # is large even without C++ symbols.
        # Removing the tool cache is safe for THIS job specifically: it installs
        # Rust with rustup and mold with apt, and the two actions it does use
        # (sccache, rust-cache) are JS, so nothing here reads `setup-*`'s cache.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache
          df -h / | tail -1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Run the test suite
        # `cargo test`, not nextest, and that is a measured choice. nextest runs
        # each test in its own PROCESS; with 586 tests across ~147 binaries that
        # each statically link bundled DuckDB, the spawn-and-load cost dominates
        # whatever the extra overlap buys. A/B on this job, same cache state:
        # cargo 357s vs nextest 453s. nextest wins where tests are few and slow
        # (the Postgres tier), and loses where they are many and fast — which is
        # this job. The way to parallelise here is FEWER, larger test binaries,
        # so cargo's own in-binary threads do the overlapping — and, since the
        # split, a second RUNNER for the one binary that dwarfs the rest.
        # Doctests stay complete across the legs: `-p er-match` runs er-match's,
        # `--exclude er-match` runs everyone else's.
        run: cargo test ${{ matrix.args }}
      - name: Cache DuckDB extensions
        if: matrix.slice == 'rest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - name: Extension loading (splink_udfs) and the engine version label
        # Moved here from the e2e tier: `cargo test --workspace` above already
        # BUILT and ran dedupe-core's one test binary, so re-invoking it with
        # the filter is run-only (~seconds) — where in the e2e rest leg the
        # same step paid its own 2m15s tree build. The env is STEP-scoped on
        # purpose: er-compile and er-sql-check also gate tests behind
        # DEDUPE_E2E_EXTENSIONS, and a job-level env would silently start
        # running those on every PR.
        if: matrix.slice == 'rest'
        env:
          DEDUPE_E2E_EXTENSIONS: "1"
        run: cargo test -p dedupe-core --test main extensions
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why. This job is also where the disk wall
        # shows up, so the `target` size is the number to watch here.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true
          df -h / | tail -1

  # The required status check for the test tier — the same shape, for the same
  # reason, as `ducklake-gate` below and infra.yml's `plan-gate`: a matrix
  # job's per-leg names cannot be required status checks. Carries the old
  # job's exact `name:` so the context "test" kept reporting and branch
  # protection never changed.
  test-gate:
    name: test
    needs: [detect, test-shard]
    # `!cancelled()`: the gate must RUN (and fail) when a leg fails — a gate
    # skipped because its `needs` failed would read to branch protection as
    # satisfied.
    if: ${{ !cancelled() && needs.detect.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every test leg must have succeeded
        # No checkout in this job, so the workflow's `working-directory: rust`
        # default would fail — point the step at the workspace root.
        working-directory: ${{ github.workspace }}
        env:
          # The matrix aggregate: `success` only if every leg succeeded,
          # `failure` if any failed, `skipped` if the whole job was.
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test tier result: $RESULT"
          case "$RESULT" in
            success)
              echo "all test legs succeeded"
              ;;
            skipped)
              # Defensive only: the legs skip exactly when detect says
              # code != 'true', and then this gate is itself skipped.
              echo 'legs reported skipped alongside a running gate'
              ;;
            *)
              echo "::error::a test leg did not succeed (result: $RESULT)"
              exit 1
              ;;
          esac

  security:
    name: cargo-deny (advisories + licenses + bans)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cargo-deny runs in a musl container that pre-installs only the pinned MSRV,
    # not the `channel = "stable"` our rust-toolchain.toml asks for — so rustup
    # refuses `cargo metadata` with "toolchain not installed". cargo-deny never
    # compiles, so pin it to the installed toolchain via RUSTUP_TOOLCHAIN (which
    # overrides the toolchain file) to keep the check evaluating the lockfile.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  # SPLIT in three, and that is a measurement too — the opposite of the one a
  # previous version of this comment recorded against splitting. Run 41461727505
  # (2026-11-02) put this tier at 30m, decomposing as 2m16s of build (sccache on
  # S3 at a 100% hit rate) and then ~22m of test binaries running one after the
  # other: er-cli's lake suite alone 888s, then er-server's 419s. The tree-build
  # cost that once made a split look worse than the job it would improve (the
  # ~18m estimate, from the GHA-cache era) is ~2m now, so a second runner pays
  # ~5m of setup+build to take ~15m off the wall. Three jobs rather than one
  # matrix because the legs genuinely differ: the lake shards need no Postgres
  # service and partition one crate's suite with nextest; the server leg keeps
  # the service, plain `cargo test`, and the extensions step.
  #
  #   lake-e2e       er-cli only, 4 nextest hash partitions, no pg service
  #   ducklake-e2e   three slices: pg a-l, pg m-z (er-server's pg_* suite,
  #                  split at the measured time-midpoint) and rest
  #                  (dedupe-cli + er-entity-diff + er-server non-pg)
  #   ducklake-gate  the required context (see it for why the legs cannot be)
  #
  # The extensions step moved to the `test` tier's rest leg (its binary is
  # already built there); the gate KEEPS the name "DuckLake + extensions e2e"
  # because a job's name is its branch-protection context and renaming one is
  # a protection edit — the name is frozen, the coverage note lives here.
  #
  # nextest here, though the `test` job measured it out (357s -> 453s): that tax
  # is process-per-test on thousands of tiny tests. This suite is 44 tests
  # averaging ~21s (A/B on the old combined job: 15.5m cargo vs 15.2m nextest),
  # and hash partitioning is the thing libtest cannot do — every test lands in
  # exactly one shard by name hash, so a new test is auto-assigned to a shard,
  # never silently dropped, and existing tests do not migrate when one is added.
  #
  # nextest must NOT reach er-server's pg suite: those tests coordinate around
  # the shared service database in-process (er-server/tests/common/mod.rs), and
  # process-per-test would void that. The server leg stays on plain `cargo test`
  # deliberately.
  lake-e2e:
    name: DuckLake e2e shard (${{ matrix.partition }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A flaky leg can be re-run alone; its siblings' green stands.
      fail-fast: false
      matrix:
        # Four, up from three, both times for the same reason: hash
        # partitioning balances counts, not durations. 2-way landed 518s/274s
        # of execution (run 41478579329); 3-way landed legs at 9.8/13.0/12.0m
        # wall (run 41484769012) — the slow tests cluster. nextest has no
        # duration-aware partition, so the lever is more, smaller shards.
        partition: ["1/4", "2/4", "3/4", "4/4"]
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
      # A RUNTIME gate: each lake test early-returns without this (er-cli
      # tests/lake_e2e.rs). A shard that lost this env would go green in
      # seconds — if a shard finishes suspiciously fast, check here first.
      DEDUPE_E2E_DUCKLAKE: "1"
      # No ER_TEST_PG_DSN and no postgres service: er-cli's tests reference
      # neither — the lake catalog is a DuckDB file under a per-test temp dir,
      # which is also what makes nextest's process-per-test safe here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # Same step and same reasoning as `test` (errno 28 masquerading as an
        # `ar` failure). This leg builds only er-cli's targets, so it may not
        # need the headroom — the Build cost step below prints `du`/`df` so
        # that removal can be decided by measurement, not assumption.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache
          df -h / | tail -1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed — see the `test` job's copy for why.
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # PRs assume the READ role — see the server leg's copy for the reasoning.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest
      - name: DuckLake e2e (er-cli, hash partition)
        # No `--test main` restriction: er-cli's lib unit tests partition too,
        # so nothing the old combined job ran is dropped. Doctests are a
        # cargo-test-only concept, and the `test` job runs them workspace-wide.
        run: cargo nextest run -p er-cli --no-fail-fast --partition hash:${{ matrix.partition }}
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why. The `du`/`df` pair is also the
        # input for deciding whether this leg can drop the disk-reclaim step.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true
          df -h / | tail -1

  ducklake-e2e:
    name: DuckLake e2e server (${{ matrix.slice }})
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 45 for the same reason as `lint`: this measured 29 min on a cold cache,
    # one minute inside the old limit. It passed by luck, not by margin.
    timeout-minutes: 45
    strategy:
      # A flaky leg can be re-run alone; its sibling's green stands.
      fail-fast: false
      matrix:
        # Three slices. The pg suite measured 423.8s on one leg (run
        # 41484769012) — the tier's floor — so it splits at the alphabetic
        # midpoint its module START TIMES put near pg_l/pg_m (~216s vs ~208s).
        # The split stays complementary BY CONSTRUCTION: `pg a-l` names the
        # twelve `pg_<letter>` prefix tokens explicitly, and `pg m-z` runs the
        # full `pg_` filter with `--skip` of EXACTLY those twelve tokens — so
        # a new pg_* module lands in one slice or the other by its name, never
        # in neither, and a test matching both boundaries runs exactly once.
        # er-entity-diff's Postgres tests (whose FN names carry no `pg_` —
        # they are `postgres_diff_*`/`the_control_database_*` in the separate
        # pg_diff / pg_reconcile binaries) run UNFILTERED in the rest slice,
        # so no name filter can silently drop them. All slices keep the
        # postgres service: non-pg_ er-server tests (db_per_test and friends)
        # still reach the DSN.
        #
        # The extensions step that used to ride the rest slice now rides the
        # `test` tier's rest leg, where dedupe-core's binary is already built —
        # it was paying a 2m15s tree build here to run 0.5s of tests.
        include:
          - slice: pg a-l
            suite: pg-al
          - slice: pg m-z
            suite: pg-mz
          - slice: rest
            suite: rest
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
      DEDUPE_E2E_DUCKLAKE: "1"
      # No DEDUPE_E2E_EXTENSIONS here any more: the extensions step rides the
      # `test` tier's rest leg now, with the env scoped to that one step.
      # The er-server control-plane queue gate runs against this service.
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk
        # Same step and same reasoning as `test`: this job's build grew past
        # the runner's free space when the executor added the kube tree and
        # er-server's e2e test targets — the cold libduckdb build then died in
        # `ar` with "No space left on device" (errno 28 masquerading as a
        # toolchain error). Safe here for the same reason as on `test`: this
        # job installs Rust with rustup and mold with apt, and reads nothing
        # from `setup-*`'s hostedtoolcache.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache
          df -h / | tail -1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          # Key on the lockfile (the DuckDB version lives there), and fall back to
          # any prior extensions cache so a dependency change restores the already
          # downloaded extensions instead of re-fetching them cold under the job
          # timeout.
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - name: er-server pg suite, modules a-l
        if: matrix.suite == 'pg-al'
        # The twelve prefix tokens are OR'd substring filters; `--test main`
        # selects only the consolidated integration binary. A test matching a
        # token runs here and is `--skip`ped in the m-z slice, so the pair is
        # exactly-once by construction. Keep this token list and the skip list
        # below BYTE-IDENTICAL — they are the same twelve strings.
        #
        # The tokens sit AFTER `--`: cargo's own CLI takes at most ONE
        # positional TESTNAME ("error: unexpected argument 'pg_b' found");
        # multiple OR'd filters are a libtest feature, so they must be passed
        # through to the harness.
        run: >
          cargo test -p er-server --test main --
          pg_a pg_b pg_c pg_d pg_e pg_f pg_g pg_h pg_i pg_j pg_k pg_l
      - name: er-server pg suite, modules m-z
        if: matrix.suite == 'pg-mz'
        # The complement: everything matching `pg_` except the a-l tokens. A
        # NEW pg_* module lands here unless its name starts with one of the
        # twelve prefixes — in neither-slice is impossible while the two lists
        # match.
        run: >
          cargo test -p er-server --test main pg_ --
          --skip pg_a --skip pg_b --skip pg_c --skip pg_d --skip pg_e
          --skip pg_f --skip pg_g --skip pg_h --skip pg_i --skip pg_j
          --skip pg_k --skip pg_l
      - name: everything else (rest slice)
        if: matrix.suite == 'rest'
        # Two invocations: dedupe-cli + er-entity-diff run UNFILTERED (their
        # Postgres tests live in separate binaries with non-pg_ fn names, so a
        # name filter could silently drop them); er-server's remaining targets
        # (lib + bin unittests + the non-pg_ integration tests) run with the
        # complementary skip.
        run: |
          cargo test -p dedupe-cli -p er-entity-diff
          cargo test -p er-server -- --skip pg_
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why. The `du`/`df` pair is also the
        # input for deciding whether a leg can drop the disk-reclaim step.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true
          df -h / | tail -1

  # The required status check for the e2e tier. The GitHub behaviour forcing
  # this shape is stated in full above infra.yml's `plan-gate`, which this
  # copies: A MATRIX JOB'S PER-LEG NAMES CANNOT BE REQUIRED STATUS CHECKS.
  # When `lake-e2e` is skipped by its `if:`, GitHub reports a single check-run
  # under the literal, uninterpolated name `DuckLake e2e shard (${{ matrix.partition }})`,
  # so per-leg contexts never report on a PR that skips the tier — and a
  # required context that never reports blocks the PR forever (learned on #359).
  #
  # This job carries the EXACT `name:` the old combined job had, so the split
  # needed no branch-protection edit: the context "DuckLake + extensions e2e"
  # kept reporting without interruption, just from a different job id.
  ducklake-gate:
    name: DuckLake + extensions e2e
    needs: [detect, lake-e2e, ducklake-e2e]
    # `!cancelled()`: the gate must RUN (and fail) when a leg fails — a gate
    # skipped because its `needs` failed would read to branch protection as
    # satisfied, which is the exact false-green this job exists to prevent.
    if: ${{ !cancelled() && needs.detect.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every e2e leg must have succeeded
        # No checkout in this job, so the workflow's `working-directory: rust`
        # default would fail — point the step at the (empty) workspace root.
        working-directory: ${{ github.workspace }}
        env:
          # For the matrix job this is the aggregate: `success` only if every
          # leg succeeded, `failure` if any failed, `skipped` if the whole job
          # was.
          SHARDS: ${{ needs.lake-e2e.result }}
          SERVER: ${{ needs.ducklake-e2e.result }}
        run: |
          echo "lake shards: $SHARDS; server leg: $SERVER"
          for r in "$SHARDS" "$SERVER"; do
            case "$r" in
              success) ;;
              skipped)
                # Defensive only: the legs skip exactly when detect says
                # code != 'true', and then this gate is itself skipped. If a
                # leg was skipped while the gate runs, detect gated it.
                echo 'a leg reported skipped alongside a running gate'
                ;;
              *)
                echo "::error::a DuckLake e2e leg did not succeed (result: $r)"
                exit 1
                ;;
            esac
          done

  # --- heavy perf jobs: main + nightly only (skipped on PRs for latency) ---

  bench-compile:
    name: benchmarks (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo bench -p dedupe-core --no-run
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  scale-tests:
    name: scale golden (50k)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # OIDC exchange for the sccache S3 role
    env:
      RUSTC_WRAPPER: sccache
      DEDUPE_SCALE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install mold
        # Retried and time-boxed, because this is an unpinned network dependency
        # on the critical path of six jobs. Observed hanging for 20+ minutes on
        # two consecutive attempts on 2026-10-22 — and on a required job a hang
        # is not a failure, it is the 45-minute job timeout, which reads as a
        # non-green check even though every gate passed. `timeout` bounds each
        # attempt so a stuck mirror is retried rather than waited on; the step
        # cap is sized to let all three attempts run (3 x 2 x 120s = 12 min).
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y mold; then
              exit 0
            fi
            echo "mold install attempt $i failed or timed out; retrying"
            sleep 5
          done
          exit 1
      # Pushes on main assume the WRITE role; everything else (PRs) the READ
      # role. A PR that could write the cache would be a path for a branch to
      # plant object code a later main build consumes, and poisoning outlives
      # the credential that planted it. The repository is private, so that needs
      # a collaborator rather than anyone at all — narrower, not closed.
      # The read role still gives PRs the dependency tree, which
      # is nearly all the value. See sccache.tf for the full reasoning and for
      # the measurement showing a denied write is a counted miss, not a failure.
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::797781631727:role/er-ci-sccache-write' || 'arn:aws:iam::797781631727:role/er-ci-sccache-read' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      # No rust-cache. A restored `target/` carries a populated
      # `duckdb-sources/<key>/` with its `.complete` sentinel stripped, so
      # `libduckdb-sys` tries to `fs::rename` a fresh unpack over it and gets
      # ENOTEMPTY — `DirectoryNotEmpty`, on every restoring job. Re-keying does
      # not fix that: v2 was restored `full match: true` and failed
      # identically. NB the panic text blames the unpack; the failing syscall
      # is the publish rename. The `coverage` job keeps rust-cache and repairs
      # the tree instead — its step carries the full mechanism. See also this
      # file's header.
      - run: cargo test -p dedupe-core --test main golden_historical_50k
      - name: Build cost (sccache stats, target size)
        # See the `lint` job's copy for why.
        if: always()
        run: |
          sccache --show-stats || true
          du -sh target || true

  # --- coverage: nightly + on-demand only (never on PRs or main pushes) ---
  #
  # Measures line coverage with cargo-llvm-cov over the default + DuckLake/PG
  # e2e paths (the 50k scale test stays off). `--fail-under-lines` is the
  # non-regression floor: ratchet it UP as coverage grows, never down. It is a
  # backstop against regressions — the primary quality gate is the behavioral
  # tests the other jobs run. No sccache/mold here: llvm-cov owns RUSTFLAGS for
  # instrumentation and instrumented builds don't cache usefully; nightly
  # latency is not a concern.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      RUSTFLAGS: ""
      DEDUPE_E2E_DUCKLAKE: "1"
      DEDUPE_E2E_EXTENSIONS: "1"
      ER_TEST_PG_DSN: "host=localhost port=5432 user=er password=er dbname=er"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: er
          POSTGRES_PASSWORD: er
          POSTGRES_DB: er
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          shared-key: coverage
          # Keyed to include a hash of Cargo.toml, which rust-cache does not
          # hash by default — see the `lint` job for the stale-entry failure that
          # cost. Keep these identical across jobs or they stop sharing.
          prefix-key: "v2-rust"
          key: ${{ hashFiles('rust/Cargo.toml') }}
          # This key KEEPS its writer, unlike the four restore-only jobs above,
          # and the reasoning is worth recording because the opposite looks
          # obviously right: the entry held 1,885 MiB, 19% of the repository's
          # whole 10 GB budget, for a job that runs nightly and is not required.
          #
          # Dropping it would make this job permanently cold, and the `llvm-cov`
          # step already measures 22m10 WARM against a 60-minute timeout. An
          # instrumented cold build has no cache to fall back on — llvm-cov owns
          # RUSTFLAGS, so every unit including dependencies rebuilds, and the
          # `shared-key: rust` entry cannot substitute. That trades 1.8 GiB for a
          # timeout failure.
          #
          # It also is not necessary. `[profile.test]` inherits
          # `[profile.dev.package."*"] debug = false` from rust/Cargo.toml, so
          # this entry shrinks on its own — the bulk of it was the ~1.5 GB duckdb
          # rlib. The single-writer rule, the nightly sccache cap and that shrink
          # free enough on their own; check the real number here before
          # considering anything more aggressive.
      - name: Repair the restored libduckdb-sys source tree
        # #424 cured the eight compile jobs by DELETING rust-cache. This job is
        # the one that keeps it — for the reasons directly above — so it is the
        # one place the poisoning survives, and it needs the repair instead.
        #
        # The mechanism, from the crate source rather than the symptom.
        # `libduckdb-sys` does not unpack into `OUT_DIR`: `src/build_paths.rs:40`
        # walks UP from it to a tree shared across the whole target dir,
        # `target/duckdb-sources/<key>/`, guarded by a `.complete` DOTFILE.
        # Present, the build script returns early. Absent, it unpacks into a
        # fresh staging dir and `fs::rename`s that over `<key>/` — and renaming
        # onto a non-empty directory is ENOTEMPTY, which is Linux errno 39:
        #
        #   unpacking bundled DuckDB sources: Os { code: 39, kind: DirectoryNotEmpty }
        #
        # That panic message names the wrong operation. `fs::rename` in
        # `publish()` is the ONLY syscall in that function that can return 39 —
        # the staging dir is uniquely minted, so `archive.unpack` cannot — and
        # the `?` carries it to an `.expect("unpacking bundled DuckDB sources")`
        # at `build_bundled_cc.rs:65`. Reading that string as the location is
        # what sent two earlier fixes at `OUT_DIR`, where they verifiably
        # deleted `.o` files while the panic happened anyway.
        #
        # So the poisoned state is a POPULATED `<key>/` with NO `.complete`,
        # which is what a rust-cache save/restore round-trip leaves behind. The
        # repair cannot go before the save — rust-cache writes in its POST-step,
        # after every step this workflow can declare — so after the restore is
        # the only place it can go.
        #
        # Dated prediction this step exists to stop: #376 bumped duckdb at
        # 01:07 on 2026-11-03, after that day's nightly. The next scheduled run
        # therefore gets a NEW `<key>`, unpacks cleanly, passes, and SAVES the
        # stripped tree; the run after that restores it and dies before a test.
        # Breakage never lands on the run that caused it.
        #
        # The test below is exactly the build script's own precondition, so an
        # intact tree is left alone and keeps the fast path. Dropping one costs
        # the tarball unpack (seconds), not the compile (minutes) — the C++
        # objects come from sccache. It echoes per tree because both earlier
        # fixes went GREEN having done nothing: "it ran" and "it did something"
        # have to be distinguishable in the log.
        run: |
          shopt -s nullglob
          trees=(target/duckdb-sources/*/)
          if [ ${#trees[@]} -eq 0 ]; then
            echo "none     target/duckdb-sources/ absent - build script unpacks cold"
          fi
          for tree in "${trees[@]}"; do
            if [ -f "$tree.complete" ]; then
              echo "intact   $tree"
            else
              echo "REPAIRED $tree (no .complete - would panic ENOTEMPTY)"
              rm -rf "$tree"
            fi
          done
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - name: Cache DuckDB extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            duckdb-extensions-
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 45

  # --- cache hygiene: nightly + on-demand only ---
  #
  # GitHub allows 10 GB of Actions cache per repository and evicts LRU past it.
  # sccache's GHA backend writes ONE ENTRY PER COMPILATION OBJECT and nothing
  # caps it, so it grows without bound — measured at ~2,706 entries and 4,410 MiB,
  # 99% of the repository's entries and 44% of its bytes. At that size the
  # repository sat at the ceiling (10,653,007,178 bytes across 2,594 entries) and
  # GitHub evicted the largest LRU victim, which is the ~1.5 GB `shared-key: rust`
  # entry that five compile jobs restore from. So sccache was evicting the cache
  # it was added to complement, and the cost was a 42m27 `lint` instead of 14m15.
  #
  # Pruning OLDEST-ACCESSED-FIRST rather than by prefix is deliberate: an sccache
  # entry is content-addressed, so an old one is still a valid hit if that crate
  # version comes back, and the least-recently-accessed ones are the versions the
  # lockfile has already moved past. Deleting the whole prefix would throw away
  # the thing sccache is uniquely good at — surviving a `Cargo.lock` change, which
  # rust-cache cannot do at all.
  #
  # Kept as its own job, never a step on a required one: cache hygiene must not
  # be able to fail a merge.
  cache-prune:
    name: prune the Actions cache to budget
    runs-on: ubuntu-latest
    # 30, not 15: listing ~5,600 entries over 56 paginated requests and then
    # deleting thousands of them is minutes of pure API round trips even eight at
    # a time. The first version ran sequentially and did not finish in ten.
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      # Deleting a cache entry needs write; nothing else here does.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # sccache's share of the 10 GB budget. Deliberately GENEROUS, and the first
      # guess here (2048) was wrong in a way worth recording.
      #
      # sccache turns out to be the PRIMARY cache for this workspace, not a
      # backstop for rust-cache. Run 39783867347 logged `No cache found.` for
      # rust-cache in both compile jobs — a total miss — and still finished the
      # whole workflow in 8m03, because sccache hit 96.65% and 97.54% (and 98%
      # on C/C++, so it is caching the bundled DuckDB compile too). clippy came
      # in at 2m02 with no rust-cache at all.
      #
      # So this budget is not "sccache's slice". It is "what is left after the
      # caches that cannot share", and it should be as large as that allows:
      # a fresh `v1-rust` entry, `coverage`'s entry, the buildkit blobs from
      # images.yml (~1 GB, also uncapped), the pnpm store, the Next cache and the
      # DuckDB extensions come to roughly 3.5 GB. Pruning below that line deletes
      # entries that are each a future compile.
      #
      # The prune still exists, because unbounded growth is what evicted
      # rust-cache in the first place. But the real fix is to take sccache out of
      # this 10 GB budget entirely — see the build-cost reference's S3 section,
      # which this measurement promotes from contingency to the obvious next step.
      #
      # MEASURED 2026-10-22, run 39838150331 — the first real run of this job.
      # It printed the accounting below and then correctly deleted NOTHING,
      # because sccache was 3,341 MiB against this 5,120 budget while the
      # repository sat at 10,696,640,978 bytes:
      #
      #     sccache        4682 entries  3341.1 MiB
      #     buildkit-blob   ~70 entries  ~5000 MiB   <- four entries at 763.8 MiB
      #     v1-rust-rust       2 entries   364.1 MiB each
      #
      # So capping sccache alone made this job a no-op while `images.yml`'s
      # `type=gha,mode=max` layer cache held half the budget and kept evicting
      # the entries that make CI fast. BUDGETS below is therefore a list, not a
      # single number: each prefix is capped independently, oldest-accessed
      # first.
      #
      # That measurement is also why this job SURVIVED the sccache move to S3.
      # sccache no longer writes here at all, so its 3,341 MiB line is now
      # always zero and its budget is vestigial — kept only so a rollback to the
      # GHA backend does not silently uncap it. buildkit — the producer that
      # was doing the damage all along — moved to ECR too (er-buildcache;
      # images.yml `cache-to: type=registry`), so BOTH budgets are now
      # rollback insurance rather than live caps. images.yml keeps a
      # transitional `type=gha` cache-FROM, which only reads; once that line
      # is dropped this whole job's remaining value is the enumeration it
      # prints, and retiring it becomes a fair question.
      #
      # What is deliberately NOT capped: `v1-rust*` (two ~364 MiB entries,
      # the thing all of this protects), `pnpm-store`, `next-build` and
      # `duckdb-extensions` — all small, all load-bearing, none growing without
      # bound. Only the two unbounded producers are listed.
      BUDGETS: |
        sccache 5120
        buildkit-blob 2048
      # Upper bound on deletions per run, so one night's work is bounded no
      # matter how large the backlog. It converges over successive runs, and
      # reports when it stops short rather than looking finished.
      MAX_DELETES: "4000"
    steps:
      - name: Prune
        # No checkout, so step off the workflow's `rust` working-directory
        # default, which would not exist.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Totals by ENUMERATION, not from `actions/cache/usage`. That
          # endpoint is a lagging aggregate: measured 2026-10-22 immediately
          # after this job deleted 29 entries worth ~2.7 GiB, it returned the
          # identical byte count on three reads 45s apart while the enumerated
          # sum tracked live writes —
          #
          #     reported 10.02 GiB   enumerated 7.27 GiB   delta 2.75 GiB
          #     reported 10.02 GiB   enumerated 7.33 GiB   delta 2.69 GiB
          #     reported 10.02 GiB   enumerated 7.28 GiB   delta 2.74 GiB
          #
          # i.e. the delta was exactly what had been deleted. Reporting from it
          # would print an unchanged before/after and make a working prune look
          # like a no-op — a hygiene job whose only output lies about its own
          # effect. The enumeration costs one extra paginated sweep.
          report() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
              --jq '.actions_caches[].size_in_bytes' |
              awk '{s+=$1; n++}
                   END {printf "%d entries, %d bytes (%.2f GiB enumerated)\n", n, s, s/1073741824}'
          }

          echo "::group::before"
          echo "total: $(report)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.size_in_bytes)\t\(.key | split("/")[0])"' |
            awk -F'\t' '{c[$2]++; s[$2]+=$1}
                        END {for (k in c) printf "%7d entries %9.1f MiB  %s\n", c[k], s[k]/1048576, k}' |
            sort -k3 -rn
          echo "::endgroup::"

          # One pass per capped prefix. Each is independent: a prefix already
          # under budget contributes no deletions, which is the correct no-op.
          grand_deleted=0
          while read -r prefix budget_mib; do
            [ -n "$prefix" ] || continue

            entries=$(mktemp)
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=$prefix&sort=last_accessed_at&direction=asc" \
              --jq '.actions_caches[] | "\(.id)\t\(.size_in_bytes)"' >"$entries"

            total=$(awk -F'\t' '{s+=$2} END {print s+0}' "$entries")
            budget=$((budget_mib * 1048576))
            printf '%s: %d entries, %d MiB (budget %d MiB)\n' \
              "$prefix" "$(wc -l <"$entries")" "$((total / 1048576))" "$budget_mib"

            if [ "$total" -le "$budget" ]; then
              echo "  under budget; nothing to do"
              continue
            fi

            # Choose the victims in one pass, then delete them CONCURRENTLY. A
            # sequential loop is what the first version did and it does not fit
            # in any sane timeout: one DELETE is a separate HTTPS round trip
            # (~150 ms) and the backlog was 5,595 entries / 5,846 MiB, i.e.
            # ~3,400 deletions. Measured: it ran past 10 minutes having cleared
            # only part of it. `xargs -P 8` does 1,586 in 2m00.
            #
            # MAX_DELETES bounds a single run so the job cannot become unbounded
            # work if a backlog is ever huge; it converges over successive runs
            # instead. Anything dropped is reported, never silent.
            remaining_cap=$((MAX_DELETES - grand_deleted))
            if [ "$remaining_cap" -le 0 ]; then
              printf '  deletion cap %d already spent; the next run continues here\n' "$MAX_DELETES"
              continue
            fi

            doomed=$(mktemp)
            awk -F'\t' -v budget="$budget" -v total="$total" -v cap="$remaining_cap" '
              total <= budget { exit }
              NR > cap        { exit }
              { print $1; total -= $2 }
            ' "$entries" >"$doomed"
            want=$(wc -l <"$doomed")
            printf '  deleting %d oldest-accessed entries (cap %d remaining)\n' "$want" "$remaining_cap"

            # `|| true` per delete: a concurrent run may have evicted it
            # already, which is not a failure. xargs would otherwise exit 123
            # and, under `set -e`, fail a job whose whole point is hygiene.
            export GITHUB_REPOSITORY
            xargs -r -P 8 -I{} sh -c \
              'gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/{}" --silent 2>/dev/null || true' \
              <"$doomed"

            grand_deleted=$((grand_deleted + want))
            if [ "$want" -ge "$remaining_cap" ]; then
              printf '  hit the deletion cap with %s still over budget; the next run continues\n' "$prefix"
            fi
          done <<<"$BUDGETS"

          printf 'deleted %d entries in total\n' "$grand_deleted"
          echo "total: $(report)"
