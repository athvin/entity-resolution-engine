name: marketing preview cleanup

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Closed PR number whose previews should be removed'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: marketing-preview-cleanup-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: remove closed PR previews
    if: >-
      vars.MARKETING_PREVIEW_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: marketing-preview
    steps:
      # pull_request_target is credentialed: NEVER check out the PR's head or
      # merge ref. The helper always comes from the trusted default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/marketing-preview-lifecycle.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Wait for in-flight previews, delete this PR's deployments, update its comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: node scripts/ci/marketing-preview-lifecycle.mjs cleanup
