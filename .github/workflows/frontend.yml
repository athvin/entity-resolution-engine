# The frontend's CI gate. The backend (Rust) is gated by rust.yml; this is the
# equivalent gate for the Next.js app under frontend/, so a merge to main is
# known to lint, type-check, unit-test, build, pass the Playwright functional
# tier, and carry no known-vulnerable or wrongly-licensed dependency.
#
# WHY THERE IS NO `paths:` FILTER. These jobs are REQUIRED status checks. A
# workflow that a path filter skips never reports at all, which leaves a required
# check "pending" forever and blocks every backend-only PR. So, exactly as
# rust.yml does for its `.claude/**` skip, a `detect` job computes whether the PR
# touches the frontend and the real jobs gate on it with `if:`. A job skipped by
# `if:` reports a "skipped" conclusion, which branch protection accepts as
# satisfied — so a Rust-only PR stays mergeable at zero compute.
#
# The jobs:
#   - check:   eslint + prettier + tsc + vitest (with coverage floor) + the
#              generated-API drift gate, on the plain runner.
#   - e2e:     the fast Playwright tier (mock-erserver + PGlite, all three device
#              projects, incl. the @visual baselines). It runs INSIDE the pinned
#              Playwright image v1.63.0-jammy so the browsers are preinstalled
#              and, crucially, the visual snapshots compare against the same
#              font-rendering environment the committed baselines were generated
#              in (scripts/frontend-dev/update-baselines.sh uses this exact image).
#   - audit:   the frontend's cargo-deny equivalent — advisories + licenses.
#   - semgrep: static analysis for the BFF's own risk classes.
#
# The heavy full-stack e2e tier (playwright.e2e.config.ts, real backend) stays
# out of CI, and is dormant besides — see docs/frontend-testing.md. Action refs
# are SHA-pinned with a `# vTAG` comment, per repo policy.
name: frontend

on:
  pull_request:
  # Merge-queue wiring, which NOTHING CONSUMES TODAY (see rust.yml's trigger
  # block for why the queue cannot be enabled here, and `merge-bus.yml` for the
  # substitute that actually proves a combination). Kept so a queue, if one ever
  # existed, would not stall on a workflow missing `merge_group:`. `detect`
  # applies its usual path filter to the queue's own base...head but never
  # consults the content-addressed pass markers.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Nightly coverage at 07:00 UTC (matches rust.yml).
    - cron: "0 7 * * *"
  workflow_dispatch:
    # On-demand trigger for the nightly-only coverage job.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  # Did this change touch the frontend? The required jobs below gate on this, so
  # a backend-only PR skips them (a skipped required check still satisfies branch
  # protection).
  #
  # Pushes to main are filtered the same way, unlike rust.yml, which always runs
  # on main. The difference is deliberate: rust.yml IS the gate protecting main,
  # so it must never self-skip there, whereas this workflow's main run only ever
  # re-tests what the just-merged PR already tested — the squash commit and the
  # PR head are near-identical trees. Running the Playwright container again for
  # a Rust-only merge cost ~5 minutes and proved nothing. Nightly and manual runs
  # still always report `true`.
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      pass_key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci/frontend-detect.sh
      # CONTENT-ADDRESSED SKIP. A PR whose tested tree is byte-identical, over
      # every path this gate reads, to a tree that already went green on THIS PR
      # skips the gate. That is the common rebase: main moved under the PR but
      # only through paths this gate does not read (or not at all), so the
      # re-run would prove the same thing twice. It also covers re-pushing the
      # same content with reworded or squashed commits.
      #
      # The key is computed from the checked-out merge commit — the tree the
      # jobs below actually test — not from the PR head, so a moved base whose
      # change DOES reach a gated path changes the key and the gate runs.
      #
      # Why this is safe to trust:
      #   - Markers are written only by `record-pass` on a `pull_request` run,
      #     after every required job succeeded. Actions caches written from a
      #     PR are scoped to that PR's ref, so a PR can only ever skip on a
      #     result it produced itself — no PR can plant a marker for another.
      #   - The ISO week is part of the key, bounding the floating inputs the
      #     tree cannot see (stable rustc via rust-toolchain.toml, DuckDB
      #     extension downloads, advisory databases) to at most a week.
      #   - `merge_group` and `push` never consult markers. With no merge queue
      #     enabled (see the trigger block), nothing re-proves a skip BEFORE it
      #     lands — the push-to-main run does, consulting no marker. So a
      #     PR-level skip can let a finding reach main, but cannot keep it
      #     hidden there.
      # Bypass with the `ci:full` label (or a workflow re-run after removing a
      # marker) when you want the full gate regardless.
      - id: key
        if: github.event_name == 'pull_request' && steps.filter.outputs.frontend == 'true' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Exactly the paths the filter above treats as this gate's inputs —
          # the same sourced regex, so a change the filter would ignore cannot
          # change the key and vice versa.
          . scripts/ci/frontend-paths.sh
          include="$FRONTEND_INCLUDE"
          exempt=''

          tree="$(git ls-tree -r HEAD | awk -F'\t' -v re="$include" '$2 ~ re' | awk -F'\t' -v re="$exempt" 're == "" || $2 !~ re')"
          printf 'keyed paths: %s\n' "$(printf '%s\n' "$tree" | wc -l)"
          hash="$( { printf '%s\n' "$tree"; date -u +%G-W%V; } | sha256sum | cut -c1-40)"
          echo "key=ci-pass-frontend-$hash" >> "$GITHUB_OUTPUT"
      - id: lookup
        if: steps.key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - id: decide
        working-directory: ${{ github.workspace }}
        env:
          RAN: ${{ steps.filter.outputs.frontend }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          if [ "$RAN" = "true" ] && [ "$HIT" = "true" ]; then
            echo "::notice::frontend gate skipped: this exact content already passed on this PR ($KEY)"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=$RAN" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: lint + types + unit
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      # Cached explicitly rather than via setup-node's `cache: pnpm`, which
      # resolves the store path before corepack has installed the pinned pnpm.
      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # frontend/README.md promises "CI fails on drift" for the generated
      # erserver types. openapi.json is produced by the Rust side and committed;
      # this asserts the checked-in schema.d.ts is what openapi-typescript emits
      # from it, so a stale binding cannot reach main.
      - name: Generated API types are not stale
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

  # SHARDED BY ENGINE, at --workers=2 everywhere — every number here is
  # measured, not guessed. The suite ran 579 tests on ONE worker (Playwright's
  # CI default) for 15.9m of serial execution (run 41461727537); shards fixed
  # the wall, and THIRTY full-suite --workers=2 runs in
  # frontend-experiments.yml then earned the worker bump in two steps:
  #
  #   - the chromium projects (desktop-chromium, mobile-chrome) never failed
  #     once across all thirty runs;
  #   - every failure in the first twenty was mobile-safari — webkit emulation
  #     is the slowest engine, and pre-hydration interaction under its
  #     slowness is where the React 19 value-tracker deadlock lived
  #     (helpers.ts hydratedFill, PRs #400/#404). After that fix, ten of ten
  #     consecutive runs went green with @visual included — the flip protocol
  #     this comment used to defer to, satisfied.
  #
  # Both webServers (mock erserver, `next start` + in-memory PGlite) are
  # shared mutable state across workers, which is why the worker count was
  # evidence-gated at all. The nightly experiment keeps running as the
  # regression watchdog for exactly that class.
  #
  # The per-leg names can never be required checks (see `e2e-gate` below); the
  # required context rides the gate.
  e2e:
    name: playwright e2e (${{ matrix.leg }})
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A flaky leg can be re-run alone; its siblings' green stands.
      fail-fast: false
      matrix:
        include:
          # `slug` exists because upload-artifact v4 forbids `/` in names.
          - leg: chromium 1/2
            slug: chromium-1
            args: --project=desktop-chromium --project=mobile-chrome --shard=1/2 --workers=2
          - leg: chromium 2/2
            slug: chromium-2
            args: --project=desktop-chromium --project=mobile-chrome --shard=2/2 --workers=2
          # webkit in halves: its emulation runs ~2x slower per test than
          # chromium (7.5m for all 193 at two workers, measured on this PR's
          # own first run), so one webkit leg would be the tier's 9m pole
          # while the chromium legs finish in ~5m.
          - leg: webkit 1/2
            slug: webkit-1
            args: --project=mobile-safari --shard=1/2 --workers=2
          - leg: webkit 2/2
            slug: webkit-2
            args: --project=mobile-safari --shard=2/2 --workers=2
    # The same image the committed visual baselines were rendered in; browsers
    # are preinstalled, so there is no `playwright install` step.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      # Next's build cache. Keyed on sources so an unchanged tree restores a warm
      # cache; the lockfile-only prefix still helps when only sources moved.
      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-build-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            next-build-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # CI=true (set by Actions) makes playwright.config.ts take the `next start`
      # branch, so we build explicitly first; `next start` then serves `.next/`.
      - run: pnpm build
      - run: pnpm test:e2e ${{ matrix.args }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Suffixed per shard: upload-artifact v4 hard-fails on a duplicate
          # name, and two shards can fail in one run. Each report is
          # self-contained for its shard's tests — no merge step needed for
          # the only thing this is used for (reading a failure).
          name: playwright-report-${{ matrix.slug }}
          path: frontend/playwright-report/
          retention-days: 7

  # The required status check for the playwright tier. The GitHub behaviour
  # forcing this shape is stated in full above infra.yml's `plan-gate`, which
  # this copies: A MATRIX JOB'S PER-LEG NAMES CANNOT BE REQUIRED STATUS CHECKS —
  # a skipped matrix reports one check-run under the literal, uninterpolated
  # `playwright e2e (shard ${{ matrix.shard }}/3)`, so per-leg contexts never
  # report on a PR that skips the tier, and a required context that never
  # reports blocks the PR forever.
  #
  # This job carries the EXACT `name:` the old single job had, so the split
  # needed no branch-protection edit: the context "playwright functional tier"
  # kept reporting without interruption, just from a different job id.
  e2e-gate:
    name: playwright functional tier
    needs: [detect, e2e]
    # `!cancelled()`: the gate must RUN (and fail) when a shard fails — a gate
    # skipped because its `needs` failed would read to branch protection as
    # satisfied.
    if: ${{ !cancelled() && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout only to have scripts/ci/ on disk — the gate reads no code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every shard must have succeeded
        working-directory: ${{ github.workspace }}
        env:
          # For the matrix job this is the aggregate: `success` only if every
          # shard succeeded, `failure` if any failed, `skipped` if the whole
          # job was.
          GATE_LEGS: |
            e2e=${{ needs.e2e.result }}
        run: bash scripts/ci/gate-all-legs.sh

  # The ONLY job here that loads postgres.js. Every other tier — the unit files
  # and both Playwright webServers — points ERWEB_DATABASE_URL at
  # `pglite://memory`, so `db()` takes its PGlite branch and the real driver is
  # never constructed. The consequence was measured, not theorised: the
  # postgres 3.4.9 -> 4.0.0 major (#378) passed all eight required contexts
  # without the driver being executed once, and was verified by hand instead.
  #
  # This closes that specific hole and nothing more. It is a driver contract,
  # not a second unit tier: five cases over the types v4's `infer: false`
  # change can actually reach (boolean, Buffer/bytea, jsonb, Date/timestamptz),
  # plus a transaction commit/rollback pair and the migrator. `bytea` is the
  # consequential one — `org_credentials` holds each tenant's sealed erserver
  # key, so a driver that mangles it loses tenant access rather than failing a
  # test.
  #
  # Deliberately NOT the full-stack tier (playwright.e2e.config.ts), which
  # needs the Rust backend and stays a release gate. A Postgres service and a
  # 10-second vitest run is the cheapest thing that makes the next driver bump
  # a gated change rather than a hand-verified one.
  #
  # `pnpm db:migrate` is a precondition AND part of the contract: only the
  # PGlite branch applies migrations itself, and the migrator is what exercises
  # `client.begin()` and the DDL path.
  driver:
    name: postgres.js driver contract
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # 17 to match the frontend dev stack's control-plane container; the
        # driver contract is not version-sensitive, but drifting from what
        # developers run locally would make a failure here hard to reproduce.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: er
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ERWEB_DATABASE_URL: postgresql://postgres:er@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations (the postgres.js branch does not)
        run: pnpm db:migrate
      # vitest.driver.config.ts pins `environment: node`, which is
      # load-bearing: postgres v4 detects binary with `x instanceof
      # Uint8Array`, and under jsdom a Node Buffer fails that against jsdom's
      # realm, so bytea is sent as text and rejected `22P02`. Observed both
      # ways before this job was trusted — jsdom fails exactly the vault case,
      # node passes 5/5.
      - run: pnpm test:driver

  # The frontend's mirror of rust.yml's `cargo-deny (advisories + licenses +
  # bans)`. `pnpm audit` is the advisories half; scripts/check-licenses.mjs is
  # the licenses half, against the same permissive allowlist rust/deny.toml uses.
  # Exceptions live in frontend/audit-allow.json and follow deny.toml's house
  # convention: a prose justification per entry naming why it cannot reach us.
  audit:
    name: pnpm audit + licenses
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The full advisory picture, including the low/moderate rows the gate
      # tolerates — informational, never fails the job.
      - name: Advisory report (all severities)
        run: pnpm audit || true
      - name: Advisories gate (high + critical)
        run: node scripts/check-audit.mjs
      - name: Licenses gate
        run: node scripts/check-licenses.mjs

  # Static analysis for the sink classes typescript-eslint does not model: HTML
  # injection, dynamic code evaluation, and NEXT_PUBLIC_* leakage. Semgrep is
  # installed with pip at a pinned version rather than via its action, for the
  # same reason rust.yml installs rustup by hand — the repo requires every
  # `uses:` to carry an `@<sha> # vTAG` pin.
  #
  # The BFF authorization invariant is NOT checked here: see the note at the top
  # of frontend/.semgrep.yml. It is `pnpm authz:check`, inside the `check` job.
  #
  # Registry packs are fetched over the network, so until this has proven stable
  # it is deliberately NOT in the required-contexts set; the local ruleset is the
  # part that cannot flake. See docs/frontend-testing.md.
  semgrep:
    name: semgrep (static analysis)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install semgrep
        run: pip install --quiet semgrep==1.181.0
      - name: Local ruleset (BFF-specific; no network)
        run: semgrep scan --config .semgrep.yml --error --metrics=off .
      - name: Registry packs (typescript + react + nodejs)
        run: |
          semgrep scan --config p/typescript --config p/react --config p/nodejs \
            --error --metrics=off --exclude src/lib/entities --exclude src/lib/api/schema.d.ts .

  # Nightly + on-demand only. The coverage FLOOR is enforced on every PR by
  # `pnpm check` (vitest.config.ts `coverage.thresholds`); this job exists to
  # publish the browsable HTML report as an artifact.
  coverage:
    name: coverage (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # Writes the content-addressed pass marker `detect` looks up. Runs only on a
  # PR, only when the gate actually ran (not when it was itself skipped by a
  # marker or by the path filter), and only when every required job succeeded.
  # Not a required check, and it cannot fail a merge: a failed save just means
  # the next identical run does the work again.
  record-pass:
    name: record pass marker
    needs: [detect, check, e2e-gate, audit, semgrep]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.detect.outputs.frontend == 'true'
      && needs.detect.outputs.pass_key != ''
      && needs.check.result == 'success' && needs.e2e-gate.result == 'success' && needs.audit.result == 'success' && needs.semgrep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - working-directory: ${{ github.workspace }}
        run: echo "${{ github.sha }}" > .ci-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.detect.outputs.pass_key }}
