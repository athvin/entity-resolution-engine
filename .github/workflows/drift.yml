# Out-of-band drift detection — the cost of `infra.yml`'s `-refresh=false`,
# paid back on a schedule.
#
# WHY THIS EXISTS. infrastructure.md §14.2 gives up one thing deliberately: the
# plan tier runs `-refresh=false`, because `er-ci-tf-plan` is assumable from any
# PR branch and a refreshing plan reads secret values. What that loses is drift —
# a console edit, a manual fix during an incident, an AWS-side default that
# moved. Today the only thing that notices is the next `apply` on `main`, which
# refreshes fully and then silently reconciles it. So drift is invisible until
# some unrelated infra PR merges and quietly fixes (or fails on) it, and nobody
# connects the two.
#
# `plan -refresh-only` is exactly the right question, and it is a different
# question from the plan tier's. It compares STATE against REALITY and ignores
# the configuration entirely, so what it reports is only ever "something changed
# outside Terraform" — never "someone edited a .tf file". That is why this is a
# separate workflow rather than a flag on `infra.yml`.
#
# WHY A THIRD ROLE. `er-ci-tf-drift` holds the reads `ReadOnlyAccess` omits —
# `secretsmanager:GetSecretValue`, `bcm-data-exports:GetExport` and
# `bcm-data-exports:ListTagsForResource` — which a refresh needs and the plan
# role must never have. It is safe here because of who can reach it: its trust
# pins BOTH `sub` to `refs/heads/main` AND `job_workflow_ref` to this file. No PR
# branch can mint the first, and no other workflow satisfies the second — so
# adding a step elsewhere cannot inherit secret-read. See
# infra/terraform/envs/core/ci-terraform.tf, which also records that this role's
# secret scope reaches the builder admin key, and why that is bounded.
#
# That list grew twice from real runs and may grow again: #354 found
# `GetExport` by failing on it and then switched the plan tier to
# `-refresh=false`, so until this workflow existed NOTHING had ever completed a
# full refresh — `ListTagsForResource` had simply never been reached.
#
# NOT A REQUIRED CHECK, and it cannot become one: it never runs on a pull
# request. A red run here means the account disagrees with its state file, which
# is information about the world rather than about a diff.
#
# READ-ONLY, including the lock. The role holds no S3 write, so `-lock=false` is
# mandatory for the same reason it is in the plan tier — acquiring the lockfile
# is itself a write. A refresh-only PLAN writes no state; only
# `apply -refresh-only` would, and nothing here applies. Drift is reported for a
# human to resolve, never auto-reconciled: silently writing reality back into
# state is how a console change becomes permanent without anyone deciding so.
#
# WHAT "DRIFT" MEANS HERE IS DECIDED PER ATTRIBUTE, by
# `scripts/ci/tf-drift-classify.sh`, and the first real run is why. Two signals
# that look obvious both failed on it:
#
#   `-detailed-exitcode`  `dev` and `prod` printed "found no differences" and
#                         exited 2 anyway. Not a drift signal.
#   the text sentinel     "Objects have changed outside of Terraform" fired on
#                         `core` and `state-backend`, and neither was drift —
#                         `tags = {}` where state holds null, plus attributes
#                         (`managed_policy_arns`, `aws_s3_bucket.policy`) that
#                         report what a SEPARATE resource manages.
#
# `state-backend` makes that permanent rather than transient: CI plans it and
# never applies it, so nothing reconciles its state snapshot and it would have
# reported drift every day forever. The classifier's ignore list is therefore
# evidence-based — see the script.
name: drift

on:
  schedule:
    # 06:00 UTC daily, an hour before rust.yml's nightly, so the two do not
    # contend for runners.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: us-east-2

jobs:
  refresh:
    name: drift (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-drift
    strategy:
      # Read-only, so unlike the apply tier these are free to run together.
      fail-fast: false
      matrix:
        include:
          - key: state-backend
            dir: infra/terraform/bootstrap/state-backend
          - key: core
            dir: infra/terraform/envs/core
          - key: dev
            dir: infra/terraform/envs/dev
          - key: prod
            dir: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-drift
      - name: terraform plan -refresh-only
        env:
          DIR: ${{ matrix.dir }}
        # NO `-detailed-exitcode`, and that is the correction rather than an
        # omission. The first real run used it and treated 2 as drift; `dev` and
        # `prod` both printed "found no differences" and both exited 2, because a
        # refresh-only plan has something to persist almost by construction. It
        # is not a drift signal, and trusting it would have turned the schedule
        # red every day — the alarm fatigue this gate exists to avoid.
        #
        # So the plan is saved and read twice, as the apply tier does: once as
        # text for a human, once as JSON for the decision.
        #
        # `driftplan` AND `driftout/plan.json` CARRY ATTRIBUTE VALUES IN
        # CLEARTEXT. Neither may be uploaded as an artifact, and the JSON must
        # never be printed — there is deliberately no upload step in this
        # workflow. The classifier below emits only addresses and attribute
        # NAMES; the `show -no-color` text that reaches the summary redacts
        # values to `(sensitive value)`.
        run: |
          mkdir -p driftout
          terraform -chdir="$DIR" init -input=false
          terraform -chdir="$DIR" plan -refresh-only -out=driftplan \
            -no-color -lock=false -input=false
          terraform -chdir="$DIR" show -no-color driftplan > driftout/out.txt
          terraform -chdir="$DIR" show -json    driftplan > driftout/plan.json
          tail -c 60000 driftout/out.txt
      - name: classify the refresh
        # The classifier's own exit code IS the verdict: 0 no real drift, 1 real
        # drift, 2 unparseable. So this step needs no plumbing — it fails the job
        # directly, and its stdout names what drifted.
        #
        # `set -o pipefail` explicitly: GitHub's default shell is `bash -e` and
        # adds no pipefail, so `classifier | tee` would return TEE's status and
        # swallow the verdict entirely. That is the same mistake twice over in
        # this workflow family, so it is spelled out rather than assumed.
        run: |
          set -o pipefail
          bash scripts/ci/tf-drift-classify.sh driftout/plan.json | tee driftout/verdict.txt
      - name: summary
        if: always()
        # After the classifier, so a red job explains itself in the summary
        # rather than only in the log.
        env:
          STACK_KEY: ${{ matrix.key }}
        run: bash scripts/ci/drift-summary.sh
