# Out-of-band drift detection — the cost of `infra.yml`'s `-refresh=false`,
# paid back on a schedule.
#
# WHY THIS EXISTS. infrastructure.md §14.2 gives up one thing deliberately: the
# plan tier runs `-refresh=false`, because `er-ci-tf-plan` is assumable from any
# PR branch and a refreshing plan reads secret values. What that loses is drift —
# a console edit, a manual fix during an incident, an AWS-side default that
# moved. Today the only thing that notices is the next `apply` on `main`, which
# refreshes fully and then silently reconciles it. So drift is invisible until
# some unrelated infra PR merges and quietly fixes (or fails on) it, and nobody
# connects the two.
#
# `plan -refresh-only` is exactly the right question, and it is a different
# question from the plan tier's. It compares STATE against REALITY and ignores
# the configuration entirely, so what it reports is only ever "something changed
# outside Terraform" — never "someone edited a .tf file". That is why this is a
# separate workflow rather than a flag on `infra.yml`.
#
# WHY A THIRD ROLE. `er-ci-tf-drift` holds the two reads `ReadOnlyAccess` omits
# (`secretsmanager:GetSecretValue`, `bcm-data-exports:GetExport`) which a refresh
# needs and which the plan role must never have. It is safe here because of who
# can reach it: its trust pins BOTH `sub` to `refs/heads/main` AND
# `job_workflow_ref` to this file. No PR branch can mint the first, and no other
# workflow satisfies the second — so adding a step elsewhere cannot inherit
# secret-read. See infra/terraform/envs/core/ci-terraform.tf.
#
# NOT A REQUIRED CHECK, and it cannot become one: it never runs on a pull
# request. A red run here means the account disagrees with its state file, which
# is information about the world rather than about a diff.
#
# READ-ONLY, including the lock. The role holds no S3 write, so `-lock=false` is
# mandatory for the same reason it is in the plan tier — acquiring the lockfile
# is itself a write. A refresh-only PLAN writes no state; only
# `apply -refresh-only` would, and nothing here applies. Drift is reported for a
# human to resolve, never auto-reconciled: silently writing reality back into
# state is how a console change becomes permanent without anyone deciding so.
name: drift

on:
  schedule:
    # 06:00 UTC daily, an hour before rust.yml's nightly, so the two do not
    # contend for runners.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: us-east-2

jobs:
  refresh:
    name: drift (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-drift
    strategy:
      # Read-only, so unlike the apply tier these are free to run together.
      fail-fast: false
      matrix:
        include:
          - key: state-backend
            dir: infra/terraform/bootstrap/state-backend
          - key: core
            dir: infra/terraform/envs/core
          - key: dev
            dir: infra/terraform/envs/dev
          - key: prod
            dir: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-drift
      - name: terraform plan -refresh-only
        id: drift
        env:
          DIR: ${{ matrix.dir }}
        # `-detailed-exitcode`: 0 = state matches reality, 2 = it does not,
        # 1 = the refresh itself failed. Without it an error and a clean result
        # share an exit code, which is how a broken check reads as "no drift" —
        # the same reason the plan tier passes it.
        run: |
          mkdir -p driftout
          set +e
          terraform -chdir="$DIR" init -input=false > driftout/out.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            terraform -chdir="$DIR" plan -refresh-only \
              -no-color -lock=false -input=false -detailed-exitcode \
              > driftout/out.txt 2>&1
            code=$?
          else
            code=1
          fi
          set -e

          tail -c 60000 driftout/out.txt
          case "$code" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drifted=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "drifted=error" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: summary
        if: always()
        env:
          DRIFTED: ${{ steps.drift.outputs.drifted }}
        run: |
          {
            echo "### drift — ${{ matrix.key }}"
            echo ""
            case "$DRIFTED" in
              false) echo "State matches reality." ;;
              true)  echo "**DRIFT: the account disagrees with the state file.**" ;;
              *)     echo "**The refresh itself failed** — this is not a drift result." ;;
            esac
            echo ""
            echo '```terraform'
            tail -c 40000 driftout/out.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: fail on drift
        # Deliberately a separate step so the summary above is always written
        # first — a red job whose summary says why beats a red job you have to
        # open the log to understand.
        #
        # Drift FAILS rather than warns. A scheduled workflow that goes red
        # notifies; one that warns is a line in a log nobody opens. If an
        # environment turns out to drift chronically, the answer is to fix the
        # configuration or record the exception — not to lower this to a warning,
        # which would retire the check while leaving it in the tree.
        env:
          DRIFTED: ${{ steps.drift.outputs.drifted }}
        run: |
          case "$DRIFTED" in
            false)
              echo "no drift in ${{ matrix.key }}"
              ;;
            true)
              echo "::error::${{ matrix.key }}: state disagrees with reality — see the run summary for the refresh diff"
              exit 1
              ;;
            *)
              echo "::error::${{ matrix.key }}: the refresh-only plan failed; this is not a clean result"
              exit 1
              ;;
          esac
