name: marketing preview

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/marketing-preview.yml'
      - '.github/workflows/marketing-preview-cleanup.yml'
      - 'scripts/ci/marketing-preview*'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/marketing-preview.yml'
      - '.github/workflows/marketing-preview-cleanup.yml'
      - 'scripts/ci/marketing-preview*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: export and test marketing preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --test ../scripts/ci/marketing-preview-lifecycle.test.mjs
      - run: pnpm build:preview
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-marketing-preview.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-preview
          path: .marketing-preview/out
          if-no-files-found: error
          retention-days: 7
      - name: Preview setup
        if: vars.MARKETING_PREVIEW_ENABLED != 'true'
        run: echo 'Static preview passed; download the marketing-preview artifact. Hosting setup is documented in frontend/preview/README.md.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: publish marketing preview
    needs: build
    if: >-
      vars.MARKETING_PREVIEW_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: marketing-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Only the lifecycle helper is checked out; no frontend scripts or
      # dependencies execute in this credentialed job. Forks are excluded above.
      - name: Check PR is still open
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.payload.pull_request?.number;
            if (!number) { core.setOutput('deploy', true); return; }
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            core.setOutput('deploy', data.state === 'open');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.deploy == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/marketing-preview-lifecycle.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: marketing-preview
          path: site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Deploy static assets
        if: steps.gate.outputs.deploy == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: '9eefbe6bc92d11b2bb4e962494765a4c'
          wranglerVersion: '4.166.0'
          command: pages deploy site --project-name dupezero-marketing-preview --branch preview-${{ github.event.pull_request.number || github.run_id }}
      - name: Update PR preview link or clean up a closure race
        if: always() && steps.deploy.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/ci/marketing-preview-lifecycle.mjs after
