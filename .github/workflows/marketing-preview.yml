name: marketing preview

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/marketing-preview.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/marketing-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: export and test marketing preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:preview
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-marketing-preview.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-preview
          path: .marketing-preview/out
          if-no-files-found: error
          retention-days: 7
      - name: Preview setup
        if: vars.MARKETING_PREVIEW_ENABLED != 'true'
        run: echo 'Static preview passed; download the marketing-preview artifact. Hosting setup is documented in frontend/preview/README.md.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: publish marketing preview
    needs: build
    if: >-
      vars.MARKETING_PREVIEW_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: marketing-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # No checkout or execution of the PR's build scripts in the credentialed job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: marketing-preview
          path: site
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Deploy static assets
        id: deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: '9eefbe6bc92d11b2bb4e962494765a4c'
          wranglerVersion: '4.166.0'
          command: pages deploy site --project-name dupezero-marketing-preview --branch preview-${{ github.event.pull_request.number || github.run_id }}
      - name: Preview link
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: printf '### Marketing preview\n\n[Open the site](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
