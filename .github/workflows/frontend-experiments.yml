# CI experiments for the frontend — jobs that exist to ACCUMULATE EVIDENCE,
# never to gate a merge. Nothing in this workflow is, or may become, a required
# status check; that is the reason it is a separate file. The alternative —
# keeping the experiment inside frontend.yml and triggering it with
# workflow_dispatch — re-runs the ENTIRE frontend tier (~40 runner-minutes:
# detect gives dispatch events a blanket `true`, so check + all three
# playwright shards + audit + semgrep + the nightly coverage job all run) to
# collect one ~10-minute data point. A dedicated file makes a dispatch cost
# exactly the experiment.
#
# Current experiment: the full playwright suite at --workers=2. The PR shards
# (frontend.yml `e2e`) run one worker each because parallel safety is
# unvalidated — both webServers (the mock erserver and `next start` with its
# in-memory PGlite) are shared mutable state across workers, and the suite had
# only ever run at workers=1 in CI. The flip protocol: ~10 consecutive greens
# here, including the @visual project; triage any cross-test state bleed as a
# test-isolation bug. Then the PR-shard flip is one `--workers=2` on
# frontend.yml's shard legs (~5m -> ~3m each).
#
# Action refs are SHA-pinned with a `# vTAG` comment, per repo policy.
name: frontend-experiments

on:
  schedule:
    # Nightly at 07:00 UTC, alongside rust.yml's and frontend.yml's nightlies.
    - cron: "0 7 * * *"
  workflow_dispatch:
    # On-demand runs so the ~10-green protocol can be accumulated in an
    # afternoon instead of a fortnight of nightlies.

permissions:
  contents: read

# NO concurrency group, deliberately: parallel dispatches are independent
# samples of flake behaviour and must not cancel each other.

defaults:
  run:
    working-directory: frontend

jobs:
  workers-experiment:
    name: playwright workers=2 (experiment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-build-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            next-build-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e --workers=2
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-workers-experiment-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 7
