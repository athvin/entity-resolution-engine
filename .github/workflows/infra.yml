# The terraform gate, in three tiers (infrastructure.md §14.2 — "plan on every
# PR under a read-only role; apply on `main` under the apply role"):
#
#   1. fmt + validate   — credential-free, every PR. Catches syntax, type,
#                         module and unknown-field breakage at zero cost or
#                         risk, and still runs for a fork PR that can reach no
#                         AWS at all.
#   2. plan             — per env, read-only role, posts the diff. This is the
#                         state-diff gate that used to be roadmap item 0.5b.
#   3. apply            — per env, on `main` only, UNATTENDED. Merge is the
#                         trigger and the only trigger.
#
# NO REPOSITORY SECRETS, by design and not by omission. Every AWS identity here
# is a federated OIDC role whose credentials last an hour; §11 records that CI
# "consumes zero repository secrets" and the account has never held a static CI
# key. A long-lived AWS key in a PUBLIC repository's secrets would be strictly
# worse than this.
#
# WHAT GUARDS THE APPLY, now that nothing else does. The apply role holds
# AdministratorAccess, and §8.2's two prod deny statements ride the *permission
# sets* — so they constrain humans, not this role. That section is explicit that
# the apply role "walks through the guardrail legitimately" and therefore that
# "its trust policy is part of this claim".
#
# With applies unattended (operator decision), that trust policy — `sub` pinned
# to `refs/heads/main` — plus `main`'s branch protection and PR review IS the
# whole control. There is no second gate. A merged PR touching
# `infra/terraform/envs/prod` provisions production: the plan for it is
# currently 61 resources including an RDS cluster, two instances and EFS. The
# `plan` tier above is what makes that visible BEFORE the merge, which is now
# the only place a human sees it.
#
# The per-env `environment:` keys are kept even without reviewers: they give
# each env its own deployment history, and `protected_branches: true` on each
# means only `main` can deploy to them regardless of what a workflow says.
#
# Consequence worth tracking: §14.2's chained prod-scoped apply role (trust
# naming the CI apply role plus `ProdAdmin` as break-glass) was previously
# described as "covered by the reviewer gate". It no longer is. It is the
# remaining defence-in-depth for prod and should land before prod carries
# data — see infra/terraform/envs/core/ci-terraform.tf.
#
# BOOTSTRAP: the two roles cannot create themselves. The first
# `terraform -chdir=infra/terraform/envs/core apply` has to come from a human
# identity (`AWS_PROFILE=er-mgmt`); CI owns every apply after that. See
# infra/terraform/envs/core/ci-terraform.tf.
name: infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: us-east-2

jobs:
  validate:
    name: fmt + validate (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: fmt -check
        run: terraform fmt -check -recursive infra/terraform
      - name: validate each env
        # `validate` configures the aws provider but makes no AWS API call, so
        # dummy creds + a disabled metadata probe keep it fully offline.
        run: |
          for e in core dev prod; do
            echo "== validate envs/$e =="
            terraform -chdir="infra/terraform/envs/$e" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/$e" validate -no-color
          done

  plan:
    name: plan (${{ matrix.env }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A fork PR is issued no `id-token`, so it could not assume the plan role
    # and would fail on role assumption rather than on anything real. Skip it
    # instead: `validate` above still covers a fork, which is the tier that
    # needs no credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-plan
    strategy:
      fail-fast: false
      matrix:
        env: [core, dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-plan
      - name: terraform plan
        id: plan
        # `-lock=false` because the plan role holds no S3 write and acquiring
        # the lockfile IS a write. A plan that cannot lock can race a concurrent
        # apply; the apply job's concurrency group is what serialises writes.
        #
        # `-refresh=false` is a SECURITY choice, not a speed one. A refreshing
        # plan re-reads every resource, and two of those reads are privileged:
        # `aws_secretsmanager_secret_version` needs
        # `secretsmanager:GetSecretValue` — AWS deliberately leaves it out of
        # ReadOnlyAccess, because reading a secret's VALUE is the sensitive
        # action — and the CUR 2.0 export needs `bcm-data-exports:GetExport`.
        # The first real run of this gate failed on both.
        #
        # This role is assumable from ANY ref, because a plan has to run on the
        # pull request. Granting it secret-read would let any same-repo PR —
        # which can also edit this very workflow, since `pull_request` runs the
        # PR's own copy of it — print dev's Postgres and S3 credentials into a
        # public build log. That is a bad price for drift detection.
        #
        # So the role stays genuinely read-only and the plan does not refresh.
        # What is lost is out-of-band drift. What is kept is the
        # config-versus-state diff, which is the thing a reviewer is reading.
        # Drift is still caught at APPLY time, where the apply role refreshes
        # fully and the result is visible before the environment gate is
        # released.
        #
        # `-detailed-exitcode`: 0 = no changes, 2 = changes, 1 = error. Without
        # it a plan that errors and a plan that is empty are the same exit code,
        # which is how a broken plan gets read as "nothing to do".
        run: |
          set +e
          terraform -chdir="infra/terraform/envs/${{ matrix.env }}" init -input=false
          terraform -chdir="infra/terraform/envs/${{ matrix.env }}" plan \
            -no-color -lock=false -refresh=false -input=false -detailed-exitcode \
            > "plan-${{ matrix.env }}.txt" 2>&1
          code=$?
          set -e
          tail -c 60000 "plan-${{ matrix.env }}.txt"
          if [ "$code" = "1" ]; then
            echo "::error::terraform plan failed for envs/${{ matrix.env }}"
            exit 1
          fi
          echo "changes=$([ "$code" = "2" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: summary
        if: always()
        run: |
          {
            echo "### terraform plan — envs/${{ matrix.env }}"
            echo ""
            echo "changes: \`${{ steps.plan.outputs.changes }}\`"
            echo ""
            echo '```terraform'
            tail -c 40000 "plan-${{ matrix.env }}.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (${{ matrix.env }})
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Kept without reviewers: per-env deployment history, and
    # `protected_branches: true` so only `main` can deploy here.
    environment: infra-apply-${{ matrix.env }}
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-apply
    strategy:
      # Never parallel and never fail-fast: these share one state bucket, and a
      # half-applied account is worse than a slow one.
      max-parallel: 1
      fail-fast: false
      matrix:
        env: [core, dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-apply
      - name: terraform apply
        # Locking ON here, unlike plan: this one writes.
        run: |
          terraform -chdir="infra/terraform/envs/${{ matrix.env }}" init -input=false
          terraform -chdir="infra/terraform/envs/${{ matrix.env }}" apply \
            -no-color -input=false -auto-approve
