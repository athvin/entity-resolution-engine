# The terraform gate, in four tiers (infrastructure.md §14.2 — "plan on every
# PR under a read-only role; apply on `main` under the apply role"):
#
#   1. fmt + validate   — credential-free. Catches syntax, type, module and
#                         unknown-field breakage at zero cost or risk, and still
#                         runs for a fork PR that can reach no AWS at all.
#   2. plan             — per stack, read-only role, writes the diff to an
#                         artifact. This is the state-diff gate that used to be
#                         roadmap item 0.5b.
#   3. plan comment     — ONE sticky comment per PR, upserted in place, carrying
#                         a per-stack add/change/destroy table and the diffs.
#                         The plan used to land only in the run summary, so
#                         reviewing an infra PR meant leaving the PR.
#   4. apply            — per env, on `main` only, UNATTENDED. Merge is the
#                         trigger and the only trigger.
#
# NO REPOSITORY SECRETS, by design and not by omission. Every AWS identity here
# is a federated OIDC role whose credentials last an hour; §11 records that CI
# "consumes zero repository secrets" and the account has never held a static CI
# key. A long-lived AWS key in repository secrets would be strictly worse: it
# does not expire, it is reachable by every workflow in the repository rather
# than by one job, and rotating it is a manual act nobody is prompted to
# perform. (`GITHUB_TOKEN` in the comment job is not a repository secret — it is
# minted per run, and that job's `pull-requests: write` is the only write scope
# anywhere in this file.)
#
# NON-AWS CREDENTIALS EXIST — TWO OF THEM, both Cloudflare, and they are
# different tokens on purpose. The distinction that keeps the claim above true
# is worth stating rather than leaving to be rediscovered.
#
#   core — an R2 bucket (#910), needing `Workers R2 Storage: Edit` on the
#          ACCOUNT. Held as an **Environment** secret on `infra-apply-core`,
#          NOT a repository secret. Every objection the paragraph above raises
#          to a repository secret is about reach — "reachable by every workflow
#          in the repository rather than by one job" — and an Environment
#          secret on a `protected_branches: true` environment is reachable by
#          exactly one job on `main`. A pull request cannot read it even by
#          editing this workflow.
#   prod — DNS records (#555), needing `Zone DNS: Edit` on ONE zone. Held in
#          Secrets Manager (`er/shared/cloudflare`) and read with the prod
#          apply role's own credentials, so there is no stored GitHub secret
#          for it at all.
#
# Neither token can do the other's job — measured, not assumed: the
# zone-scoped one returns `9109` on `/accounts/<id>` and `10000` on
# `/accounts/<id>/r2/buckets`. One shared token would need both scopes and be
# strictly broader than either leg. `scripts/ci/tf-cloudflare-token.sh` picks
# the source per leg and is the only thing that sets `CLOUDFLARE_API_TOKEN`;
# see its header for why it must be a step rather than a job-level `env:`.
#
# What does NOT survive the move is the expiry argument: unlike every AWS
# identity here, a Cloudflare API token is long-lived, so it is rotated by hand
# or not at all. It is scoped to `Workers R2 Storage: Edit` on one account and
# nothing else, which bounds that. Cloudflare has no OIDC equivalent, so this is
# the floor rather than a shortcut — and it is why #909 rebuilds S3's
# read/write role split out of two scoped bucket tokens rather than federation.
#
# WHAT GUARDS THE APPLY. The apply role holds AdministratorAccess, and §8.2's
# two prod deny statements ride the *permission sets* — so they constrain
# humans, not this role. That section is explicit that the apply role "walks
# through the guardrail legitimately" and therefore that "its trust policy is
# part of this claim".
#
# With applies unattended (operator decision), that trust policy — `sub` pinned
# to the three `infra-apply-*` environments — plus `main`'s branch protection and
# PR review IS the control. Two things sit behind it, neither a substitute for
# review:
#
#   - a DESTROY GUARD on tier 4, which refuses any non-zero destroy count
#     unless the commit message carries `ALLOW-DESTROY`. A speed bump.
#   - §14.2's prod hop: `envs/prod` applies under `er-ci-tf-apply-prod`, chained
#     into from the ordinary apply role, which is DENIED the prod state object
#     so the hop cannot stop being used. This makes a prod write legible in
#     CloudTrail and stops an accidental one from the non-prod path; it is not
#     containment, because the apply role may assume it by design.
#
# A merged PR touching `infra/terraform/envs/prod` still provisions production —
# 61 resources including an RDS cluster, two instances and EFS — and tiers 2 and
# 3 are what make that visible BEFORE the merge, which is the only place a human
# sees it.
#
# NO `paths:` FILTER, and it must never come back. The plan tiers are REQUIRED
# status checks, and a workflow a path filter skips never reports, so a required
# check that never reports blocks every non-infra PR forever. This is the same
# `detect`-job pattern `rust.yml` and `frontend.yml` use for the same reason: a
# job skipped by `if:` reports a "skipped" conclusion, which branch protection
# accepts as satisfied, while a job skipped by `paths:` reports nothing at all.
#
# A JOB'S `name:` IS ITS BRANCH-PROTECTION CONTEXT. The matrix is a list of
# `{key, dir}` objects so the bootstrap stacks can join it, and every matrix job
# therefore sets `name:` explicitly — left to itself GitHub would name the job
# `plan (core, infra/terraform/envs/core)` and silently un-protect `plan (core)`.
#
# The per-env `environment:` keys are kept even without reviewers: they give
# each env its own deployment history, and `protected_branches: true` on each
# means only `main` can deploy to them regardless of what a workflow says.
#
# BOOTSTRAP: the two roles cannot create themselves. The first
# `terraform -chdir=infra/terraform/envs/core apply` has to come from a human
# identity (`AWS_PROFILE=er-mgmt`); CI owns every apply after that. See
# infra/terraform/envs/core/ci-terraform.tf.
name: infra

on:
  pull_request:
  # Merge-queue wiring, which nothing consumes today (see rust.yml's trigger
  # block for why the queue cannot be enabled here). `terraform plan` is a
  # required context, so this workflow would have to report on queue runs or
  # every queued PR would wait forever — which is why the trigger is kept
  # against the day one exists. `detect` diffs the queue's base...head like a PR; `plan`
  # itself skips here (its `if:` admits only push and same-repo PRs), which
  # `plan-gate` accepts — the PR already ran its plan, and `validate` still runs.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: us-east-2

jobs:
  # Did this change touch Terraform, this workflow, or the scripts it calls?
  # Everything below gates on the answer with `if:`, which is what lets the plan
  # tiers be required without a `paths:` filter (see the header).
  #
  # Named `detect infra changes` rather than `detect changes`, which `rust.yml`
  # and `images.yml` both already use: three identically-named contexts in one
  # PR's check list is unreadable.
  detect:
    name: detect infra changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        # THE PUSH PATH FAILS SAFE, and the asymmetry is deliberate. A
        # wrongly-skipped *plan* is cosmetic — the PR simply shows nothing. A
        # wrongly-skipped *apply* silently diverges the account from its
        # configuration until the next infra PR happens to notice. So only a
        # confidently-computed empty diff may skip: an absent, all-zero or
        # unreachable before-SHA (a force-push, a freshly-created branch) means
        # "assume infra changed" rather than "assume it did not".
        run: bash scripts/ci/infra-detect.sh
  # The three shell helpers this workflow calls, asserted against fixtures.
  #
  # `apply` gates on this job, which is the point of it existing rather than
  # being a local convenience. `tf-destroy-guard.sh` is the only thing between a
  # merge and an unattended apply that destroys production, and every real apply
  # so far has planned `0 to destroy` — so its refusal path has never actually
  # run in CI. A guard whose failure path is unexercised is indistinguishable
  # from a guard that cannot fail, which is this repository's recurring bug
  # class. Now the refusal, the `ALLOW-DESTROY` override and the fail-closed
  # branch are proven on every run, before anything is applied.
  #
  # Pure shell: no toolchain, no credentials, no network, no terraform binary.
  helpers:
    name: terraform ci helpers (self-test)
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fixture tests for the plan comment, metadata and destroy guard
        run: bash scripts/ci/tf-helpers-test.sh

  # The HELM gate. There was none at all: `images.yml` triggers on
  # `infra/k8s/**` and deploys chart changes straight into the `ci` namespace,
  # so until now the first thing to evaluate a chart edit was the cluster.
  # plan-to-aws.md listed "helm lint/template + kubeconform" as unfinished.
  #
  # Credential-free and offline, like `validate` above — it renders templates
  # and compares schemas, it does not talk to a cluster. It lives in this
  # workflow rather than its own because this is the infra gate and the detect
  # pattern is already here; it is deliberately gated on its OWN detect output
  # so a chart edit does not run `terraform plan` and a terraform edit does not
  # pay for a chart render.
  #
  # NOT a required check yet, and that order is not optional: a job's `name:` IS
  # its branch-protection context, so a context added for a job that has never
  # reported green on `main` leaves every PR pending forever. Land it, watch it
  # report, then require it.
  charts:
    name: helm charts (lint + render + selectors)
    needs: detect
    if: needs.detect.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform
        # helm comes from scripts/ci/install-helm.sh, which owns that pin for
        # all three of its consumers (here, deploy.yml and kind.yml); the
        # version-pinned-tarball argument and the install check are stated
        # there.
        run: bash scripts/ci/install-chart-tools.sh
      - name: Install PyYAML
        # Explicit rather than relying on the runner image carrying it: the
        # selector gate imports yaml, and a gate that cannot run must fail
        # loudly at a named step instead of becoming an import error buried in
        # a script's output.
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'
      - name: helm lint
        run: bash scripts/ci/helm-lint.sh
      - name: Render and schema-validate every profile
        # Three renders, because they are three different manifest sets and a
        # template guarded by `if` is unchecked in the profiles that disable it:
        # the default dev profile, the kind profile (`web.enabled: false`, so no
        # BFF container and no drizzle hook), and the namespace chart.
        #
        # `-ignore-missing-schemas` is needed for the ExternalSecret CRD, which
        # has no published schema. It is a real gap — a typo in a CRD's `kind`
        # would be skipped rather than caught — which is why the step prints the
        # skipped count rather than hiding it, and why the selector gate below
        # checks relationships that no schema could express anyway.
        run: bash scripts/ci/charts-render-validate.sh
      - name: Selectors resolve, and the edge hole is web-only
        # The check none of the above can make: does a selector match any pod
        # that exists? See the script's header — a NetworkPolicy that matched
        # nothing was valid YAML, valid against the schema and lint-clean for
        # weeks. Cross-chart by necessity, since the policy and the pod it
        # selects are in different charts.
        run: python3 scripts/ci/charts-check.py

  validate:
    name: fmt + validate (credential-free)
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: fmt -check
        run: terraform fmt -check -recursive infra/terraform
      - name: validate every stack
        # `validate` configures the aws provider but makes no AWS API call, so
        # dummy creds + a disabled metadata probe keep it fully offline.
        #
        # ALL FIVE stacks, including both bootstrap ones — this is the only tier
        # that covers `bootstrap/organization` at all. It needs no variable
        # value to do so: `terraform validate` does not evaluate variables, so
        # the gitignored `terraform.tfvars` that stack depends on (a member
        # account's root email, deliberately kept out of version control) is not
        # required here. That is also why it cannot join the plan tier, which
        # would need the value.
        run: bash scripts/ci/tf-validate-all.sh

  plan:
    name: plan (${{ matrix.key }})
    needs: [detect, validate]
    # A fork PR is issued no `id-token`, so it could not assume the plan role
    # and would fail on role assumption rather than on anything real. Skip it
    # instead: `validate` above still covers a fork, which is the tier that
    # needs no credentials.
    #
    # Every continuation line here sits at the SAME indent as the first. A
    # more-indented line in a YAML folded scalar is kept literally, newline and
    # all, which silently embeds a newline in the expression — actionlint
    # tolerates it, GitHub's expression parser is a different implementation,
    # and this is the condition that gates the apply.
    if: >-
      needs.detect.outputs.infra == 'true'
      && (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # Planned and NEVER applied: this stack owns the bucket its own
          # backend lives in, so applying it from CI is the circular case. A
          # plan still catches drift in the bucket's configuration, which is the
          # value. Reading its state needs the `bootstrap/*.tfstate` grant added
          # to the plan role in #358.
          - key: state-backend
            dir: infra/terraform/bootstrap/state-backend
          - key: core
            dir: infra/terraform/envs/core
          - key: dev
            dir: infra/terraform/envs/dev
          - key: prod
            dir: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-plan
      - name: terraform plan
        id: plan
        env:
          DIR: ${{ matrix.dir }}
        # `-lock=false` because the plan role holds no S3 write and acquiring
        # the lockfile IS a write. A plan that cannot lock can race a concurrent
        # apply; the apply job's concurrency group is what serialises writes.
        #
        # `-refresh=false` is a SECURITY choice, not a speed one. A refreshing
        # plan re-reads every resource, and two of those reads are privileged:
        # `aws_secretsmanager_secret_version` needs
        # `secretsmanager:GetSecretValue` — AWS deliberately leaves it out of
        # ReadOnlyAccess, because reading a secret's VALUE is the sensitive
        # action — and the CUR 2.0 export needs `bcm-data-exports:GetExport`.
        # The first real run of this gate failed on both.
        #
        # This role is assumable from ANY ref, because a plan has to run on the
        # pull request. Granting it secret-read would let any same-repo PR —
        # which can also edit this very workflow, since `pull_request` runs the
        # PR's own copy of it — print dev's Postgres and S3 credentials into a
        # build log. The repository is private, so that log is not world-visible;
        # it is still readable by every collaborator, persists in the run
        # history, and needs no AWS access at all to read. That is a bad price
        # for drift detection.
        #
        # So the role stays genuinely read-only and the plan does not refresh.
        # What is lost is out-of-band drift. What is kept is the
        # config-versus-state diff, which is the thing a reviewer is reading —
        # and the comment below says so, so nobody mistakes one for the other.
        # Drift is still caught at APPLY time, where the apply role refreshes
        # fully and the result lands in the run summary.
        #
        # `-detailed-exitcode`: 0 = no changes, 2 = changes, 1 = error. Without
        # it a plan that errors and a plan that is empty are the same exit code,
        # which is how a broken plan gets read as "nothing to do".
        run: bash scripts/ci/tf-plan-run.sh
      - name: upload the plan for the comment job
        # `always()`: a FAILED plan is exactly the one a reviewer needs to see,
        # and the comment job reads these artifacts.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-${{ matrix.key }}
          path: planout
          retention-days: 7
          if-no-files-found: warn
      - name: summary
        if: always()
        # Kept alongside the comment: this is the UNTRUNCATED copy, and the
        # comment links here when a plan is too large to inline.
        env:
          TITLE: terraform plan — ${{ matrix.key }}
          PLAN: planout/plan.txt
          META: planout/meta.txt
        run: bash scripts/ci/tf-step-summary.sh

  # The required status check for the plan tier, and the reason it exists is a
  # GitHub behaviour worth stating exactly.
  #
  # A MATRIX JOB'S PER-LEG NAMES CANNOT BE REQUIRED STATUS CHECKS. When the
  # matrix runs, `plan` reports one check-run per leg — `plan (core)`,
  # `plan (dev)`, … — and those look like perfectly good contexts. When the job
  # is SKIPPED by its `if:`, GitHub reports a single check-run under the literal,
  # uninterpolated name `plan (${{ matrix.key }})`. So the per-leg contexts never
  # report at all on a PR that skips the tier, and a required context that never
  # reports blocks the PR forever — the same failure mode as a `paths:` filter,
  # which is the whole thing this workflow's `detect` job exists to avoid.
  #
  # That is not theoretical: the four `plan (<env>)` contexts were made required,
  # and the next non-infra PR (#359, agentic workflows) went unmergeable with
  # them stuck on "Expected". `fmt + validate (credential-free)` was fine
  # throughout, because it is not a matrix job and reports `skipped` under its
  # own name.
  #
  # So the required context is this single non-matrix job instead. It reports
  # `skipped` when the tier is skipped, which branch protection accepts, and
  # fails when any leg failed.
  plan-gate:
    name: terraform plan
    needs: [detect, plan]
    if: ${{ !cancelled() && needs.detect.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout only to have scripts/ci/ on disk — the gate reads no code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every plan leg must have succeeded
        env:
          # For a matrix job this is the aggregate: `success` only if every leg
          # succeeded, `failure` if any did, `skipped` if the whole job was.
          #
          # `skipped` passes with a note, and only one thing produces it here: a
          # fork PR, which is issued no `id-token` and so cannot assume the plan
          # role at all (the `plan` job skips itself for exactly that reason).
          # Treating it as a failure would make every fork PR unmergeable, which
          # is the bug this job was added to fix, pointed the other way.
          GATE_LEGS: |
            plan=${{ needs.plan.result }}
        run: bash scripts/ci/gate-all-legs.sh

  comment:
    name: plan comment
    needs: [detect, plan]
    # `!cancelled()` rather than `always()`: a failed plan must still be
    # reported — that is when the comment matters most — but a cancelled run
    # should leave the previous comment alone rather than overwrite it with
    # half a story.
    #
    # Fork condition mirrors the plan job's. A fork `pull_request` also gets a
    # read-only `GITHUB_TOKEN`, so the upsert would 403 even if there were
    # artifacts to post.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.detect.outputs.infra == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the ONE write scope in this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: tfplans
      - name: assemble and upsert the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- terraform-plan -->"
        # Upserted by MARKER, not by `gh pr comment --edit-last`: that flag keys
        # on the authoring actor, so any other `github-actions[bot]` comment
        # arriving later would be the one it edited.
        #
        # The payload goes through `jq -Rs` rather than `gh api -F body=@file`
        # so no part of a plan's text can be read as a field type or a flag.
        #
        # THE LOOKUP IS TWO STATEMENTS, NOT A PIPELINE, and that is the whole
        # point. GitHub's default shell here is `bash -e {0}` — `pipefail` is
        # added only by an explicit `shell: bash`, which nothing in this
        # repository sets. So in `gh api … | jq …` a FAILING `gh` is invisible:
        # jq succeeds on empty input, `id` comes back empty, and the job posts a
        # brand-new comment on every push instead of updating the one that is
        # already there. Silent duplicates, not a red job.
        #
        # Assigning `gh`'s output to a variable first makes its failure fatal,
        # because the assignment carries the command substitution's exit status
        # and `-e` aborts on it. `--slurp` collects every page into one array so
        # the filter emits exactly one line (and nothing closes the stream
        # early); `--arg` keeps the marker out of the jq program text.
        run: bash scripts/ci/tf-comment-upsert.sh
  apply:
    name: apply (${{ matrix.key }})
    # `helpers` is in here deliberately: a broken `tf-destroy-guard.sh` must
    # stop the apply rather than be discovered by it.
    needs: [detect, helpers, plan]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Kept without reviewers: per-env deployment history, and
    # `protected_branches: true` so only `main` can deploy here. The name is
    # also what the apply role's trust policy matches on — a job that references
    # an Environment gets a `…:environment:<name>` subject claim instead of a
    # ref claim, so these three names are load-bearing, not decoration.
    environment: infra-apply-${{ matrix.key }}
    # JOB level, not step level, and that placement is the whole fix for the
    # `apply (core)` failure on be64c41e (#910). These were on the
    # `terraform plan (to a file)` step only, so the plan succeeded and the
    # apply died with
    #
    #   400 {"code":9106,"message":"Missing X-Auth-Key, X-Auth-Email or
    #   Authorization headers"}
    #
    # The asymmetry is not an oversight in Terraform, it is the point: VARIABLE
    # values are baked into the saved plan file, but PROVIDER CREDENTIALS are
    # deliberately not — which is exactly why `versions.tf` has the provider read
    # `CLOUDFLARE_API_TOKEN` from the environment instead of taking it as a
    # variable (a variable would land in the plan file and in state). So the
    # credential has to be present at plan AND at apply, and the only way the
    # two cannot drift is to set it once for the job.
    env:
      # The Cloudflare account that owns the R2 sccache bucket. NOT a secret —
      # it appears in every dashboard URL and the S3-API endpoint is derived
      # from it — so it belongs in the tree, exactly as `rust.yml` carries the
      # AWS account id inside `SCCACHE_BUCKET`.
      #
      # Set unconditionally rather than per-leg: only `envs/core` declares this
      # variable, and Terraform silently ignores a `TF_VAR_` for an undeclared
      # one (unlike `-var`, which errors). A `matrix.key == 'core' && … || ''`
      # expression would be worse than useless — it yields the empty STRING on
      # the other legs, and `"" != null`, so `local.r2_enabled` would flip true
      # with no account id to use.
      TF_VAR_cloudflare_account_id: 9eefbe6bc92d11b2bb4e962494765a4c
      # `CLOUDFLARE_API_TOKEN` is DELIBERATELY NOT SET HERE, and that is a
      # correction rather than an omission — see the `cloudflare token` step.
      #
      # It was a job-level `env:` resolving the `infra-apply-core` Environment
      # secret, on the stated reasoning that it is "empty on dev and prod, which
      # need no Cloudflare credential". That was true when written and stopped
      # being true the moment `envs/prod` got DNS records (#555).
      #
      # A job-level `env:` OVERRIDES anything a step writes to `$GITHUB_ENV`, so
      # the empty value on the prod leg silently shadowed the token the prod
      # step had just exported — and the apply failed with Cloudflare `9106`
      # (no authorization header at all) while the export step reported success.
      # Precedence, not the fetch, was the bug.
    permissions:
      contents: read
      id-token: write # OIDC exchange for er-ci-tf-apply
    strategy:
      # Never parallel and never fail-fast: these share one state bucket, and a
      # half-applied account is worse than a slow one.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # `state-backend` is deliberately absent — see the plan matrix.
          - key: core
            dir: infra/terraform/envs/core
          - key: dev
            dir: infra/terraform/envs/dev
          - key: prod
            dir: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-apply
      - name: chain into the prod-scoped apply role
        # §14.2's second hop, prod only. `er-ci-tf-apply` is DENIED the prod
        # state object, so this is not an optimisation — without it `terraform
        # init` for `envs/prod` fails on state access. That is deliberate: it
        # makes the audited hop the only path Terraform has, so deleting this
        # step cannot silently restore a direct prod apply.
        #
        # `role-chaining: true` makes the action use the credentials the step
        # above exported rather than a fresh OIDC exchange, which is why the
        # prod role's trust names `er-ci-tf-apply` instead of the OIDC provider.
        #
        # Session tags come along on this path — the web-identity paths drop
        # them, the plain AssumeRole path does not — so the prod role's trust
        # allows `sts:TagSession` and CloudTrail records the actor, commit and
        # branch behind the write. STS caps a chained session at one hour, which
        # is this job's timeout anyway.
        if: matrix.key == 'prod'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::797781631727:role/er-ci-tf-apply-prod
          role-chaining: true
      - name: cloudflare token
        # TWO STACKS NEED A CLOUDFLARE CREDENTIAL, AND THEY NEED DIFFERENT ONES.
        # `envs/core` creates an R2 bucket, which wants `Workers R2 Storage:
        # Edit` on the ACCOUNT; `envs/prod` writes DNS records, which wants
        # `Zone DNS: Edit` on ONE zone. Neither token can do the other's job —
        # measured: the zone-scoped token returns `9109` on the account
        # endpoint and `10000` on `r2/buckets` — so one shared token would have
        # to carry both scopes and would be strictly broader than either leg
        # needs. Two least-privilege tokens is the design, not an accident.
        #
        # Hence one variable, sourced per leg, exported by one script:
        #   core -> the `infra-apply-core` Environment secret, passed in below.
        #   prod -> Secrets Manager `er/shared/cloudflare`, read with the prod
        #           role's own credentials AFTER the §14.2 hop above.
        #
        # It must be a STEP and not a job-level `env:` — a job-level `env:`
        # wins over `$GITHUB_ENV`, which is exactly the shadowing that broke
        # the prod apply (see the note where that value used to be set).
        if: matrix.key == 'core' || matrix.key == 'prod'
        env:
          # Resolves only on the core leg: this is an Environment secret on
          # `infra-apply-core`, and that environment is
          # `protected_branches: true`, so a pull request cannot read it even
          # by editing this workflow. Empty elsewhere, which is the signal the
          # script uses to fall through to Secrets Manager.
          CF_TOKEN_FROM_ENVIRONMENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci/tf-cloudflare-token.sh
      - name: terraform plan (to a file)
        env:
          DIR: ${{ matrix.dir }}
        # Plan to a file and apply THAT file, rather than `apply -auto-approve`
        # letting Terraform re-plan inside the apply. Same work, but what lands
        # becomes a thing that can be shown, counted and refused first.
        #
        # Locking ON here, unlike the plan tier: this one writes. Refreshing
        # too — the apply role can read what the plan role deliberately cannot,
        # which is where out-of-band drift is actually caught. That is also
        # why it is a separate script from scripts/ci/tf-plan-run.sh, which
        # argues the point; what may and may not leave this job (only the
        # redacted `applyplan.txt`, never `tfplan`) is argued there too.
        run: bash scripts/ci/tf-apply-plan.sh
      - name: destroy guard
        # Fails closed on anything it cannot classify. See the script.
        run: bash scripts/ci/tf-destroy-guard.sh applyplan.txt
      - name: terraform apply
        env:
          DIR: ${{ matrix.dir }}
        run: terraform -chdir="$DIR" apply -no-color -input=false -lock-timeout=5m tfplan
      - name: summary
        if: always()
        env:
          TITLE: terraform apply — ${{ matrix.key }}
          PLAN: applyplan.txt
        run: bash scripts/ci/tf-step-summary.sh
