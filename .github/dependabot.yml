# SHA-pinned `uses:` references cannot float, which is the point of S9 -- so the only
# way a pinned action is ever updated is a reviewed pull request. This file is what
# opens it: Dependabot resolves each pinned SHA's tag from the trailing comment,
# proposes the next release's SHA and rewrites the comment with it.
#
# `npm` and `cargo` are here because nothing else bumps them. The repo's own
# security notes flagged the hole (.claude/skills/security/references/secrets-iac.md:
# "Dependabot does not cover cargo or npm"), and the frontend gate found what it
# cost: at the time npm was added, `next` was four patch releases behind a set of
# six advisories, one of them a HIGH SSRF in image optimization.
#
# Both ecosystems are gated in CI, so a bot PR has to pass the same checks a human
# does: cargo-deny for Rust (rust.yml), `pnpm audit` + the license allowlist for the
# frontend (frontend.yml). Updates are grouped to one PR per ecosystem per week,
# with majors split out — a major is a migration to schedule, not a dependency bump
# to merge on green.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to the Playwright Docker image tag in frontend/playwright.config.ts's
      # CI container and scripts/frontend-dev/update-baselines.sh. The committed visual
      # baselines are rendered in that exact image, so the package and the tag must
      # move together, by hand. See frontend/README.md.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    # Two, not the five this started at. Each cargo PR carries a different
    # Cargo.lock, so Swatinem/rust-cache (keyed on the lockfile) misses and the
    # workspace compiles near-cold. Five of those at once starved the runners
    # badly enough to push `fmt + clippy + docs` past its 30-minute timeout —
    # on the dependabot branches AND on main. The grouping below batches
    # minor/patch into one PR, but majors are deliberately separate (a major is
    # a migration to schedule, not a bump to merge on green), so a week with
    # several major releases is exactly when the burst happens.
    #
    # Dependabot queues the rest and opens them as these merge, so nothing is
    # lost — it just stops arriving all at once. npm stays at 5: those PRs do
    # not compile Rust.
    open-pull-requests-limit: 2
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Crates whose major is not ours to choose alone, in three groups: three
      # must equal the major an EXTERNAL dependency already resolved (`arrow`,
      # the two `datafusion-*`); two must equal EACH OTHER (`sha2`/`hmac`); five
      # must move as ONE SET with a fixed offset (the `opentelemetry*` crates and
      # `tracing-opentelemetry`). Either way the failure is a trait or type
      # mismatch rather than a version conflict, because the same name arrives
      # under two crate versions and stops being the same thing.
      #
      # `arrow` must match whatever `duckdb` pulls, because Arrow values cross
      # that boundary. Held at 58 while duckdb was on 1.10506.1, because arrow
      # 60 against that pin produced `expected &[RecordBatch], found
      # &Vec<RecordBatch>`: two RecordBatch types, one per arrow major (closed
      # PR #195). duckdb 1.20000.0 pulls arrow 60, and #338 moved both together
      # by hand — which is still how this one moves. The ignore stays because
      # the constraint is permanent, not because 60 is the ceiling.
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      # `datafusion-common` / `datafusion-expr` must match the major that
      # `ff-analysis` resolves — a git dependency pinned to a tag, whose
      # LogicalPlan er-sql-check inspects. On 55 the compiler said it plainly:
      # "there are multiple different versions of crate `arrow_schema` in the
      # dependency graph". The unblocker is a new ff-analysis tag built on the
      # newer DataFusion (closed PRs #194, #196).
      #
      # er-sql-check/Cargo.toml carries the long-form reasoning, including why
      # the resulting arrow 57/58 split is deliberate and contained.
      - dependency-name: "datafusion-common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datafusion-expr"
        update-types: ["version-update:semver-major"]
      # `sha2` and `hmac` must equal EACH OTHER, not an external: both are
      # RustCrypto crates over `digest`, and hmac's `Sha256` is the one from
      # *its* digest. sha2 0.11 + hmac 0.13 are the digest-0.11 line; sha2 0.10
      # + hmac 0.12 were digest-0.10. Dependabot proposed them one at a time and
      # each failed alone with
      # `Sha256: hmac::digest::core_api::CoreProxy is not satisfied`
      # (closed PRs #341, #342). Moved together by hand instead; the pair also
      # needed `use hmac::KeyInit` added, since `new_from_slice` no longer comes
      # in via `Mac`. Minor/patch still flow — only the major is held, because
      # that is where the digest line moves.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-major"]
      # The `opentelemetry*` set plus `tracing-opentelemetry` are the same
      # must-equal-each-other shape as sha2/hmac, one crate larger and with an
      # offset: er-obs/Cargo.toml has carried the rule since the crate existed —
      # "`opentelemetry*` crates exchange types with each other while
      # `tracing-opentelemetry` sits exactly ONE minor ahead — 0.32 pairs with
      # opentelemetry 0.31. Bump them in one commit."
      #
      # That rule was in the manifest and NOT here, which is the whole defect:
      # nothing stopped the bot proposing them one at a time, so it did, and each
      # one failed alone. #731 (tracing-opentelemetry 0.32.1 -> 0.34.0) and #732
      # (opentelemetry_sdk 0.31.0 -> 0.33.1) both went red on the same trait
      # mismatch the manifest predicts:
      #
      #   error[E0277]: the trait bound
      #     `opentelemetry_sdk::trace::SdkTracer: opentelemetry::trace::tracer::Tracer`
      #     is not satisfied
      #
      # — two `Tracer` traits in the graph, one per opentelemetry major, so the
      # SDK's tracer does not implement the one `tracing-opentelemetry` wants.
      # `Context::span` and `OpenTelemetryLayer::with_filter` fail the same way.
      # Both PRs were closed rather than fixed, because the unblocker is a
      # coordinated bump of all five and never a change inside either PR.
      #
      # `semver-major` IS the right update-type even though the breaking
      # position for a `0.x` crate is the minor, and it is worth recording the
      # evidence rather than reasoning from the pair above — that one landed
      # 2026-11-06, after its own incident, so it has never actually been
      # exercised and proves nothing yet.
      #
      # The evidence is how these two arrived. The `groups` block above sweeps
      # `update-types: ["minor", "patch"]` across `patterns: ["*"]`, and a real
      # minor lands in it with the group in its title — #348, "Bump sha2 from
      # 0.11.0 to 0.11.1 in the rust-minor-patch group". #731 and #732 arrived
      # as TWO UNGROUPED PRs, which is what dependabot does for an update the
      # group's update-types exclude. So it classified 0.31 -> 0.33 as major,
      # and a `semver-major` ignore is what holds it. Patch releases still flow
      # through the group.
      - dependency-name: "opentelemetry"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opentelemetry_sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opentelemetry-otlp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opentelemetry-http"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tracing-opentelemetry"
        update-types: ["version-update:semver-major"]
