# SHA-pinned `uses:` references cannot float, which is the point of S9 -- so the only
# way a pinned action is ever updated is a reviewed pull request. This file is what
# opens it: Dependabot resolves each pinned SHA's tag from the trailing comment,
# proposes the next release's SHA and rewrites the comment with it.
#
# `npm` and `cargo` are here because nothing else bumps them. The repo's own
# security notes flagged the hole (.claude/skills/security/references/secrets-iac.md:
# "Dependabot does not cover cargo or npm"), and the frontend gate found what it
# cost: at the time npm was added, `next` was four patch releases behind a set of
# six advisories, one of them a HIGH SSRF in image optimization.
#
# Both ecosystems are gated in CI, so a bot PR has to pass the same checks a human
# does: cargo-deny for Rust (rust.yml), `pnpm audit` + the license allowlist for the
# frontend (frontend.yml). Updates are grouped to one PR per ecosystem per week,
# with majors split out — a major is a migration to schedule, not a dependency bump
# to merge on green.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned to the Playwright Docker image tag in frontend/playwright.config.ts's
      # CI container and frontend/dev/update-baselines.sh. The committed visual
      # baselines are rendered in that exact image, so the package and the tag must
      # move together, by hand. See frontend/README.md.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    # Two, not the five this started at. Each cargo PR carries a different
    # Cargo.lock, so Swatinem/rust-cache (keyed on the lockfile) misses and the
    # workspace compiles near-cold. Five of those at once starved the runners
    # badly enough to push `fmt + clippy + docs` past its 30-minute timeout —
    # on the dependabot branches AND on main. The grouping below batches
    # minor/patch into one PR, but majors are deliberately separate (a major is
    # a migration to schedule, not a bump to merge on green), so a week with
    # several major releases is exactly when the burst happens.
    #
    # Dependabot queues the rest and opens them as these merge, so nothing is
    # lost — it just stops arriving all at once. npm stays at 5: those PRs do
    # not compile Rust.
    open-pull-requests-limit: 2
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
