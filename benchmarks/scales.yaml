# Workloads and resource limits. Smoke can bootstrap without a measured baseline.
# Larger scales become dispatchable after a measured baseline is reviewed.

smoke:
  personas: 400
  records: 1000
  incremental_batch: 50
  min_free_gb: 4
  baseline_committed: false
  dispatchable: true
  runner: ubuntu-latest
  cpu_limit: 2
  mem_limit: 6g
  duckdb_memory_limit: 4GB

10k:
  personas: 4000
  records: 10000
  incremental_batch: 100
  min_free_gb: 8
  baseline_committed: false
  dispatchable: false
  runner: ubuntu-latest
  cpu_limit: 2
  mem_limit: 6g
  duckdb_memory_limit: 4GB

100k:
  personas: 40000
  records: 100000
  incremental_batch: 1000
  min_free_gb: 24
  baseline_committed: false
  dispatchable: false
  runner: ubuntu-latest-8-cores
  cpu_limit: 6
  mem_limit: 24g
  duckdb_memory_limit: 16GB

1m:
  personas: 400000
  records: 1000000
  incremental_batch: 10000
  min_free_gb: 120
  baseline_committed: false
  dispatchable: false
  runner: ubuntu-latest-16-cores
  cpu_limit: 12
  mem_limit: 56g
  duckdb_memory_limit: 40GB
