# The kind cluster for the orchestration probe (batch-orchestration-design §11
# Phase 2): one node, the shared data directory mounted in from the host (the
# chart's `efs.hostPath: /mnt/er` points at it), and containerd wired to the
# local registry via the hosts.d config dir — scripts/kind_env.sh writes the
# per-registry hosts.toml and runs the cluster.
#
# The host path below is a placeholder: kind_env.sh substitutes
# ${ER_KIND_DATA_DIR} before `kind create cluster`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: er-kind
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __ER_KIND_DATA_DIR__
        containerPath: /mnt/er
