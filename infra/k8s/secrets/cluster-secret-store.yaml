# §9: the one store every namespace's ExternalSecrets reference. ESO's
# controller authenticates via EKS Pod Identity (no credentials here); its IAM
# role is scoped to secretsmanager:er/* read-only (envs/dev/secrets.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
