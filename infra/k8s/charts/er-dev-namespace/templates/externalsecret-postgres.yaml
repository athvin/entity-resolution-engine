# The Postgres pod's own credentials (POSTGRES_PASSWORD for initdb, plus the
# §7.1 role passwords the init script creates). A third SM entry beside §9's
# erserver/erweb pair — the DSNs inside those embed er_app/er_provisioner
# passwords, and this entry is where the cleartext the *server* initializes
# from lives. Created by scripts/dev_env.sh, like the other two.
#
# No helm-hook dance here (unlike er-platform's): nothing in this chart is a
# hook, and the StatefulSet pod simply waits in CreateContainerConfigError for
# ESO's first sync — seconds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: er-postgres
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: er-postgres-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: er/{{ .Values.environment }}/{{ include "er-dev-namespace.name" . }}/postgres
