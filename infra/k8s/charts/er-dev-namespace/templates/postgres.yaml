# §7.1: the developer's Postgres — one instance holding the control-plane DB
# (erctl) and every tenant catalog DB, exactly the shape both compose files
# test. `-c max_locks_per_transaction=1024` is §2's first constraint: DuckLake's
# maintenance sweep drops every expired inlined-data table in one transaction
# and the default of 64 fails it with "out of shared memory" (the 2.2
# acceptance check runs `er lake maintain` to prove the flag took).
#
# The init script runs ONCE, on first init of an empty PGDATA (the postgres
# image contract): §7.1's roles — er_app for application traffic,
# er_provisioner (CREATEDB, never superuser) for ERSERVER_MAINT_DSN and the
# tenant catalog DBs it creates/owns.
apiVersion: v1
kind: ConfigMap
metadata:
  name: er-postgres-init
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
data:
  10-roles.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-postgres}" --dbname "${POSTGRES_DB}" <<-SQL
      CREATE ROLE er_app LOGIN PASSWORD '${ER_APP_PASSWORD}';
      CREATE ROLE er_provisioner LOGIN CREATEDB PASSWORD '${ER_PROVISIONER_PASSWORD}';
      ALTER DATABASE ${POSTGRES_DB} OWNER TO er_app;
    SQL
---
# Headless: the StatefulSet's governing service. DSNs use host `er-postgres`,
# which resolves to the single pod.
apiVersion: v1
kind: Service
metadata:
  name: er-postgres
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    app.kubernetes.io/name: er-postgres
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: er-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: er-postgres
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    app.kubernetes.io/name: er-postgres
    app.kubernetes.io/component: postgres
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
spec:
  serviceName: er-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: er-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: er-postgres
        app.kubernetes.io/component: postgres
        {{- include "er-dev-namespace.labels" . | nindent 8 }}
    spec:
      securityContext:
        # Run as the image's postgres user outright; fsGroup hands the PVC to
        # it so initdb works without an init-chown container.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # args (not command) keeps the image's docker-entrypoint.sh — the
          # same effective invocation as both compose files' `command:`.
          args: ["postgres", "-c", "max_locks_per_transaction=1024"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: erctl # the control-plane DB exists from birth (§12 step 2)
            # The PVC mounts at the data directory's parent; PGDATA one level
            # down keeps initdb away from lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            # POSTGRES_PASSWORD, ER_APP_PASSWORD, ER_PROVISIONER_PASSWORD —
            # from Secrets Manager via the er-postgres ExternalSecret, never
            # from a committed value (§8.5).
            - secretRef:
                name: er-postgres-env
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "erctl"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "erctl"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: er-postgres-init
            defaultMode: 0555
  # The §17 suspend check rests on this PVC outliving the pod: a misconfigured
  # volumeClaimTemplate silently gives an emptyDir instead (§7.1).
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "er-dev-namespace.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
