# §8.5/§12: default-deny ingress with only in-namespace traffic allowed — a
# bare podSelector (no namespaceSelector) matches pods in THIS namespace only,
# so alice's pods reach alice's Postgres and bob's cannot. This is the object
# the §17 Phase 2 check probes behaviourally: under the VPC CNI *without* the
# policy agent enabled it looks correct and enforces nothing.
#
# Egress is deliberately unrestricted: cross-namespace isolation holds because
# every developer namespace carries this same ingress deny, and the pods need
# S3, SES, ECR and Secrets Manager egress anyway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
{{- if .Values.webIngressFromVpc.enabled }}
---
# The one hole the edge needs (§4.1): the internal ALB's targets are pod IPs
# (target-type ip) and the connection originates from the ALB dataplane in the
# VPC — not from any pod — so it needs an ipBlock allowance.
#
# The selector is `web-api`, the label er-platform's MERGED pod actually
# carries. It used to say `er-web`, from when the BFF was its own Deployment;
# after the pods were merged nothing carried that label, so this policy selected
# NOTHING and `default-deny-ingress` would have blackholed the ALB the first
# time `ingress.enabled` was flipped on. It was never caught because both halves
# are off by default and are meant to be turned on together — the failure was
# waiting at the end of task 1.4, not in any diff.
#
# Selecting the merged pod does NOT expose the control plane, and that is the
# port list's doing rather than the selector's: the rule admits one port, the
# BFF's, and er-server's 8000 is not in it. §4.1's "er-api is on no load
# balancer in any environment" therefore still holds for the whole pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-web
  namespace: {{ include "er-dev-namespace.name" . }}
  labels:
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.webIngressFromVpc.vpcCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.webIngressFromVpc.port }}
{{- end }}
