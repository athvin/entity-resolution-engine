# The developer's namespace. Pod Security `baseline` ENFORCED (task 1.3 proved
# the admission is on: a privileged pod is rejected); restricted is surfaced as
# warn/audit so drift is visible without blocking the postgres image, which
# needs no privilege but is not fully `restricted`-clean.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "er-dev-namespace.name" . }}
  labels:
    {{- include "er-dev-namespace.labels" . | nindent 4 }}
    er.dupezero.com/developer: {{ include "er-dev-namespace.name" . }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
