# er-dev-namespace values. No credential ever lives here: the Postgres
# passwords and role passwords come from er/{environment}/{developer}/postgres
# in Secrets Manager, created by scripts/dev_env.sh at dev-up (§8.5).

# REQUIRED: the developer's name — it names the Namespace and the §9 secret
# path. `make dev-up DEV=alice` sets it.
developer: ""

environment: dev

externalSecrets:
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1h

postgres:
  # Dev's control-plane DB is the shared Aurora Serverless v2 cluster
  # (infra/terraform/envs/dev/rds.tf), not an in-cluster StatefulSet: pay-per-use
  # (scales to 0 ACU when idle), and database-per-developer (erctl_{dev}) gives
  # the same isolation the per-dev pod did. templates/bootstrap.yaml creates each
  # dev's role + database with this image's psql; scripts/dev_env.sh points the
  # erserver/erweb DSNs at Aurora. Pinned by digest, matching docker/compose.yaml.
  image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082

# §12: what stops one developer's 10M-row run from starving the cluster. The
# ephemeral-storage quota is what makes §5.3's spill sizing enforceable.
#
# jobs.batch is sized per batch-orchestration-design §7.2: the chart's own
# batch objects can hold ~7-8 Jobs at once (the drizzle and tenant-migrate
# hooks while they run, the drift CronJob's 1 live + 1+3 history, the
# idle-suspend CronJob's 1+1+1, a lingering bootstrap hook), and the executor
# adds one `er-t-…` Job per in-flight task attempt that then lingers for its
# 300 s TTL — `>= 8 + cap × (1 + ceil(ttl / mean_segment_seconds))`. With cap 1
# that computes to 14; 20 buys margin and is recomputed whenever the cap
# rises. (History: 8 after the 2.3 quota-stall incident, 10 for the
# idle-suspend history, 20 since the executor.)
quota:
  requestsMemory: 80Gi
  limitsCpu: "24"
  requestsEphemeralStorage: 900Gi
  jobs: 20
# LimitRange defaults — required so pods that omit a resource still pass the
# quota (a ResourceQuota on a resource rejects any pod with no request for
# it). Runner Jobs (2.3) always set their own explicit values.
limitRange:
  defaultRequest: { cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi }
  default: { cpu: "1", memory: 1Gi, ephemeral-storage: 4Gi }

# The idle-suspend CronJob (§5.2) was a Python script; it was removed in the
# all-Rust cutover. `make dev-suspend` performs the same scaling by hand until a
# Rust replacement lands.

# Escape hatch through the default-deny NetworkPolicy for the §4.1 internal
# ALB (target-type ip — the connection arrives from the ALB dataplane in the
# VPC, not from a pod). OFF until task 1.4 lands; enable together with
# er-platform's ingress.enabled.
webIngressFromVpc:
  enabled: false
  vpcCidr: 10.0.0.0/16
  port: 3000
