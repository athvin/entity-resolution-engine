# er-platform values. The committed defaults hold NO credentials and NO
# environment-specific identifiers beyond the nonprod registry/bucket names —
# every secret value lives in Secrets Manager and arrives via ExternalSecrets
# (infrastructure.md §8.5: the committed dev set in frontend/dev/env.sh stays
# exclusively in the local Compose path).

# The developer (== namespace) this install serves; defaults to the release
# namespace, so `helm -n alice upgrade --install er-platform …` needs no flag.
# Names the §9 Secrets Manager entries: er/{environment}/{developer}/{erserver,erweb}.
developer: ""

# The {env} half of the §9 secret names, and ERSERVER_ENV (anything but "dev"
# disables the FastAPI docs routes — §4.1).
environment: dev

images:
  registry: 797781631727.dkr.ecr.us-east-2.amazonaws.com
  # Shared default tag: CI pushes er-api/er-web by commit sha (ci.yaml). The
  # "latest" default never exists in ECR (tags are immutable, CI never pushes
  # it), so an install that forgot to pin fails at image pull instead of
  # silently running stale code. `make dev-up TAG=<sha>` sets it.
  tag: latest
  api:
    repository: er-api
    tag: "" # overrides images.tag when set
    digest: "" # sha256:…; takes precedence over any tag (§14.2 promote-by-digest)
  web:
    repository: er-web
    tag: ""
    digest: ""
  # There is no separate runner image (batch-orchestration-design §6.2): the
  # task pod runs the SAME er-api multicall image as `er-server exec-task`,
  # rendered into the task template by configmap-task-template.yaml. The
  # Python-era `images.runner` (`er-pipeline`) block is gone with the launcher
  # it described.

externalSecrets:
  # infra/k8s/secrets/cluster-secret-store.yaml, installed in task 1.6.
  # `enabled: false` (the kind profile) skips the ExternalSecrets entirely —
  # the install script then creates er-erserver-env/er-erweb-env directly,
  # because kind has no Secrets Manager to project from.
  enabled: true
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1h

# The shared writable filesystem (§6.2/§7.4): one EFS access point per
# namespace, created by `scripts/dev_env.sh up` at dev-up time. Both roots are
# subdirectories of the one mount — erserver creates them lazily
# (provision.py mkdirs config parents; api.py:334 mkdirs drop roots).
efs:
  fileSystemId: "" # fs-…       (required to install; the PV cannot mount without it)
  accessPointId: "" # fsap-…    (posix user 1001:1001 — the er uid in Dockerfile.api)
  mountPath: /srv/er
  # The kind profile: a node-local directory instead of EFS. When set, the PV
  # is a hostPath under the kind node's extraMount and the fs/accessPoint ids
  # are not required — batch-orchestration-design §11 Phase 2's kind probe.
  hostPath: ""

erserver:
  # s3://{lake.bucket}/{lake.prefix}/{ns}/ — §7.3's nonprod layout. prefix
  # defaults to dev/{developer}.
  lake:
    bucket: er-dev-lake-797781631727
    prefix: ""
  # ERSERVER_TENANT_DB_PREFIX; empty keeps the erserver default ("er_").
  tenantDbPrefix: ""
  email:
    # §7.5. `ses` sends through the SES API, signed by the pod's EKS Pod
    # Identity credentials (no key to mount, and none exists — see
    # infra/terraform/envs/dev/ses.tf). `log` renders to the pod log, which is
    # how a dev namespace gets the invite/verify links without AWS. Empty
    # leaves POST /v1/email answering 503, which the BFF's relay treats as
    # "not configured" and falls back from.
    backend: "" # ER_MAIL_BACKEND: ses | log | off
    from: "" # ER_MAIL_FROM; required by `ses`, which disables itself without it
    configurationSet: "" # ER_MAIL_CONFIGURATION_SET; terraform output ses_configuration_set_name

api:
  replicas: 1
  resources:
    # Defensive, per §2/§18.10: the read path attaches the *tenant's* DuckDB
    # env, so API memory must cover ER_DUCKDB_MEMORY_LIMIT in the tenant env
    # (the dev_env.sh default is 2GB) until the backend-design §8 split lands.
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 3Gi }

dispatcher:
  # The dispatcher is its own Deployment (deployment-dispatcher.yaml): the
  # `er-dispatcher` multicall arm under the `er-dispatcher` ServiceAccount,
  # which is the only identity holding Job-create RBAC
  # (batch-orchestration-design §6.7 — the Role that creates Jobs must not sit
  # on the pod that serves the API behind the BFF). replicas and strategy are
  # NOT values: the single-dispatcher model needs exactly one, so the template
  # hard-codes replicas 1 / Recreate.
  #
  # Legacy kinds still run IN this pod's process (the in-process arms of
  # dispatcher.rs); kinds listed in executor.dagKinds run as per-attempt
  # Kubernetes Jobs instead. A stuck legacy run therefore shows nothing in pod
  # events — read the `er-dispatcher` pod log and look for a stale
  # `dispatching`/`running` row holding the org's partial unique index; an
  # executor-kind run shows up as `er-t-…` Jobs and task_instances rows.
  pollSeconds: "" # ERSERVER_POLL_SECONDS; empty keeps the erserver default (2s)
  resources:
    # The dispatcher runs whole legacy pipelines in-process (DuckDB included),
    # so it keeps the API container's defensive memory ceiling until Phase 4
    # deletes the legacy arm.
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 3Gi }

# The Kubernetes executor (batch-orchestration-design §6): one Job per task
# attempt, rendered by the dispatcher from the mounted task template.
executor:
  # The rollout allowlist (§11): job kinds the executor runs as Kubernetes
  # Jobs; everything else stays on the in-process arms. Comma-separated,
  # EMPTY BY DEFAULT — the executor is inert until a kind is listed here.
  # Deleted in Phase 4 when the legacy arm goes.
  dagKinds: ""
  # Launch gate (§7.2): queued|running pod rows across orgs. Default 1 until
  # the account's Standard vCPU quotas are raised — with 8 vCPU and 4 consumed
  # by app+system nodes, a second runner node of any class cannot provision.
  inFlightCap: 1
  # §6.2: Postgres is the record; 300 s covers the watch's 5-min resync.
  ttlSecondsAfterFinished: 300
  # §4.5's capacity wait, seconds.
  quotaWaitSeconds: 30
  # The class table (infrastructure.md §6.5), rendered into the task template:
  # requests == limits, ER_DUCKDB_THREADS == cpu and duckdbMemory strictly
  # below memory in the SAME operation (D-SIZING invariants), spill to the
  # NVMe-backed emptyDir. L requests 12, never 16: a 16-vCPU node's
  # allocatable can never fit a 16-core request.
  classes:
    S: { cpu: "2", memory: 6Gi, duckdbMemory: 4GB, spill: 40Gi, nodepool: runner-sm }
    M: { cpu: "6", memory: 10Gi, duckdbMemory: 6GB, spill: 150Gi, nodepool: runner-sm }
    L: { cpu: "12", memory: 14Gi, duckdbMemory: 8GB, spill: 400Gi, nodepool: runner-l }
  # §7.1: priority orders the pending queue and never kills (all three classes
  # are preemptionPolicy: Never; infra/k8s/priorityclasses/, applied by
  # `make cluster-objects` because PriorityClass is cluster-scoped). Phase 2
  # renders `scheduled` into every template; the per-trigger choice
  # (interactive for UI "Run now", maintenance for lake_maintain) is Phase 3.
  priorityClass:
    interactive: er-task-interactive
    scheduled: er-task-scheduled
    maintenance: er-task-maintenance

# The schema reconciliation the deploy drives (entity-framework-design.md,
# "Upgrades"). The control plane migrates in the web-api pod's init container
# (not a value: it is how the pod boots). The tenant half is this:
tenantMigrate:
  # The post-upgrade hook Job that reconciles every active tenant's lake and
  # prints the per-tenant report; off only for a chart install with no tenants
  # to sweep.
  enabled: true
  # How long `er-server migrate-tenants` waits for the dispatcher to run the
  # sweep's jobs before reporting the stragglers as `timeout` (and failing the
  # hook). A tenant mid-run holds its lake until that run finishes; its own job
  # start reconciles the lake anyway.
  timeoutSeconds: 1800
  drift:
    # The same sweep on a timer: catches a lake altered or restored behind the
    # deploy's back, and a tenant that missed the sweep.
    enabled: true
    schedule: "17 4 * * *"

web:
  # `enabled: false` (the kind profile) drops the er-web container, its
  # Service and the drizzle hook: the kind probe exercises the orchestration
  # stack, and building the web image for a throwaway cluster buys nothing.
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

# Telemetry. `autoInstrument` and its Instrumentation CR are GONE: they
# injected a PYTHON agent into a pod that has run a Rust binary since the
# all-Rust cutover, into a deployment (`deployment-api.yaml`) that no longer
# exists, behind an annotation no template carried. It could never have worked,
# and left `traces`/`metrics` pipelines with zero producers while reading as
# though Phase 1 were done.
#
# What replaced it is in the binary: every entry point installs a `tracing`
# subscriber, the HTTP layer spans each request, and the generated query
# functions span each of the 245 declared statements. `endpoint` is where that
# goes once the exporter lands — 4318 because OTLP/HTTP is what the Rust
# exporter will speak (and the reason is now the dependency graph rather than a
# Python agent's limitation: gRPC would pull a second TLS stack).
otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4318
  # The default filter lives in `er_obs::init::DEFAULT_FILTER` and already pins
  # the noisy dependencies; this is the environment override §10.4 asks for and
  # which no chart has ever carried. Empty means "use the compiled default".
  logLevel: ""

# The §4.1 edge: internal ALB shared across dev namespaces via group.name,
# hostname published by external-dns into Cloudflare (unproxied). DISABLED by
# default — task 1.4 (ALB controller/IngressClass, external-dns, the wildcard
# cert) is blocked on user-side items; flip this on with the real class name
# and certificate ARN once 1.4 lands.
ingress:
  enabled: false
  className: alb
  groupName: er-dev
  domain: dupezero.com
  host: "" # defaults to {developer}.dev.{domain}
  certificateArn: ""
