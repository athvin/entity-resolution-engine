# The kind profile (batch-orchestration-design §11's probe): the er-platform
# chart with every AWS edge swapped for a local equivalent, and the executor ON
# for every kind the probe drives. Installed by scripts/kind_env.sh as
# `-f values-kind.yaml`; the image coordinates ride --set from the script.
#
# What this profile proves that no unit tier can: a real pod's projected token
# against a real API server's JWKS, adoption across a dispatcher restart,
# cancel-through-canceling against a live DuckDB, and — since the pipeline
# phase — a seven-stage run where each stage's pod hands the next one its work
# through the lake rather than through a shared process.
developer: er-kind
environment: kind

externalSecrets:
  # kind has no Secrets Manager; kind_env.sh creates er-erserver-env directly.
  enabled: false

web:
  # The probe exercises the orchestration stack; the BFF buys nothing here.
  enabled: false

efs:
  # The kind node's extraMount (infra/k8s/kind/cluster.yaml).
  hostPath: /mnt/er

erserver:
  email:
    backend: log

# Three pods carry these requests during the probe's phase 6 — the dispatcher
# and BOTH colours of web-api — so trimming them is worth three times what
# trimming any single pod is, which is why this is the lever rather than the
# executor classes. See the budget sums under `executor:` below.
#
# REQUESTS ONLY; the limits stay at the chart's `cpu: "1"`. A request is a
# scheduling reservation, not a ceiling, so a 100m er-server still bursts to a
# full core on an idle kind node — the startup probe's `ensure_schema` is
# unaffected. Lowering a LIMIT would have throttled it; lowering the request
# only stops it reserving capacity phase 6 needs for a pod that must actually
# be scheduled.
api:
  resources:
    requests: { cpu: 100m, memory: 512Mi }

dispatcher:
  resources:
    requests: { cpu: 100m, memory: 512Mi }

executor:
  # Every kind runs as per-attempt Kubernetes Jobs here, on the one kind node,
  # with no nodepool pinning — the allowlist that used to name three of them is
  # gone with the legacy arm (#645). What `check_kind.sh` exercises is still
  # chosen by the phases it runs, and `run_all_full` is the one that matters
  # most: the single-task kinds cannot show a stage reading what the previous
  # stage's PROCESS wrote.
  # Three — the same as the chart default, stated explicitly because the reason
  # differs. `run_all` is a strict chain, so the cap never gates the pipeline
  # regardless of its value; what it bounds here is how many DuckDB pods one
  # kind node inside a laptop's docker VM is asked to hold if a phase ever does
  # overlap. The probe's phases run sequentially, so in practice it is one.
  inFlightCap: 3
  # Sized for a GITHUB RUNNER, not for a laptop and not for EKS; every class
  # identical and unpinned because kind has one node and no Karpenter.
  #
  # These were `cpu: "1"` and that does not fit, which is why the probe step
  # had never once passed in CI. The task pod sat `Pending` for the whole of
  # phase 1's 420s budget and the job stayed `running`, so it surfaced as a
  # timeout rather than as the scheduling refusal it was:
  #
  #   FailedScheduling  0/1 nodes are available: 1 Insufficient cpu.
  #   no new claims to deallocate, preemption: not eligible due to
  #   preemptionPolicy=Never
  #
  # The arithmetic, measured rather than estimated. Committed on the node
  # before any task pod exists, with the `api`/`dispatcher` overrides below:
  #
  #   kube-system   0.95   (apiserver .25, controller-manager .20, etcd .10,
  #                         scheduler .10, kindnet .10, coredns 2x.10)
  #   er-postgres   0.10   (infra/k8s/kind/postgres.yaml)
  #   er-dispatcher 0.10
  #   web-api       0.10   (ONE container here — `web.enabled: false` above)
  #   ------------------
  #   steady state  1.25
  #
  # A standard GitHub-hosted runner on a private repository is 2 vCPU, so a
  # 1-CPU request could never be scheduled against the 1.55 this used to
  # commit. That the refusal happened at all is itself the measurement: with 4
  # allocatable there would have been 2.45 free and no failure.
  #
  # 250m leaves 0.50 spare against one task pod. The cost is wall clock, not
  # correctness: a quarter-core DuckDB stage is slower, which phase 5's 1800s
  # budget for seven sequential pods absorbs. `requests == limits` for task
  # pods and `preemptionPolicy: Never`, so there is no burst and nothing to
  # evict.
  #
  # The binding case is NOT a single task pod — it is the probe's phase 6,
  # which is the only point where three pods the steady state lacks exist at
  # once:
  #
  #   steady state            1.25
  #   + idle colour's web-api 0.10   (phase 6 scales it to replicas: 1)
  #   + a task pod            0.25
  #   + er-schema-migrate     0.10   (a PRE-UPGRADE hook, so every helm
  #                                   upgrade re-fires it — including the
  #                                   `color.active` flip that happens while
  #                                   the task is in flight)
  #   ---------------------------
  #   peak                    1.70   of ~2.0
  #
  # er-db-migrate is deliberately absent from that sum: it is guarded by
  # `web.enabled`, off here. Verified by rendering this profile, not assumed.
  #
  # Do not raise any of these without redoing both sums — the next 100m is the
  # difference between a probe that runs and one that reports a timeout for a
  # pod that never started. `check_kind.sh` asserts the phase 6 figure before
  # the phase runs, so a change that breaks it fails with both numbers rather
  # than as a five-minute `helm --wait` timeout.
  classes:
    S: { cpu: "250m", memory: 1Gi, duckdbMemory: 500MB, spill: 2Gi, nodepool: "" }
    M: { cpu: "250m", memory: 1Gi, duckdbMemory: 500MB, spill: 2Gi, nodepool: "" }
    L: { cpu: "250m", memory: 1Gi, duckdbMemory: 500MB, spill: 2Gi, nodepool: "" }
