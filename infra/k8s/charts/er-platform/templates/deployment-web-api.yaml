# web-api: the API and the BFF in one pod.
#   - er-server (Rust): the control-plane API on :8000. Internal only — the
#     dispatcher is its own Deployment now (deployment-dispatcher.yaml,
#     batch-orchestration-design §6.7): the identity that creates Jobs must
#     not sit on the pod serving the API behind the BFF, so
#     ER_DISPATCH_IN_PROCESS is gone from this pod.
#   - er-web (Next.js BFF): the browser-facing tier on :3000, talking to the
#     API over localhost. The only container exposed via the Ingress.
# Postgres stays its own StatefulSet. Recreate: the init container migrates the
# control-plane schema, and no old code may see a migrated schema mid-flight.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/component: web-api
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true" # §9.1 — roll on secret rotation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "er-platform.selectorLabels" (dict "root" . "name" "web-api") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web-api
        {{- include "er-platform.selectorLabels" (dict "root" . "name" "web-api") | nindent 8 }}
        {{- include "er-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: er-api
      # Endpoint removal is ASYNCHRONOUS with the SIGTERM: the kubelet signals
      # the containers at the same moment the endpoint controller starts telling
      # kube-proxy and the ALB to stop routing here. A process that drains
      # perfectly and then exits still refuses the requests that were in flight
      # across that gap. The `preStop` sleep on each container below is what
      # closes it — the signal is withheld for its duration while the pod keeps
      # serving — and this budget has to cover sleep + drain or the kubelet
      # SIGKILLs mid-drain and undoes the whole thing.
      #
      # 60 = 5s of preStop + 55s of drain. The upper bound is a read that
      # attaches the tenant's DuckDB environment, which is why api.resources
      # carries a 3Gi ceiling; Next's own guidance for its half asks for 10-30s.
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "er-platform.podSecurityContext" . | nindent 8 }}
      initContainers:
        # The control-plane schema, BEFORE the new er-server serves: the baseline
        # (every table) plus the reconciler (every column the catalog in this
        # image adds), each applied statement ledgered in public.schema_migrations.
        # Under Recreate the old pod is already gone, so no old code sees a
        # migrated schema mid-flight; a breaking difference (ERR_SCHEMA_BREAKING)
        # fails this container and the pod never starts, which is the halt a
        # half-migrated schema deserves. ensure_schema also rides the API's boot
        # (idempotent, advisory-locked), so a dev stack without this container
        # behaves the same.
        - name: er-migrate
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.api) }}
          command: ["er-server", "migrate"]
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1001
            runAsGroup: 1001
          env:
            {{- include "er-platform.erserverEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: er-erserver-env
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      containers:
        # --- the Rust control plane + in-process dispatcher ---
        - name: er-server
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.api) }}
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1001
            runAsGroup: 1001
          ports:
            - name: api
              containerPort: 8000
          env:
            {{- include "er-platform.erserverEnv" . | nindent 12 }}
            # The cancel route needs to know which kinds the EXECUTOR runs
            # (cancel-through-canceling vs the legacy arm); this populates
            # AppState.executor_kinds only — the API process never builds an
            # executor, that is the dispatcher Deployment's job.
            {{- with .Values.executor.dagKinds }}
            - name: ER_EXECUTOR_DAG_KINDS
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: er-erserver-env
          # Readiness answers "can this process serve", which is the question a
          # Service selector — and a blue/green cutover gate — actually asks.
          # Both probes used to point at /healthz, which is a static literal, so
          # a pod whose control plane was unreachable reported ready and kept
          # taking traffic it could only 500 on. /readyz connects and says so.
          #
          # Liveness stays on /healthz deliberately, and that split is the whole
          # point: a liveness probe that fails on a *dependency* outage restarts
          # a healthy pod and makes the outage worse. The reasoning is written
          # out at the two handlers in er-server/src/lib.rs.
          #
          # The startupProbe is what lets the other two drop initialDelaySeconds:
          # both are disabled until it passes, so the boot — which runs
          # ensure_schema — gets its own budget instead of a guessed delay.
          # 3s x 40 = 120s covers a cold Rust boot plus an Aurora resume from
          # 0 ACU (dev sets min_capacity 0, so an idle cluster takes ~15s).
          startupProbe:
            httpGet: { path: /readyz, port: api }
            periodSeconds: 3
            failureThreshold: 40
          # 6 x 5s = 30s of CONSECUTIVE failure before the pod leaves the
          # Service. With one replica, leaving is a hard 503 at the edge, and
          # /readyz times out after 2s — so an idle dev Aurora resuming would
          # otherwise flip a working pod out of rotation for the ~15s it takes to
          # wake. Long enough to ride that out, short enough that a genuinely
          # unreachable control plane is still reported.
          readinessProbe:
            httpGet: { path: /readyz, port: api }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: api }
            periodSeconds: 10
          # The native sleep action (GA since 1.30), NOT `exec: ["sleep", "5"]`:
          # an exec preStop depends on a shell and a coreutils `sleep` existing
          # in the image, and the day someone slims this image that dependency
          # fails silently — a preStop whose command cannot run is logged as a
          # FailedPreStopHook event and the container is signalled immediately,
          # which looks exactly like having no preStop at all.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: er-efs
              mountPath: {{ .Values.efs.mountPath }}
            - name: duckdb-tmp
              mountPath: /app/.tmp
            # The §6.4 key-set credential, EXPLICIT because automount stays
            # off: the three standard sources at the default path, so the
            # in-cluster client conventions work unchanged. er-server uses it
            # solely to read the cluster JWKS from
            # https://kubernetes.default.svc/openid/v1/jwks (the fixed path,
            # never the discovery document's jwks_uri) through the default
            # service-account-issuer-discovery grant — it holds no Role.
            # Deliberately NOT mounted into er-web.
            - name: api-server-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- if .Values.web.enabled }}
        # --- the Next.js BFF (browser-facing) ---
        - name: er-web
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.web) }}
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 3000
          env:
            # Same pod — reach the API over localhost, no Service hop.
            - name: ERSERVER_BASE_URL
              value: http://localhost:8000
            {{- if .Values.ingress.enabled }}
            - name: ERWEB_PUBLIC_BASE_URL
              value: https://{{ include "er-platform.host" . }}
            {{- end }}
            - name: ERSERVER_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: er-erserver-env
                  key: ERSERVER_OPERATOR_TOKEN
          envFrom:
            - secretRef:
                name: er-erweb-env
          # Same split as er-server above, for the same reason. `/` is the
          # marketing page: a static route, so it answered 200 from a container
          # whose environment was unusable and whose in-pod upstream had not
          # booted — useless as a cutover gate. /api/healthz validates the env
          # and probes er-server's /readyz over localhost.
          #
          # Liveness keeps `/`, and here the static page is exactly right: the
          # question is whether the node process is wedged, and nothing about a
          # dependency should restart it.
          #
          # The startup budget matches er-server's, because /api/healthz cannot
          # pass until er-server does — the pod takes no traffic until BOTH
          # halves work, which is the property the merged pod exists to give.
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          # Same gap, same fix. The Next server needs no code change for this:
          # the App Router already finishes in-flight requests and runs pending
          # `after()` callbacks on SIGTERM, and its own self-hosting guidance
          # asks the platform for a 10-30s drain window — which the pod-level
          # grace period above provides.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: er-efs
          persistentVolumeClaim:
            claimName: er-efs
        - name: duckdb-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: api-server-token
          projected:
            sources:
              - serviceAccountToken:
                  # The default API-server audience — this token authenticates
                  # the JWKS read, nothing else.
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
