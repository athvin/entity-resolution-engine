# Both ClusterIP, both selecting the merged web-api pod. er-api is on no load
# balancer in any environment (§4.1); er-web is reached through the Ingress.
# The Service names are unchanged so the Ingress and any er-api DNS references
# keep resolving — they just both point at the one web-api pod now.
apiVersion: v1
kind: Service
metadata:
  name: er-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: er-api
    app.kubernetes.io/component: web-api
    {{- include "er-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "er-platform.selectorLabels" (dict "root" . "name" "web-api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: er-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: er-web
    app.kubernetes.io/component: web-api
    {{- include "er-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "er-platform.selectorLabels" (dict "root" . "name" "web-api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
