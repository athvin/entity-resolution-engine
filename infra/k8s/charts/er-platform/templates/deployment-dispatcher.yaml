# er-dispatcher: the same Rust image as er-api with CMD overridden to the
# er-dispatcher binary (the in-process dispatcher — it runs the pipeline itself,
# no per-run k8s Jobs). §2 constraints:
#   - replicas 1 + strategy Recreate: a single claimer per queue (the
#     one-active-per-org index tolerates more, but the idle reaper assumes one);
#   - the same EFS mount as the API: the dispatcher re-loads each org's config +
#     drop files by path (ER_CONFIG_PATH / drop_root) on the run path.
# NOTE: the Python build needed a wait-for-api init container because the
# dispatcher's leader connection could block the API's ensure_schema. The Rust
# ensure_schema runs under pg_advisory_xact_lock (serialized), so concurrent
# boot is safe and the init container is gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: er-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: er-dispatcher
    app.kubernetes.io/component: dispatcher
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    # §9.1: with Recreate, a secret rotation is a brief gap in job dispatch
    # rather than a seamless rollout — rotation is scheduled, not arbitrary.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "er-platform.selectorLabels" (dict "root" . "name" "er-dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dispatcher
        {{- include "er-platform.selectorLabels" (dict "root" . "name" "er-dispatcher") | nindent 8 }}
        {{- include "er-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: er-dispatcher
      securityContext:
        {{- include "er-platform.podSecurityContext" . | nindent 8 }}
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: er-dispatcher
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.api) }}
          command: ["er-dispatcher"]
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "er-platform.erserverEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: er-erserver-env
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
          volumeMounts:
            - name: er-efs
              mountPath: {{ .Values.efs.mountPath }}
      volumes:
        - name: er-efs
          persistentVolumeClaim:
            claimName: er-efs
