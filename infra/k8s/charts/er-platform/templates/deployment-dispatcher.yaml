# The dispatcher, split out of the web-api pod (batch-orchestration-design
# §6.7): the Role that creates Jobs — arbitrary code in the namespace under the
# runner's AWS identity — must not sit on the pod that serves the API behind
# the BFF. The split is this chart change, not a code change: the image's
# `er-dispatcher` symlink dispatches on argv[0] (rust/Dockerfile) and runs the
# claim loop plus the Kubernetes executor, which owns every kind.
#
# replicas 1 / Recreate are hard-coded, not values: the single-dispatcher
# model (one claim loop, one watcher, adoption on start) assumes it is alone,
# and Recreate guarantees the old process is gone before the new one adopts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: er-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: er-dispatcher
    app.kubernetes.io/component: dispatcher
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true" # §9.1 — roll on secret rotation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "er-platform.selectorLabels" (dict "root" . "name" "er-dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dispatcher
        {{- include "er-platform.selectorLabels" (dict "root" . "name" "er-dispatcher") | nindent 8 }}
        {{- include "er-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: er-dispatcher
      # `dispatcher_bin.rs` installs a SIGTERM drain — finish the in-flight job,
      # then exit at the next loop top — and it was being given the 30s default,
      # which a legacy in-process run (a whole DuckDB pipeline, not a
      # write-back) blows through. The SIGKILL that follows strands the job's
      # row in `dispatching`/`running`, where it holds the dataset's partial
      # unique index and blocks every later job for that dataset. There is no
      # startup reclaim for the legacy arm: `pg::resume_job` is an OPERATOR
      # action that 409s on anything else, so recovery is a human. That is the
      # symptom values.yaml already warns about under `dispatcher`.
      #
      # Paid only when a job is actually in flight — an idle dispatcher sees the
      # flag and exits within one poll — so this is a ceiling, not a cost.
      #
      # The ceiling is bounded by the DEPLOY, not by how long a pipeline can
      # run. `Recreate` means the new pod waits for this one to go, and the CI
      # deploy runs `helm upgrade --wait --timeout 10m`; a grace period near
      # that would turn a long run into a FAILED deploy. Hence half of it, and
      # the two numbers have to move together.
      terminationGracePeriodSeconds: {{ .Values.dispatcher.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "er-platform.podSecurityContext" . | nindent 8 }}
      containers:
        - name: er-dispatcher
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.api) }}
          command: ["er-dispatcher"]
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1001
            runAsGroup: 1001
          env:
            {{- include "er-platform.erserverEnv" . | nindent 12 }}
            {{- with .Values.dispatcher.pollSeconds }}
            - name: ERSERVER_POLL_SECONDS
              value: {{ . | quote }}
            {{- end }}
            # The executor (§6) needs no per-kind opt-in: every kind runs as
            # per-attempt Jobs (#645). What decides whether this pod builds one
            # is its namespace and in-cluster identity, both of which it has.
            - name: ER_EXECUTOR_IN_FLIGHT_CAP
              value: {{ .Values.executor.inFlightCap | quote }}
            - name: ER_TASK_TEMPLATE_PATH
              value: /etc/er/task-template/task-template-S.yaml
            - name: ER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.images.api.digest }}
            - name: ER_IMAGE_DIGEST
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: er-erserver-env
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
          volumeMounts:
            # The legacy in-process arms and the control tasks read tenant
            # configs and drops from EFS, exactly as the merged pod did.
            - name: er-efs
              mountPath: {{ .Values.efs.mountPath }}
            - name: duckdb-tmp
              mountPath: /app/.tmp
            # The task template (configmap-task-template.yaml): a mounted
            # file, never read through the API.
            - name: task-template
              mountPath: /etc/er/task-template
              readOnly: true
      volumes:
        - name: er-efs
          persistentVolumeClaim:
            claimName: er-efs
        - name: duckdb-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: task-template
          configMap:
            name: er-task-template
