# Three ServiceAccounts (batch-orchestration-design §6.7):
#
#   er-api        — the merged web-api pod. Automount stays OFF: nothing in
#                   that pod talks to the Kubernetes API today. (When the
#                   projected-token credential of §6.4 lands, the pod gains an
#                   EXPLICIT projected API-server-audience volume to read the
#                   JWKS — automount stays off even then.)
#   er-dispatcher — the dispatcher Deployment. Automount ON, bound to the one
#                   namespaced Role (rbac-dispatcher.yaml): the only identity
#                   that can create Jobs, deliberately NOT the pod serving the
#                   API behind the BFF.
#   er-runner     — the task pod's identity. Automount OFF and no RBAC: the
#                   pod evaluates tenant-authored SQL, so it holds no
#                   Kubernetes credential at all. Its AWS identity is an EKS
#                   Pod Identity association (envs/dev/pod_identity.tf) for
#                   when the S3 lake is openable; EFS is today's data path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
