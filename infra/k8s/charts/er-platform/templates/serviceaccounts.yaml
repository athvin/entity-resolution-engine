# One ServiceAccount per deployable. None needs the Kubernetes API today, so
# token automount is off everywhere; task 2.3 flips er-dispatcher's on and
# grants it the §6.2 namespace-scoped Role (create/get/list/watch/delete on
# batch/jobs, read on pods) when the Job launcher lands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
