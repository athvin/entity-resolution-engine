# One ServiceAccount per deployable. Token automount is off everywhere except
# er-dispatcher, which is the one process that talks to the Kubernetes API: it
# creates a batch/v1 Job per run behind the §6 launch seam. Its authority is
# the namespace-scoped Role in rbac-dispatcher.yaml — batch/jobs CRUD plus pod
# read — and nothing wider. er-runner exists so the Job spec can name a
# ServiceAccount today and swap in per-tenant ones in Phase 4 (§6.4); the
# runner itself never calls the Kubernetes API, so its automount stays off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
