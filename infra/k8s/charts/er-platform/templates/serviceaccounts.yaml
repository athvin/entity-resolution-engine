# The merged web-api pod runs under one ServiceAccount. Token automount is off:
# nothing in the pod talks to the Kubernetes API (the dispatcher runs the
# pipeline in-process, so there are no per-run Jobs to create — the old
# er-dispatcher / er-runner SAs + their Job RBAC are gone).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: er-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
