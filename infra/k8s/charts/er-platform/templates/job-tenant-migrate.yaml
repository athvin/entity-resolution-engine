# The deploy's tenant sweep: after the new web-api pod is up, reconcile every
# active tenant's lake to the catalog this release carries, and report per
# tenant. `er-server migrate-tenants` enqueues one `lake_migrate` job per
# active org (the dispatcher in the web-api pod runs them, under the queue's
# one-active-job-per-org rule, which is the lake's writer lock), waits for them,
# prints one line per tenant, and exits non-zero if any tenant is `breaking`,
# `error` or `timeout` — so a tenant that cannot be reconciled fails the
# release visibly instead of failing its next run quietly.
#
# POST-upgrade, not pre-: the lake DDL comes from the NEW image's catalog, and
# every auto-applied change is additive, so old and new code both tolerate
# either state — the objection that rules out a pre-upgrade hook for the
# control plane (the old pod still serves) does not apply here. Correctness
# never depends on this Job: every lake job reconciles its lake first; the
# sweep is what makes "every deploy reconciles every tenant" true within the
# deploy rather than at each tenant's next run.
{{- if .Values.tenantMigrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: er-tenant-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: er-tenant-migrate
    app.kubernetes.io/component: migrations
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    # Keep a FAILED Job around for kubectl logs (the per-tenant report is its
    # output); a succeeded one is noise.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1 # the sweep is idempotent; one retry covers a pod not yet up
  activeDeadlineSeconds: {{ add .Values.tenantMigrate.timeoutSeconds 120 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: er-tenant-migrate
        {{- include "er-platform.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: er-api
      securityContext:
        {{- include "er-platform.podSecurityContext" . | nindent 8 }}
      containers:
        - name: tenant-migrate
          image: {{ include "er-platform.image" (dict "root" . "image" .Values.images.api) }}
          command: ["er-server", "migrate-tenants", "--timeout-secs", {{ .Values.tenantMigrate.timeoutSeconds | quote }}]
          securityContext:
            {{- include "er-platform.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1001
            runAsGroup: 1001
          env:
            {{- include "er-platform.erserverEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: er-erserver-env
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
{{- end }}
