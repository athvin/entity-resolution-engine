# §9: the two Secrets Manager entries this namespace consumes, projected into
# Kubernetes Secrets by ESO through the task-1.6 ClusterSecretStore. Each SM
# entry is a JSON object of exactly the §9 key list; dataFrom.extract turns
# every JSON key into a Secret key, so envFrom sees the variables verbatim.
#
# Rendered as pre-install/pre-upgrade HOOKS, not release resources, because the
# drizzle migration Job (also a pre-* hook, weight 0) reads ERWEB_DATABASE_URL
# from the projected Secret — on a first install a plain resource would not
# exist until after every hook had already run. Two consequences, both chosen:
#   - creationPolicy Orphan keeps the projected Secret alive across the
#     before-hook-creation delete/recreate on every upgrade (no reloader churn,
#     no envFrom gap for a pod starting mid-upgrade), and
#   - `helm uninstall` leaves both objects behind; dev-down deletes the whole
#     namespace, which collects them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: er-erserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: er-erserver-env
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: {{ include "er-platform.secretPath" . }}/erserver
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: er-erweb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "er-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: er-erweb-env
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: {{ include "er-platform.secretPath" . }}/erweb
