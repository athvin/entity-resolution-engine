{{- $org := required "orgId is required" .Values.orgId -}}
{{- $dataset := required "datasetId is required" .Values.datasetId -}}
{{- $client := required "clientNamespace is required" .Values.clientNamespace -}}
{{- if or (not (regexMatch "^[A-Za-z0-9_-]{1,128}$" $org)) (not (regexMatch "^[A-Za-z0-9_-]{1,128}$" $dataset)) -}}
{{- fail "orgId and datasetId must be immutable literal identifiers" -}}
{{- end -}}
{{- if or (gt (len $client) 63) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $client)) -}}
{{- fail "clientNamespace must be a Kubernetes namespace" -}}
{{- end -}}
{{- $namespace := printf "duckfleet-%s" (printf "%s\x00%s" $org $dataset | sha256sum | trunc 40) -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/part-of: duckfleet
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dataset-budget
  namespace: {{ $namespace }}
spec:
  hard:
    requests.cpu: "6"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 10Gi
    requests.storage: 20Gi
    persistentvolumeclaims: "1"
    pods: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
# Installed before the upstream fleet. Its own policy retains namespace-local
# catalog/worker communication. This additive rule opens only the HTTP gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: er-gateway-clients
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels: {app: duckfleet-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $client | quote }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: web-api}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $client | quote }}}
          podSelector:
            matchLabels:
              er.dupezero.com/duckfleet-dataset: {{ $namespace | quote }}
      ports: [{protocol: TCP, port: 8080}]
---
# No permissive bootstrap interval while the upstream release is absent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dataset-default-deny
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
