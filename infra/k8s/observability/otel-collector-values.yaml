# OTel Collector gateway (task 1.8, §10.5 topology: one Deployment every
# deployable pushes OTLP to; it batches and routes). Backend per §10.5: start
# with CloudWatch (EMF) for metrics and X-Ray for traces — not because they
# are the best backends but because the exporter is the swappable part. Moving
# to AMP/Grafana Cloud later is an `exporters:` edit in THIS file plus the
# §10.5 PII rule check (logs never leave the account; they do not flow through
# this gateway at all — the Fluent Bit DaemonSet owns logs).
#
# Chart: open-telemetry/opentelemetry-collector 0.175.1 — pin with --version.
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm --kube-context er-dev upgrade --install otel-collector open-telemetry/opentelemetry-collector \
#     --version 0.175.1 --namespace observability -f infra/k8s/observability/otel-collector-values.yaml
# (`make obs-up` runs exactly this.)
#
# Credentials: EKS Pod Identity on the `otel-collector` ServiceAccount
# (er-dev-otel-collector role, envs/dev/observability.tf).

mode: deployment
replicaCount: 1

# Service DNS pinned to otel-collector.observability — the name the
# er-platform chart's Instrumentation CR (and later §10.2 SDK config) points
# at. Renaming this breaks every OTLP sender.
fullnameOverride: otel-collector

image:
  # contrib, not core: awsemf and awsxray live only in the contrib
  # distribution. The AWS distro (ADOT) packages the same exporters; contrib
  # keeps us on the upstream release train.
  repository: otel/opentelemetry-collector-contrib
  tag: 0.161.0 # pinned to the chart's appVersion
command:
  name: otelcol-contrib

serviceAccount:
  create: true
  name: otel-collector

# The namespace cannot enforce PSS (the log DaemonSet needs hostPath), so this
# pod carries the restricted profile itself — the gateway handles every
# service's telemetry and deserves the tightest box available. The contrib
# image runs as uid 10001.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# OTLP in, nothing else: the chart's jaeger/zipkin defaults are surface we do
# not accept (null strips them from the rendered config).
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

# The ingest credential for the span store.
#
# `exporters.otlp_http/openobserve.headers.Authorization` is `${env:OPENOBSERVE_AUTH}`,
# and without this the collector does NOT fail — it logs
# `Configuration references unset environment variable` once and then sends an
# EMPTY Authorization header, so every span is a 401 that only OpenObserve's
# access log records. Observed exactly that way on the first real deploy.
#
# The secret is created by scripts/obs_up.sh from Secrets Manager, so no
# credential is in this file or in git.
extraEnvs:
  - name: OPENOBSERVE_AUTH
    valueFrom:
      secretKeyRef:
        name: openobserve-ingest
        key: OPENOBSERVE_AUTH

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # Tail sampling: the main cost lever, and config rather than code so it can
    # be retuned without a deploy. It MUST come before `batch` — batching first
    # would hand the sampler fragments of traces to decide on.
    #
    # TRAP, and a silent one: tail sampling requires every span of a trace to
    # reach ONE collector instance. `replicaCount: 1` above is load-bearing for
    # that. Scaling to 2 splits traces across sampling decisions with no error
    # anywhere — fix it with a two-tier gateway and a `loadbalancing` exporter
    # keyed on trace id, not by bumping the replica count.
    #
    # CONSEQUENCE, measured 2026-11-05 and not yet mitigated: because there is
    # exactly one replica and it is NOT protected from voluntary disruption,
    # Karpenter evicts it on every consolidation. The `app` nodepool runs
    # `consolidationPolicy: WhenEmptyOrUnderutilized` with
    # `consolidateAfter: 1m`, and the pod was observed moving to a brand-new
    # spot node three times inside 45 minutes ("Evicted pod: Underutilized").
    #
    # Each eviction discards whatever `decision_wait` was holding — up to 10s
    # of traces whose sampling decision had not been made — plus any in-flight
    # batch. Roughly a few percent of traces, lost invisibly: nothing errors,
    # and the gap looks like a quiet period.
    #
    # The obvious fix is `karpenter.sh/do-not-disrupt: "true"` in
    # `podAnnotations`, which is this repo's idiom for the runner pods. It is
    # NOT applied here, because `nodepools/app.yaml` has no `expireAfter` —
    # and `nodepools/runner-sm.yaml` records why that matters: "a
    # do-not-disrupt pod otherwise pins a node indefinitely", which would
    # leave an un-upgradeable node carrying AMI-level CVEs. Pinning the
    # collector therefore needs `expireAfter` on the app pool first, and that
    # pool also hosts web-api, reloader and openobserve, so it is a shared
    # capacity decision with a cost side rather than an observability tweak.
    #
    # Three ways out, for whoever takes it: `do-not-disrupt` plus `expireAfter`
    # on the app pool; a longer `consolidateAfter` there, which reduces churn
    # for every app workload but pays for idle nodes longer; or accept the loss
    # and stop reading short gaps as outages.
    # The PII boundary, enforced in flight rather than trusted.
    #
    # §10.4 is the one prohibition this system has: telemetry carries
    # identifiers and counts, never attribute values. Three things already
    # uphold it in code — `sql_span` has no parameter argument so there is
    # nowhere to put a bind value, `er_span::attr` declares three names
    # `Pii::Never`, and `er-schema/tests/sql_span_pii.rs` fails the build if
    # product code names one. This is the layer underneath all of that: an
    # ALLOWLIST, so an attribute nobody anticipated does not ship merely
    # because nobody thought to forbid it.
    #
    # Fail-closed by construction: `keep_keys` drops everything not named, so
    # the failure mode of forgetting an attribute is losing a field, not
    # leaking one. A denylist would have the opposite failure mode, which is
    # the wrong way round for a deduplication engine whose payload is names
    # and addresses.
    #
    # **If an attribute you expect is missing in OpenObserve, look here
    # first.** That is the cost of this control and it is deliberate.
    #
    # The list was built by MEASUREMENT, not from the code alone: a scan of
    # every span macro in the workspace found 37 names, and a real exported
    # Parquet file from the dev collector showed eight more that
    # `tracing-opentelemetry` adds on its own (`busy_ns`, `idle_ns`,
    # `thread.*`, `code.*`, `target`). Keeping only the 37 would have silently
    # dropped the CPU-versus-wall-time split, which is among the most useful
    # things on a stage span. A dependency bump that renames any of those SDK
    # attributes will drop it again, so re-measure after one.
    #
    # Resource attributes (`service.*`, `deployment.environment.name`,
    # `er.role`) are NOT affected: this touches span attributes only.
    # `service.name` / `service.version` are in the list because `init.rs` sets
    # them as FIELDS on the process span, distinct from the resource attributes
    # of the same names. `collector_allowlist.rs` caught that: without them the
    # process span loses its own identity while the resource keeps it, which is
    # the confusing half of a drop.
    #
    # `span.attributes`, not `attributes`. The bare form still works and the
    # collector REWRITES it, logging "one or more paths were modified to include
    # their context prefix, please rewrite them accordingly" on every start —
    # the same shape as the `otlphttp` -> `otlp_http` auto-rewrite noted below,
    # and the same risk: an auto-rewrite is one version away from being removed,
    # at which point the config is refused and the collector crashlooops while
    # the old pod keeps serving. Found by reading the collector's own startup
    # log, not by it failing.
    #
    # NOTE FOR ANYONE EDITING THE LIST BELOW: it is an OTTL expression, and OTTL
    # has NO comment syntax. A `#` line inside the `>-` block folds into the
    # expression and the collector refuses the whole config at startup —
    # `lexer: invalid input text "#..."` — which crashloops the new pod while
    # the old one keeps serving, so the ConfigMap looks updated and nothing
    # works. Keep commentary out here, in YAML.
    transform/pii_allowlist:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - >-
              keep_keys(span.attributes, [
                "er.statement", "er.generator", "er.rows", "er.outcome",
                "er.org", "er.dataset", "er.run_id", "er.stage",
                "er.action", "er.actor", "er.role", "er.request_id",
                "er.attempt", "er.duration_ms", "er.job_id", "er.job_kind",
                "er.members", "er.mode", "er.model_version",
                "er.rebuild_reason", "er.segment", "er.snapshot_end",
                "er.tf_snapshot_id", "er.trace_context",
                "db.system.name", "db.collection.name",
                "db.query.text", "db.query.summary",
                "http.request.method", "http.response.status_code",
                "http.route", "url.path", "error.type",
                "busy_ns", "idle_ns", "thread.id", "thread.name",
                "code.file.path", "code.line.number", "code.module.name",
                "target",
                "service.name", "service.version"
              ])

    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      expected_new_traces_per_sec: 200
      policies:
        # §10.2: "always sample pipeline runs" — hundreds a day, each the unit
        # the whole product is about.
        - name: pipeline-runs
          type: string_attribute
          string_attribute:
            key: er.job_kind
            values: [run_all_full, run_all_incremental, correct, train, lake_migrate, provision]
        - name: errors
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: slow
          type: latency
          latency:
            threshold_ms: 2000
        # Every mutation. A read you lose is a sample; a write you lose is a
        # hole in the only record of what changed.
        - name: mutations
          type: string_attribute
          string_attribute:
            key: http.request.method
            values: [POST, PATCH, PUT, DELETE]
        # Never sample away a super admin acting as a tenant.
        - name: impersonation
          type: boolean_attribute
          boolean_attribute:
            key: er.impersonating
            value: true
        # Goal #1, and the policy the plan listed that was missing until the
        # `er.action` attribute existed to key on.
        #
        # A click that causes a mutation was already kept by `mutations`, and
        # one that starts a run by `pipeline-runs`. What fell through was the
        # click that causes a GET — opening a record, filtering the inbox,
        # paging a table — which landed in `residual` and was therefore dropped
        # 90% of the time. That is the half of the click stream most likely to
        # be asked about ("what did this person look at before they merged
        # these two?"), and the volume is tiny next to the read path it sits in.
        #
        # Matches any non-empty `er.action`. The value comes from the closed
        # `UI_ACTIONS` vocabulary, validated at the BFF and shape-checked again
        # by `er_server::telemetry::acceptable_action`, so a regex this broad
        # cannot be driven to keep arbitrary traffic.
        - name: ui-interactions
          type: string_attribute
          string_attribute:
            key: er.action
            values: [".+"]
            enabled_regex_matching: true
        # Everything else — the GET read path, where the volume is.
        - name: residual
          type: probabilistic
          probabilistic:
            sampling_percentage: 10

  exporters:
    # --- the queryable half -------------------------------------------------
    # Self-hosted, in-account, on our own S3. Being in-account is what lets it
    # take logs as well as traces without crossing §8.5's boundary — the
    # constraint that forced §10.5's split-by-signal does not apply to a store
    # we run ourselves.
    # `otlp_http`, not `otlphttp`. The collector chart renamed it and still
    # auto-rewrites the old spelling, announcing on every install that
    # "auto-rewrite will be removed in a future release" — so the old name is a
    # chart bump away from failing. Surfaced by the first deploy that actually
    # rendered these values.
    otlp_http/openobserve:
      endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
      headers:
        Authorization: ${env:OPENOBSERVE_AUTH}

    # --- the in-account fallback -------------------------------------------
    # Kept wired deliberately, past the trial period. One shared store is one
    # point of failure, and the fallback is only a fallback while it is still
    # connected.
    #
    # NOTE: the X-Ray OTLP endpoint requires CloudWatch Transaction Search to
    # be ENABLED on the account (a one-time setting; it also auto-creates the
    # vended `aws/spans` group, which cannot be created by hand). Until then
    # this exporter returns errors and the collector logs them — which is
    # noisy but not data loss, because OpenObserve has the spans.
    awsxray:
      region: us-east-2
    awsemf:
      region: us-east-2
      # §10.3: operational metrics under one namespace; resource_class — never
      # tenant — is the dimension (cardinality rule).
      namespace: ER/Dev
      # Terraform-managed event group (30d, envs/dev/observability.tf);
      # CloudWatch extracts the metric data on ingest.
      log_group_name: /er/dev/metrics
      log_stream_name: otel-collector

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsemf, otlp_http/openobserve]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, transform/pii_allowlist, tail_sampling, batch]
        exporters: [awsxray, otlp_http/openobserve]
      # Still no OTLP logs pipeline. Logs ride stdout -> Fluent Bit, which is
      # the reliable path for an ephemeral Job: the runtime captures both
      # streams however the process exits, so logs survive exactly the crash
      # that loses unflushed OTLP spans (§10.5). Fluent Bit gains an
      # OpenObserve output beside its CloudWatch one, so the logs land in the
      # same store as the traces without this pipeline existing.
      logs: null

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
