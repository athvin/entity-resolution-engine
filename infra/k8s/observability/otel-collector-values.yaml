# OTel Collector gateway (task 1.8, §10.5 topology: one Deployment every
# deployable pushes OTLP to; it batches and routes). Backend per §10.5: start
# with CloudWatch (EMF) for metrics and X-Ray for traces — not because they
# are the best backends but because the exporter is the swappable part. Moving
# to AMP/Grafana Cloud later is an `exporters:` edit in THIS file plus the
# §10.5 PII rule check (logs never leave the account; they do not flow through
# this gateway at all — the Fluent Bit DaemonSet owns logs).
#
# Chart: open-telemetry/opentelemetry-collector 0.175.1 — pin with --version.
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm --kube-context er-dev upgrade --install otel-collector open-telemetry/opentelemetry-collector \
#     --version 0.175.1 --namespace observability -f infra/k8s/observability/otel-collector-values.yaml
# (`make obs-up` runs exactly this.)
#
# Credentials: EKS Pod Identity on the `otel-collector` ServiceAccount
# (er-dev-otel-collector role, envs/dev/observability.tf).

mode: deployment
replicaCount: 1

# Service DNS pinned to otel-collector.observability — the name the
# er-platform chart's Instrumentation CR (and later §10.2 SDK config) points
# at. Renaming this breaks every OTLP sender.
fullnameOverride: otel-collector

image:
  # contrib, not core: awsemf and awsxray live only in the contrib
  # distribution. The AWS distro (ADOT) packages the same exporters; contrib
  # keeps us on the upstream release train.
  repository: otel/opentelemetry-collector-contrib
  tag: 0.161.0 # pinned to the chart's appVersion
command:
  name: otelcol-contrib

serviceAccount:
  create: true
  name: otel-collector

# The namespace cannot enforce PSS (the log DaemonSet needs hostPath), so this
# pod carries the restricted profile itself — the gateway handles every
# service's telemetry and deserves the tightest box available. The contrib
# image runs as uid 10001.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# OTLP in, nothing else: the chart's jaeger/zipkin defaults are surface we do
# not accept (null strips them from the rendered config).
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

# The ingest credential for the span store.
#
# `exporters.otlp_http/openobserve.headers.Authorization` is `${env:OPENOBSERVE_AUTH}`,
# and without this the collector does NOT fail — it logs
# `Configuration references unset environment variable` once and then sends an
# EMPTY Authorization header, so every span is a 401 that only OpenObserve's
# access log records. Observed exactly that way on the first real deploy.
#
# The secret is created by scripts/obs_up.sh from Secrets Manager, so no
# credential is in this file or in git.
extraEnvs:
  - name: OPENOBSERVE_AUTH
    valueFrom:
      secretKeyRef:
        name: openobserve-ingest
        key: OPENOBSERVE_AUTH

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # Tail sampling: the main cost lever, and config rather than code so it can
    # be retuned without a deploy. It MUST come before `batch` — batching first
    # would hand the sampler fragments of traces to decide on.
    #
    # TRAP, and a silent one: tail sampling requires every span of a trace to
    # reach ONE collector instance. `replicaCount: 1` above is load-bearing for
    # that. Scaling to 2 splits traces across sampling decisions with no error
    # anywhere — fix it with a two-tier gateway and a `loadbalancing` exporter
    # keyed on trace id, not by bumping the replica count.
    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      expected_new_traces_per_sec: 200
      policies:
        # §10.2: "always sample pipeline runs" — hundreds a day, each the unit
        # the whole product is about.
        - name: pipeline-runs
          type: string_attribute
          string_attribute:
            key: er.job_kind
            values: [run_all_full, run_all_incremental, correct, train, lake_migrate, provision]
        - name: errors
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: slow
          type: latency
          latency:
            threshold_ms: 2000
        # Every mutation. A read you lose is a sample; a write you lose is a
        # hole in the only record of what changed.
        - name: mutations
          type: string_attribute
          string_attribute:
            key: http.request.method
            values: [POST, PATCH, PUT, DELETE]
        # Never sample away a super admin acting as a tenant.
        - name: impersonation
          type: boolean_attribute
          boolean_attribute:
            key: er.impersonating
            value: true
        # Everything else — the GET read path, where the volume is.
        - name: residual
          type: probabilistic
          probabilistic:
            sampling_percentage: 10

  exporters:
    # --- the queryable half -------------------------------------------------
    # Self-hosted, in-account, on our own S3. Being in-account is what lets it
    # take logs as well as traces without crossing §8.5's boundary — the
    # constraint that forced §10.5's split-by-signal does not apply to a store
    # we run ourselves.
    # `otlp_http`, not `otlphttp`. The collector chart renamed it and still
    # auto-rewrites the old spelling, announcing on every install that
    # "auto-rewrite will be removed in a future release" — so the old name is a
    # chart bump away from failing. Surfaced by the first deploy that actually
    # rendered these values.
    otlp_http/openobserve:
      endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
      headers:
        Authorization: ${env:OPENOBSERVE_AUTH}

    # --- the in-account fallback -------------------------------------------
    # Kept wired deliberately, past the trial period. One shared store is one
    # point of failure, and the fallback is only a fallback while it is still
    # connected.
    #
    # NOTE: the X-Ray OTLP endpoint requires CloudWatch Transaction Search to
    # be ENABLED on the account (a one-time setting; it also auto-creates the
    # vended `aws/spans` group, which cannot be created by hand). Until then
    # this exporter returns errors and the collector logs them — which is
    # noisy but not data loss, because OpenObserve has the spans.
    awsxray:
      region: us-east-2
    awsemf:
      region: us-east-2
      # §10.3: operational metrics under one namespace; resource_class — never
      # tenant — is the dimension (cardinality rule).
      namespace: ER/Dev
      # Terraform-managed event group (30d, envs/dev/observability.tf);
      # CloudWatch extracts the metric data on ingest.
      log_group_name: /er/dev/metrics
      log_stream_name: otel-collector

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsemf, otlp_http/openobserve]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [awsxray, otlp_http/openobserve]
      # Still no OTLP logs pipeline. Logs ride stdout -> Fluent Bit, which is
      # the reliable path for an ephemeral Job: the runtime captures both
      # streams however the process exits, so logs survive exactly the crash
      # that loses unflushed OTLP spans (§10.5). Fluent Bit gains an
      # OpenObserve output beside its CloudWatch one, so the logs land in the
      # same store as the traces without this pipeline existing.
      logs: null

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }
