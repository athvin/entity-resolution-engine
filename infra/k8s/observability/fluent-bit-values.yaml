# Fluent Bit log DaemonSet (task 1.8, §10.5 topology: logs stay on
# stdout/stderr and a DaemonSet tails them — the path that survives the crash
# that loses unflushed OTLP spans).
#
# Chart: eks/aws-for-fluent-bit 0.2.0 (app 3.2.1) — pin with --version.
#   helm repo add eks https://aws.github.io/eks-charts
#   helm --kube-context er-dev upgrade --install fluent-bit eks/aws-for-fluent-bit \
#     --version 0.2.0 --namespace observability -f infra/k8s/observability/fluent-bit-values.yaml
# (`make obs-up` runs exactly this.)
#
# Credentials: EKS Pod Identity on the `fluent-bit` ServiceAccount
# (er-dev-fluent-bit role, envs/dev/observability.tf). No IRSA annotation, no
# node role.

serviceAccount:
  create: true
  name: fluent-bit

# §10.4's substrate: runner-node logs must ship too — the engine's structured
# stage records land on a tainted runner node, and the PII-grep probe reads
# them from CloudWatch. Tolerate the runner taint (infra/k8s/nodepools/
# runner-*.yaml) so the DaemonSet lands there as well as on app nodes.
tolerations:
  - key: er.dupezero.com/runner
    operator: Exists
    effect: NoSchedule

# Two outputs, deliberately. CloudWatch is the in-account tier §10.4 already
# relies on and the one the PII-grep probe reads; OpenObserve is where the
# traces are, so sending logs there too is what makes "all my logs in one
# place" true rather than "traces in one place and logs in another".
#
# Both, not one, until OpenObserve has earned the CloudWatch leg's retirement:
# the debug tier can move once it has, but the audit trails never do — those
# are CloudTrail and Postgres tables (D-RETENTION), and a compliance artifact
# must not depend on a service we operate.

cloudWatchLogs:
  enabled: true
  match: "*"
  region: us-east-2
  # Terraform-managed group (30-day retention, §10.4); the role deliberately
  # lacks logs:CreateLogGroup, so a typo here fails loudly instead of creating
  # an unmanaged, retention-less group.
  logGroupName: /er/dev/containers
  autoCreateGroup: false
  # One stream per container, named so `aws logs filter-log-events
  # --log-stream-name-prefix <ns>.` scopes to a namespace.
  logStreamTemplate: $kubernetes['namespace_name'].$kubernetes['pod_name'].$kubernetes['container_name']
  # Fallback when the kubernetes filter could not attach metadata.
  logStreamPrefix: "unmatched-"

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# The span store, over the same OTLP/HTTP endpoint the collector uses. Fluent
# Bit's http output is used rather than an OTLP plugin because the shipped
# aws-for-fluent-bit image carries it unconditionally; the ingest path accepts
# newline-delimited JSON, which is exactly what the Rust subscriber writes.
additionalOutputs: |
  [OUTPUT]
      Name                 http
      Match                *
      Host                 openobserve.observability.svc.cluster.local
      Port                 5080
      URI                  /api/default/containers/_json
      Format               json
      Json_date_key        timestamp
      Json_date_format     iso8601
      compress             gzip
      HTTP_User            ${OPENOBSERVE_USER}
      HTTP_Passwd          ${OPENOBSERVE_PASSWORD}
      # A store that is down must not block the shipper or fill its buffer: the
      # CloudWatch output above is the durable path, so dropping here is the
      # right failure mode.
      Retry_Limit          2

# The ingest credential for the span store.
#
# The OpenObserve output below authenticates with `HTTP_User ${OPENOBSERVE_USER}`
# / `HTTP_Passwd ${OPENOBSERVE_PASSWORD}`, which Fluent Bit interpolates from
# the ENVIRONMENT. Without these the variables resolve empty and every push is
# a 401 — twice a second, visible only in OpenObserve's access log, which is
# exactly how it was found on the first real deploy.
#
# Created by scripts/obs_up.sh from Secrets Manager; nothing secret is in git.
env:
  - name: OPENOBSERVE_USER
    valueFrom:
      secretKeyRef:
        name: openobserve-ingest
        key: OPENOBSERVE_USER
  - name: OPENOBSERVE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openobserve-ingest
        key: OPENOBSERVE_PASSWORD
