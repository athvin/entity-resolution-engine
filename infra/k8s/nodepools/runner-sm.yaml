# §5/§5.1: S and M runner classes — 8 vCPU, local NVMe (Auto Mode stripes it
# RAID0 automatically). WhenEmpty ONLY: WhenEmptyOrUnderutilized would let a
# bin-packing consolidation discard an hour of a run; runner pods additionally
# carry karpenter.sh/do-not-disrupt (§6's Job spec). expireAfter handles AMI
# hygiene since a do-not-disrupt pod otherwise pins a node indefinitely.
# Tainted so only runner Jobs (which tolerate it) land on NVMe capacity.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: runner-sm
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      taints:
        - key: er.dupezero.com/runner
          value: "true"
          effect: NoSchedule
      requirements:
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["c6id", "c8id", "c5ad", "c5d", "m6id"]
        - key: eks.amazonaws.com/instance-size
          operator: In
          values: ["2xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: 72h
  disruption:
    consolidationPolicy: WhenEmpty
    # Let a finished runner node linger, so the NEXT job in a chain does not pay
    # a cold start. A pipeline session is a chain — provision, then imports, then
    # train, then run_all — and at 30s every link provisioned a fresh instance,
    # because the previous node was reclaimed half a minute after its pod exited.
    # Ten minutes turns that into one cold start per working session.
    #
    # The cost is the linger window when no second job arrives, which at the
    # measured c6id spot rate (incl. the ~12% Auto Mode fee, charged even on
    # spot) is about $0.02 per run against $0.001 at 30s — a few dollars a month
    # at one or two nodes. AWS's cost guidance for bursty workloads says keep
    # this short, which is right for a fleet of CI runners and wrong here.
    #
    # `WhenEmpty` and `expireAfter` do NOT change: D-DISRUPT's argument is that
    # `WhenEmptyOrUnderutilized` could discard an hour of a run mid-flight, and
    # a longer idle timer does nothing to that. Only the timer moves.
    consolidateAfter: 10m
