[project]
name = "er"
version = "0.1.0"
description = "Entity resolution, deduplication and golden record management"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Every distribution below has a row in DesignDoc.md S2.1 and is pinned to the
# literal there. S2.1's last rule makes this a closed set: adding a dependency
# means adding a row to the spec first, never a quiet edit here.
# dbt-adapters and dbt-common are transitive through dbt-core, but S5.0 relies on
# their contract-enforcement machinery, so S2.1 pins them and they are declared
# directly rather than left to the resolver.
dependencies = [
  "splink==5.0.0.dev5",
  "pyarrow==25.0.1",
  "duckdb==1.5.5",
  "dbt-core==1.12.2",
  "dbt-duckdb==1.11.0",
  "dbt-adapters==1.24.5",
  "dbt-common==1.39.0",
  "typer==0.27.1",
  "pydantic==2.13.4",
  "python-ulid==4.0.1",
  "boto3==1.43.72",
  "psycopg[binary]==3.3.4",
  "pyyaml==6.0.3",
]

[project.scripts]
# The single entry point of S4.0's orchestration contract. `main` exists so the
# script name is stable while the Typer app underneath it can be restructured.
er = "er.entrypoint:main"

[dependency-groups]
dev = [
  "pandas==3.0.5",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "hypothesis==6.165.7",
  "ruff==0.16.3",
  "mypy==2.3.0",
  "actionlint-py==1.7.7.23",
  "types-PyYAML==6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[tool.ruff]
target-version = "py312"
# 100 rather than the 88 default: the Python already in this repo is authored at
# 95-103 columns and the pipeline's SQL-bearing strings read badly narrower.
line-length = 100
# Keep reference Markdown and the legacy specification linter out of formatting.
extend-exclude = ["*.md", "scripts/lint_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/er"]

# These dependencies do not ship type information; application code stays strict.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# pandas is used by test comparison helpers.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test helpers are imported as helpers.*.
pythonpath = ["tests"]
# Model regeneration is exercised separately from the PR suite.
markers = [
  "slow: refits or regenerates a committed artifact; excluded from the PR path",
]
