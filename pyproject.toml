[project]
name = "er"
version = "0.1.0"
description = "Entity resolution and golden record pipeline (DesignDoc.md v1.1)"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Every distribution below has a row in DesignDoc.md S2.1 and is pinned to the
# literal there. S2.1's last rule makes this a closed set: adding a dependency
# means adding a row to the spec first, never a quiet edit here.
# dbt-adapters and dbt-common are transitive through dbt-core, but S5.0 relies on
# their contract-enforcement machinery, so S2.1 pins them and they are declared
# directly rather than left to the resolver.
dependencies = [
  "splink==4.0.16",
  "duckdb==1.5.5",
  "dbt-core==1.12.2",
  "dbt-duckdb==1.11.0",
  "dbt-adapters==1.24.5",
  "dbt-common==1.39.0",
  "typer==0.27.1",
  "pydantic==2.13.4",
  "python-ulid==4.0.1",
  "boto3==1.43.72",
  "psycopg[binary]==3.3.4",
  "pyyaml==6.0.3",
]

[project.scripts]
# The single entry point of S4.0's orchestration contract. `main` exists so the
# script name is stable while the Typer app underneath it can be restructured.
er = "er.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "hypothesis==6.165.7",
  "ruff==0.16.3",
  "mypy==2.3.0",
  "actionlint-py==1.7.7.23",
  "types-PyYAML==6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[tool.ruff]
target-version = "py312"
# 100 rather than the 88 default: the Python already in this repo is authored at
# 95-103 columns and the pipeline's SQL-bearing strings read badly narrower.
line-length = 100
# Two exclusions, both about files this project must not rewrite:
#   *.md            - ruff formats fenced python blocks inside Markdown. The only
#                     Markdown here is DesignDoc.md (the authority every gate is
#                     graded against), the board, and the committed v1.0 spec
#                     fixture. Their snippets are illustrative and elided, and
#                     MUST read as authored.
#   the loop scripts - scripts/board.py and scripts/lint_spec.py are the
#                     implementation loop's own machinery. They predate this gate,
#                     are not ruff-clean at any line length (F401, UP035, UP037,
#                     B904 and lines the formatter both splits and collapses), and
#                     every ticket lists them as protected_paths. Linting a file no
#                     ticket may edit turns the gate into a permanent red light
#                     rather than a check. Reformatting them needs its own ticket.
extend-exclude = ["*.md", "scripts/board.py", "scripts/lint_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/er"]

# boto3 and botocore ship no `py.typed` and S2.1 pins no stub distribution for them,
# so `src/er/lake/objectstore.py` cannot even `import boto3` under the gate. The
# override is deliberately narrow: it names those two distributions and nothing else,
# so every module under `src/er` is still checked at full `--strict`. `psycopg` needs
# no entry here -- it ships `py.typed`, which is why `lake/catalog.py` is fully typed.
#
# `follow_untyped_imports` was tried first and is worse: mypy then reads boto3's
# unannotated source, and `--strict`'s disallow_untyped_calls rejects every call into
# it, which could only be silenced by weakening the gate on our own code.
#
# The durable fix is S2.1's own precedent -- its PyYAML row pins `types-PyYAML`
# precisely because an `ignore_missing_imports` override loosens this gate. boto3 has
# the same problem and no such row; adding one is a spec amendment, not a code ticket.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# pandas has the same shape as boto3 above and reaches the gate for the same reason:
# S8.2.1 pins `assert_golden_equal(actual: pd.DataFrame, ...)` verbatim, so
# `tests/helpers/compare.py` must name that type, and `mypy --strict tests/helpers` is
# ER-027's verify command. pandas 3.0.5 ships no `py.typed`, and S2.1 pins no
# `pandas-stubs` row -- pandas is present only transitively through Splink. Adding that
# row is a spec amendment, which a code ticket may not make, so the narrow override is
# the same trade S2.1's PyYAML/boto3 split already records.
#
# Deliberately narrow, and narrower in effect than it looks: it names pandas alone, and
# the only module under this override's influence is `tests/helpers/compare.py`, which
# `[tool.mypy] files` does not even check -- every module under `src/er` is still
# checked at full `--strict` with no pandas import anywhere in it.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` on sys.path so `helpers.compare` is the module name under pytest as well as
# under `mypy --strict tests/helpers`, which derives it by walking up while
# `__init__.py` exists and stops at `tests/` (which has none). One spelling in both
# tools, and no `tests/__init__.py` -- pytest's rootdir-based collection does not want
# one, and `tests/conftest.py` belongs to ER-018.
pythonpath = ["tests"]
