scenario: merge_scenario

# `base` holds two entities the model keeps apart, and `batch` delivers the one record
# that joins them (S8.2). The two sides disagree on given name, email, phone and
# birth_date and agree on family name, address and postal, so every cross pair is
# blocked under `name_postal`, scored and REJECTED rather than never compared — which
# is what makes the base partition an honest two rather than an artefact of a blocking
# rule that never fired.
#
# The bridging record straddles the two sides: it carries the B-side's given name and
# email, the A-side's birth_date, the shared family name and address, and no phone at
# all (a null hits `is_null_level` and contributes a Bayes factor of 1 — no evidence
# either way). Agreement on email + address clears `auto_merge` against the B-side and
# agreement on birth_date + address clears it against the A-side, while the two sides
# still disagree on too much to match each other directly. That asymmetric straddle is
# what produces a merge under `model_test_v1`.
phases: [base, batch]

# No expected/*/golden.csv. `golden_records` is first written in M4 and reaping the
# loser's golden row is T-INC-2's assertion (ER-092), so a golden expectation here
# would be a claim this milestone cannot check. S8.2.1 makes an absent expected file
# mean the phase claims nothing about that relation, so the omission is the encoding.
