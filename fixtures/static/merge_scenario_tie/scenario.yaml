scenario: merge_scenario_tie

# The even-overlap variant of `merge_scenario`. Both old entities hold exactly two
# members and the new group contains all four plus the bridge, so `|g_new ∩ g_old|` is
# 2 for both and the largest-overlap half of S4.5.3's claimant rule cannot decide the
# survivor. What decides it is the tiebreak — `min member record_key ASC` within the
# overlap — and `billing:B601` sorts before `billing:B602`, so the entity holding
# `billing:B601` survives.
#
# The bridge is built the same way as the non-tie scenario's: the B-side's given name
# and email, the A-side's birth_date, the shared family name and address, and no phone
# at all (a null hits `is_null_level` and contributes a Bayes factor of 1 — no evidence
# either way — so the missing phone argues neither for nor against either side).
phases: [base, batch]

# No expected/*/golden.csv, for the reason `merge_scenario/scenario.yaml` states: the
# loser's golden row is ER-092's assertion, and S8.2.1 spells "this phase claims
# nothing about that relation" as an absent file.
