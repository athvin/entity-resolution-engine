tenant: acct_10
entity_type: account

# NOTE on `comparisons` and `blocking`: unlike `acct_base` and `acct_test`, which
# each declare a single `company_name` comparison and a single domain blocking
# rule, this config is deliberately COHERENT WITH `acct_model_v1.json` — the same
# four comparisons, the same levels, and the same three blocking rules the model
# generates predictions from. A cluster-count grid search over the score scale is
# only meaningful if the config the pipeline compiles and the model it scores with
# describe the same comparison space.

thresholds:
  auto_merge: 0.95
  review_low: 0.60

standardization:
  email_strip_plus_addressing: false
  email_placeholders: []
  phone_default_region: US

sources:
  crm:
    adapter: csv
    priority_rank: 1
    record_id_column: crm_id
    updated_at_column: last_modified
    date_format: "%Y-%m-%d"
    columns:
      company_name: company
      domain:       website
      phone:        phone
      addr_street:  street
      addr_city:    city
      addr_region:  state
      addr_postal:  zip
  vendors:
    adapter: csv
    priority_rank: 2
    record_id_column: vendor_id
    updated_at_column: modified
    date_format: "%Y-%m-%d"
    columns:
      company_name: name
      domain:       url
      phone:        tel
      addr_street:  addr1
      addr_city:    town
      addr_region:  region
      addr_postal:  postcode
  billing:
    adapter: csv
    priority_rank: 3
    record_id_column: billing_id
    updated_at_column: updated_at
    date_format: "%Y-%m-%d"
    columns:
      company_name: account_name
      domain:       web
      phone:        telephone
      addr_street:  address_line1
      addr_city:    city
      addr_region:  state_code
      addr_postal:  postal

# The three rules `acct_model_v1` generates predictions from. The company-prefix
# rule is what makes `same_name_distinct_company` and `subsidiary_distinct`
# reachable at all: without it, two companies that share neither a domain nor a
# phone are never compared, and those traps would measure nothing.
blocking:
  - { key_type: domain_exact,   expr: "domain_norm" }
  - { key_type: phone_exact,    expr: "phone_e164" }
  - { key_type: company_prefix, expr: "substr(company_name_norm,1,6)" }

# `acct_model_v1.json` carries a fourth company-name level — "company_variants
# intersection >= 1" — and this config deliberately does NOT declare the
# `variant_match` that would compile to it. `er-compile` emits that level as
# `list_intersect("name_variants_l", "name_variants_r")`, hardcoding the PERSON
# column (er-compile/src/lib.rs:400; `company_variants` appears nowhere in the
# crate). An account config declaring `variant_match` therefore compiles,
# publishes, and then fails every run at predict with
# `Binder Error: ... does not have a column named "name_variants"`.
# That is the same shape as the `tf: true`-without-an-exact-level bug (#616):
# accepted at config time, fatal at run time. Until it is either refused in
# `config_check` or taught `company_variants`, the level cannot appear here.
comparisons:
  company_name_norm: { levels: [exact, jaro_winkler:0.92, null] }
  domain_norm:       { levels: [exact, null] }
  phone_e164:        { levels: [exact, null] }
  addr_postal:       { levels: [exact, null] }

survivorship:
  company_name: [source_priority, recency]
  domain:       [source_priority, recency]
  phone_e164:   [validated, source_priority, recency]
  address:      [source_priority, recency]

training:
  deterministic_rules:
    - "l.domain_norm = r.domain_norm"
  recall: 0.85
  u_max_pairs: 1000000
  u_seed: 20260101
  u_sampling_method: bernoulli
  u_min_count_per_level: null
  u_num_chunks: 10
  em_blocking_rules:
    - "l.domain_norm = r.domain_norm"
  em:
    fix_u_probabilities: true
    max_pairs: null

storage:
  data_path: "s3://lake/er/"
  drop_dir: "/app/drop"
  model_uri_prefix: "s3://lake/models/acct/"

versions:
  std_version: "1"
  survivorship_version: "1"
  address_parser_version: "1"

generator:
  seed: 42

clustering:
  max_iterations: 50
  cut_protect_probability: 1.0

coherence:
  scorer: noop

correction_pass:
  cadence: "0 3 * * 0"
