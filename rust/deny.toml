# cargo-deny configuration. Run locally with `cargo deny check`.
# CI runs advisories (RustSec) + licenses + bans on every push/PR.

[advisories]
# Fail on any security advisory or unmaintained/yanked crate.
yanked = "deny"
version = 2
# The three RUSTSEC entries below are *unmaintained* notices (not
# vulnerabilities). We control none of them and none has a safe upgrade:
#   - RUSTSEC-2024-0436: `paste` (feature-complete proc-macro, via arrow/datafusion),
#     pulled by the entity framework's analyser (ff-analysis's DataFusion 52 +
#     arrow 57 subtree).
#   - RUSTSEC-2024-0449: `unsafe-libyaml`, via feather-flow's `serde_yaml`. Our own
#     crates deliberately use `serde_norway` instead; this reaches us only through
#     ff-analysis. Retire when feather-flow moves off serde_yaml.
#   - RUSTSEC-2026-0441: `pin-utils`, archived 2026-10-01 after 0.1.1. It arrives
#     through `aws-smithy-http`, so the whole AWS SDK surface depends on it:
#     aws-config, aws-runtime, aws-sdk-s3, aws-sdk-sesv2 and aws-sdk-sts, all of
#     which er-server needs for Pod Identity, the sccache bucket and SES mail.
#     The advisory states "No safe upgrade is available!" — the fix is for smithy
#     to move to `core::pin::pin!` or pin-project-lite, which is upstream's call
#     and not ours. Swapping the SDK is not an option either: the aws crates are
#     pinned `default-features = false` because the default TLS resolves to
#     aws-lc-rs, which needs a cmake the build image does not carry.
#
#     What it actually is: a pin-projection macro crate whose repository was
#     archived. Archived is a maintenance status, not a defect — there is no
#     reported flaw in the code, and `pin_mut!` has simply been superseded by a
#     std macro. Retire this entry when the AWS SDK drops the dependency; a
#     `cargo tree -i pin-utils` returning nothing is the signal.
#
# There is deliberately no `zip` exception here any more. One existed for `zip`
# 6.0.0 — a registry yank plus three extract-time path-handling advisories
# (RUSTSEC-2026-0367/-0368/-0369) — held open because libduckdb-sys pinned that
# version and nothing here extracts an untrusted archive. libduckdb-sys has since
# moved to zip 9.0.5, so all four entries were dead, and cargo-deny said so
# ("advisory was not encountered", "yanked crate not detected"). A dead `yanked`
# exception is worse than none: it keeps `yanked = "deny"` switched off for that
# crate for good, and its comment misinforms the next reader.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0441",
]

[licenses]
# Allow only permissive licenses typical for this dependency tree.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate (bloats the binary).
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io by default.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# feather-flow's ff-analysis is the entity framework's SQL analyser (DataFusion
# planning against the entity catalog). It is a sibling repo by the same author,
# pinned by rev in er-sql-check; a tag replaces the rev once the integration
# settles. Public repo, fetched over HTTPS in CI.
allow-git = ["https://github.com/athvin/feather-flow"]
