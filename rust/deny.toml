# cargo-deny configuration. Run locally with `cargo deny check`.
# CI runs advisories (RustSec) + licenses + bans on every push/PR.

[advisories]
# Fail on any security advisory or unmaintained/yanked crate.
yanked = "deny"
version = 2
# zip 6.0.0 was yanked upstream with no 6.x replacement published, and it is pinned
# transitively by libduckdb-sys (=1.10505.0) — the exact DuckDB our determinism/golden
# baselines depend on, which we deliberately do not bump. A yank is a registry
# withdrawal, not a vulnerability; this is a narrow exception (yanked = "deny" still
# applies to every other crate) until a replacement 6.x publishes.
#
# The two RUSTSEC entries below are *unmaintained* notices (not vulnerabilities),
# pulled transitively by the entity framework's analyser (ff-analysis's DataFusion
# 52 + arrow 57 subtree). We do not control either and neither is a safe-upgrade:
#   - RUSTSEC-2024-0436: `paste` (feature-complete proc-macro, via arrow/datafusion).
#   - RUSTSEC-2024-0449: `unsafe-libyaml`, via feather-flow's `serde_yaml`. Our own
#     crates deliberately use `serde_norway` instead; this reaches us only through
#     ff-analysis. Retire when feather-flow moves off serde_yaml.
ignore = ["zip@6.0.0", "RUSTSEC-2024-0436", "RUSTSEC-2024-0449"]

[licenses]
# Allow only permissive licenses typical for this dependency tree.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate (bloats the binary).
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io by default.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# feather-flow's ff-analysis is the entity framework's SQL analyser (DataFusion
# planning against the entity catalog). It is a sibling repo by the same author,
# pinned by rev in er-sql-check; a tag replaces the rev once the integration
# settles. Public repo, fetched over HTTPS in CI.
allow-git = ["https://github.com/athvin/feather-flow"]
