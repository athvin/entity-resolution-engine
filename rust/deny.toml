# cargo-deny configuration. Run locally with `cargo deny check`.
# CI runs advisories (RustSec) + licenses + bans on every push/PR.

[advisories]
# Fail on any security advisory or unmaintained/yanked crate.
yanked = "deny"
version = 2

[licenses]
# Allow only permissive licenses typical for this dependency tree.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate (bloats the binary).
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io by default.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
