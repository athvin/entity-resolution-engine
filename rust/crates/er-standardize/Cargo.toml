[package]
name = "er-standardize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Every file in tests/ is a module of tests/main.rs, not a target of its own
# (sccache cannot cache a final link). See tests/main.rs.
autotests = false
[dependencies]
er-std = { path = "../er-std" }
er-config = { path = "../er-config" }
er-hash = { path = "../er-hash" }
dedupe-core = { path = "../dedupe-core" }
anyhow.workspace = true

[dev-dependencies]
er-ingest = { path = "../er-ingest" }
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
