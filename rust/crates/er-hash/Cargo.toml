[package]
name = "er-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Every file in tests/ is a module of tests/main.rs, not a target of its own
# (sccache cannot cache a final link). See tests/main.rs.
autotests = false
[dependencies]
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
serde_json.workspace = true
er-schema = { path = "../er-schema" }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
