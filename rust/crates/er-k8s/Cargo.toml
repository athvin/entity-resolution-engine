[package]
name = "er-k8s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Kubernetes half of batch-orchestration-design §6: the PodApi seam, the per-attempt Job manifest, the watch/observer discipline, and the pure pre-start and terminal classifiers."

[dependencies]
# kube 4.0.x is the recorded dependency decision (design §11 Phase 0): it holds
# under the workspace's 1.88 floor where 4.2 wants 1.89, and it must never pull
# aws-lc-rs — rustls/ring is the one crypto stack this image links.
kube = { version = "=4.0.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime"] }
# 0.28 is what kube 4.0 pins; its newest API-types feature is v1_33, which
# serves a 1.36 cluster fine for the stable batch/v1 + core/v1 surface this
# crate touches (the design named v1_36; that feature arrives with kube 4.2).
k8s-openapi = { version = "0.28", features = ["v1_33"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
