[package]
name = "er-k8s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Kubernetes half of batch-orchestration-design §6: the PodApi seam, the per-attempt Job manifest, the watch/observer discipline, and the pure pre-start and terminal classifiers."

[dependencies]
# kube 5.0.x, with the workspace floor raised to 1.89 for it (design §11 Phase 0
# named that raise as the recorded dependency decision). It must never pull
# aws-lc-rs — rustls/ring is the one crypto stack this image links.
kube = { version = "=5.0.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime"] }
# 0.29 is what kube 5.0 pins; the two must move together, or the build carries
# two copies of every API type. v1_33 serves a 1.36 cluster fine for the stable
# batch/v1 + core/v1 surface this crate touches.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
