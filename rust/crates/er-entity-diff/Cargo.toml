[package]
name = "er-entity-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# DELIBERATELY NOT `autotests = false`. Every other multi-file test crate in this
# workspace collapses its `tests/*.rs` into one binary, because sccache cannot
# cache a final link. This one cannot yet: `pg_diff.rs` and `pg_reconcile.rs`
# both connect to the single database named by `ER_TEST_PG_DSN`, so as modules of
# one binary they run as concurrent threads against shared tables. That is not
# theoretical — it was tried, and Postgres returned
# `E40P01 deadlock detected` (one test waiting on AccessShareLock on the schema
# while the other held AccessExclusiveLock on a relation it was retyping).
#
# er-server solved this with a database per test (`tests/common/fresh_db`), which
# is what would have to come here first. It is only two links, so it was not
# worth duplicating that helper or extracting it into a shared dev-dependency
# crate for; revisit together if a third Postgres test lands here.

# The schema differ: reads a live store's actual columns (Postgres via
# information_schema, DuckLake via duckdb_columns) and compares them to the entity
# catalog, classifying each difference safe vs breaking. The migration-plan writer
# and the boot-time applier build on this.
[dependencies]
er-entity-spec = { path = "../er-entity-spec" }
# The migration-plan writer renders CREATE TABLE / ADD COLUMN from the catalog.
er-entity-gen = { path = "../er-entity-gen" }
tokio-postgres = { workspace = true }
duckdb = { workspace = true }
thiserror = { workspace = true }
er-ids = { version = "0.1.0", path = "../er-ids" }
er-entities = { version = "0.1.0", path = "../er-entities" }
er-schema = { version = "0.1.0", path = "../er-schema" }
chrono.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
serde_norway = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
