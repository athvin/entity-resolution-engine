kind: entity
version: 1
name: widget
relation: widgets
description: "A control-plane entity shaped to exercise V7_foreign_key_column_misnamed."
key: [id]
generate:
  stores: [postgres]
  languages: [rust]
columns:
  - name: id
    type: varchar
    nullable: false
    description: "The row's id (UUIDv7)."
  - name: tenant
    type: varchar
    nullable: false
    references: { relation: orgs, column: id }
    description: "The tenant the row belongs to."
  - name: created_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "When the row appeared."
  - name: updated_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "Wall-clock last-write time."
