kind: entity
version: 1
name: widget
relation: widgets
description: "A control-plane entity shaped to exercise V5_control_timestamp_is_not_wall_clock."
key: [id]
generate:
  stores: [postgres]
  languages: [rust]
columns:
  - name: id
    type: varchar
    nullable: false
    description: "The row's id (UUIDv7)."
  - name: created_at
    type: timestamp
    nullable: false
    description: "When the row appeared."
  - name: updated_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "Wall-clock last-write time."
