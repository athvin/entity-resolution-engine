kind: entity
version: 1
name: thing
relation: things
description: "An append-enabled lake entity with a LIST column."
key: [id]
generate:
  stores: [duckdb]
  languages: [rust]
  append: true
columns:
  - name: id
    type: varchar
    nullable: false
    description: "Row identifier."
  - name: tags
    type: list<varchar>
    description: "Unsupported append value."
  - name: created_at
    type: timestamp
    nullable: false
    description: "Run-logical creation time."
  - name: updated_at
    type: timestamp
    nullable: false
    description: "Run-logical update time."
