kind: entity
version: 1
name: widget
relation: widgets
description: "A control-plane entity shaped to exercise V9_reference_to_an_unknown_relation."
key: [id]
generate:
  stores: [postgres]
  languages: [rust]
columns:
  - name: id
    type: varchar
    nullable: false
    description: "The row's id (UUIDv7)."
  - name: parent_id
    type: varchar
    nullable: false
    references: { relation: parents, column: id }
    description: "Points at a relation no entity declares."
  - name: created_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "When the row appeared."
  - name: updated_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "Wall-clock last-write time."
