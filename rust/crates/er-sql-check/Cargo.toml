[package]
name = "er-sql-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The static analyser: loads the statement/function YAML, rewrites what DataFusion
# cannot plan (DuckLake `AT (VERSION => ..)`, Postgres `RETURNING`/`ON CONFLICT`,
# named params), plans each statement against a two-store catalog via ff-analysis,
# runs the E0xx passes, and (later) emits the typed query functions + the oracle.
#
# ff-analysis is pinned by the `er-entity-v0.1.4` tag on feather-flow (public):
# the integration baseline (store-qualified get_table_source + plan_statement for
# a pre-parsed AST), the DuckDB json/list function stubs the engine's stage SQL
# calls (to_json, map_from_entries, json_keys, array_length, now, list), and the
# golden-lineage constructs (v0.1.2): a custom ExprPlanner for DuckDB `MAP {..}`
# literals + subscript access, window-function stubs (row_number, rank, lag, …),
# and concat/concat_ws/element_at; v0.1.3 adds the standardization-stage
# surface — json payload accessors, LIST(VARCHAR)-typed list shaping, unicode
# normalizers, variadic regexp forms, and array-literal planning (the
# source_metadata lambdas are rewritten out by this crate before planning).
# It brings datafusion 52 / arrow 57 /
# sqlparser 0.59 — a separate arrow major from the duckdb-pulled arrow 58 the rest
# of the workspace uses. The two never unify: the analyser works in
# ff_analysis::SqlType and the oracle compares type-name strings, so the split is
# contained to this crate.
[dependencies]
er-entity-spec = { path = "../er-entity-spec" }
# The engine's intermediate lake tables (int_std_records, golden_lineage,
# entity_membership, entities) are modeled from the er-schema registry so stage SQL
# can be planned against them alongside the entity-owned marts.
er-schema = { path = "../er-schema" }
ff-analysis = { git = "https://github.com/athvin/feather-flow", tag = "er-entity-v0.1.4" }
# Pinned to the same major ff-analysis resolves (52), so the LogicalPlan this crate
# inspects and the plan ff-analysis produces are the same types. sqlparser is used
# only through ff_analysis::sqlparser (DataFusion's bundled 0.59), never the
# standalone crate.
datafusion-common = "52"
datafusion-expr = "55"
regex = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The oracle proves the type map against a real DuckDB: it builds a table from the
# generated DDL and compares DuckDB's DESCRIBE to the entity. duckdb brings arrow
# 58 (vs the analyser's arrow 57), but the oracle compares type-name strings, so
# the two never meet. er-entity-gen renders the lake DDL the oracle loads.
duckdb = { workspace = true }
er-entity-gen = { path = "../er-entity-gen" }
# The stage-SQL test plans the REAL golden-mart assembly SQL (er-golden) against the
# stage catalog, from a representative tenant config (er-config).
er-golden = { path = "../er-golden" }
# The standardize-stage vector test plans the REAL stg/int_std assembly SQL.
er-standardize = { path = "../er-standardize" }
er-config = { path = "../er-config" }

[lints]
workspace = true
