[package]
name = "dedupe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for dedupe-core: train/predict/cluster against a DuckLake catalog"

# Every file in tests/ is a module of tests/main.rs, not a target of its own
# (sccache cannot cache a final link). See tests/main.rs.
autotests = false
[lints]
workspace = true

[[bin]]
name = "dedupe"
path = "src/main.rs"

[dependencies]
dedupe-core = { path = "../dedupe-core" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
er-obs = { version = "0.1.0", path = "../er-obs" }

[dev-dependencies]
assert_cmd = "2"
duckdb = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"
