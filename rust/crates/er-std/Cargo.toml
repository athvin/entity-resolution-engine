[package]
name = "er-std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Every file in tests/ is a module of tests/main.rs, not a target of its own
# (sccache cannot cache a final link). See tests/main.rs.
autotests = false
[dependencies]
regex.workspace = true
unicode-normalization = "0.1"
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Runs the generated standardization SQL in a real DuckDB session to prove
# byte-parity with the retired dbt macros.
dedupe-core = { path = "../dedupe-core" }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
