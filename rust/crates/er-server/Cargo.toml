[package]
name = "er-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "er-server"
path = "src/main.rs"

# The in-process job dispatcher daemon (deploy: the er-dispatcher Deployment).
[[bin]]
name = "er-dispatcher"
path = "src/bin/er-dispatcher.rs"

# Emits the OpenAPI document (regenerates frontend/src/lib/api/openapi.json).
[[bin]]
name = "er-openapi"
path = "src/bin/er-openapi.rs"

# The API breaking-change gate: diff the current OpenAPI document vs a base.
[[bin]]
name = "er-openapi-check"
path = "src/bin/er-openapi-check.rs"

[dependencies]
er-config = { path = "../er-config" }
# The config-publish check validates a tenant config's blocking/comparison column
# references against the standardized-records schema (int_std_records columns).
er-schema = { path = "../er-schema" }
er-std = { path = "../er-std" }
# The generated entity structs + typed control query functions (job, org, …): the
# read/write path no longer hand-writes SQL or row mapping.
er-entities = { path = "../er-entities" }
er-ids = { version = "0.1.0", path = "../er-ids" }
# The OpenAPI document references the generated structs' `ToSchema`, so
# `openapi.json` (and the frontend's `schema.d.ts`) follow the entities.
utoipa = { workspace = true }
chrono = { workspace = true }
# The golden read path streams Arrow IPC: the generated lake query functions
# return RecordBatch, which the handler writes with the IPC StreamWriter.
arrow = { workspace = true }
# The in-process dispatcher runs the whole pipeline over the claimed job's
# DuckLake (run_all / correct / maintain / train) — no per-run k8s Jobs.
er-cli = { path = "../er-cli" }
# The merge-plans read uses the shared master-record election SQL.
er-golden = { path = "../er-golden" }
# Unmerge prechecks proposed never-rules with the shared contradiction-1 check.
er-reconcile = { path = "../er-reconcile" }
# The read API attaches each org's DuckLake (read-only) and queries lake.main.*.
dedupe-core = { path = "../dedupe-core" }
# The merge-plan generator statement runs on the lake connection directly
# (prepare + params! + typed batch extraction).
duckdb = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
# The :action path normalizer wraps the router as an outer tower service.
tower = { workspace = true }
base64 = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "signal"] }
tokio-postgres = { workspace = true }
er-pg-tls = { path = "../er-pg-tls" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Webhook delivery: HMAC-SHA256 payload signatures + the outbound HTTP POST.
hmac = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
# Email (§7.5): SES via the API, not the SMTP interface, so the pod's EKS Pod
# Identity credentials sign the call and no static access key is ever minted
# (this is infrastructure.md §9.3's scheduled exit, taken before the credential
# it retires was created).
#
# `default-features = false` throughout, deliberately — the defaults are
# expensive and none of what they add is reachable here:
#   * `default-https-client` resolves TLS to aws-lc-rs, whose `aws-lc-sys`
#     needs cmake and a C toolchain the `rust:1-bookworm` build image does not
#     carry. We pass an explicit ring-backed client instead, which is also the
#     provider reqwest already uses, so the image links one crypto library.
#   * `sso`/`credentials-process` pull aws-sdk-sso + aws-sdk-ssooidc and two
#     more credential providers the server cannot use: it authenticates by EKS
#     Pod Identity, which is the container-credentials provider in the base
#     chain. The consequence to know: `aws sso login` credentials will NOT work
#     for a locally-run er-server — use ER_MAIL_BACKEND=log, which is what dev
#     wants anyway. (These crates also require Rust 1.88, which was a second
#     reason to exclude them until `time`'s RUSTSEC-2026-0009 fix forced the
#     workspace floor to 1.88 regardless — see rust/Cargo.toml.)
aws-config = { version = "1.8.11", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-sdk-sesv2 = { version = "1.85.0", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-smithy-http-client = { version = "1.1.4", default-features = false, features = [
  "rustls-ring",
] }
thiserror.workspace = true
er-versions = { version = "0.1.0", path = "../er-versions" }

[lints]
workspace = true
