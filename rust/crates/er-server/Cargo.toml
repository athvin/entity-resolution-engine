[package]
name = "er-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "er-server"
path = "src/main.rs"

# The in-process job dispatcher daemon (deploy: the er-dispatcher Deployment).
[[bin]]
name = "er-dispatcher"
path = "src/bin/er-dispatcher.rs"

# Emits the OpenAPI document (regenerates frontend/src/lib/api/openapi.json).
[[bin]]
name = "er-openapi"
path = "src/bin/er-openapi.rs"

# The API breaking-change gate: diff the current OpenAPI document vs a base.
[[bin]]
name = "er-openapi-check"
path = "src/bin/er-openapi-check.rs"

[dependencies]
er-config = { path = "../er-config" }
# The config-publish check validates a tenant config's blocking/comparison column
# references against the standardized-records schema (int_std_records columns).
er-schema = { path = "../er-schema" }
er-std = { path = "../er-std" }
# The generated entity structs + typed control query functions (job, org, …): the
# read/write path no longer hand-writes SQL or row mapping.
er-entities = { path = "../er-entities" }
er-ids = { path = "../er-ids" }
# The OpenAPI document references the generated structs' `ToSchema`, so
# `openapi.json` (and the frontend's `schema.d.ts`) follow the entities.
utoipa = { workspace = true }
chrono = { workspace = true }
# The golden read path streams Arrow IPC: the generated lake query functions
# return RecordBatch, which the handler writes with the IPC StreamWriter.
arrow = { workspace = true }
# The in-process dispatcher runs the whole pipeline over the claimed job's
# DuckLake (run_all / correct / maintain / train) — no per-run k8s Jobs.
er-cli = { path = "../er-cli" }
# The merge-plans read uses the shared master-record election SQL.
er-golden = { path = "../er-golden" }
# Unmerge prechecks proposed never-rules with the shared contradiction-1 check.
er-reconcile = { path = "../er-reconcile" }
# The read API attaches each org's DuckLake (read-only) and queries lake.main.*.
dedupe-core = { path = "../dedupe-core" }
# The merge-plan generator statement runs on the lake connection directly
# (prepare + params! + typed batch extraction).
duckdb = { workspace = true }
axum = { workspace = true }
# The :action path normalizer wraps the router as an outer tower service.
tower = { workspace = true }
base64 = { workspace = true }
serde_urlencoded = { workspace = true }
# `signal` (over the workspace features) for the dispatcher's SIGTERM drain.
tokio = { workspace = true, features = ["signal"] }
tokio-postgres = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Webhook delivery: HMAC-SHA256 payload signatures + the outbound HTTP POST.
hmac = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
