[package]
name = "dedupe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fellegi-Sunter record linkage engine targeting DuckLake"
# Every file in tests/ is a module of tests/main.rs, not a target of its own:
# sccache cannot cache a final link, so each target was compiled and linked
# uncached on every CI run while statically linking bundled DuckDB. See
# tests/main.rs.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true

[dependencies]
duckdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
petgraph = "0.8"

[dev-dependencies]
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false
