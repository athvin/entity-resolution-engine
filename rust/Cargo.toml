[workspace]
resolver = "3"
members = ["crates/dedupe-core", "crates/dedupe-cli", "crates/er-eval", "crates/er-errors", "crates/er-ids", "crates/er-hash", "crates/er-k8s", "crates/er-schema", "crates/er-span", "crates/er-obs", "crates/er-versions", "crates/er-config", "crates/er-std", "crates/er-ingest", "crates/er-standardize", "crates/er-reconcile", "crates/er-match", "crates/er-compile", "crates/er-golden", "crates/er-profile", "crates/er-cli", "crates/er-dag", "crates/er-server", "crates/er-mcp", "crates/er-entity-spec", "crates/er-entity-lint", "crates/er-entity-gen", "crates/er-entity-cli", "crates/er-entities", "crates/er-sql-check", "crates/er-entity-diff", "crates/er-pg-tls", "crates/er-api-spec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, raised from 1.85 when the SES mailer landed (§7.5). This is not taste:
# `time` 0.3.45 carries RUSTSEC-2026-0009 (stack exhaustion parsing RFC 2822),
# the AWS SDK depends on `time`, and the first patched release — 0.3.47 —
# requires 1.88. Declaring 1.85 is what pinned cargo's resolver to the
# vulnerable version, so the choice was a real advisory or an honest floor.
#
# 1.89 since kube 5.0 (er-k8s): k8s-openapi 0.29 is pinned by kube 5.x only, and
# every kube release after 4.0 declares 1.89 — so this floor is what lets the
# Kubernetes API types move at all (batch-orchestration-design §11 Phase 0
# named this exact raise as the recorded dependency decision).
#
# Nothing verifies the floor downward: `rust-toolchain.toml` asks for `stable`,
# every CI job installs stable, and the image is `rust:1-bookworm`. The field's
# live effect is on dependency resolution, where a higher floor lets cargo pick
# newer and safer versions.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/athvin/dedupe-engine"

# Shared lint policy (applied via `[lints] workspace = true` in each crate).
# CI runs `clippy --all-targets -- -D warnings`, so every warning here is a
# hard gate. Pedantic is on; the allow-list below carves out the lints that are
# pure noise for a numeric SQL-generation engine (inter-type casts, doc prose
# mentioning DuckDB/SQL, deliberate exact float compares of fixed parameters).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numeric engine: i64/usize/f64 conversions are pervasive and intentional.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# We deliberately compare trained/fixed float params for exact equality.
float_cmp = "allow"
# Doc prose mentions DuckDB, DuckLake, SQL — not code spans.
doc_markdown = "allow"
# Public API documents errors/panics in prose, not //! sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Style preferences that fight the shape of this codebase.
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
# Determinism-critical float/hash constants (CPython float-repr thresholds, sampling
# moduli) — reformatting risks a transcription error for zero functional gain.
unreadable_literal = "allow"
# CLI command handlers and builder entry points legitimately take their args by
# value (they own the parsed config); borrowing would just add noise.
needless_pass_by_value = "allow"

[workspace.dependencies]
# Bundles DuckDB 2.0.0. The crate version encodes the engine in its middle
# component as `major * 10000 + minor * 100 + patch`, so `=1.20000.0` is v2.0.0
# and the previous pin, `1.10506.1`, was v1.5.6.
#
# The version is load-bearing. Extension binaries are keyed by it both in the
# repository the engine fetches from and on disk
# (`<extension_directory>/v2.0.0/<platform>/<name>.duckdb_extension`), so
# moving this pin invalidates the directory the image bakes and the bake step
# has to rebuild it. `er-server install-extensions` runs through this same
# linked DuckDB precisely so the two cannot disagree.
#
# Plain `bundled`, note — not `bundled-cmake`, and without the `parquet`/`json`
# features, so only `core_functions` is statically linked and everything else
# is an extension (see dedupe_core::session::BAKED_EXTENSIONS).
#
# MOVING THIS PIN IS A MIGRATION, NOT A BUMP. Dependabot groups it as
# minor/patch because the *crate* version stays `1.x`, so the PR arrives looking
# like a routine bump. Five things have to move together, and the 1.5.6 -> 2.0.0
# move (PRs #320, #338 and the follow-up that made it green) is the worked
# example of every one:
#
#   1. `arrow` below, which must equal the major duckdb pulls. duckdb
#      1.20000.0 pulls arrow 60, and with the workspace left on 58
#      `er-entities` failed to compile with 56 x E0308 — `RecordBatch` existed
#      twice in the graph. `arrow`'s major is ignored in
#      .github/dependabot.yml precisely because it must track duckdb's.
#      er-sql-check is NOT a blocker: it already tolerates a separate arrow
#      major via datafusion 52 because it compares type-name strings (see its
#      Cargo.toml).
#   2. duckdb-rs API churn. 1.20000.0 merged the C-API-V2 branch: Arrow FFI
#      import validation, `next_chunk`'s signature inverted, `libduckdb-sys` no
#      longer re-exporting arrow-array, the libduckdb download client moved
#      behind a `download-lib` feature. None of it reached this repo, whose only
#      Arrow surface is `Statement::query_arrow` — but check rather than assume.
#   3. The release label in rust/.cargo/config.toml. libduckdb-sys vendors the
#      released engine source but its `bundled` build never stamps the version,
#      so without that file the engine reports a `-dev` label, DuckDB routes
#      extension URLs through `source_id` instead of the version tag, and every
#      fetch 404s. That file explains the mechanism; the gate is dedupe-core's
#      `the_engine_reports_a_released_version`, which fails on a pin moved
#      without it.
#   4. Rebake the extension directory. `v2.0.0/` in the path above becomes the
#      new engine version, and every baked extension must exist for it. Check
#      extensions.duckdb.org/<version>/<platform>/ before starting — community
#      extensions (rapidfuzz, splink_udfs, from community-extensions.duckdb.org)
#      included, for every platform the image targets.
#   5. Re-run the goldens and read the result. The baselines are a Splink 5.0.0
#      parity oracle — each MANIFEST.json's `generated_with` records the Python
#      duckdb that produced it — not a snapshot of this engine, so a drift is a
#      finding to explain, not a file to regenerate.
duckdb = { version = "=1.20000.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Maintained serde_yaml fork (serde_yaml itself is deprecated). Reads the S6
# config document; config_hash is computed over the serde_json re-serialisation,
# not this crate's output, so YAML quirks never reach the digest.
serde_norway = "0.9"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"

# The telemetry wire. Already in Cargo.lock transitively (hyper, reqwest,
# tokio-postgres, aws-smithy, kube) with no subscriber installed, so every span
# those crates emit is currently discarded. Declaring it here is what lets
# er-span and the library crates emit; the subscriber and the OTLP exporter
# live in er-obs, which only binaries depend on.
tracing = "0.1"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# sha2 and hmac MOVE TOGETHER, and dependabot will keep proposing them
# separately. Both are RustCrypto crates built on `digest`: sha2 0.11 and
# hmac 0.13 are the digest-0.11 line, sha2 0.10 and hmac 0.12 were digest-0.10.
# Mismatch them and the failure is a trait bound, not a version conflict —
# `Sha256: hmac::digest::core_api::CoreProxy is not satisfied`, because the
# `Sha256` hmac wants is the one from *its* digest. That is what closed PRs #341
# (hmac alone) and #342 (sha2 alone); the pair is listed in
# .github/dependabot.yml's ignore block for the same reason `arrow` is.
sha2 = "0.11"
# Webhook payload signatures (HMAC-SHA256 over the delivered body).
hmac = "0.13"
hex = "0.4"
# Outbound HTTP for webhook delivery (rustls, no OpenSSL). json feature off —
# bodies are pre-serialized so the raw-byte signature matches what's sent.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# P3 control plane (er-server): the axum HTTP surface replacing FastAPI, and the
# Postgres-backed job queue (SKIP-LOCKED) + org/config tables.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# Aurora requires TLS (`sslmode=require`); rustls keeps the image OpenSSL-free,
# matching reqwest below. The `ring` provider is pinned explicitly so the
# verifier in er-pg-tls and the ClientConfig agree on one crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = "0.14"
ulid = "3"
# UUIDv7 minting (the identity convention for application-minted ids).
uuid = { version = "1", features = ["v7"] }
# API-key secret generation (SHA-256-hashed at rest; the plaintext is random).
rand = "0.10"
# Opaque keyset read cursors (base64url of the snapshot + last key).
base64 = "0.23"
# Parse repeated query params (e.g. ?key=a&key=b) the typed Query extractor can't.
serde_urlencoded = "0.7"
# Entity framework generated crate (`er-entities`): Arrow schemas, chrono date/time
# types, and the OpenAPI component derive. `arrow` is pinned to the same 60 line
# the `duckdb` crate pulls so Arrow types unify across the read path.
arrow = "60"
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "6", features = ["chrono"] }

# Dependencies build WITHOUT debug info, which is the whole ballgame on this
# workspace. `libduckdb-sys` compiles bundled DuckDB C++ through cc-rs, which
# emits `-g` whenever cargo tells it the profile wants debug info — and the
# resulting rlib is ~1.5 GB, linked into every one of the 28 test binaries.
# Measured here on a cold `cargo build -p libduckdb-sys`: the rlib goes
# 1,544,853,576 -> 250,957,656 bytes (1473 -> 239 MiB, 6.15x) and `target`
# 6.0 GB -> 1.1 GB. That matches the `cargo test -p er-server --no-run`
# measurement this setting came from: rlib 1480 MB -> 240 MB, whole build
# 12631 MB -> 7234 MB.
#
# Nobody debugs into bundled DuckDB, and the `package."*"` form leaves workspace
# crates at the profile default, so stepping through this repo's own code still
# works locally. Test harnesses keep line tables below, so backtraces name a
# file and a line.
#
# Recorded because the obvious knob is the wrong one: `debug = "line-tables-only"`
# here saves only ~7%, since any non-false setting still makes cargo pass
# DEBUG=true to build scripts and cc keeps emitting full C++ symbols. It has to
# be `false`.
#
# This lived as `CARGO_PROFILE_DEV_DEBUG` / `CARGO_PROFILE_TEST_DEBUG` job env on
# the CI `test` job alone until 2026-10-22, so `lint`, `ducklake-e2e`,
# `bench-compile`, `scale-tests` and every developer's laptop paid the full 1.9x.
# A smaller `target` is also a smaller rust-cache entry, which is why this is
# load-bearing for the Actions cache budget — see the `ci-and-supply-chain`
# skill's build-cost reference.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

