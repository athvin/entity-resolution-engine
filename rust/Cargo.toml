[workspace]
resolver = "3"
members = ["crates/dedupe-core", "crates/dedupe-cli", "crates/er-eval", "crates/er-errors", "crates/er-ids", "crates/er-hash", "crates/er-schema", "crates/er-obs", "crates/er-env", "crates/er-versions", "crates/er-config", "crates/er-std", "crates/er-ingest", "crates/er-standardize", "crates/er-reconcile", "crates/er-match", "crates/er-compile", "crates/er-golden", "crates/er-cli", "crates/er-server", "crates/er-entity-spec", "crates/er-entity-lint", "crates/er-entity-gen", "crates/er-entity-cli", "crates/er-entities", "crates/er-sql-check", "crates/er-entity-diff", "crates/er-pg-tls"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, raised from 1.85 when the SES mailer landed (§7.5). This is not taste:
# `time` 0.3.45 carries RUSTSEC-2026-0009 (stack exhaustion parsing RFC 2822),
# the AWS SDK depends on `time`, and the first patched release — 0.3.47 —
# requires 1.88. Declaring 1.85 is what pinned cargo's resolver to the
# vulnerable version, so the choice was a real advisory or an honest floor.
#
# Nothing verifies the floor downward: `rust-toolchain.toml` asks for `stable`,
# every CI job installs stable, and the image is `rust:1-bookworm`. The field's
# live effect is on dependency resolution, where a higher floor lets cargo pick
# newer and safer versions.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/athvin/dedupe-engine"

# Shared lint policy (applied via `[lints] workspace = true` in each crate).
# CI runs `clippy --all-targets -- -D warnings`, so every warning here is a
# hard gate. Pedantic is on; the allow-list below carves out the lints that are
# pure noise for a numeric SQL-generation engine (inter-type casts, doc prose
# mentioning DuckDB/SQL, deliberate exact float compares of fixed parameters).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numeric engine: i64/usize/f64 conversions are pervasive and intentional.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# We deliberately compare trained/fixed float params for exact equality.
float_cmp = "allow"
# Doc prose mentions DuckDB, DuckLake, SQL — not code spans.
doc_markdown = "allow"
# Public API documents errors/panics in prose, not //! sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
# Determinism-critical float/hash constants (CPython float-repr thresholds, sampling
# moduli) — reformatting risks a transcription error for zero functional gain.
unreadable_literal = "allow"
# CLI command handlers and builder entry points legitimately take their args by
# value (they own the parsed config); borrowing would just add noise.
needless_pass_by_value = "allow"

[workspace.dependencies]
# Bundles DuckDB 1.5.6 — the exact engine version the golden fixtures were
# generated on, so the engine and the baselines execute on identical builds.
#
# The version is load-bearing beyond the goldens: extension binaries are keyed
# by it on disk (`<extension_directory>/v1.5.6/<platform>/<name>.duckdb_extension`),
# so bumping this pin invalidates the directory the image bakes and the bake
# step has to rebuild it. `er-server install-extensions` runs through this same
# linked DuckDB precisely so the two cannot disagree.
#
# This comment said 1.5.5 until the bake step printed the real path. Plain
# `bundled`, note — not `bundled-cmake`, and without the `parquet`/`json`
# features, so only `core_functions` is statically linked and everything else
# is an extension (see dedupe_core::session::BAKED_EXTENSIONS).
duckdb = { version = "=1.10506.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Maintained serde_yaml fork (serde_yaml itself is deprecated). Reads the S6
# config document; config_hash is computed over the serde_json re-serialisation,
# not this crate's output, so YAML quirks never reach the digest.
serde_norway = "0.9"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
# Webhook payload signatures (HMAC-SHA256 over the delivered body).
hmac = "0.12"
hex = "0.4"
# Outbound HTTP for webhook delivery (rustls, no OpenSSL). json feature off —
# bodies are pre-serialized so the raw-byte signature matches what's sent.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# P3 control plane (er-server): the axum HTTP surface replacing FastAPI, and the
# Postgres-backed job queue (SKIP-LOCKED) + org/config tables.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# Aurora requires TLS (`sslmode=require`); rustls keeps the image OpenSSL-free,
# matching reqwest below. The `ring` provider is pinned explicitly so the
# verifier in er-pg-tls and the ClientConfig agree on one crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = "0.13"
ulid = "1"
# UUIDv7 minting (the identity convention for application-minted ids).
uuid = { version = "1", features = ["v7"] }
# API-key secret generation (SHA-256-hashed at rest; the plaintext is random).
rand = "0.10"
# Opaque keyset read cursors (base64url of the snapshot + last key).
base64 = "0.23"
# Parse repeated query params (e.g. ?key=a&key=b) the typed Query extractor can't.
serde_urlencoded = "0.7"
# Entity framework generated crate (`er-entities`): Arrow schemas, chrono date/time
# types, and the OpenAPI component derive. `arrow` is pinned to the same 58 line
# the `duckdb` crate pulls so Arrow types unify across the read path.
arrow = "58"
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "6", features = ["chrono"] }

# Dependencies build WITHOUT debug info, which is the whole ballgame on this
# workspace. `libduckdb-sys` compiles bundled DuckDB C++ through cc-rs, which
# emits `-g` whenever cargo tells it the profile wants debug info — and the
# resulting rlib is ~1.5 GB, linked into every one of the 28 test binaries.
# Measured here on a cold `cargo build -p libduckdb-sys`: the rlib goes
# 1,544,853,576 -> 250,957,656 bytes (1473 -> 239 MiB, 6.15x) and `target`
# 6.0 GB -> 1.1 GB. That matches the `cargo test -p er-server --no-run`
# measurement this setting came from: rlib 1480 MB -> 240 MB, whole build
# 12631 MB -> 7234 MB.
#
# Nobody debugs into bundled DuckDB, and the `package."*"` form leaves workspace
# crates at the profile default, so stepping through this repo's own code still
# works locally. Test harnesses keep line tables below, so backtraces name a
# file and a line.
#
# Recorded because the obvious knob is the wrong one: `debug = "line-tables-only"`
# here saves only ~7%, since any non-false setting still makes cargo pass
# DEBUG=true to build scripts and cc keeps emitting full C++ symbols. It has to
# be `false`.
#
# This lived as `CARGO_PROFILE_DEV_DEBUG` / `CARGO_PROFILE_TEST_DEBUG` job env on
# the CI `test` job alone until 2026-10-22, so `lint`, `ducklake-e2e`,
# `bench-compile`, `scale-tests` and every developer's laptop paid the full 1.9x.
# A smaller `target` is also a smaller rust-cache entry, which is why this is
# load-bearing for the Actions cache budget — see the `ci-and-supply-chain`
# skill's build-cost reference.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

