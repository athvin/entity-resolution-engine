kind: statement
operation: read
description: "The golden preview columns of every entity in an id range at a pinned snapshot (the duplicates page preview)."
params:
  - { name: snapshot, type: bigint }
  - { name: first, type: varchar }
  - { name: last, type: varchar }
returns:
  - { name: id, type: varchar, nullable: false }
  - { name: given_name, type: varchar }
  - { name: family_name, type: varchar }
  - { name: email, type: varchar }
