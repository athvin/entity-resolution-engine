kind: statement
operation: create
mode: partial
description: "Record a DATASET lake's schema position after a reconciliation or check: insert the row, or on a repeat for the same dataset replace its catalog version, status, detail and check time. Org-level reconciliations (no dataset) go through upsert_org_level — the two conflict targets are different partial uniques."
params:
  - { name: id, type: varchar }
  - { name: org_id, type: varchar }
  - { name: dataset_id, type: varchar }
  - { name: catalog_hash, type: varchar }
  - { name: status, type: varchar }
  - { name: detail, type: varchar, nullable: true }
returns: none
