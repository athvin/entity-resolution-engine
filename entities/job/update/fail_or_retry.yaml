kind: statement
operation: update
mode: partial
description: "Record a job failure terminally, with its class and detail. It used to decide retry in the same statement — a retryable class with attempts left went back to queued behind an exponential backoff — which was the LEGACY in-process arm's retry. Retry is per task attempt now (task_instance/update/fail_or_retry, with the Airflow budget arithmetic), and a job reaches a terminal state through job/update/settle, so the branch had no production caller left."
params:
  - { name: error_class, type: varchar, nullable: true }
  - { name: error_detail, type: varchar, nullable: true }
  - { name: job_id, type: varchar }
returns: entity
