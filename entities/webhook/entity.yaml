kind: entity
version: 1
name: webhook
relation: webhooks
description: "A tenant webhook endpoint: its URL, subscribed events and signing secret."
key: [id]
generate:
  stores: [postgres]
  languages: [rust, typescript]
  wire: [json]
  history: true
columns:
  - name: id
    type: varchar
    nullable: false
    description: "The webhook's unique id."
  - name: org_id
    type: varchar
    nullable: false
    references: { relation: orgs, column: id }
    description: "The tenant that owns the webhook."
  - name: dataset_id
    type: varchar
    references: { relation: datasets, column: id }
    description: "Optional dataset filter: NULL subscribes to every dataset's events."
  - name: url
    type: varchar
    nullable: false
    description: "The delivery URL."
  - name: events
    type: json
    nullable: false
    default: "'[]'::jsonb"
    description: "The subscribed event types."
  - name: secret
    type: varchar
    nullable: false
    description: "HMAC signing secret for deliveries."
  - name: active
    type: boolean
    nullable: false
    default: "true"
    description: "Whether the webhook is active."
  - name: created_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "When the webhook was registered."
  - name: updated_at
    type: timestamp
    nullable: false
    default: "now()"
    volatile: true
    description: "Wall-clock last-write time (database default; advanced by mutations once the entity migrates)."
indexes:
  # V17: the dataset-scoped read path.
  - name: webhooks_dataset
    columns: [dataset_id]
