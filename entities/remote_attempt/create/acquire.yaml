kind: statement
operation: create
mode: partial
description: "Acquire a fence from a live running task and job before opening remote compute. Scope is copied from the task, never caller-supplied. A duplicate live dataset fence refuses admission."
params:
  - { name: id, type: varchar }
  - { name: task_instance_id, type: varchar }
  - { name: launch, type: bigint }
  - { name: binding_generation, type: bigint }
  - { name: namespace, type: varchar }
reads: [task_instance, job]
returns: none
