kind: statement
operation: create
mode: partial
description: "Mint the next version of a named model for a tenant. The version number is computed in the statement, so two concurrent creates cannot both claim the same number (the natural-key unique index is the backstop)."
params:
  - { name: model_id, type: varchar }
  - { name: org_id, type: varchar }
  - { name: name, type: varchar }
  - { name: entity_type, type: varchar }
  - { name: model_json, type: varchar }
  - { name: model_hash, type: varchar }
  - { name: model_version_label, type: varchar }
  - { name: tf_snapshot_id, type: varchar, nullable: true }
  - { name: provenance, type: json }
  - { name: created_by, type: varchar }
returns: entity
