kind: statement
operation: read
description: "One keyset page of duplicate groups (entities with at least two members) at a pinned snapshot, with their member counts. `min_members` raises the floor — the clusters an over-merge hides in are the large ones, and a page ordered by entity id will not surface them on its own. Floored at 2 regardless of what is asked: a one-member entity is not a duplicate group, so admitting one would change what the endpoint means. `max_members` caps the size from above (the size filter's 'pairs' bucket), and `only_entity` pins the page to one entity id — the member-record search resolves a record key to its entity, then answers through this same statement so the group payload is assembled identically on both paths."
params:
  - { name: snapshot, type: bigint }
  - { name: after, type: varchar, nullable: true }
  - { name: min_members, type: bigint, nullable: true }
  - { name: max_members, type: bigint, nullable: true }
  - { name: only_entity, type: varchar, nullable: true }
  - { name: limit, type: bigint }
returns:
  - { name: entity_id, type: varchar, nullable: false }
  - { name: member_count, type: bigint }
