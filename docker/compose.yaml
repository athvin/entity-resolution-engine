# The test/dev substrate, and the only substrate CI uses (S7).
#
# Profiles: `test` (PR path) and `bench` (workflow_dispatch / weekly). The stack is
# driven with `docker compose run --rm`, never with `up` and the abort-on-exit flag
# S7.4 forbids: the one-shot initialiser below exits as soon as it succeeds, and
# under `up` that exit tears the whole stack down and reports a teardown signal as
# the test result. The flag is named nowhere in this tree, and
# tests/unit/test_compose_contract.py greps for it (S7.4).
# scripts/ci/{itest,bench,compose_smoke}.sh are the only supported entry points.
#
# `catalog-init` runs `er init` once per stack and is what creates the ddl.py-owned
# relations (S4.0, S7.1); `pipeline` and `benchmark` gate on it having completed, so
# neither can start against a lake that holds no relations.

name: er                                   # fixed project name; without it Compose derives `docker`
                                           # from the directory and the prebuilt image is never found

x-er-env: &er-env
  ER_CONFIG:                 /app/configs/test.yaml
  ER_CATALOG_DSN:            postgresql://er:erpassword@catalog:5432/ducklake
  ER_S3_ENDPOINT:            objectstore:9000        # host:port — NO scheme; DuckDB httpfs rejects a URL
  ER_S3_ACCESS_KEY_ID:       erminio
  ER_S3_SECRET_ACCESS_KEY:   erminiopassword
  ER_S3_REGION:              us-east-1
  ER_S3_URL_STYLE:           path
  ER_S3_USE_SSL:             "false"
  ER_LAKE_DATA_PATH:         s3://lake/er/
  ER_LAKE_ALIAS:             lake
  ER_LAKE_METADATA_SCHEMA:   er_main
  ER_DUCKDB_THREADS:         "${ER_CPU_LIMIT:-2}"          # == the cpus quota below, always
  ER_DUCKDB_MEMORY_LIMIT:    "${ER_DUCKDB_MEMORY_LIMIT:-4GB}"

x-er-image: &er-image
  image: er-pipeline:ci          # built once by CI (or `docker compose build`) and consumed as-is
  pull_policy: never             # never attempt a registry pull for a local-only tag
  build: { context: .., dockerfile: docker/Dockerfile }

services:
  catalog:                                 # DuckLake catalog database
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    # DuckLake's maintenance sweep drops every expired inlined-data table in one
    # transaction, and a long test session accumulates hundreds of them; postgres's
    # default 64 locks per transaction then fails the sweep with "out of shared
    # memory" and poisons the catalog connection for everything after it. The limit
    # is per-transaction bookkeeping, not memory reserved up front, so raising it
    # costs nothing when unused.
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_USER: er
      POSTGRES_PASSWORD: erpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U er -d ducklake"]
      interval: 2s
      timeout: 3s
      retries: 30

  objectstore:                             # S3-compatible storage for DuckLake data files
    # The pipeline build supplies the pinned MinIO source release (S2.1, S7.3).
    <<: *er-image
    command: minio server /data --console-address ":9001"
    volumes:
      - /data                             # preserve the upstream image's data-volume behavior
    environment:
      MINIO_ROOT_USER:     erminio         # >= 3 chars — MinIO refuses to start below the minimum
      MINIO_ROOT_PASSWORD: erminiopassword # >= 8 chars
    # Readiness and bucket creation share the configured alias in objectstore-init.

  objectstore-init:                        # create the bucket; same credentials as the server
    <<: *er-image
    depends_on:
      objectstore: { condition: service_started }
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 60); do
          mc alias set local http://objectstore:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break;
          sleep 1;
        done &&
        mc ready local &&
        mc mb -p local/lake
    environment:
      MINIO_ROOT_USER:     erminio
      MINIO_ROOT_PASSWORD: erminiopassword

  catalog-init:                            # one-shot lake bootstrap: extensions, secret, ATTACH, ddl.py tables
    <<: *er-image
    # NO `profiles:` key, so it is enabled under every profile: both consumers gate
    # on it, and a profile that skipped it would run against an empty lake (S7.1).
    depends_on:
      catalog:          { condition: service_healthy }
      objectstore-init: { condition: service_completed_successfully }
    environment: *er-env
    command: ["er", "init"]                # idempotent; exit 0 on an already-initialised lake
    restart: "no"

  pipeline:
    <<: *er-image
    profiles: [test]
    depends_on:
      catalog-init: { condition: service_completed_successfully }
    environment: *er-env
    volumes:
      - ../artifacts:/app/artifacts        # junit, dbt logs, run manifests reach the host/runner
      # The S12 M1 exit gate (tests/integration/test_m1_exit.py) asserts that every
      # clause it enforces is still verbatim in the S12 M1 exit-criteria cell, so a
      # spec edit fails the gate instead of silently drifting from it. S7.3's image
      # deliberately COPYs no documentation -- it is later the k8s job image -- so the
      # spec reaches the suite as a read-only bind mount on the `test` profile only,
      # and never as a layer. Read-only: the suite reads the spec, it never writes it.
      - ../DesignDoc.md:/app/DesignDoc.md:ro
    command: ["pytest", "tests/integration", "-q", "--maxfail=3",
              "--junitxml=/app/artifacts/junit.xml", "--durations=20"]
    deploy: { resources: { limits: { cpus: "${ER_CPU_LIMIT:-2}", memory: "${ER_MEM_LIMIT:-6g}" } } }

  benchmark:
    <<: *er-image
    profiles: [bench]
    depends_on:
      catalog-init: { condition: service_completed_successfully }
    environment:
      <<: *er-env
      BENCH_SCALE: ${BENCH_SCALE:-smoke}
    volumes:
      - ../artifacts:/app/artifacts        # artifacts/bench/latest.json + report.md
      - benchdata:/app/.bench              # generated corpus; kept out of the artifacts mount
    command: ["python", "benchmarks/report.py", "--run",
              "--scale", "${BENCH_SCALE:-smoke}", "--repeat", "3",
              "--out", "/app/artifacts/bench/latest.json"]
    # The envelope is a property of the SCALE (S10.2), exported by the S9.2 preflight.
    # Defaults are the smoke/10k row, which is also the `test` profile's envelope.
    deploy: { resources: { limits: { cpus: "${ER_CPU_LIMIT:-2}", memory: "${ER_MEM_LIMIT:-6g}" } } }

volumes:
  benchdata:
