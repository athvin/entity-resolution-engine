# Repo-local Symposium configuration (https://github.com/symposium-dev/symposium).
#
# This file is only read when SYMPOSIUM_HOME points at <repo>/.symposium, which
# is what scripts/symposium and the `env` block in .claude/settings.json do.
# Nothing here is installed into ~/.symposium or ~/.cargo/bin — the cargo-agents
# binary lives in <repo>/.tools/bin (gitignored; run `scripts/symposium install`
# to fetch it).
#
# Symposium resolves the "project root" from `cargo metadata`, so every path it
# writes is relative to rust/ (the cargo workspace root), NOT the repo root:
#   rust/.claude/skills/<name>/   skills  — Claude Code reads these as nested,
#                                           directory-scoped skills
#   rust/.agents/skills/<name>/   skills  — Codex reads these as nested skills
#   rust/.claude/settings.json    hooks   — INERT, Claude Code only reads the
#                                           repo-root settings file
#   rust/.codex/hooks.json        hooks   — INERT, Codex reads the trusted hook
#                                           installed in $CODEX_HOME/hooks.json
#   rust/.mcp.json                MCP     — INERT, same reason
# The root Claude settings and scripts/codex-hooks-sync.sh install the hooks
# that actually fire.

# Re-sync skills automatically during hook invocations, so a dependency change
# in rust/ updates the installed skills without a manual run.
auto-sync = true

# Mirror skills authored in <workspace>/.agents/skills into .claude/skills.
agents-syncing = true

# Write hooks/MCP into the project rather than either agent's config home.
# "Project" means rust/ here; root hooks are installed separately as above.
hook-scope = "project"

# MUST stay "off". The default ("on") self-updates via `cargo install`, which
# would drop a binary in ~/.cargo/bin and defeat the repo-local install.
# To update deliberately: scripts/symposium install <version>
auto-update = "off"

[[agent]]
name = "claude"

[[agent]]
name = "codex"

[logging]
level = "info"
