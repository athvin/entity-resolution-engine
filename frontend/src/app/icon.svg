<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid tile so the mark reads on light and dark browser chrome alike.
       Two offset records collapsing into one: the overlap is the golden record. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <rect x="7" y="7" width="12" height="12" rx="3" fill="none" stroke="#fdfdfd" stroke-width="2"/>
  <rect x="13" y="13" width="12" height="12" rx="3" fill="#0a0a0a" stroke="#fdfdfd" stroke-width="2"/>
  <rect x="13" y="13" width="6" height="6" fill="#fdfdfd"/>
</svg>
