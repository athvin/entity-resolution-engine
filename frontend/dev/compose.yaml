# The frontend dev/e2e substrate: control-plane Postgres + DuckLake catalog + MinIO.
#
# This stack REPLACES the three ad-hoc `docker run` containers server/README.md
# documents for the lake E2E (same ports 5433/5434/9000, same credentials), so the
# two setups are mutually exclusive on one machine. The engine's docker/compose.yaml
# is untouched and publishes no host ports, so both can coexist.
#
# MinIO no longer publishes public container images; the pipeline image builds the
# pinned MinIO source release (S2.1), so `objectstore` reuses er-pipeline:ci exactly
# like docker/compose.yaml does. Driven by frontend/dev/up.sh; the one-shot
# objectstore-init is invoked with `docker compose run --rm`, never `up`.

name: er-frontend-dev

x-pg-image: &pg-image
  image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082

x-er-image: &er-image
  image: er-pipeline:ci
  pull_policy: never
  build: { context: ../.., dockerfile: docker/Dockerfile }

services:
  controlplane-db: # erserver's Postgres (jobs, orgs, keys, config, reviews) + the BFF's erweb schema
    <<: *pg-image
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: er
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  catalog-db: # DuckLake catalog; tenant databases (er_t_*) are created here by provisioning
    <<: *pg-image
    # Same rationale as docker/compose.yaml: DuckLake's maintenance sweep needs
    # more than the default 64 locks per transaction on a long-lived catalog.
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ducklake
      POSTGRES_PASSWORD: er
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ducklake"]
      interval: 2s
      timeout: 3s
      retries: 30

  objectstore: # S3-compatible storage for DuckLake data files
    <<: *er-image
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  objectstore-init: # one-shot bucket creation; run with `docker compose run --rm objectstore-init`
    <<: *er-image
    profiles: ["init"]
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 60); do
          mc alias set local http://objectstore:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break;
          sleep 1;
        done &&
        mc mb --ignore-existing local/lake
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
