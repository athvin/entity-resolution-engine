# The frontend dev/e2e substrate: one Postgres, holding both the er-server
# control plane (jobs, orgs, keys, config, reviews) and the BFF's erweb schema.
#
# It used to be three services — a second Postgres for the DuckLake catalog and
# MinIO for the lake's data files. Both are gone, for two reasons:
#
#   * They could not start. Each built `er-pipeline:ci` from `docker/Dockerfile`,
#     and `docker/` went with the Python tree. MinIO stopped publishing public
#     container images, which is why the image was built from source in the
#     first place, so there is no drop-in replacement to point at either.
#
#   * They were not buying this tier anything. The lake here is a local DuckLake
#     catalog file plus a data directory — exactly what every `lake_e2e` case
#     uses, and what `make check-e2e` already runs. Neither local gate exercises
#     S3 or a Postgres catalog today; those are covered by the real AWS
#     environment (`make dev-up`), and this tier exists to exercise the
#     BFF -> er-server seam, not object-store fidelity.
#
# The honest cost: a bug that only appears against S3 or a Postgres-backed
# catalog will not be caught here. That was already true before this change,
# because the stack could not boot at all.
#
# Port 5433 is shared with the engine's own lake-E2E instructions, so the two
# setups remain mutually exclusive on one machine.

name: er-frontend-dev

services:
  controlplane-db: # er-server's Postgres (jobs, orgs, keys, config, reviews) + the BFF's erweb schema
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: er
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
